[project]
name = "alpha-engine"
version = "2.5.0"
description = "Artifact-first quantitative research engine for CN and US markets based on Microsoft Qlib."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyqlib>=0.9.0",
    "typing_extensions>=4.12.2",
    "numpy<2.0.0",
    "pandas",
    "fire",
    "pyyaml",
    "tabulate",
    "scikit-learn",
    "lightgbm",
    "matplotlib",
    "yfinance",
    "plotly",
    "xgboost",
    "baostock",
    "akshare",
    "efinance",
    "python-dotenv",
    "protobuf<4.0.0",
    "setuptools==69.5.1",
    "pandera",
    "mcp",
    "structlog>=24.1.0",
    "sqlalchemy<2.0",
    "exchange-calendars>=4.13,<5",
]

[project.scripts]
alpha = "src.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
]

[tool.uv]
managed = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
"src/api/mcp_server.py" = ["E402"]
"src/inference.py" = ["E402"]
"src/research/service.py" = ["E402"]

# ---------------------------------------------------------------------------
# Mypy — ratcheted scope
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "src.agents.*",
    "src.api.*",
    "src.assistant.*",
    "src.cli.*",
    "src.common.*",
    "src.dashboard.*",
    "src.data.*",
    "src.guardrails.*",
    "src.models.artifact",
    "src.reliability.*",
    "src.reporting.*",
    "src.research.*",
    "src.strategies.*",
    "src.workflows.*",
    "scripts.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "src.research.economics",
    "src.research.replay_comparison",
    "src.research.ranker_training",
    "src.research.ranker_execution",
]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true

# ---------------------------------------------------------------------------
# Pytest — zero-unapproved-skip policy
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
    "unit: fast pure unit tests that do not require external services or real market artifacts",
    "contract: schema, artifact, CLI or integration contract tests using local fakes",
    "integration: tests crossing service/module boundaries or requiring heavier fixtures",
    "slow: tests that are valid but too slow for the default PR feedback loop",
    "e2e: browser or workflow end-to-end tests",
    "benchmark: performance or baseline measurement tests; not required for PR correctness",
    "manual: tests requiring real data, credentials, or manual setup",
    "approved_skip(reason): marks a test that is approved to be skipped with a documented reason",
]
