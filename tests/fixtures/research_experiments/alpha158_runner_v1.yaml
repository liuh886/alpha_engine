  cutoff: '2026-06-24'

fixed_model:
  model_id: us_x1_1
  frozen_spec: configs/research_paradigms/us_x1_1_frozen_v1.yaml

factor_library:
  source: src/factors/sets/qlib_alpha158.py

candidates:
  - candidate_id: alpha158_baseline
    role: baseline
    factor_groups:
      - qlib_alpha158_all
    xgb_native:
      n_gain_bins: 7
      num_boost_round: 200
      max_leaves: 31
      max_depth: 0
