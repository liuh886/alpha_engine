      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      seed: 42
  - candidate_id: alpha158_challenger
    role: challenger
    factor_groups:
      - qlib_alpha158_all
    xgb_native:
      n_gain_bins: 7
      num_boost_round: 300
      max_leaves: 31
      max_depth: 0
      min_child_weight: 1.0
      learning_rate: 0.03
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      seed: 42

windows:
  candidate_selection:
    - 2024H1
    - 2024H2
    - 2025H1
    - 2025H2
  consumed_reporting_only:
    - 2026H1
  consumed_reporting_may_enter_selection: false
  new_holdout_reserved: true

execution:
  base_cost_bps: 20
  cost_stress_bps:
    - 20
    - 60

evaluation:
  schema_version: '1.0'
  baseline_candidate_id: alpha158_baseline
  stress_cost_bps: 60
  decision: alpha158_candidate_supported
  ranking:
    - gate_pass_count
    - worst_drawdown
    - compounded_relative_excess
  thresholds:
    min_window_relative_excess: 0.0
    min_worst_drawdown: -0.35
    min_stress_compounded_relative_excess: 0.0
    max_strongest_positive_window_share: 0.55
    min_mean_rank_ic_improvement: 0.0
    require_factor_baseline_dominance: false

stop_rules:
  - no_feature_search_beyond_declared_groups
  - no_pool_changes
  - no_portfolio_construction_changes
  - no_automatic_baseline_update

version_policy:
  maximum_surviving_candidates: 1
  may_propose_us_x1_3_candidate: true
  may_release_us_x1_3_automatically: false
  new_untouched_challenge_required: true
