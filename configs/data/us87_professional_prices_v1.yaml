schema_version: "1.0"
contract_id: "us87_professional_prices_v1"
status: "active_research_data_contract"
market: "us"
research_only: true
trade_ready: false

pool:
  pool_id: "us_selected_equities_v2"
  spec: "configs/research_universes/us_selected_equities_v2.yaml"
  candidate_count: 87
  references: ["QQQ"]
  reference_in_candidate_pool_allowed: false

history:
  requested_start: "2021-01-01"
  end_policy: "explicit_cutoff_required"
  adjusted_price_required: true
  raw_price_retention_required_when_provider_supports_it: true
  pre_listing_fill_allowed: false

providers:
  primary:
    name: "tiingo"
    credential_env: "TIINGO_API_TOKEN"
    source_family: "tiingo_eod"
  secondary:
    name: "polygon"
    credential_env: "POLYGON_API_KEY"
    source_family: "polygon_sip"
    optional_for_single_professional_source: true
  fallback_research_only:
    name: "yfinance"
    eligible_for_professional_status: false

sharding:
  shard_size: 10
  deterministic_order: "pool_order_then_reference"
  one_shard_per_live_invocation: true
  finalization_requires_all_symbols: true
  partial_shards_may_not_be_used_for_training: true

reconciliation:
  minimum_overlap_sessions: 20
  consensus_p99_adjusted_close_return_diff: 0.0015
  consensus_max_adjusted_close_return_diff: 0.01
  consensus_p99_adjusted_open_return_diff: 0.0025
  consensus_max_adjusted_open_return_diff: 0.01
  consensus_max_annual_compounded_open_return_drift: 0.003
  consensus_max_full_period_compounded_open_return_drift: 0.003
  material_return_difference: 0.01
  corporate_action_window_sessions: 1

symbol_statuses:
  - "consensus"
  - "explainable_corporate_action_difference"
  - "single_professional_source"
  - "provider_missing"
  - "quarantine"

promotion:
  professional_single_source_requires:
    - "Tiingo identity and adjusted bars pass"
    - "all exact candidates and QQQ reference are present"
  professional_corroborated_requires:
    - "Tiingo and Polygon both pass exact identity"
    - "all symbols pass independent return reconciliation"
  automatic_trade_ready_promotion_allowed: false
