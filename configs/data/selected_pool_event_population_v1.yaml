schema_version: "1.1"
contract_id: "selected_pool_event_population_v1"
status: "active_research_data_contract"
research_only: true
trade_ready: false

markets:
  us:
    pool_id: "us_selected_equities_v2"
    pool_spec: "configs/research_universes/us_selected_equities_v2.yaml"
    expected_symbols: 87
    fundamental_primary:
      name: "sec_companyfacts"
      source_family: "sec_edgar"
      credential_required: false
      user_agent_policy: "checked_in_project_identity_with_optional_env_override"
    corporate_action_primary:
      name: "yfinance_actions"
      source_family: "yahoo_finance"
    validators:
      - {name: "tiingo", source_family: "tiingo_eod", role: "validation_only"}
      - {name: "polygon", source_family: "polygon_sip", role: "validation_only"}
    identity_mapping: "configs/providers/us_selected_equities_sec_cik_v3.yaml"
    availability_policy: "next_calendar_day_00_00_utc_when_only_filed_date_is_available"
  cn:
    pool_id: "cn_selected_equities_v3"
    pool_spec: "configs/research_universes/cn_selected_equities_v3.yaml"
    expected_symbols: 130
    fundamental_primary:
      transport: "akshare"
      facts_source: "sina_financial_report"
      disclosure_time_source: "cninfo_disclosure"
      source_families: ["sina_finance", "cninfo"]
      pit_join_required: true
    corporate_action_primary:
      transport: "akshare"
      structured_sources:
        - {endpoint: "stock_fhps_detail_em", source_family: "eastmoney"}
        - {endpoint: "stock_share_change_cninfo", source_family: "cninfo"}
        - {endpoint: "stock_allotment_cninfo", source_family: "cninfo"}
    validators:
      - {name: "baostock", source_family: "baostock", role: "validation_only"}
      - {name: "mootdx", source_family: "tongdaxin", role: "validation_only_optional"}
      - {name: "tushare", source_family: "tushare_pro", role: "validation_only", credential_env: "TUSHARE_TOKEN"}
    availability_policy: "official_disclosure_or_source_update_time_never_period_end"

fundamental_fields:
  us:
    Revenues: {field: revenue, unit: USD, currency: USD}
    NetIncomeLoss: {field: net_income, unit: USD, currency: USD}
    Assets: {field: total_assets, unit: USD, currency: USD}
    Liabilities: {field: total_liabilities, unit: USD, currency: USD}
    StockholdersEquity: {field: stockholders_equity, unit: USD, currency: USD}
    EarningsPerShareDiluted: {field: diluted_eps, unit: USD/shares, currency: USD}
    OperatingIncomeLoss: {field: operating_income, unit: USD, currency: USD}
  cn:
    营业收入: {field: revenue, unit: CNY, currency: CNY}
    净利润: {field: net_income, unit: CNY, currency: CNY}
    资产总计: {field: total_assets, unit: CNY, currency: CNY}
    负债合计: {field: total_liabilities, unit: CNY, currency: CNY}
    所有者权益(或股东权益)合计: {field: stockholders_equity, unit: CNY, currency: CNY}
    基本每股收益: {field: basic_eps, unit: CNY/shares, currency: CNY}

provider_role_rules:
  primary_data_may_feed_training: true
  validation_sources_may_feed_training: false
  validation_sources_may_replace_primary: false
  shared_upstream_transports_count_as_one_source: true
  source_disagreement_requires_explicit_conflict_status: true
  validator_event_prefixes_excluded_from_canonical:
    - "tushare_validation_"
    - "tiingo_validation_"
    - "polygon_validation_"

coverage:
  every_pool_symbol_requires_explicit_status: true
  allowed_statuses:
    [ready, partial, provider_missing, identity_missing, conflict, no_event_observed]
  allowed_statuses_by_component:
    fundamental_coverage: [ready, partial, provider_missing, identity_missing, conflict]
    corporate_action_coverage:
      [ready, partial, provider_missing, identity_missing, conflict, no_event_observed]
  no_forward_fill: true
  no_price_implied_events: true
  event_store_hash_binding_required: true
