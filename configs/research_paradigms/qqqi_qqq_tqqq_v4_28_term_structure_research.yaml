experiment_id: qqqi_qqq_tqqq_v4_28_term_structure_research
parent_experiment_id: qqqi_qqq_tqqq_vxn_bridge_v4_2
schema_version: "1.0"
research_only: true
trade_ready: false
post_result_hypothesis: false
issue: 623

purpose: >-
  Test whether point-in-time-safe Cboe volatility term structure improves
  recovery timing and state-2 drawdown control without changing the formal
  v4.2 state trace.

boundaries:
  baseline_contract: configs/research_paradigms/qqqi_qqq_tqqq_vxn_bridge_v4_2.yaml
  signal_trace_must_equal_v4_2: true
  transaction_cost_bps_per_turnover_unit: 10.0
  signal_time: session_close_t
  execution_time: next_session_open_t_plus_1
  return_measurement: adjusted_open_to_adjusted_open
  actionable_alert_changes_authorized: false
  formal_model_promotion_authorized: false

sources:
  provider: Cboe Global Markets
  endpoint_pattern: https://cdn.cboe.com/api/global/us_indices/daily_prices/{symbol}_History.csv
  required_indices: [VIX9D, VIX3M]
  audited_next_stage_index: VVIX
  alternate_provider_fallback: false
  source_splicing: false
  forward_fill: false
  primary_term_structure_start: "2014-01-01"
  reason: >-
    VIX9D first-value history predates its 2013 launch. The primary mechanism
    window therefore begins in 2014 so pre-launch back-calculated observations
    are not treated as decision-time evidence.

factor_a_timing:
  name: acute_shock_normalization
  rule: VIX9D < VIX
  use: confirm_v4_27_panic_repair_activation
  threshold_search: false
  smoothing: false
  confirmation_count: 1

factor_b_drawdown:
  name: vix_curve_backwardation
  rule: VIX > VIX3M
  use: cap_executed_formal_state_2_risk_budget
  guarded_state_2:
    QQQI: 0.00
    QQQ: 0.50
    TQQQ: 0.50
  ordinary_state_2:
    QQQI: 0.00
    QQQ: 0.25
    TQQQ: 0.75
  threshold_search: false
  allocation_search: false
  smoothing: false

comparators:
  - current_v4_2
  - v4_27_panic_repair_boost
  - v4_28_panic_repair_vix9d_confirmed
  - v4_28_backwardation_guard
  - v4_28_term_structure_joint

evidence_scopes:
  actual:
    role: actual_qqqi_product_evidence
    synthetic_pre_inception_backfill: false
  proxy:
    role: qqq_defensive_component_mechanism_only
    start_date: "2014-01-01"
    qqqi_defensive_component: QQQ

validation:
  chronological_train_fraction: 0.60
  minimum_term_structure_coverage: 0.98
  v4_3_candidate_gate:
    actual_cagr_delta_pp_min: 1.00
    actual_max_drawdown_worsening_pp_max: 0.00
    actual_calmar_delta_min: 0.10
    proxy_cagr_delta_pp_min: 0.50
    proxy_max_drawdown_worsening_pp_max: 0.50
    both_chronological_segments_calmar_not_worse: true
    largest_positive_episode_share_max: 0.50
  direct_promotion_authorized: false

hypothesis_discipline:
  - Run exactly the five frozen comparators.
  - Do not search VIX9D/VIX or VIX/VIX3M thresholds.
  - Do not search state-2 TQQQ cap weights.
  - Do not search confirmation counts, smoothing windows, delays or persistence.
  - Do not use pre-2014 VIX9D values as primary mechanism evidence.
  - Do not change v4.2 alerts or formal model status in this experiment.
  - If the frozen factors fail, record the failure instead of retuning them.
