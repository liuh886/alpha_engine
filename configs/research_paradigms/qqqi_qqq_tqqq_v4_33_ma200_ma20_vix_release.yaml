experiment_id: qqqi_qqq_tqqq_v4_33_ma200_ma20_vix_release
parent_experiment_id: qqqi_qqq_tqqq_vxn_bridge_v4_2
schema_version: "1.0"
research_only: true
trade_ready: false
post_result_hypothesis: true
issue: 639

purpose: >-
  Run the final deterministic release variant for the MA200 state-0 defensive
  line: preserve falling-SMA200 slow-bear entry and release strong defense as
  soon as existing MA20 price failure clears with VIX easing/normalization.

boundaries:
  baseline_contract: configs/research_paradigms/qqqi_qqq_tqqq_vxn_bridge_v4_2.yaml
  signal_trace_must_equal_v4_2: true
  state_1_must_equal_source: true
  state_2_must_equal_source: true
  transaction_cost_bps_per_turnover_unit: 10.0
  signal_time: session_close_t
  execution_time: next_session_open_t_plus_1
  return_measurement: adjusted_open_to_adjusted_open
  actionable_alert_changes_authorized: false
  formal_model_promotion_authorized: false

slow_entry:
  source_column: ma_long
  inherited_window_sessions: 200
  rule: ma_long_t < ma_long_t_minus_1
  parameter_search: false

minimal_release:
  rule: NOT stress_price_failure AND (vix_easing OR vix_normalized)
  price_semantics: QQQ_at_or_above_existing_SMA20
  volatility_semantics: existing_v4_2_vix_easing_or_normalized
  ma20_window_search: false
  price_buffer_search: false
  vix_threshold_search: false
  confirmation_search: false

strong_defense:
  close_rule: ma200_falling AND NOT minimal_release
  actual:
    equity_asset: QQQI
    equity_weight: 0.50
    cash_asset: SGOV
    cash_weight: 0.50
  proxy:
    equity_asset: QQQ
    equity_weight: 0.50
    cash_asset: BIL
    cash_weight: 0.50
  allocation_search: false
  persistence: false
  cooldown: false
  hysteresis: false
  state_1_unchanged: true
  state_2_unchanged: true

interaction_with_v4_27:
  source_allocation: frozen_v4_27_panic_repair
  release_restores_source_allocation: true
  v4_27_thresholds_unchanged: true
  v4_27_boost_weight_unchanged: true

comparators:
  - current_v4_2
  - v4_27_panic_repair_boost
  - v4_33_ma200_ma20_vix_defense
  - v4_33_panic_repair_ma200_ma20_vix_release

evidence_scopes:
  actual:
    role: actual_qqqi_sgov_product_evidence
    synthetic_pre_inception_backfill: false
  proxy:
    role: qqq_bil_mechanism_only
    qqqi_defensive_component: QQQ
    cash_proxy: BIL

validation:
  chronological_train_fraction: 0.60
  minimum_cash_coverage: 0.98
  retrospective_v4_3_candidate_gate:
    actual_cagr_delta_pp_min: 1.00
    actual_max_drawdown_improvement_pp_min: 2.00
    actual_calmar_delta_min: 0.15
    proxy_cagr_delta_pp_min: 0.00
    proxy_max_drawdown_improvement_pp_min: 3.00
    proxy_calmar_delta_min: 0.05
    both_chronological_segments_calmar_not_worse: true
    proxy_guard_years_min: 8
    turnover_increase_max: 1.00
  concentration_policy:
    report_largest_positive_episode_share: true
    report_largest_guard_year_share: true
    retrospective_veto: false
    prospective_validation_required: true
  direct_promotion_authorized: false
  prospective_shadow_required_before_formal_v4_3: true

stop_rule:
  final_deterministic_release_variant: true
  on_failure: close_single_factor_state0_defense_line

hypothesis_discipline:
  - Run exactly the four frozen comparators.
  - Do not search MA200 or MA20 windows, slopes, buffers or confirmation counts.
  - Do not change VIX thresholds, defensive allocation or v4.27 parameters.
  - Do not add persistence, cooldown, hysteresis or delay.
  - Do not combine with rejected VVIX, term structure, SKEW, breadth, downside-volatility or HYG/SHY factors.
  - Passing authorizes only a retrospective v4.3 candidate and prospective shadow validation.
  - Formal v4.3 requires separate non-design prospective evidence and an explicit later promotion decision.
  - If this frozen experiment fails, close this deterministic state-0 defense line rather than creating v4.34 by retuning release rules.
