experiment_id: qqqi_qqq_tqqq_v4_29_vvix_state0_defense_research
parent_experiment_id: qqqi_qqq_tqqq_vxn_bridge_v4_2
schema_version: "1.0"
research_only: true
trade_ready: false
post_result_hypothesis: false
issue: 627

purpose: >-
  Test whether point-in-time-safe VVIX stress can identify the subset of
  formal v4.2 state-0 sessions that require stronger Treasury-bill defense,
  while retaining the frozen v4.27 Panic Repair offensive overlay.

boundaries:
  baseline_contract: configs/research_paradigms/qqqi_qqq_tqqq_vxn_bridge_v4_2.yaml
  signal_trace_must_equal_v4_2: true
  state_1_must_equal_source: true
  state_2_must_equal_source: true
  transaction_cost_bps_per_turnover_unit: 10.0
  signal_time: session_close_t
  execution_time: next_session_open_t_plus_1
  return_measurement: adjusted_open_to_adjusted_open
  actionable_alert_changes_authorized: false
  formal_model_promotion_authorized: false

vvix_source:
  provider: Cboe Global Markets
  endpoint: https://cdn.cboe.com/api/global/us_indices/daily_prices/VVIX_History.csv
  alternate_provider_fallback: false
  source_splicing: false
  forward_fill: false

vvix_stress:
  rolling_sessions: 252
  quantile: 0.80
  inheritance: v4_2_vix_logic_stress_quantile
  comparison: greater_than_or_equal
  threshold_search: false

state_0_defense:
  actual:
    equity_asset: QQQI
    equity_weight: 0.50
    cash_asset: SGOV
    cash_weight: 0.50
  proxy:
    equity_asset: QQQ
    equity_weight: 0.50
    cash_asset: BIL
    cash_weight: 0.50
  allocation_search: false
  persistence: false
  cooldown: false
  hysteresis: false
  state_1_unchanged: true
  state_2_unchanged: true

interaction_with_v4_27:
  defense_precedence: true
  stressed_state_0_overrides_panic_tqqq_boost: true
  v4_27_trace_unchanged: true

comparators:
  - current_v4_2
  - v4_27_panic_repair_boost
  - v4_29_vvix_state0_defense
  - v4_29_panic_repair_vvix_state0_defense

evidence_scopes:
  actual:
    role: actual_qqqi_sgov_product_evidence
    synthetic_pre_inception_backfill: false
  proxy:
    role: qqq_bil_mechanism_only
    start_date: "2010-10-18"
    qqqi_defensive_component: QQQ
    cash_proxy: BIL

validation:
  chronological_train_fraction: 0.60
  minimum_source_coverage: 0.98
  v4_3_candidate_gate:
    actual_cagr_delta_pp_min: 1.00
    actual_max_drawdown_improvement_pp_min: 2.00
    actual_calmar_delta_min: 0.15
    proxy_cagr_delta_pp_min: 0.00
    proxy_max_drawdown_improvement_pp_min: 3.00
    proxy_calmar_delta_min: 0.05
    both_chronological_segments_calmar_not_worse: true
    largest_positive_episode_share_max: 0.50
    proxy_guard_years_min: 4
    largest_guard_year_share_max: 0.50
  direct_promotion_authorized: false

hypothesis_discipline:
  - Run exactly the four frozen comparators.
  - Do not search VVIX percentile, rolling window or defensive allocation.
  - Do not add persistence, cooldown, delay or hysteresis.
  - Do not modify state 1 or state 2.
  - Do not combine with rejected breadth, realized-volatility, credit or term-structure factors.
  - Passing authorizes only a named v4.3 candidate and prospective shadow monitoring.
  - If the frozen selector fails, record the failure instead of retuning it.
