experiment_id: qqqi_tqqq_sgov_voo_multifactor_events_v4_14_research
parent_experiment_id: qqqi_qqq_tqqq_vxn_bridge_v4_2
schema_version: "1.0"
research_only: true
trade_ready: false
post_result_exploration: true
purpose: >-
  Discover interpretable, non-overlapping defense, repair, Nasdaq acceleration
  and broad-market rotation events from frozen VIX, VXN, RSI20, Bollinger and
  QQQ-versus-VOO conditions, then evaluate a discrete action policy against v4.2.

boundaries:
  signal_time: session_close_t
  execution_time: next_session_open_t_plus_1
  return_measurement: adjusted_open_to_adjusted_open
  transaction_cost_bps_per_turnover_unit: 10.0
  annual_risk_free_rate: 0.0
  no_qqqi_pre_inception_backfill: true
  volatility_indices_are_signal_only: true
  historical_success_authorizes_shadow_only: true
  baseline_alerts_unchanged: true
  telegram_unchanged: true
  issue_348_unchanged: true

data:
  provider: yfinance_via_alphaengine_adapter
  start_date: "2010-01-01"
  end_date: null
  required_symbols: [QQQ, TQQQ, VOO, BIL, SGOV, QQQI, ^VIX, ^VXN]
  long_history_cash: BIL
  actual_cash: SGOV
  actual_product_start: "2024-01-01"

features:
  volatility:
    - vol_max_percentile_252
    - vol_max_return_5d
    - vol_min_retreat_20d
    - vxn_vix_ratio_z63
    - vxn_minus_vix_percentile
    - vxn_minus_vix_return_5d
  price:
    - qqq_rsi20
    - qqq_bollinger_pct_b_20_2
    - qqq_bollinger_bandwidth_z63
    - qqq_distance_ma20
    - qqq_distance_ma50
    - qqq_distance_ma200
    - qqq_ma20_slope_5d
    - qqq_drawdown_63d
    - qqq_realized_volatility_20d
  cross_index:
    - qqq_minus_voo_return_5d
    - qqq_minus_voo_return_20d
    - qqq_voo_rs_distance_ma20
    - qqq_voo_trend_gap
    - qqq_voo_bollinger_gap
    - voo_distance_ma200

rule_grammar:
  allowed_logic: AND
  minimum_conditions: 2
  maximum_conditions: 3
  require_one_volatility_condition: true
  require_one_price_condition: true
  maximum_cross_index_conditions: 1
  holding_sessions: 10
  cooldown_sessions: 5
  maximum_active_session_fraction: 0.25
  minimum_development_events: 8
  selected_rules_per_family: 3
  executed_rule_rank_per_family: 1
  fdr_alpha: 0.10
  macro_cluster_calendar_days: 30

outer_folds:
  - {fold: fold_2016_2017, train_start: "2011-01-03", train_end: "2015-12-31", test_start: "2016-01-01", test_end: "2017-12-29"}
  - {fold: fold_2018_2019, train_start: "2011-01-03", train_end: "2017-12-29", test_start: "2018-01-01", test_end: "2019-12-31"}
  - {fold: fold_2020_2021, train_start: "2011-01-03", train_end: "2019-12-31", test_start: "2020-01-01", test_end: "2021-12-31"}
  - {fold: fold_2022_2023, train_start: "2011-01-03", train_end: "2021-12-31", test_start: "2022-01-01", test_end: "2023-12-29"}

families:
  defense:
    target: cash_minus_qqq_10d
    action: SGOV_DEFENSE
    eligibility: always
    volatility_conditions:
      - {id: vol_stress, feature: vol_max_percentile_252, operator: ge, threshold: 0.80}
      - {id: vol_spike, feature: vol_max_return_5d, operator: ge, threshold: 0.15}
      - {id: tech_vol_premium, feature: vxn_vix_ratio_z63, operator: ge, threshold: 1.00}
      - {id: tech_percentile_premium, feature: vxn_minus_vix_percentile, operator: ge, threshold: 0.15}
    price_conditions:
      - {id: rsi_oversold, feature: qqq_rsi20, operator: le, threshold: 35.0}
      - {id: below_lower_bollinger, feature: qqq_bollinger_pct_b_20_2, operator: le, threshold: 0.10}
      - {id: below_ma20_3pct, feature: qqq_distance_ma20, operator: le, threshold: -0.03}
      - {id: drawdown_8pct, feature: qqq_drawdown_63d, operator: le, threshold: -0.08}
      - {id: bandwidth_expansion, feature: qqq_bollinger_bandwidth_z63, operator: ge, threshold: 1.00}
    cross_conditions:
      - {id: tech_underperform_20d, feature: qqq_minus_voo_return_20d, operator: le, threshold: -0.03}
      - {id: relative_strength_break, feature: qqq_voo_rs_distance_ma20, operator: le, threshold: -0.02}
      - {id: qqq_trend_weaker, feature: qqq_voo_trend_gap, operator: le, threshold: -1.0}
      - {id: qqq_bollinger_weaker, feature: qqq_voo_bollinger_gap, operator: le, threshold: -0.25}
  repair:
    target: qqq_minus_cash_10d
    action: NASDAQ_INCOME
    eligibility: recent_stress
    volatility_conditions:
      - {id: dual_vol_retreat, feature: vol_min_retreat_20d, operator: ge, threshold: 0.15}
      - {id: vol_below_extreme, feature: vol_max_percentile_252, operator: le, threshold: 0.75}
      - {id: vol_not_rising, feature: vol_max_return_5d, operator: le, threshold: 0.00}
      - {id: tech_premium_normalizing, feature: vxn_vix_ratio_z63, operator: le, threshold: 0.50}
    price_conditions:
      - {id: rsi_repaired, feature: qqq_rsi20, operator: ge, threshold: 45.0}
      - {id: bollinger_mid_reclaimed, feature: qqq_bollinger_pct_b_20_2, operator: ge, threshold: 0.50}
      - {id: ma20_reclaimed, feature: qqq_distance_ma20, operator: ge, threshold: 0.00}
      - {id: ma20_rising, feature: qqq_ma20_slope_5d, operator: ge, threshold: 0.00}
      - {id: drawdown_repaired, feature: qqq_drawdown_63d, operator: ge, threshold: -0.12}
    cross_conditions:
      - {id: tech_leads_5d, feature: qqq_minus_voo_return_5d, operator: ge, threshold: 0.00}
      - {id: relative_strength_reclaimed, feature: qqq_voo_rs_distance_ma20, operator: ge, threshold: 0.00}
      - {id: trend_not_weaker, feature: qqq_voo_trend_gap, operator: ge, threshold: 0.0}
      - {id: bollinger_gap_repaired, feature: qqq_voo_bollinger_gap, operator: ge, threshold: -0.10}
  tech_acceleration:
    target: tqqq_minus_qqq_10d
    action: NASDAQ_ACCELERATE
    eligibility: v4_2_state_2
    volatility_conditions:
      - {id: vol_normal, feature: vol_max_percentile_252, operator: le, threshold: 0.60}
      - {id: vol_retreated, feature: vol_min_retreat_20d, operator: ge, threshold: 0.20}
      - {id: tech_premium_contained, feature: vxn_vix_ratio_z63, operator: le, threshold: 0.50}
      - {id: no_tech_vol_spike, feature: vxn_minus_vix_return_5d, operator: le, threshold: 0.05}
    price_conditions:
      - {id: rsi_strength, feature: qqq_rsi20, operator: ge, threshold: 55.0}
      - {id: upper_bollinger, feature: qqq_bollinger_pct_b_20_2, operator: ge, threshold: 0.80}
      - {id: above_ma20_2pct, feature: qqq_distance_ma20, operator: ge, threshold: 0.02}
      - {id: ma20_rising, feature: qqq_ma20_slope_5d, operator: ge, threshold: 0.00}
      - {id: bandwidth_not_extreme, feature: qqq_bollinger_bandwidth_z63, operator: le, threshold: 1.50}
    cross_conditions:
      - {id: tech_leads_20d, feature: qqq_minus_voo_return_20d, operator: ge, threshold: 0.03}
      - {id: relative_strength_positive, feature: qqq_voo_rs_distance_ma20, operator: ge, threshold: 0.02}
      - {id: qqq_trend_not_weaker, feature: qqq_voo_trend_gap, operator: ge, threshold: 0.0}
      - {id: qqq_bollinger_leads, feature: qqq_voo_bollinger_gap, operator: ge, threshold: 0.00}
  broad_rotation:
    target: voo_minus_qqq_10d
    action: BROAD_EQUITY
    eligibility: voo_long_trend_positive
    volatility_conditions:
      - {id: tech_vol_premium, feature: vxn_vix_ratio_z63, operator: ge, threshold: 1.00}
      - {id: tech_percentile_premium, feature: vxn_minus_vix_percentile, operator: ge, threshold: 0.15}
      - {id: tech_vol_change_premium, feature: vxn_minus_vix_return_5d, operator: ge, threshold: 0.05}
    price_conditions:
      - {id: rsi_not_strong, feature: qqq_rsi20, operator: le, threshold: 50.0}
      - {id: below_bollinger_mid, feature: qqq_bollinger_pct_b_20_2, operator: le, threshold: 0.50}
      - {id: below_ma20, feature: qqq_distance_ma20, operator: le, threshold: 0.00}
      - {id: ma20_not_rising, feature: qqq_ma20_slope_5d, operator: le, threshold: 0.00}
    cross_conditions:
      - {id: tech_underperform_20d, feature: qqq_minus_voo_return_20d, operator: le, threshold: -0.03}
      - {id: relative_strength_break, feature: qqq_voo_rs_distance_ma20, operator: le, threshold: -0.02}
      - {id: qqq_trend_weaker, feature: qqq_voo_trend_gap, operator: le, threshold: -1.0}
      - {id: qqq_bollinger_weaker, feature: qqq_voo_bollinger_gap, operator: le, threshold: -0.20}

action_lattice:
  SGOV_DEFENSE: {cash: 1.00}
  BROAD_DEFENSE: {cash: 0.50, VOO: 0.50}
  BROAD_EQUITY: {VOO: 1.00}
  NASDAQ_INCOME: {QQQI: 1.00}
  NASDAQ_CORE: {QQQ: 1.00}
  NASDAQ_ACCELERATE: {QQQ: 0.25, TQQQ: 0.75}
  NASDAQ_MAX_ACCELERATE: {TQQQ: 1.00}
  priority: [defense, broad_rotation, repair, tech_acceleration]

validation:
  event_quality:
    minimum_macro_clusters: 8
    positive_outer_fold_rate_min: 0.70
    conditional_win_rate_lift_min: 0.10
    median_excess_return_min: 0.0
    largest_positive_cluster_share_max: 0.30
    recurrence_rate_min: 0.60
  portfolio_shadow_gate:
    cagr_improvement_vs_v4_2_pp_min: 1.50
    max_drawdown_worsening_pp_max: 1.00
    calmar_improvement_vs_v4_2_min: 0.10
    sortino_not_below_v4_2: true
    positive_calendar_year_rate_min: 0.70
    largest_family_positive_share_max: 0.50
    largest_event_positive_share_max: 0.20
    turnover_increase_max: 0.40

hypothesis_discipline:
  - All conditions, thresholds, folds, targets and actions are frozen before evidence.
  - A rule has one volatility and one price condition, with at most one cross-index condition.
  - Only AND rules are allowed.
  - Inner development selects rules; outer outcomes never change rules or thresholds.
  - QQQI is never backfilled before inception.
  - VOO is an equity sleeve and never a cash proxy.
  - Historical success authorizes at most a prospective shadow ledger.
  - v4.2, Telegram and Issue 348 remain unchanged regardless of historical results.
