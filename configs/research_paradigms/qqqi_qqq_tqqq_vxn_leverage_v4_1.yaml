experiment_id: qqqi_qqq_tqqq_vxn_leverage_v4_1
parent_experiment_id: qqqi_qqq_tqqq_breadth_vxn_v4
schema_version: "1.0"
research_only: true
trade_ready: false
post_result_hypothesis: true
purpose: >-
  Preserve the frozen VIX v3 defense and initial QQQ repair logic while using
  Nasdaq-specific VXN only as a veto on the 75% TQQQ risk layer.

boundaries:
  price_signal_symbol: QQQ
  vix_symbol: ^VIX
  vxn_symbol: ^VXN
  tradable_symbols: [QQQI, QQQ, TQQQ]
  signal_time: session_close_t
  execution_time: next_session_open_t_plus_1
  return_measurement: adjusted_open_to_adjusted_open
  common_tradable_window: true
  no_pre_inception_backfill_for_qqqi: true
  volatility_indices_are_signal_only: true

data:
  provider: yfinance_via_alphaengine_adapter
  start_date: "2010-01-01"
  end_date: null
  fields: [date, open, close]
  corporate_action_basis: adjusted

price_logic:
  ma_short: 20
  ma_medium: 50
  ma_long: 200
  ma_long_buffer: 0.01
  shock_drawdown: 0.10
  shock_lookback_sessions: 63
  shock_memory_sessions: 63
  early_breakout_sessions: 5
  confirmation_breakout_sessions: 20
  ma_rise_sessions: 3
  exit_below_ma_short_sessions: 2

vix_logic:
  rolling_window: 252
  stress_quantile: 0.80
  normalization_quantile: 0.60
  spike_1d: 0.20
  spike_5d: 0.35
  easing_retreat_for_qqq: 0.15
  normalization_retreat_for_tqqq: 0.25
  falling_sessions: 3

vxn_overlay:
  role: partial_leverage_veto_only
  qqqi_defense_uses_vix_only: true
  initial_qqq_repair_uses_vix_only: true
  partial_leverage_entry_requires_vix_normalized: true
  partial_leverage_entry_requires_vxn_not_stressed: true
  partial_leverage_exit_if_vxn_stressed: true
  no_vxn_normalization_requirement: true
  rationale: >-
    V4 showed that VXN has additional Nasdaq-specific stress information but
    that requiring full VXN normalization or replacing VIX changes too much of
    the state path. VXN therefore acts as a narrow veto, not a second timing engine.

portfolio:
  leveraged_tqqq_weight: 0.75
  transaction_cost_bps_per_turnover_unit: 10.0
  annual_risk_free_rate: 0.0
  charge_initial_entry: true

validation:
  event_horizons: [5, 10, 20, 40]
  chronological_train_fraction: 0.60
  primary_baseline_experiment: qqqi_qqq_tqqq_vix_v3_aggressive
  primary_metrics: [cagr, annual_volatility, sharpe, max_drawdown, calmar]
  compare_blocked_and_accelerated_leverage_sessions: true
  require_same_defensive_and_initial_qqq_rules: true

hypothesis_discipline:
  - This rule was generated after observing v4 and is not independent evidence.
  - VXN may prevent Nasdaq-specific leverage exposure without replacing broad-market VIX defense.
  - VXN stress is a veto; lack of stress is not a directional buy forecast.
  - No additional VXN threshold, easing rule or normalization rule may be searched in this contract.
  - Any attractive result requires future out-of-sample monitoring before promotion.
