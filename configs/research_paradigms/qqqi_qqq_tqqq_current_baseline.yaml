schema_version: "2.0"
effective_date: "2026-08-08"
strategy_family: qqqi_qqq_tqqq_recovery_risk_budget

current_research_baseline:
  model_id: qqqi_qqq_tqqq_v4_3
  display_name: QQQ Rotation v4.3
  formal_catalog: data/research/formal_model_runs/catalog.json
  preview_catalog: data/research/model_runs/catalog.json
  formal_state_engine:
    experiment_id: qqqi_qqq_tqqq_vxn_bridge_v4_2
    contract: configs/research_paradigms/qqqi_qqq_tqqq_vxn_bridge_v4_2.yaml
    role: internal_state_engine_only
  panic_repair:
    implementation: src/research/v4_2_panic_repair_boost.py
    rsi_period: 14
    rsi_lt: 30
    fear_greed_lt: 10
    tqqq_boost: 0.25
  slow_bear_defense:
    implementation: src/research/v4_33_ma200_ma20_vix_release.py
    entry: existing_SMA200_falling
    eligible_formal_state: 0
    allocation:
      QQQI: 0.50
      SGOV: 0.50
    release: QQQ_at_or_above_existing_SMA20_AND_VIX_easing_or_normalized
  execution:
    signal_time: session_close_t
    execution_time: next_session_open_t_plus_1
    transaction_cost_bps_per_turnover_unit: 10.0

performance_semantics:
  schema_version: formal_performance_semantics_v1
  trace_frequency: daily_open_to_open
  signal_time: session_close_t
  execution_time: next_session_open_t_plus_1
  return_measurement: adjusted_open_to_next_adjusted_open
  price_basis: governed_adjusted_open
  performance_date_field: date
  holding_end_offset_sessions: 1
  cost:
    rate_bps: 10.0
    turnover_formula: sum(abs(target_weight - previous_weight))
    row_cost_field: transaction_cost
    net_return_formula: gross_return - transaction_cost

promotion_decision:
  issue: 643
  research_result: docs/research/qqqi_qqq_tqqq_v4_33_ma200_ma20_vix_release_result_2026-08-08.md
  fresh_evidence_run: 31204072434
  fresh_evidence_artifact: 9004000740
  fresh_evidence_digest: sha256:7a94663c302268ab3c6fa970b41b2f306103de3dc46b714ab98c1017965601e0
  backtest_cutoff: "2026-08-06"
  actual_product_window:
    start: "2024-01-30"
    end: "2026-08-05"
    observations: 631
    v4_2:
      cagr: 0.34053977
      max_drawdown: -0.24213452
      sharpe: 1.271721
      sortino: 1.845814
      calmar: 1.406407
    v4_3:
      cagr: 0.36788696
      max_drawdown: -0.21646771
      sharpe: 1.394121
      sortino: 2.020008
      calmar: 1.699500
  long_mechanism_proxy:
    start: "2010-10-18"
    end: "2026-08-05"
    observations: 3973
    v4_2:
      cagr: 0.257203
      max_drawdown: -0.389218
      calmar: 0.660819
    v4_3:
      cagr: 0.242351
      max_drawdown: -0.333782
      calmar: 0.726074
  original_retrospective_gate: v4_33_final_release_promising_gate_failed
  failed_checks:
    - proxy_cagr_not_worse
    - early_chronological_calmar_not_worse
  decision_basis: >-
    Explicit owner-directed promotion as a drawdown/Calmar risk-budget choice.
    The actual QQQI/SGOV product window improves return, drawdown, volatility and
    risk-adjusted metrics simultaneously. The 2010+ proxy gives up about 1.49
    percentage points of CAGR for about 5.54 percentage points of maximum-
    drawdown improvement and a higher Calmar ratio. The failed pre-registered
    gate remains disclosed and is not rewritten as a pass.

active_operations:
  reviewed_formal_refresh: .github/workflows/formal-backtest-refresh.yml
  refresh_adapter: scripts/refresh_qqq_v4_3_formal.py
  signal_monitor: scripts/run_qqq_v4_3_monitor.py
  signal_alert: scripts/run_qqq_v4_3_signal_alert.py
  signal_workflow: .github/workflows/qqq-v4-3-signal-alert.yml
  strategy_console_capability: data/research/strategy_operations/capabilities.json

historical_baselines:
  - model_id: qqqi_qqq_tqqq_v4_2
    role: superseded_formal_baseline_and_research_comparator
    active: false
  - model_id: qqqi_qqq_tqqq_vxn_leverage_v4_1
    role: immutable_historical_signal_comparator
    active: false

boundaries:
  research_only: true
  trade_ready: false
  broker_execution_authorized: false
  model_selection_reopened: false
  active_v4_2_compatibility_alias: false

guardrails:
  - v4.3 is the only active QQQ formal baseline identity.
  - v4.2 may be used only as historical evidence or a named comparator.
  - Daily refresh must reproduce the frozen v4.3 rules before appending new evidence.
  - Alerts compare full target weights, not only formal-state changes.
  - No MA, VIX, RSI, Fear & Greed, defensive-weight, panic-boost, persistence or cooldown search is authorized by this promotion.
  - The model remains research-only and cannot place broker orders.
