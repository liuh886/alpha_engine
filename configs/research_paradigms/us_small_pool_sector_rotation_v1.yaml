schema_version: "1.0"
experiment_id: "us_small_pool_sector_rotation_v1"
market: "us"
benchmark: "QQQ"
research_only: true
trade_ready: false
pool_spec: "configs/pools/us_small_pool_v1.yaml"

objective:
  type: "versioned_small_pool_sector_rotation"
  primary: "rotate among user-curated economic baskets and select eligible securities"
  universal_model_required: false
  model_fitting: false
  cash_allowed: true

architecture:
  layers:
    - "market_regime"
    - "basket_rotation"
    - "security_timing"
  security_timing_spec: "configs/research_paradigms/us_focus_watchlist_cycle_signal_v1.yaml"
  shared_rules_across_baskets: true
  shared_rules_across_symbols: true

market_regime:
  reference: "QQQ"
  medium_trend_days: 50
  long_trend_days: 200
  risk_on_rule: "qqq_close > qqq_sma_200 and qqq_sma_50 > qqq_sma_200"
  risk_off_rule: "not risk_on"
  risk_off_target_exposure: 0.0

sector_context:
  reference: "SOX"
  provider_symbol: "^SOX"
  informational_only: true

rotation:
  evaluation_time: "daily_close"
  execution_time: "next_trading_session"
  rebalance_every_n_qqq_sessions: 10
  maximum_selected_baskets: 2
  maximum_selected_symbols_per_basket: 2
  forced_selection: false

  eligibility:
    minimum_eligible_constituents: 2
    minimum_constituent_coverage_ratio: 0.50
    minimum_breadth_above_sma50: 0.50
    require_positive_median_relative_momentum_63: true

  score:
    normalization: "cross_basket_percentile_rank"
    combination: "equal_weight_mean"
    components:
      median_relative_momentum_63_vs_qqq:
        weight: 0.25
        direction: "higher_is_better"
      median_momentum_20:
        weight: 0.25
        direction: "higher_is_better"
      breadth_above_sma50:
        weight: 0.25
        direction: "higher_is_better"
      median_drawdown_from_63d_high:
        weight: 0.25
        direction: "higher_is_better"
    minimum_composite_percentile: 0.50

security_selection:
  eligible_states:
    ENTER: 1.0
    HOLD: 1.0
    REDUCE: 0.5
    WATCH: 0.0
    EXIT: 0.0
  ranking:
    primary: "state_priority"
    secondary: "relative_momentum_63_vs_qqq"
    state_priority:
      ENTER: 3
      HOLD: 2
      REDUCE: 1
      WATCH: 0
      EXIT: 0
  daily_reduce_and_exit_between_rotation_dates: true
  entry_requires_selected_basket: true

portfolio:
  selected_basket_weighting: "equal_weight"
  selected_symbol_weighting_within_basket: "equal_weight"
  reduce_state_multiplier: 0.5
  maximum_gross_exposure: 1.0
  shorting_allowed: false
  automatic_order_routing: false
  manual_execution_only: true
  transaction_cost_bps_per_unit_exposure_change: 10

pool_governance:
  immutable_pool_version_per_run: true
  membership_hash_required: true
  allow_new_version_before_new_experiment: true
  allow_mid_run_changes: false
  allow_post_result_removal: false
  primary_basket_only: true

benchmarking:
  baselines:
    - "QQQ"
    - "equal_weight_pool_buy_and_hold"
  report_basket_contribution: true
  report_symbol_contribution: true
  report_cash_utilization: true

 evidence:
  development_observed:
    start: "2021-01-01"
    end: "2025-12-31"
  falsification_only:
    start: "2026-01-01"
    end: "2026-06-30"
  independent_reserved:
    start: "2026-07-01"
    end: "2026-12-31"
    opening_rule: "complete_half_year_plus_required_forward_horizon"

parameter_search:
  allowed: false
  score_weight_search_allowed: false
  basket_definition_search_allowed: false
  per_basket_rule_variants_allowed: false
  per_symbol_rule_variants_allowed: false
  rotation_frequency_search_allowed: false
  selection_count_search_allowed: false

outputs:
  required:
    - "pool_identity.json"
    - "basket_score_history.json"
    - "rotation_history.json"
    - "portfolio_state_history.json"
    - "evidence_manifest.json"
    - "decision.json"
