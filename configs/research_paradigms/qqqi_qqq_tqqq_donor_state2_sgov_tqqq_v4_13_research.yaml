experiment_id: qqqi_qqq_tqqq_donor_state2_sgov_tqqq_v4_13_research
parent_experiment_id: qqqi_qqq_tqqq_cross_asset_sgov_tqqq_transfer_v4_12_research
schema_version: "1.0"
research_only: true
trade_ready: false
post_result_hypothesis: true
purpose: >-
  Preserve the complete v4.2 state trace and state-0/state-1 allocations while
  using donor formal state-2 analogs to set one frozen 50%, 75% or 100% TQQQ
  risk budget inside each target formal state-2 episode.

boundaries:
  signal_time: session_close_t
  execution_time: next_session_open_t_plus_1
  return_measurement: adjusted_open_to_adjusted_open
  transaction_cost_bps_per_turnover_unit: 10.0
  annual_risk_free_rate: 0.0
  target_symbols_excluded_from_training: [QQQ, TQQQ, QQQI, SGOV, ^VXN]
  target_state_trace_must_equal_v4_2: true
  state_0_allocation_must_equal_v4_2: true
  state_1_allocation_must_equal_v4_2: true
  baseline_alerts_unchanged: true
  telegram_unchanged: true
  issue_348_unchanged: true

data:
  start_date: "2008-01-01"
  end_date: null
  donor_cash_proxy: BIL
  actual_cash_asset: SGOV
  risk_reference: ^VIX
  target_vxn_reference: ^VXN
  donor_pairs:
    SPY: UPRO
    IWM: TNA
    DIA: UDOW
    XLK: TECL
    SOXX: SOXL
    XLF: FAS
  target_pair:
    underlying: QQQ
    leveraged: TQQQ
  required_symbols:
    [SPY, UPRO, IWM, TNA, DIA, UDOW, XLK, TECL, SOXX, SOXL, XLF, FAS,
     QQQ, TQQQ, QQQI, BIL, SGOV, ^VIX, ^VXN]

features:
  - underlying_return_5d
  - underlying_return_20d
  - underlying_distance_ma20
  - underlying_distance_ma50
  - underlying_distance_ma200
  - underlying_ma20_slope_5d
  - underlying_realized_volatility_20d
  - underlying_drawdown_63d
  - vix_return_5d
  - vix_retreat_from_20d_high
  - vix_percentile_252d
  - donor_breadth_above_ma20
  - donor_breadth_above_ma50
  - state_1_age_sessions

label:
  name: leveraged_minus_bil_formal_state2_episode_log_return
  positive_condition: strictly_greater_than_zero
  episode_horizon: contiguous_executed_state_2

estimator:
  pipeline: median_imputer_standard_scaler_l2_logistic_regression
  penalty: l2
  C: 1.0
  class_weight: balanced
  solver: liblinear
  max_iter: 2000
  random_state: 42
  probability_inversion_allowed: false

clustering:
  macro_cluster_calendar_days: 30

strategy_mapping:
  probability_low_below: 0.40
  probability_high_at_or_above: 0.60
  low:
    TQQQ: 0.50
    cash: 0.50
  medium:
    TQQQ: 0.75
    cash: 0.25
  high:
    TQQQ: 1.00
    cash: 0.00
  no_daily_probability_resizing: true

comparators:
  - frozen_v4_2
  - state2_cash_residual_swap
  - state2_defensive_only
  - state2_offensive_only
  - state2_joint_donor_budget

validation:
  primary_target_start: "2017-01-03"
  primary_target_end: "2019-12-31"
  quarantine_proxy_start: "2020-01-02"
  quarantine_proxy_end: "2023-12-29"
  actual_start: "2024-01-02"
  macro_cluster_oof:
    minimum_donor_episodes: 30
    minimum_macro_clusters: 8
    roc_auc_min: 0.55
    spearman_ic_min: 0.05
    top_bottom_quartile_spread_positive: true
    largest_positive_cluster_contribution_max: 0.30
    maximum_single_asset_episode_share: 0.40
  leave_one_asset_out:
    roc_auc_min: 0.55
    spearman_ic_min: 0.05
    top_bottom_quartile_spread_positive: true
    positive_asset_spread_count_min: 4
  primary_target_gate:
    cagr_improvement_vs_v4_2_pp_min: 1.0
    max_drawdown_worsening_vs_v4_2_pp_max: 1.0
    calmar_improvement_vs_v4_2_min: 0.10
    sortino_not_below_v4_2: true
    positive_relative_calendar_years_min: 2
    largest_positive_episode_share_max: 0.50
    turnover_increase_max: 0.35
    ablation_metrics_to_beat_min: 2
  contradiction_gate:
    quarantine_proxy_cagr_and_calmar_both_negative_allowed: false
    actual_cagr_and_calmar_both_negative_allowed: false
    actual_max_drawdown_worsening_pp_max: 2.0

hypothesis_discipline:
  - Donor episodes must be executed formal state-2 episodes from the frozen VIX state machine.
  - QQQ, TQQQ, QQQI, SGOV and VXN may never enter donor fitting.
  - Macro-cluster OOF and leave-one-asset-out transfer must both pass.
  - Target probabilities use donor episodes strictly earlier than the target calendar year.
  - Target state 0, state 1 and all transition dates remain exactly v4.2.
  - Only formal state-2 weights may change.
  - The 2020-2023 target window is quarantined descriptive evidence.
  - Actual 2024-plus evidence is a contradiction check, not promotion evidence.
  - No result changes v4.2 or actionable alerts.
  - Passing authorizes at most a non-actionable prospective shadow monitor.
