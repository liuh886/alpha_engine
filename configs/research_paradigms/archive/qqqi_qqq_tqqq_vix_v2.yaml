experiment_id: qqqi_qqq_tqqq_vix_v2
schema_version: "1.0"
research_only: true
trade_ready: false
purpose: >-
  Test whether VIX stress, retreat and normalization improve the timing and
  risk budgeting of a QQQI / QQQ / partial-TQQQ recovery state machine.

boundaries:
  price_signal_symbol: QQQ
  volatility_signal_symbol: ^VIX
  tradable_symbols: [QQQI, QQQ, TQQQ]
  signal_time: session_close_t
  execution_time: next_session_open_t_plus_1
  return_measurement: adjusted_open_to_adjusted_open
  common_tradable_window: true
  no_pre_inception_backfill_for_qqqi: true
  no_vix_spot_trading: true
  no_parameter_promotion_from_this_contract: true

data:
  provider: yfinance_via_alphaengine_adapter
  start_date: "2010-01-01"
  end_date: null
  fields: [date, open, close]
  corporate_action_basis: adjusted

price_logic:
  ma_short: 20
  ma_medium: 50
  ma_long: 200
  ma_long_buffer: 0.01
  shock_drawdown: 0.10
  shock_lookback_sessions: 63
  shock_memory_sessions: 63
  early_breakout_sessions: 5
  confirmation_breakout_sessions: 20
  ma_rise_sessions: 3
  exit_below_ma_short_sessions: 2

vix_logic:
  rolling_window: 252
  stress_quantile: 0.80
  normalization_quantile: 0.60
  spike_1d: 0.20
  spike_5d: 0.35
  easing_retreat_for_qqq: 0.15
  normalization_retreat_for_tqqq: 0.25
  falling_sessions: 3

portfolio:
  leveraged_tqqq_weight: 0.50
  transaction_cost_bps_per_turnover_unit: 10.0
  annual_risk_free_rate: 0.0
  charge_initial_entry: true

validation:
  event_horizons: [5, 10, 20, 40]
  vix_event_cluster_gap_sessions: 20
  minimum_regime_sessions: 20
  chronological_train_fraction: 0.60
  require_all_states_reached: true

hypothesis_discipline:
  - VIX is a forward-looking SPX volatility measure, not a directional QQQ forecast.
  - Elevated VIX should control risk budget rather than create a standalone buy signal.
  - QQQI-to-QQQ requires price repair plus evidence that fear is easing.
  - Partial TQQQ requires medium-term price repair and VIX normalization.
  - Any VIX spike while price repair fails should reduce risk quickly.
