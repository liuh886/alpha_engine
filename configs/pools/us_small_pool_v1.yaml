    symbols:
      - "VRT"
      - "NBIS"
      - "IREN"
      - "TIGO"
  mega_cap_platforms:
    description: "large technology platforms and enterprise software"
    symbols:
      - "AAPL"
      - "MSFT"
      - "ORCL"
  china_consumer_internet:
    description: "China consumer internet and e-commerce"
    symbols:
      - "PDD"
      - "JD"
  defensive_consumer:
