activation_requirements:
  - "candidate and reference universes are resolved separately"
  - "every use declares an allowed role"
  - "an executable ETF requires explicit portfolio authorization in the strategy spec"
  - "an index cannot be substituted by a tracking ETF"
  - "reference registry identity is bound into every model or strategy manifest"
  - "QQQ QQQI and TQQQ strategy evidence binds the ETF bundle manifest identity"
