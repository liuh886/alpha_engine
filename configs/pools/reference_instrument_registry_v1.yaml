schema_version: "1.1"
registry_id: "reference_instrument_registry_v1"
created_at: "2026-08-01"
status: "active_governance_contract"

policy:
  candidate_eligible_by_default: false
  portfolio_eligible_by_default: false
  references_must_be_declared_by_model_or_strategy_spec: true
  cross_market_reference_use_allowed: false
  index_and_tracking_etf_are_distinct_instruments: true
  provider_aliases_must_preserve_canonical_identity: true
  reference_membership_changes_require_new_version: true
  post_result_reference_changes_allowed: false
  executable_etf_data_bundle: "configs/data/qqqi_qqq_tqqq_reference_bundle_v1.yaml"

markets:
  us:
    instruments:
      QQQ:
        canonical_symbol: "QQQ"
        instrument_type: "equity_etf"
        provider_aliases: ["QQQ"]
        roles: ["benchmark", "market_regime", "factor_reference"]
        executable: true
        candidate_eligible: false
        portfolio_eligible_by_default: false
        fundamental_data_applicable: false
        corporate_actions_applicable: true
        data_bundle_contract: "qqqi_qqq_tqqq_reference_bundle_v1"
        adjusted_open_close_required: true
      TQQQ:
        canonical_symbol: "TQQQ"
        instrument_type: "leveraged_equity_etf"
        provider_aliases: ["TQQQ"]
        roles: ["leveraged_sleeve", "recovery_context", "risk_budget_context"]
        executable: true
        candidate_eligible: false
        portfolio_eligible_by_default: false
        fundamental_data_applicable: false
        corporate_actions_applicable: true
        data_bundle_contract: "qqqi_qqq_tqqq_reference_bundle_v1"
