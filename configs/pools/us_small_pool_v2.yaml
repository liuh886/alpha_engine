schema_version: "1.0"
pool_id: "us_small_pool_v2"
parent_pool_id: "us_small_pool_v1"
created_at: "2026-08-01"
source: "user_predeclared_with_identity_corrections"
market: "us"
membership_mode: "versioned_predeclared"
status: "active_selected_pool"
primary_basket_only: true
silent_exclusion_allowed: false

corrections_from_parent:
  - type: "ticker_entity_correction"
    removed_symbol: "TIGO"
    added_symbol: "TYGO"
    reason: "TIGO is Millicom; TYGO is Tigo Energy, the intended solar and energy infrastructure company"
  - type: "independent_history_boundary"
    removed_symbol: "SNDK"
    added_symbol: "WDC"
    reason: "SNDK began independent regular-way trading on 2025-02-24; WDC is the historical storage-industry proxy"

references:
