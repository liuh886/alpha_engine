symbol_history_constraints:
  TYGO:
    public_trading_start: "2023-05-24"
    pre_start_policy: "unavailable_not_backfilled"
    eligible_after_start_only: true

forward_only_symbols:
  SNDK:
    role: "storage_industry_successor_observation"
    independent_history_start: "2025-02-24"
    pre_start_policy: "unavailable_not_backfilled"
