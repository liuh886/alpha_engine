# US x1.3 isolated factor replay — Stage A (Issue #862)
# Tests 4 expanded factor groups vs r11_sampled baseline.
# All other parameters frozen to US x1.2 contract.
schema_version: '1.0'
experiment_id: us_x1_3_factor_replay_v1
runner: cross_sectional_xgb_ranker_v1
active: true
status: pre_registered
parent_model_id: us_x1_2
research_only: true
trade_ready: false

purpose: >-
  Issue #862 Stage A: test whether expanded US OHLCV groups (reversal,
  mean-reversion, liquidity, price-volume-pressure) add information
  beyond the accepted r11_sampled baseline. All parameters frozen.

snapshot:
  policy: exact_selected_pool_source_rebuild
  source_dir: data/csv_source
  provider_identity_sha256: 1236f32168f9fc71a8fe79d733ddc21edb37e733f50f228bf97d080784a2613f
  cutoff: '2026-08-10'

fixed_model:
  model_id: us_x1_2
  frozen_spec: configs/research_paradigms/us_x1_1_frozen_v1.yaml

factor_library:
  source: configs/factor_libraries/ohlcv.yaml

candidates:
  # ---- Baseline: r11_sampled (7 factors) ----
  - candidate_id: baseline_r11_sampled
    role: baseline
    factor_groups:
      - momentum_volatility_volume
    xgb_native:
      n_gain_bins: 7
      num_boost_round: 200
      max_leaves: 31
      max_depth: 0
      min_child_weight: 1.0
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      seed: 42

  # ---- Challenger 1: + short_reversal_liquidity ----
  - candidate_id: mvv_plus_revliq
    role: challenger
    factor_groups:
      - momentum_volatility_volume
      - us_short_reversal_liquidity
    xgb_native:
      n_gain_bins: 7
      num_boost_round: 200
      max_leaves: 31
      max_depth: 0
      min_child_weight: 1.0
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      seed: 42

  # ---- Challenger 2: + volatility_reversal ----
  - candidate_id: mvv_plus_volrev
    role: challenger
    factor_groups:
      - momentum_volatility_volume
      - us_volatility_reversal
    xgb_native:
      n_gain_bins: 7
      num_boost_round: 200
      max_leaves: 31
      max_depth: 0
      min_child_weight: 1.0
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      seed: 42

  # ---- Challenger 3: + price_volume_pressure ----
  - candidate_id: mvv_plus_pressure
    role: challenger
    factor_groups:
      - momentum_volatility_volume
      - us_price_volume_pressure
    xgb_native:
      n_gain_bins: 7
      num_boost_round: 200
      max_leaves: 31
      max_depth: 0
      min_child_weight: 1.0
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      seed: 42

  # ---- Challenger 4: all three expanded groups ----
  - candidate_id: mvv_plus_all3
    role: challenger
    factor_groups:
      - momentum_volatility_volume
      - us_short_reversal_liquidity
      - us_volatility_reversal
      - us_price_volume_pressure
    xgb_native:
      n_gain_bins: 7
      num_boost_round: 200
      max_leaves: 31
      max_depth: 0
      min_child_weight: 1.0
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      seed: 42

windows:
  candidate_selection:
    - 2024H1
    - 2024H2
    - 2025H1
    - 2025H2
  consumed_reporting_only: []
  consumed_reporting_may_enter_selection: false
  new_holdout_reserved: true

execution:
  base_cost_bps: 20
  cost_stress_bps:
    - 20
    - 60

evaluation:
  schema_version: '1.0'
  baseline_candidate_id: baseline_r11_sampled
  stress_cost_bps: 60
  decision: factor_expansion_candidate_supported
  ranking:
    - gate_pass_count
    - worst_drawdown
    - compounded_relative_excess
  thresholds:
    min_window_relative_excess: 0.0
    min_worst_drawdown: -0.35
    min_stress_compounded_relative_excess: 0.0
    max_strongest_positive_window_share: 0.55
    min_mean_rank_ic_improvement: 0.0
    require_factor_baseline_dominance: false

stop_rules:
  - no_feature_search_beyond_declared_groups
  - no_pool_changes
  - no_parameter_search
  - no_portfolio_construction_changes
  - no_automatic_baseline_update

version_policy:
  maximum_surviving_candidates: 2
  may_propose_us_x1_3_candidate: false
  may_release_us_x1_3_automatically: false
  new_untouched_challenge_required: true
