schema_version: '1.0'
experiment_id: cn_x1_2_certification_2026h1_v1
runner: cross_sectional_xgb_ranker_v1
online_validation: exact_cn_ranker_portfolio_v1
active: false
status: pre_registered
parent_model_id: cn_x1_1
research_only: true
trade_ready: false

purpose: >-
  Consume the previously untouched 2026H1 window exactly once to certify the
  supported 17-factor CN x1.2 challenger against the governed CN x1.1 incumbent.
  No tuning or 2026H2 evidence is allowed.

certification:
  authority_issue: 896
  evidence_role: untouched_holdout
  window: 2026H1
  new_holdout_consumed: true
  promotion_if_supported: true
  automatic_trade_readiness: false

snapshot:
  policy: exact_selected_pool_source_rebuild
  source_dir: data/csv_source
  source_component_identity_sha256: 15248fcc8ffe83bdc025d23f07b2ab0fa7cca71880583f5c2af1db75ae35c55d
  provider_identity_sha256: 1b0b8aea689422640f6b0ca8e24ecc8c0f64fe2131caebd3fb2f1e1bd03d1050
  cutoff: '2026-08-11'

fixed_model:
  model_id: cn_x1_1
  frozen_spec: configs/research_paradigms/cn_x1_2_certification_v1.yaml

factor_library:
  source: configs/factor_libraries/ohlcv.yaml

candidates:
  - candidate_id: baseline_cn_x1_1
    role: baseline
    factor_groups:
      - cn_balanced_ohlcv
    xgb_native:
      n_gain_bins: 5
      num_boost_round: 100
      max_leaves: 31
      max_depth: 0
      min_child_weight: 1.0
      learning_rate: 0.05
      subsample: 1.0
      colsample_bytree: 1.0
      reg_alpha: 0.0
      reg_lambda: 1.0
      seed: 42

  - candidate_id: cn_x1_2_alpha158_three_mechanism
    role: challenger
    factor_groups:
      - cn_balanced_ohlcv
    canonical_factor_additions:
      library_sources:
        - src/factors/sets/qlib_alpha158.py
      factor_ids:
        - qlib_alpha158.cntd30
        - qlib_alpha158.cord5
        - qlib_alpha158.imin30
    xgb_native:
      n_gain_bins: 5
      num_boost_round: 100
      max_leaves: 31
      max_depth: 0
      min_child_weight: 1.0
      learning_rate: 0.05
      subsample: 1.0
      colsample_bytree: 1.0
      reg_alpha: 0.0
      reg_lambda: 1.0
      seed: 42

windows:
  candidate_selection:
    - 2026H1
  consumed_reporting_only: []
  consumed_reporting_may_enter_selection: false
  new_holdout_reserved: false

evaluation:
  schema_version: '1.0'
  baseline_candidate_id: baseline_cn_x1_1
  stress_cost_bps: 60
  decision: cn_x1_2_2026h1_certification
  ranking:
    - gate_pass_count
    - worst_drawdown
    - compounded_relative_excess
  thresholds:
    min_window_relative_excess: 0.0
    min_worst_drawdown: -0.25
    min_stress_compounded_relative_excess: 0.0
    max_strongest_positive_window_share: 1.01
    min_mean_rank_ic_improvement: 0.0
    require_factor_baseline_dominance: false

execution:
  base_cost_bps: 20
  cost_stress_bps: [20, 60]
  exact_portfolio:
    replay_id: exact_cn_ranker_portfolio_v1
    sector_classification: configs/research_classifications/cn130_sector_industry_v1.yaml
    sectors: 4
    names_per_sector: 1
    weighting: equal_weight
    holding_sessions: 10
    rebalance_sessions: 10
    execution_delay_sessions: 1
    regime_rule: two_of_three
    regime_long_ma_sessions: 200
    regime_momentum_sessions: 60
    regime_breadth_ma_sessions: 60
    regime_breadth_threshold: 0.50
    regime_votes_required: 2
    risk_off_fallback: '000300'

support_boundary:
  must_beat_incumbent_20bps: true
  must_beat_incumbent_60bps: true
  require_positive_relative_excess_20bps: true
  require_positive_relative_excess_60bps: true
  minimum_positive_selection_windows: 1
  minimum_max_drawdown: -0.25
  maximum_drawdown_worsening_vs_incumbent: 0.03
  require_positive_risk_on_relative_excess: true
  require_risk_off_relative_no_worse_than_cost_drag: true
  minimum_mean_rank_ic: 0.0
  require_exact_score_reproduction: true
  require_exact_portfolio_contract: true

stop_rules:
  - no_additional_candidates
  - no_additional_factors
  - no_alpha158_search
  - no_parameter_search
  - no_seed_search
  - no_portfolio_architecture_search
  - no_regime_rule_search
  - no_execution_delay_search
  - no_cost_semantic_changes
  - no_2026h2_consumption
  - no_promotion_if_any_certification_gate_fails

version_policy:
  target_model_id: cn_x1_2
  may_promote_if_certification_supported: true
  may_release_trade_ready: false
