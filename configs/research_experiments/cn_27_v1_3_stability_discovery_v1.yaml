objective:
  primary: "test whether factors positive in at least four of six V1.2 folds can retain Sharpe at least 1 with turnover below 3x"
  factor_stability_gate: "at least 75 percent of recipe factors positive in at least four of six folds"
  interpretation: "post-diagnostic retrospective evidence only"

