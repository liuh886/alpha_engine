selection_gate:
  maximum_full_window_annual_one_way_turnover: 3.0
  maximum_full_window_drawdown_magnitude: 0.25
  minimum_full_window_sharpe_log_excess: 1.0
  minimum_double_cost_full_window_sharpe_log_excess: 0.90
  minimum_positive_fold_share: 0.8333333333
  minimum_fold_sharpe_25th_percentile: 0.30
  minimum_worst_timing_perturbation_sharpe: 0.80
  minimum_stable_selected_factor_share: 0.75
  primary_ranking: "maximize_minimum_robustness_sharpe"
  tiebreakers: ["maximize_fold_sharpe_25th_percentile", "minimize_turnover", "minimize_drawdown"]

evidence:
  output_dir: "artifacts/evidence/cn_27_v1_3_stability_discovery_v1"
  expected_outputs:
    - factor_diagnostics.csv
    - factor_stability_summary.csv
    - candidate_summary.csv
    - selected_recipe.json
    - selected_daily.csv
    - selected_factor_weights.csv
    - bootstrap.json
    - decision.json
    - report.md
    - evidence_manifest.json

stop_rules:
  - no_pool_membership_change
  - no_candidate_recipe_change_after_screening
  - no_factor_set_change_after_screening
  - no_threshold_or_cost_change_after_screening
  - no_claim_of_fresh_holdout
  - no_automatic_promotion
