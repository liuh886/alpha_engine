# US x1.3 exploration grid — governed harness experiment
# Focus: calibration depth, gain bins, and regularization beyond r11_sampled.
# r11_sampled (#770 certified) is the baseline.
schema_version: '1.0'
experiment_id: us_x1_3_exploration_v1
runner: cross_sectional_xgb_ranker_v1
active: true
status: pre_registered
parent_model_id: us_x1_2
research_only: true
trade_ready: false

purpose: >-
  Explore calibration depth and regularization beyond #770 certified r11_sampled.
  15 candidates testing: gain bins (5,7), round counts (200-400), leaf counts (31-63),
  regularization (reg_alpha, reg_lambda), and factor expansion with risk_controlled_momentum.
  All using frozen US87 pool, max-4-per-sector consistent with x1.2 contract.

