    - {id: "short_term_reversal_5", family: "reversal", direction: 1, formula: "-return_5"}
    - {id: "trend_20", family: "trend", direction: 1, formula: "close / SMA20 - 1"}
    - {id: "trend_60", family: "trend", direction: 1, formula: "close / SMA60 - 1"}
    - {id: "trend_120", family: "trend", direction: 1, formula: "close / SMA120 - 1"}
    - {id: "risk_adjusted_momentum_20", family: "risk_adjusted_momentum", direction: 1, formula: "return_20 / annualized_volatility_20"}
    - {id: "risk_adjusted_momentum_60", family: "risk_adjusted_momentum", direction: 1, formula: "return_60 / annualized_volatility_60"}
    - {id: "risk_adjusted_momentum_120", family: "risk_adjusted_momentum", direction: 1, formula: "return_120 / annualized_volatility_120"}
    - {id: "trend_efficiency_60", family: "path_efficiency", direction: 1, formula: "return_60 / sum(abs(daily_return), 60)"}
    - {id: "trend_efficiency_120", family: "path_efficiency", direction: 1, formula: "return_120 / sum(abs(daily_return), 120)"}
    - {id: "residual_momentum_60", family: "residual_momentum", direction: 1, formula: "return_60 - beta_60 * market_return_60"}
    - {id: "residual_momentum_120", family: "residual_momentum", direction: 1, formula: "return_120 - beta_120 * market_return_120"}
    - {id: "low_beta_60", family: "market_risk", direction: 1, formula: "-beta_60"}
    - {id: "low_market_correlation_60", family: "diversification", direction: 1, formula: "-correlation(stock_return, market_return, 60)"}
    - {id: "low_volatility_60", family: "volatility", direction: 1, formula: "-annualized_volatility_60"}
    - {id: "drawdown_60", family: "drawdown", direction: 1, formula: "close / rolling_max_close_60 - 1"}
    - {id: "drawdown_120", family: "drawdown", direction: 1, formula: "close / rolling_max_close_120 - 1"}
    - {id: "volatility_contraction_20_60", family: "volatility_regime", direction: 1, formula: "-(volatility_20 / volatility_60)"}
    - {id: "positive_day_share_60", family: "trend_consistency", direction: 1, formula: "mean(daily_return > 0, 60)"}

