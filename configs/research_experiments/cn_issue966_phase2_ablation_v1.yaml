# Issue #966 Phase 2 — feature-only CN x1.2 mechanism ablation.
schema_version: '1.0'
experiment_id: cn_issue966_phase2_ablation_v1
runner: cross_sectional_xgb_ranker_v1
phase2_runner: cn_x1_2_feature_ablation_v1
active: false
status: preregistered_research
parent_model_id: cn_x1_2
issue: 966
research_only: true
trade_ready: false
automatic_promotion: false

purpose: >-
  Measure incremental 10-session information and exact CN x1.2 breadth-scaled
  portfolio economics from signed-volume flow and price time-series rank while
  keeping the frozen 17-factor signal baseline, XGBoost parameters, CN130,
  two-of-three regime eligibility, breadth-scaled exposure, costs and execution
  semantics fixed. Price-volume correlation is not a challenger because CORD5
  is already active in CN x1.2. 2026H2 is never requested or consumed.

resolved_non_incremental_mechanisms:
  price_volume_correlation:
    status: already_active_in_baseline
    factor_id: qlib_alpha158.cord5
    action: no_duplicate_ablation

snapshot:
  policy: exact_selected_pool_source_rebuild
  source_dir: data/csv_source
  provider_identity_sha256: 6f17a9eba541159a4cb472721b32758f6bac4892d1a917730fa1b62e9d455980
  cutoff: '2026-06-30'

fixed_model:
  model_id: cn_x1_2
  frozen_spec: configs/research_paradigms/cn_x1_2_alpha158_breadth_scaled_development_v1.yaml

factor_library:
  source: configs/factor_libraries/ohlcv.yaml

x1_2_calibration: &x1_2_calibration
  n_gain_bins: 5
  num_boost_round: 100
  max_leaves: 31
  max_depth: 0
  min_child_weight: 1.0
  learning_rate: 0.05
  subsample: 1.0
  colsample_bytree: 1.0
  reg_alpha: 0.0
  reg_lambda: 1.0
  seed: 42

baseline_additions: &baseline_additions
  library_sources:
    - src/factors/sets/qlib_alpha158.py
  factor_ids:
    - qlib_alpha158.cntd30
    - qlib_alpha158.cord5
    - qlib_alpha158.imin30

candidates:
  - candidate_id: baseline_cn_x1_2
    role: baseline
    factor_groups: [cn_balanced_ohlcv]
    canonical_factor_additions: *baseline_additions
    regime_rule: two_of_three
    exposure_policy: breadth_scaled
    xgb_native: *x1_2_calibration

  - candidate_id: cn_x1_2_plus_signed_volume
    role: challenger
    factor_groups: [cn_balanced_ohlcv]
    canonical_factor_additions:
      library_sources:
        - src/factors/sets/qlib_alpha158.py
        - configs/factor_libraries/volume_stat_research.yaml
      factor_ids:
        - qlib_alpha158.cntd30
        - qlib_alpha158.cord5
        - qlib_alpha158.imin30
        - volume_stat_research.signed_volume_balance_10d
    regime_rule: two_of_three
    exposure_policy: breadth_scaled
    xgb_native: *x1_2_calibration

  - candidate_id: cn_x1_2_plus_rank20
    role: challenger
    factor_groups: [cn_balanced_ohlcv]
    canonical_factor_additions:
      library_sources:
        - src/factors/sets/qlib_alpha158.py
      factor_ids:
        - qlib_alpha158.cntd30
        - qlib_alpha158.cord5
        - qlib_alpha158.imin30
        - qlib_alpha158.rank20
    regime_rule: two_of_three
    exposure_policy: breadth_scaled
    xgb_native: *x1_2_calibration

  - candidate_id: cn_x1_2_plus_signed_volume_rank20
    role: challenger
    factor_groups: [cn_balanced_ohlcv]
    canonical_factor_additions:
      library_sources:
        - src/factors/sets/qlib_alpha158.py
        - configs/factor_libraries/volume_stat_research.yaml
      factor_ids:
        - qlib_alpha158.cntd30
        - qlib_alpha158.cord5
        - qlib_alpha158.imin30
        - qlib_alpha158.rank20
        - volume_stat_research.signed_volume_balance_10d
    regime_rule: two_of_three
    exposure_policy: breadth_scaled
    xgb_native: *x1_2_calibration

windows:
  candidate_selection: [2024H1, 2024H2, 2025H1, 2025H2, 2026H1]
  consumed_reporting_only: []
  consumed_reporting_may_enter_selection: false
  new_holdout_reserved: true

execution:
  base_cost_bps: 20
  cost_stress_bps: [20, 60]
  exact_portfolio:
    replay_id: exact_cn_ranker_portfolio_v1
    sector_classification: configs/research_classifications/cn130_sector_industry_v1.yaml
    sectors: 4
    names_per_sector: 1
    weighting: equal_weight
    holding_sessions: 10
    rebalance_sessions: 10
    execution_delay_sessions: 1
    regime_rule: two_of_three
    regime_long_ma_sessions: 200
    regime_momentum_sessions: 60
    regime_breadth_ma_sessions: 60
    regime_breadth_threshold: 0.50
    regime_votes_required: 2
    risk_off_fallback: '000300'

# The generic harness contract stays non-selective. The exact breadth-scaled
# runner applies the incremental Gate-2 policy to every challenger.
evaluation:
  schema_version: '1.0'
  baseline_candidate_id: baseline_cn_x1_2
  stress_cost_bps: 60
  decision: issue966_phase2_diagnostic_complete
  ranking: [gate_pass_count, worst_drawdown, compounded_relative_excess]
  thresholds:
    min_window_relative_excess: -1.0
    min_worst_drawdown: -1.0
    min_stress_compounded_relative_excess: -1.0
    max_strongest_positive_window_share: 1.01
    min_mean_rank_ic_improvement: -1.0
    require_factor_baseline_dominance: false

gate2_policy:
  baseline_candidate_id: baseline_cn_x1_2
  must_beat_baseline_20bps: true
  must_beat_baseline_60bps: true
  minimum_positive_selection_windows: 4
  maximum_drawdown_worsening_vs_baseline: 0.03
  maximum_abs_mean_daily_rank_correlation_to_baseline_feature: 0.95
  require_exact_score_reproduction: true
  require_exact_portfolio_reproduction: true
  automatic_promotion: false

stop_rules:
  - no_duplicate_cord_ablation
  - no_hyperparameter_search
  - no_regime_or_exposure_policy_changes
  - no_portfolio_changes
  - no_universe_changes
  - no_cost_changes
  - no_2026h2_use
  - no_transform_search_before_gate2
  - no_automatic_model_promotion
