# CN x1.2 systematic ranker grid — governed harness experiment
# Explores factor groups × calibration combinations.
# Score-level evaluation only; full CN x1.1 portfolio path required for final decision.
schema_version: '1.0'
experiment_id: cn_x1_2_ranker_grid_v1
runner: cross_sectional_xgb_ranker_v1
active: true
status: pre_registered
parent_model_id: cn_x1_1
research_only: true
trade_ready: false

