    - 2024H1
    - 2024H2
    - 2025H1
    - 2025H2
  consumed_reporting_only: []
  consumed_reporting_may_enter_selection: false
  new_holdout_reserved: true

execution:
  base_cost_bps: 20
  cost_stress_bps: [20, 60]
  exact_portfolio:
    replay_id: exact_us_ranker_portfolio_v1
    top_n: 15
    weighting: equal_weight
    maximum_names_per_sector: 4
    sector_classification: configs/research_classifications/us87_sector_industry_v1.yaml
    holding_sessions: 10
    rebalance_sessions: 10
    fill_contract: scan_complete_eligible_cross_section_until_exactly_15
    fail_closed_if_unfillable: true

evaluation:
  schema_version: '1.0'
  baseline_candidate_id: baseline_r11_sampled
  stress_cost_bps: 60
  decision: us_x1_3_stage_b_candidate_supported
  ranking:
    - gate_pass_count
    - worst_drawdown
    - compounded_relative_excess
  thresholds:
    min_window_relative_excess: 0.0
    min_worst_drawdown: -0.35
    min_stress_compounded_relative_excess: 0.0
    max_strongest_positive_window_share: 0.55
    min_mean_rank_ic_improvement: 0.0
    require_factor_baseline_dominance: false

support_boundary:
  must_beat_incumbent_20bps: true
  must_beat_incumbent_60bps: true
  minimum_positive_selection_windows: 3
  require_positive_mean_rank_ic: true
  require_exact_score_reproduction: true
  require_governed_sector_cap: true
  drawdown_comparison: report_delta_without_posthoc_numeric_threshold

stop_rules:
  - no_new_factor_groups
  - no_parameter_search
  - no_seed_search
  - no_topk_search
  - no_sector_cap_search
  - no_label_or_holding_period_search
  - no_cost_semantic_changes
  - no_automatic_model_promotion

version_policy:
