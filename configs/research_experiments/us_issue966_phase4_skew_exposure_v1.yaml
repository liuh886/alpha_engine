schema_version: '1.0'
experiment_id: us_issue966_phase4_skew_exposure_v1
issue: 966
phase: 4
status: preregistered_control_test
research_only: true
trade_ready: false
automatic_promotion: false

baseline_experiment: configs/research_experiments/us_issue966_phase2_ablation_v1.yaml
baseline_candidate_id: baseline_us_x1_2

risk_signal:
  factor_library: configs/factor_libraries/distribution_risk_research.yaml
  factor_id: distribution_risk_research.ret_skew_20d
  aggregation: cross_sectional_median
  risk_orientation: negative

control:
  use: exposure_scaling
  threshold:
    method: trailing_quantile
    lookback_sessions: 252
    quantile: 0.80
    lag_sessions: 1
  normal_exposure: 1.0
  high_risk_exposure: 0.5

frozen:
  model_candidate: baseline_us_x1_2
  universe: us_selected_equities_v2
  benchmark: QQQ
  label_horizon_sessions: 10
  holding_sessions: 10
  rebalance_sessions: 10
  top_n: 15
  max_names_per_sector: 4
  costs_bps: [20, 60]
  selection_windows: [2024H1, 2024H2, 2025H1, 2025H2]
  provider_cutoff: '2026-06-30'

gate4_policy:
  minimum_drawdown_improvement_20bps: 0.01
  minimum_relative_excess_retention_ratio_20bps: 0.90
  minimum_relative_excess_retention_ratio_60bps: 0.90
  minimum_positive_windows_20bps: 3
  require_exact_full_exposure_baseline_reproduction: true
  require_deterministic_control_reproduction: true
  automatic_promotion: false

stop_rules:
  - one_control_use_only
  - no_threshold_search
  - no_exposure_level_search
  - no_ranker_feature_addition
  - no_model_calibration_change
  - no_portfolio_selection_change
  - no_2026h1_or_2026h2_selection
  - no_automatic_promotion
