# PR #870 Stage B — canonical full-path replay for cal_deeper.
# Grid discovery remains separate; this mission freezes only incumbent + winner.
schema_version: '1.0'
experiment_id: cn_x1_2_cal_deeper_stage_b_v1
runner: cross_sectional_xgb_ranker_v1
active: false
status: pre_registered
parent_model_id: cn_x1_1
research_only: true
trade_ready: false
online_validation: exact_cn_ranker_portfolio_v1

purpose: >-
  Validate PR #870 winner cal_deeper on the governed CN x1.1 portfolio path.
  Refit the frozen daily ranker on canonical CN130 data, then replay sector 4x1,
  two-of-three PIT regime gating, one-session execution delay, CSI300 risk-off
  fallback, actual turnover, and 20/60 bps costs. No new holdout is consumed.

submission_lineage:
  source_pr: 870
  evidence_tier: grid_discovery
  grid_winner: cal_deeper
  grid_relative_excess: 0.282
  promotion_eligible: false

snapshot:
  policy: exact_selected_pool_source_rebuild
  source_dir: data/csv_source
  source_component_identity_sha256: 15248fcc8ffe83bdc025d23f07b2ab0fa7cca71880583f5c2af1db75ae35c55d
  provider_identity_sha256: fa92e3e88facf5908b9f6ec153f140e2505a9bce3ef693078cd001b58f607f40
  cutoff: '2026-08-11'
  identity_note: >-
    source_component_identity_sha256 is the selected-pool price-component lineage;
    provider_identity_sha256 is the deterministic CN130 + CSI300 Qlib runtime
    provider expected from exact repository-source rebuild.

fixed_model:
  model_id: cn_x1_1
  frozen_spec: configs/research_paradigms/cn_10d_selected_pool_ranker_retest_v1.yaml

factor_library:
  source: configs/factor_libraries/ohlcv.yaml

candidates:
  - candidate_id: baseline_cn_x1_1
    role: baseline
    factor_groups:
      - cn_balanced_ohlcv
    xgb_native:
      n_gain_bins: 5
      num_boost_round: 100
      max_leaves: 31
      max_depth: 0
      min_child_weight: 1.0
      learning_rate: 0.05
      subsample: 1.0
      colsample_bytree: 1.0
      reg_alpha: 0.0
      reg_lambda: 1.0
      seed: 42

  - candidate_id: cal_deeper
    role: challenger
    factor_groups:
      - cn_balanced_ohlcv
      - cn_short_reversal_liquidity
    xgb_native:
      n_gain_bins: 7
      num_boost_round: 300
      max_leaves: 63
      max_depth: 0
      min_child_weight: 1.0
      learning_rate: 0.03
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      seed: 42

windows:
  candidate_selection:
    - 2024H1
    - 2024H2
    - 2025H1
    - 2025H2
  consumed_reporting_only: []
  consumed_reporting_may_enter_selection: false
  new_holdout_reserved: true

execution:
  base_cost_bps: 20
  cost_stress_bps: [20, 60]
  exact_portfolio:
    replay_id: exact_cn_ranker_portfolio_v1
    sector_classification: configs/research_classifications/cn130_sector_industry_v1.yaml
    sectors: 4
    names_per_sector: 1
    weighting: equal_weight
    holding_sessions: 10
    rebalance_sessions: 10
    execution_delay_sessions: 1
    regime_rule: two_of_three
    regime_long_ma_sessions: 200
    regime_momentum_sessions: 60
    regime_breadth_ma_sessions: 60
    regime_breadth_threshold: 0.50
    regime_votes_required: 2
    risk_off_fallback: '000300'

evaluation:
  schema_version: '1.0'
  baseline_candidate_id: baseline_cn_x1_1
  stress_cost_bps: 60
  decision: cn_x1_2_cal_deeper_full_path_supported
  ranking:
    - gate_pass_count
    - worst_drawdown
    - compounded_relative_excess
  thresholds:
    min_window_relative_excess: 0.0
    min_worst_drawdown: -0.25
    min_stress_compounded_relative_excess: 0.0
    max_strongest_positive_window_share: 0.60
    min_mean_rank_ic_improvement: 0.0
    require_factor_baseline_dominance: false

support_boundary:
  must_beat_incumbent_20bps: true
  must_beat_incumbent_60bps: true
  minimum_positive_selection_windows: 3
  minimum_max_drawdown: -0.25
  maximum_drawdown_worsening_vs_incumbent: 0.03
  require_positive_risk_on_relative_excess: true
  require_risk_off_relative_no_worse_than_cost_drag: true
  require_exact_score_reproduction: true
  require_exact_portfolio_contract: true

stop_rules:
  - no_additional_candidates
  - no_factor_search
  - no_parameter_search
  - no_seed_search
  - no_portfolio_architecture_search
  - no_regime_rule_search
  - no_execution_delay_search
  - no_cost_semantic_changes
  - no_2026_holdout_consumption
  - no_automatic_model_promotion

version_policy:
  maximum_surviving_candidates: 1
  may_propose_cn_x1_2_candidate: true
  may_release_cn_x1_2_automatically: false
  new_untouched_challenge_required: true
