schema_version: "1.0"
experiment_id: "cn130_pit_disclosure_reaction_v1"
issue: 550
status: "frozen_pre_evaluation"
research_only: true
trade_ready: false

inputs:
  universe: "configs/research_universes/cn_selected_equities_v3.yaml"
  expected_members: 130
  membership_changes_allowed: false
  price_provider_cutoff: "2026-08-03"
  price_provider_artifact_id: 8850463785
  pit_event_artifact_id: 8926572265
  calibration_ledger_artifact_id: 8927662386
  benchmark: "000300"

windows:
  calibration: [2022H2, 2023H1, 2023H2]
  frozen_validation: [2024H1, 2024H2, 2025H1, 2025H2]
  reporting_only: [2026H1, 2026H2_PARTIAL]

execution:
  horizon_sessions: 10
  execution_delay_sessions: 1
  rebalance_interval_sessions: 10
  transaction_cost_bps: [10, 20, 40]
  disclosure_same_day_trading_allowed: false
  reaction_measurement_sessions: 3
  maximum_recent_event_age_sessions: 20

components:
  - abnormal_return_1
  - abnormal_return_3
  - abnormal_gap_1
  - amount_ratio_1
  - amount_ratio_3

component_support_gate:
  minimum_recent_event_coverage: 0.15
  minimum_mean_rank_ic: 0.05
  minimum_positive_half_years: 3
  minimum_worst_half_year_rank_ic: 0.0
  minimum_mean_incremental_rank_ic: 0.02
  require_positive_mean_spread: true
  maximum_sector_absolute_spread_share: 0.60
  select_at_most_one_component: true

architectures:
  E0_r0_sector_4x1:
    rule: "highest R0 name in each selected sector"
  E1_recent_event_rerank:
    rule: "when at least two R0 Top3 names have a recent event, rank those names by the selected event component"
  E2_negative_reaction_switch:
    rule: "switch from a negative-event R0 Top1 to the highest-R0 non-negative recent-event Top3 name"
  E3_negative_reaction_cash:
    rule: "hold cash for a sector when its R0 Top1 has a negative selected event component"

architecture_calibration_gate:
  must_beat_E0_at_20bps: true
  minimum_positive_half_years: 3
  worst_window_must_not_be_worse_than_E0: true
  require_positive_leave_one_name: true
  require_positive_leave_one_sector: true
  maximum_sector_absolute_contribution_share: 0.60
  minimum_mean_exposure: 0.75
  select_at_most_one_architecture: true

frozen_validation_gate:
  must_beat_E0_at_20bps: true
  must_beat_E0_at_40bps: true
  minimum_positive_half_years: 3
  worst_window_must_not_be_worse_than_E0: true
  require_positive_leave_one_name: true
  require_positive_leave_one_sector: true
  maximum_sector_absolute_contribution_share: 0.55

outcomes:
  - data_blocked
  - disclosure_reaction_component_not_supported
  - disclosure_reaction_architecture_not_supported
  - disclosure_reaction_validation_not_supported
  - pit_disclosure_reaction_research_candidate

promotion:
  creates_cn_x1_1_automatically: false
  requires_separate_promotion_review: true
