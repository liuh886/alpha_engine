known_limitations:
- The static CN130 universe carries survivorship bias.
- The preregistered development decision was rejected because 2026H1 maximum drawdown worsened by 4.799 percentage points versus a 3 percentage-point limit.
- The explicit user decision promotes the research baseline but does not establish that all preregistered gates passed.
- The 2026H2 range is reporting-only: it may extend formal evidence and current inference but may not enter model selection, factor search, calibration or parameter fitting.
- Formal Bundle v2 evidence is maintained append-only; current-target inference is identity-bound to the frozen CN x1.2 contract.
- Research-only evidence is not authorization for live or automated trading.
