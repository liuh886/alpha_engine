known_limitations:
- Static curated membership carries survivorship bias.
- Development return is concentrated in 2025H2.
- The 2025H1 development drawdown reached -28.36%.
- 2026H1 selections remain concentrated in high-beta growth and semiconductor names.
- The historical candidate calibration schema contains LightGBM-oriented fields that were not consumed by XGBoost.
- Seed/bootstrap, contribution concentration and higher-cost robustness are not yet promotion-complete.
