known_limitations:
- Static curated membership carries survivorship bias.
- The worst development drawdown remains -27.15%.
- AAOI, AEHR and BE recur in all four development final Top-15 lists.
- The 2026H1 reporting window has already been consumed and cannot be reused for candidate selection.
- XGBoost native regularization parameters are not yet identity-bound under Issue #357.
- Sector and security contribution controls are not yet fully validated.
- This is the formal research baseline, not a trade-ready model.
