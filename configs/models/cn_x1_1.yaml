known_limitations:
- The static CN130 universe carries survivorship bias.
- CN x1.1 inherits the frozen CN x1.0 score and does not independently repair ranker limitations.
- The 2026 path is reporting-only and increases the complete-path maximum drawdown to about 37.1%.
- Risk-off CSI300 tracking can lag the benchmark by transaction costs around state transitions.
- Research-only evidence is not authorization for live or automated trading.
