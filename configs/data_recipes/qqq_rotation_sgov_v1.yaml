schema_version: "1.0"
recipe_id: "qqq-rotation-sgov"
builder: "strategy_bundle"
status: "active_research_recipe"
research_only: true
trade_ready: false

description: >-
  Prepare one hash-bound six-symbol strategy data product for QQQI/QQQ/TQQQ
  recovery research with SGOV as a defensive tradable and VIX/VXN as signal-only
  references. The product is immutable at a declared cutoff.

history:
  requested_start: "2010-01-01"
  default_cutoff: null

symbols:
  base_tradable: ["QQQI", "QQQ", "TQQQ"]
  supplemental:
    SGOV: "tradable"
    "^VIX": "signal_reference"
    "^VXN": "signal_reference"

source_products:
  etf_contract: "configs/data/qqqi_qqq_tqqq_reference_bundle_v1.yaml"
  etf_bundle_root: "artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1"
  strategy_bundle_root: "artifacts/data/qqq_rotation_sgov_strategy_data_v1"
  model_data_bundle_root: "artifacts/data/qqq_rotation_sgov_model_data_v1"
  frontend_data_dir: "artifacts/site/data"

model_data:
  contract: "configs/data_contracts/qqq_rotation_sgov_model_data_v1.yaml"
  component_id: "strategy.qqqi_qqq_tqqq_sgov_vix_vxn_v1"
  component_kind: "strategy_data_bundle"
  profile_id: "qqqi_qqq_tqqq_sgov_vix_vxn_rotation_v1"
  candidate_pool_id: "qqqi_qqq_tqqq_sgov_strategy_bundle_v1"

cache:
  pointer: "artifacts/cache/data_recipes/qqq-rotation-sgov/latest.json"
  reuse_requires_ready_profile: true
  forbid_cross_cutoff_reuse: true

research_commands:
  qqqi-v4.2-sgov-recovery-release:
    runner: "scripts/run_qqqi_v4_2_sgov_recovery_release_experiment.py"
    output_dir: "artifacts/evidence/qqqi_qqq_tqqq_v4_2_sgov_recovery_release_v4_4_research"
    runner_arguments:
      data_bundle_flag: "--etf-data-bundle"
      output_flag: "--output-dir"
      cutoff_flag: "--end-date"
