schema_version: "1.0"
registry_id: "symbol_identity_and_lifecycle_v1"
created_at: "2026-08-01"
status: "authoritative_fail_closed_rules"

rules:
  orphan_or_corrupt_files:
    ALBA:
      market: "us"
      action: "delete_from_active_data"
      reason: "orphan file with sparse, zero-volume and constant-price observations; not a member of an active universe"

  ticker_identity_conflicts:
    TIGO:
      market: "us"
      entity: "Millicom International Cellular"
      retained_in_selected_universe: true
      prohibited_roles: ["solar_energy", "energy_infrastructure", "ai_infrastructure_power"]
      intended_symbol_for_tigo_energy: "TYGO"
      action: "retain_as_millicom_and_exclude_from_energy_baskets"

  independent_listing_boundaries:
    TYGO:
      market: "us"
      public_trading_start: "2023-05-24"
      pre_start_policy: "unavailable_not_backfilled"
      authoritative_backtest_before_start_allowed: false
      eligible_after_start_only: true
    SNDK:
      market: "us"
      independent_history_start: "2025-02-24"
      pre_start_policy: "unavailable_not_backfilled"
      historical_proxy: "WDC"
      authoritative_backtest_before_start_allowed: false
      prospective_shadow_allowed: true

  terminal_listings:
    EA:
      market: "us"
      terminal_date: "2026-08-05"
      reason: "take-private acquisition completed; Nasdaq listing terminated"
      event_type: "acquisition_take_private_delisting"
      active_universe_after_terminal_date_allowed: false
      historical_rows_retained: true
      public_references:
        - "https://www.miaxglobal.com/alert/2026/08/04/miax-exchange-group-options-markets-delisting-electronic-arts-inc-ea"
        - "https://www.wienerborse.at/en/news/vienna-stock-exchange-news/electronic-arts-trading-suspension-08052026/"
    "600837":
      market: "cn"
      terminal_date: "2025-03-04"
      reason: "terminated listing after absorption merger"
      active_universe_after_terminal_date_allowed: false
      historical_rows_retained: true
    "601989":
      market: "cn"
      terminal_date: "2025-09-05"
      reason: "terminated listing after absorption merger"
      active_universe_after_terminal_date_allowed: false
      historical_rows_retained: true

governance:
  data_repair_must_not_rewrite_observed_prices_without_source_evidence: true
  corporate_action_boundaries_must_be_explicit: true
  inactive_symbols_may_remain_for_historical_reproduction: true
  inactive_symbols_must_not_enter_new_authoritative_runs: true
