  # --- Reserved research family (no values, no claims) ---
  # RDI is a CN market-scope risk-event research family. It is not qualified and
  # emits no series. Registration fixes scope and identity so a future admission
  # cannot silently mix it with price-scope or US market indicators.
  - indicator_id: market_cn_rdi_reserved
    scope: market
    market: cn
    kind: reserved
    formula: null
    formula_version: null
    inputs:
