schema_version: "1.0"
registry_id: "indicator_registry_v1"
created_at: "2026-11-17"
status: "active_governance_contract"

# Alpha Engine remains research-only. Indicators are descriptive evidence over
# governed observed bars; they are never trade signals or order instructions.
research_only: true
trade_ready: false

# Scope and truth rules. Each flag is enforced by tests, not merely documented.
policy:
  scope_isolation: true
  cross_market_indicator_use_allowed: false
  instrument_indicators_use_own_bars_only: true
  exact_observed_bars_only: true
  forward_fill_or_interpolation_allowed: false
  insufficient_data_emits_value: false
  browser_derived_at_render_time: true
  market_series_require_governed_publication: true

# Formula identifiers are versioned implementation contracts. The registry may
# only reference a formula listed here, and the implementation version in
# qlib-dashboard/src/lib/indicators.ts must match. Adding or changing a formula
# requires a new formula version plus reference-sequence tests.
formula_catalog:
  sma:
    version: "1"
    params: ["period"]
    outputs: ["value"]
  ema:
    version: "1"
    params: ["period"]
    outputs: ["value"]
  rsi:
    version: "1"
    params: ["period"]
    outputs: ["value"]
  macd:
    version: "1"
    params: ["fast", "slow", "signal"]
    outputs: ["macd", "signal", "histogram"]
  bollinger:
    version: "1"
    params: ["period", "std_dev"]
    outputs: ["middle", "upper", "lower"]
  volume_sma:
    version: "1"
    params: ["period"]
    outputs: ["value"]

# Entry semantics:
#   scope   instrument = computed from the instrument's own observed bars;
#           market     = computed from one governed market series (for example
#                        us:VIX). A market entry declares exactly one market and
#                        must never consume another market's series.
#   kind    derived = formula over the declared input;
#           series  = raw governed series reference (no formula math);
#           reserved = future family, never produces values.
#   status  governed = admitted for descriptive display;
#           research_only = research family without admitted values;
#           blocked = a governed formula whose source contract is under repair.
# Only kind derived/series with status governed and a published input can emit
# values. reserved and every non-governed status are refused by the module.
indicators:
  # --- Instrument-scope indicators (own observed bars only) ---
  - indicator_id: instrument_sma_20
    scope: instrument
    kind: derived
    formula: sma
    formula_version: "1"
    inputs:
      source: instrument_bars
      field: close
    params:
      period: 20
    version: "1"
    status: governed
    description: "20-session simple moving average of the instrument close."
    provenance:
      authorized_by: "Owner, Alpha Engine"
      authorized_on: "2026-11-17"
      rationale: "Owner decision 2026-11-17: maintained chart indicators are governed like data updates."
      source: "docs/architecture/indicator_governance.md; chart/indicator slice brief 2026-11-17"

