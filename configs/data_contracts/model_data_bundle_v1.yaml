        accepted_statuses: ["ready"]
        minimum_coverage_ratio: 1.0
      - component_id: "fundamentals.cn_selected_equities_v3"
        accepted_statuses: ["ready", "partial"]
        minimum_coverage_ratio: 0.8
      - component_id: "corporate_actions.cn_selected_equities_v3"
        accepted_statuses: ["ready", "partial"]
