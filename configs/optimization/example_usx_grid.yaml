# Example: USx lower_lr calibration + sector cap optimization
# Demonstrates the declarative experiment contract format.
# Any agent can generate specs like this and run via:
#   python scripts/run_model_optimizer.py --spec configs/optimization/example_usx_grid.yaml

experiment_id: example_usx_sector_cap_grid
model_type: ranker
market: us
benchmark: QQQ
gate_profile: ten_day_model_gates_v1

cost_structure:
  base_cost_bps: 20.0
  stress_cost_bps: [40.0, 60.0]

windows:
  labels: ["2024H1", "2024H2", "2025H1", "2025H2"]
  train_start: "2021-01-01"
  first_test_year: 2024
  last_test_year: 2025

provider_uri: data/providers/us
universe_config: configs/research_universes/us_selected_equities_v2.yaml
factor_library: configs/factor_libraries/ohlcv.yaml

# Baseline: US x1.1 standard config
baseline_candidate_id: baseline_std

candidates:
  - candidate_id: baseline_std
    role: baseline
    params:
      factor_groups: ["momentum_volatility_volume"]
      calibration:
        n_gain_bins: 7
        num_boost_round: 200
        max_leaves: 31
        learning_rate: 0.05
        subsample: 1.0
        colsample_bytree: 1.0
        seed: 42
      top_n: 15
      max_per_sector: null
    description: "US x1.1 baseline — standard calibration, no sector cap"

  - candidate_id: lower_lr_cap4
    role: challenger
    params:
      factor_groups: ["momentum_volatility_volume"]
      calibration:
        n_gain_bins: 7
        num_boost_round: 300
        max_leaves: 31
        learning_rate: 0.03
        subsample: 0.8
        colsample_bytree: 0.8
        seed: 42
      top_n: 15
      max_per_sector: 4
    description: "Lower LR + row/col sampling + max 4 per sector"

  - candidate_id: lower_lr_cap3_top12
    role: challenger
    params:
      factor_groups: ["momentum_volatility_volume"]
      calibration:
        n_gain_bins: 7
        num_boost_round: 300
        max_leaves: 31
        learning_rate: 0.03
        subsample: 0.8
        colsample_bytree: 0.8
        seed: 42
      top_n: 12
      max_per_sector: 3
    description: "Lower LR + tighter cap + fewer stocks"
