structural_synthesis:
  conclusion: >-
    v4.2 is a strong slow daily regime engine. Completed daily factor, transition,
    regularized action, state-conditioned and credit-duration experiments did not
    produce a stable replacement. The accepted state-2 tail audit found that major
    leveraged losses were predominantly formed intraday and were not observable at
    the preceding close. The next distinct information horizon is therefore an
    intraday meta-label overlay above, not inside, frozen v4.2.
  retained_evidence:
    - v4_2_daily_state_machine_is_not_reopened
    - leverage_entry_confirmation_is_a_hypothesis_not_a_promoted_rule
    - credit_duration_information_improves_ranking_but_not_magnitude_calibration
    - fixed_daily_action_overrides_add_excess_turnover_and_underperform
    - intraday_tail_control_requires_governed_intraday_data

