retained_research_fact:
  statement: >-
    The complete credit-duration block provides stable chronological ranking
    information beyond the existing twenty-nine market-price and volatility
    inputs, but its predicted advantage magnitude is not calibrated and its
    fixed-threshold event policy does not improve frozen v4.2.

closed_retrospective_directions:
  - fixed_0_50_percent_credit_duration_action_threshold
  - selecting_cash_defense_from_actual_only
  - selecting_nasdaq_acceleration_from_oof_only
  - selecting_a_subset_of_eight_credit_duration_features
  - changing_credit_duration_windows_or_directions
  - changing_ridge_alpha_or_model_family_from_v4_20
  - lowering_advantage_or_margin_thresholds
  - adding_state_interactions_or_state_specific_models
  - continuous_weight_optimization
  - adding_credit_duration_to_v4_2_or_telegram

next_admissible_research:
  primary: prospective_v4_2_evidence_under_issue_348
  retrospective_boundary: >-
    Do not continue tuning the credit-duration action policy on the same history.
    Any future retrospective experiment must begin with a genuinely new,
    independently sourced and preregistered information family rather than a
    modification of v4.20 thresholds, model architecture or action subsets.

