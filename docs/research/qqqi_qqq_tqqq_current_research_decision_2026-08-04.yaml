    factor_gate_failed:
      - aggregate_oof_auc
      - aggregate_oof_spearman_ic
      - top_bottom_quartile_spread
      - positive_validation_year_rate
      - largest_positive_year_share
    strategy_gate_passed:
      - cagr_improvement
      - max_drawdown_not_materially_worse
      - sortino_not_below
      - turnover
      - beats_defensive_ablation
      - actual_proxy_cagr_direction
      - actual_proxy_calmar_direction
    strategy_gate_failed:
      - calmar_improvement
      - positive_relative_calendar_years
      - event_concentration
      - beats_offensive_ablation
  decision: recovery_quality_factor_has_no_stable_oof_signal
  audit: audit_pass_nonpromotion_result_valid
  shadow_monitor_authorized: false
  actionable_alert_authorized: false
  direct_promotion_authorized: false
  interpretation: >-
    The apparent holdout gain is not admissible evidence of model skill. The
    model ranked future marginal leverage returns in the wrong direction across
    the aggregated pre-2024 walk-forward sample, produced no low-score state-2
    episode in the actual holdout, and changed the portfolio in only one 2025
    episode. The joint model therefore collapsed to the offensive ablation.

research_answer:
  expand_factor_model_and_optimize_strategy_now: false
  reason: >-
    Information expansion may eventually be necessary to beat a mature rule
    baseline, but model expansion and strategy optimization must not be fitted
    together. The frozen v4.11 sequence tested factor skill first and found no
    stable OOF signal, so a more complex model or jointly tuned mapping is not
    justified on the current history.

