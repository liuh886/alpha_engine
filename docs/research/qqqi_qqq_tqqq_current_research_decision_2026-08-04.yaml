current_baseline:
  experiment_id: qqqi_qqq_tqqq_vxn_bridge_v4_2
  role: current_research_baseline
  alert_source: true
  decision: retain_unchanged
  model_changes_authorized: false
  telegram_target_changes_authorized: false
  reason: >-
    The preregistered v4.11 recovery-quality model failed every pre-2024
    walk-forward factor gate. Its 2024-plus portfolio improvement came entirely
    from one 2025 high-score state-2 episode and did not validate a stable
    multi-factor risk-budget model. v4.2 therefore remains the only actionable
    research baseline.

recovery_quality_factor_v4_11:
  experiment_id: qqqi_qqq_tqqq_v4_2_recovery_quality_factor_v4_11_research
  role: frozen_nonpromoted_factor_experiment
  objective: >-
    Predict the next ten-session marginal log return of TQQQ versus QQQ and use
    one prior-close probability to freeze a 50%, 75% or 100% TQQQ budget for a
    contiguous formal v4.2 state-2 episode.
  model_contract:
    feature_count: 16
    estimator: median_imputer_standard_scaler_l2_logistic_regression
    C: 1.0
    class_weight: balanced
    label_horizon_sessions: 10
    walk_forward_validation_years: [2018, 2019, 2020, 2021, 2022, 2023]
    purge_sessions: 10
    model_development_end: "2023-12-29"
    reserved_holdout_start: "2024-01-02"
    strategy_mapping:
      low_probability: {condition: "p < 0.40", QQQ: 0.50, TQQQ: 0.50}
      baseline_probability: {condition: "0.40 <= p < 0.60", QQQ: 0.25, TQQQ: 0.75}
      high_probability: {condition: "p >= 0.60", QQQ: 0.00, TQQQ: 1.00}
  evidence:
    report: docs/research/qqqi_qqq_tqqq_v4_2_recovery_quality_factor_result_2026-08-04.md
    workflow_run: 30832121362
    artifact_id: 8863347560
