alpha158_boundary:
  status: retain_for_cross_sectional_stock_models
  applicable_universes: [US87, CN130]
  direct_qqq_timing_import_authorized: false
  reason: >-
    Alpha158 is a governed cross-sectional feature library. Its existence does
    not justify importing the full panel into a single-index regime-timing model
    without a separate economic target, data contract and independent holdout.
