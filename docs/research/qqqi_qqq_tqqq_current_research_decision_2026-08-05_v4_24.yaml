structural_diagnosis:
  nonlinear_terminal_action_prior_exists: true
  stable_adjacent_path_timing_found: false
  state_diversity_failure: false
  feature_concentration_failure: false
  primary_failure: >-
    After static action descriptors were removed, current daily price,
    volatility, relative-strength and credit/duration features did not predict
    which adjacent state would deliver better ten-session path utility. The
    model selected all four states but increased regret relative to v4.2.
  evidence:
    - Mean edge AUC was below 0.50 and only one edge was slightly above random.
    - Utility regret worsened 17.34 percent versus frozen v4.2.
    - Only the 2016-2017 outer fold had positive total utility advantage.
    - The observed model beat only 30 percent of deterministic placebos.
    - The actual 2024+ window repeated negative utility advantage and regret.

