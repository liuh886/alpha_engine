next_admissible_research:
  boundary: >-
    Any further XGBoost experiment must first prove coverage and admissibility
    for genuinely new close-observable information, such as option skew and
    tail pricing, dealer or option positioning proxies, survivorship-safe
    breadth data, or direct credit-spread levels. No outcome model may run
    before the new information audit passes.

