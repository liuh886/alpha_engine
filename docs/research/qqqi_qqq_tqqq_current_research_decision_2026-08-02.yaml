  - bridge_weight_search
  - sgov_weight_search
  - fixed_tqqq_weight_search
  - confirmation_length_search
  - vix_vxn_threshold_search
  - moving_average_period_search
  - daily_close_state2_volatility_scaling
  - recovery_release_weight_search
  - recovery_precursor_threshold_search
  - recovery_precursor_persistence_search
  - additional_recovery_precursor_weight_search
  - qqq_proxy_weight_search
  - recovery_precursor_feature_threshold_search
  - recovery_precursor_classifier_fit

active_next_stage:
  issue: 348
  name: prospective_v4_2_alert_execution_and_recovery_feature_evidence
  model_changes_authorized: false
  shadow_fields_allowed:
    - tqqq_release_precursor_boolean
    - hypothetical_25_percent_tqqq_allocation
    - hypothetical_50_percent_tqqq_allocation
    - marginal_50_vs_25_outcomes
    - vix_return_5d
    - vxn_return_5d
    - vxn_close
    - state_1_decision_age_sessions
    - vxn_return_1d
    - qqq_distance_ma_short
    - vix_close
    - vxn_retreat_from_peak
    - shadow_outcomes_without_actionable_alert
  required_records:
    - signal_and_governed_data_dates
    - github_and_telegram_delivery_status
    - deterministic_alert_fingerprint
    - target_weights_and_modeled_cost
    - theoretical_next_open_prices
    - optional_observed_or_paper_execution_prices
    - opening_gap_slippage_and_cost_deviation
    - realized_5_10_20_40_session_outcomes
    - confirmation_reversal_or_unresolved_status
  interpretation: >-
    Prospective QQQI observations may determine whether the post-2024 favourable
    regime persists and whether the descriptive feature directions survive a
    future failed recovery. They do not authorize a rule or override the
    negative QQQ-proxy long-history evidence.
  reconsider_recovery_hypothesis_only_after:
    late_or_prospective_failed_precursor_events_minimum: 1
    feature_directions_rechecked_without_threshold_selection: true
    rule: all_conditions_required

next_admissible_research:
  name: prospective_recovery_feature_validation
  model_changes_authorized: false
  objective: >-
    Record the frozen descriptive feature set on future actual-QQQI precursor
    events and wait for both successful and failed outcomes before proposing a
    separately pre-registered rule.
  prohibited:
    - retrospective_threshold_optimization
    - classifier_fit
    - new_weight_grid
    - direct_signal_promotion

intraday_research_boundary:
  status: feasibility_gate_only
  strategy_development_authorized: false
  reason: >-
    Principal state-2 tail losses generally formed during the session without a
    preceding-close warning. Intraday controls require a separately governed
    data and execution contract rather than a retrofit to the daily v4.2 model.
