intraday_research_boundary:
  status: feasibility_gate_only
  strategy_development_authorized: false
  reason: >-
    PR #339 showed that principal state-2 tail losses generally formed during
    the session without a preceding-close warning. Intraday controls require a
    separately governed data and execution contract rather than a retrofit to
    the daily v4.2 model.
