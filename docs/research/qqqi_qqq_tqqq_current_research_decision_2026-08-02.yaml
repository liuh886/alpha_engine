schema_version: "1.4"
decision_date: "2026-08-02"
strategy_family: qqqi_qqq_tqqq_recovery_risk_budget
research_only: true
trade_ready: false

current_baseline:
  experiment_id: qqqi_qqq_tqqq_vxn_bridge_v4_2
  role: current_research_baseline
  alert_source: true
  decision: retain_unchanged
  reason: >-
    v4.2 remains the only actionable research baseline. Product-specific QQQI
    evidence after 2024 favoured a 50% recovery precursor, but the QQQ proxy
    expanded the sample to 15 events and rejected structural 50% superiority.
    The failure taxonomy found descriptive recovery-quality features but could
    not validate them in the late segment because it contains no failures.
    Production target weights therefore remain unchanged.

historical_comparator:
  experiment_id: qqqi_qqq_tqqq_vxn_leverage_v4_1
  role: immutable_signal_comparator

portfolio_profiles:
  qqqi_sgov_blended_defense:
    role: descriptive_drawdown_focused_profile
    structure:
      state_0: {QQQI: 0.50, SGOV: 0.50, QQQ: 0.00, TQQQ: 0.00}
      state_1: {QQQI: 0.25, SGOV: 0.25, QQQ: 0.50, TQQQ: 0.00}
      state_2: {QQQI: 0.00, SGOV: 0.00, QQQ: 0.25, TQQQ: 0.75}
    evidence:
      report: docs/research/qqqi_qqq_tqqq_v4_2_sgov_episode_attribution_result_2026-08-02.md
      snapshot: docs/research/snapshots/qqqi_v4_2_sgov_episode_attribution_2026-08-02.json
      workflow_run: 30734414386
      artifact_id: 8829046855
    decision: retain_descriptive_drawdown_profile_only
    separate_prospective_monitor_authorized: false

recovery_release_hypotheses:
  qqqi_release_on_state_1:
    decision: rejected_as_promoted_challenger
    reason: >-
      Unconditional QQQI release shortened typical recovery but lost late-sample
      CAGR and weakened protection in the current unresolved episode.

  tqqq_precursor_25:
    role: frozen_research_comparator
    structure: {QQQI: 0.25, SGOV: 0.00, QQQ: 0.50, TQQQ: 0.25}
    evidence:
      report: docs/research/qqqi_qqq_tqqq_v4_2_sgov_recovery_release_result_2026-08-02.md
      snapshot: docs/research/snapshots/qqqi_v4_2_sgov_recovery_release_2026-08-02.json
      workflow_run: 30735777927
      artifact_id: 8829513797
    actual_qqqi_findings:
      cagr: 0.311978
      sharpe: 1.472082
      max_drawdown: -0.173533
      precursor_events: 3
      precursor_sessions: 6
    qqq_proxy_findings:
      cagr: 0.329356
      sharpe: 1.257291
      max_drawdown: -0.256150
      precursor_events: 15
      precursor_sessions: 32
    decision: retain_as_frozen_comparator_only
    actionable_alert_authorized: false

  tqqq_precursor_50:
    role: post_2024_regime_dependent_shadow_observation
    structure: {QQQI: 0.00, SGOV: 0.00, QQQ: 0.50, TQQQ: 0.50}
    formal_state_2_unchanged: {QQQI: 0.00, SGOV: 0.00, QQQ: 0.25, TQQQ: 0.75}
    actual_qqqi_evidence:
      report: docs/research/qqqi_qqq_tqqq_v4_2_sgov_precursor_50_result_2026-08-02.md
      snapshot: docs/research/snapshots/qqqi_v4_2_sgov_precursor_50_2026-08-02.json
      workflow_run: 30737397224
      artifact_id: 8830077965
    actual_qqqi_findings:
      cagr: 0.324653
      sharpe: 1.516918
      max_drawdown: -0.168858
      cagr_delta_vs_25_pp: 1.2675767191728138
      precursor_events: 3
      marginal_event_positive_rate_vs_25: 1.00
    qqq_proxy_evidence:
      report: docs/research/qqqi_qqq_tqqq_v4_2_qqq_proxy_long_history_result_2026-08-02.md
      snapshot: docs/research/snapshots/qqqi_v4_2_qqq_proxy_long_history_2026-08-02.json
      workflow_run: 30738861599
      artifact_id: 8830582711
      artifact_digest: sha256:5a69cb3a3bb8dff9359cbcad313e9ec1b6f1fc9a56d47ef35af1471e3105c3ca
    qqq_proxy_findings:
      sample_start: "2020-06-01"
      precursor_events: 15
      precursor_sessions: 32
      cagr: 0.316992
      sharpe: 1.205074
      max_drawdown: -0.269469
      cagr_delta_vs_25_pp: -1.2363337579192724
      early_cagr_delta_vs_25_pp: -2.815733834608425
      late_cagr_delta_vs_25_pp: 1.121028043003669
      marginal_event_positive_rate_vs_25: 0.40
      overlap_sign_concordance_with_actual_qqqi: 1.00
    structural_support_authorized: false
    preferred_shadow_status: withdrawn
    shadow_monitor_authorized: false
    actionable_alert_authorized: false
    direct_promotion_authorized: false
    reason: >-
      The 50% precursor improved all three observed post-2024 QQQI events and
      the QQQ proxy reproduced their direction. However, the proxy added 12
      earlier events and showed that 50% underperformed 25% in the full and
      early samples, had only a 40% marginal event win rate, and produced worse
      Sharpe and drawdown. The result is regime-dependent rather than structural.

  staged_qqqi_then_tqqq_release:
    decision: rejected_as_promoted_challenger
    reason: >-
      The combined rule inherited the unconditional QQQI-release weakness and
      failed to preserve positive protection in all five major troughs.

recovery_failure_taxonomy:
  experiment_id: qqqi_qqq_tqqq_v4_2_recovery_precursor_failure_taxonomy_v4_7_research
  role: governed_diagnostic
  evidence:
    report: docs/research/qqqi_qqq_tqqq_v4_2_recovery_precursor_failure_taxonomy_result_2026-08-02.md
    snapshot: docs/research/snapshots/qqqi_v4_2_recovery_precursor_failure_taxonomy_2026-08-02.json
    workflow_run: 30740263682
    artifact_id: 8831040334
    artifact_digest: sha256:0e4d355e8e01cf71e66eb92622e77048627305e4d355ae2dd479389205252bfa
  findings:
    event_count: 15
    successful_event_count: 6
    failed_event_count: 9
    failed_reverted_before_state_2: 3
    failed_reached_state_2_but_extra_leverage_lost: 6
    descriptively_stable_feature_count: 8
    early_successful_events: 3
    early_failed_events: 9
    late_successful_events: 3
    late_failed_events: 0
    primary_prospective_fields:
      - vix_return_5d
      - vxn_return_5d
      - vxn_close
      - state_1_decision_age_sessions
      - vxn_return_1d
    secondary_descriptive_fields:
      - qqq_distance_ma_short
      - vix_close
      - vxn_retreat_from_peak
  prospective_feature_monitoring_justified: true
  new_preregistered_trading_hypothesis_justified: false
  model_change_authorized: false
  actionable_alert_authorized: false
  decision: monitor_features_prospectively_without_new_rule
  reason: >-
    Faster VIX/VXN compression, a fresher state-1 decision, lower VXN and a
    stronger short repair separated successful and failed events in the full
    and early samples and survived leave-one-event-out checks. The late sample
    contains three successes and no failures, so no separator can yet be
    validated across both chronological segments and no threshold may be chosen.

