  interpretation: >-
    Prospective QQQI observations may determine whether the post-2024 favourable
    regime persists, whether the descriptive signal-close features survive a
    future failed recovery, and whether failure continues to be dominated by
    weak underlying follow-through rather than TQQQ residuals. These records do
    not authorize a rule or override the negative QQQ-proxy long-history evidence.
  reconsider_recovery_hypothesis_only_after:
    late_or_prospective_failed_precursor_events_minimum: 1
    feature_and_path_mechanisms_rechecked_without_threshold_selection: true
    separately_preregistered_hypothesis_required: true
    rule: all_conditions_required

next_admissible_research:
  name: prospective_recovery_feature_and_path_validation
  model_changes_authorized: false
  objective: >-
    Record the frozen signal-close feature set and post-execution path
    decomposition on future actual-QQQI precursor events. Wait for both
    successful and failed outcomes before proposing a separately pre-registered
    timing hypothesis.
  prohibited:
    - retrospective_threshold_optimization
    - retrospective_delay_selection
    - classifier_fit
    - new_weight_grid
    - direct_signal_promotion

intraday_research_boundary:
  status: feasibility_gate_only
  strategy_development_authorized: false
  reason: >-
    Intraday and overnight decomposition is explanatory only. Principal state-2
    tail losses generally formed during the session without a preceding-close
    warning. Intraday controls require a separately governed data and execution
    contract rather than a retrofit to the daily v4.2 model.
