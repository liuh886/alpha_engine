structural_diagnosis:
  current_xgboost_model_capacity_is_primary_blocker: false
  existing_daily_feature_set_exhausted: true
  admissible_new_information_found: false
  primary_blocker: >-
    No complete genuinely new information family currently satisfies the
    governed long-history, point-in-time, revision and source-integrity gates.
    Training another XGBoost model would require either invalid source splicing,
    revised-history leakage, survivorship reconstruction or a shortened sample.
  evidence:
    - Cboe put/call archives are complete only through October 2019.
    - Public direct-credit series provide near-complete recent coverage but no 2011 development history.
    - SKEW numeric vintage history, survivorship-safe breadth and transparent positioning sources remain unresolved.
    - The Phase 0 artifact contains no outcomes and admits no family.

