structural_diagnosis:
  missing_information: current_frozen_v4_2_execution_state_and_weights
  evidence:
    - >-
      Action advantage is defined relative to the current v4.2 path, but the model
      only observed market factors and not the baseline allocation being replaced.
    - >-
      Eight OOF Nasdaq-core triggers all failed; several realized advantages were
      exactly the frozen label cost, consistent with selecting an economically
      identical action relative to the proxy baseline.
    - >-
      Cash-defense and acceleration scores often reacted to stress or trend already
      represented in the v4.2 state machine, creating redundant or contradictory
      overrides.
  interpretation: >-
    The next experiment should isolate whether explicit state and weight conditioning
    resolves the structural target mismatch. It must keep the same Ridge family,
    alpha, base factor set, sampling, embargo, action thresholds and discrete actions.

