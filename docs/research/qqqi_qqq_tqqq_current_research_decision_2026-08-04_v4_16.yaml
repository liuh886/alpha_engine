next_admissible_research:
  name: state_conditioned_incremental_action_advantage_model
  objective: >-
    Add the frozen v4.2 current execution state and weights to the same Ridge model,
    and allow only actions that materially differ from the current baseline weights
    to compete. This tests one structural omission while keeping all other model,
    label and event boundaries unchanged.
  required_boundaries:
    - same_twenty_one_base_features
    - same_eight_declared_market_interactions
    - same_multi_output_ridge_alpha_100
    - add_v4_2_state_one_hot_and_current_weights
    - preregister_state_market_interactions
    - action_weight_l1_novelty_guard
    - same_ten_session_sampling_and_embargo
    - same_advantage_and_margin_thresholds
    - action_by_state_evidence
    - discrete_actions_only
    - no_direct_historical_promotion

