next_admissible_architecture:
  name: donor_transfer_validated_state2_only_sgov_tqqq_budget
  requirements:
    - require_leave_one_asset_out_transfer_gate_before_target_use
    - preserve_v4_2_state_0_and_state_1_allocations_and_transitions
    - apply_sgov_tqqq_budget_only_inside_formal_v4_2_state_2
    - construct_donor_episodes_that_are_analogous_to_formal_state_2_not_generic_recoveries
    - separate_target_quarantine_and_prospective_primary_evidence
    - prohibit_reuse_of_four_2020_2022_qqq_events_for_tuning
  interpretation: >-
    The next experiment must narrow the donor hypothesis to the same economic
    decision made by v4.2: how much leveraged risk to hold after formal recovery
    confirmation. It must not rebuild state 0 or state 1 and must not tune against
    the already observed QQQ target events.

