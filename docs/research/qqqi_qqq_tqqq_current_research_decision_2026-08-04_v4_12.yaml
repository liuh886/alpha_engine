  decision: sgov_tqqq_transfer_does_not_stably_beat_v4_2
  audit: audit_pass_nonpromotion_result_valid
  shadow_monitor_authorized: false
  actionable_alert_authorized: false
  direct_promotion_authorized: false

research_answer:
  more_independent_events_found: true
  independent_event_method_validated: true
  current_sgov_tqqq_strategy_beats_v4_2: false
  reason: >-
    The event-scarcity problem can be addressed with non-QQQ donor assets and
    macro-cluster isolation. The remaining problem is target compatibility and
    strategy architecture. Generic recovery probabilities should not replace the
    full v4.2 state machine.

retained_components:
