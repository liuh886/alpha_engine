current_baseline:
  experiment_id: qqqi_qqq_tqqq_vxn_bridge_v4_2
  role: current_research_baseline
  alert_source: true
  decision: retain_unchanged
  model_changes_authorized: false
  telegram_target_changes_authorized: false
  reason: >-
    v4.12 successfully created a larger independent donor-event laboratory, but
    the frozen cross-asset SGOV/TQQQ transfer strategy materially underperformed
    v4.2. The donor model passed every preregistered OOF gate; the failure occurred
    in target-domain transfer and in replacing the mature v4.2 state path with an
    overly defensive structural regime. v4.2 therefore remains the only actionable
    research baseline.

cross_asset_sgov_tqqq_v4_12:
  experiment_id: qqqi_qqq_tqqq_cross_asset_sgov_tqqq_transfer_v4_12_research
  role: frozen_nonpromoted_cross_asset_event_experiment
  objective: >-
    Learn recovery-event quality from non-QQQ underlying/3x ETF pairs with
    non-overlapping shock cycles and complete macro-cluster isolation, then apply
    one frozen model to a target SGOV/TQQQ strategy.
  evidence:
    report: docs/research/qqqi_qqq_tqqq_cross_asset_sgov_tqqq_transfer_v4_12_result_2026-08-04.md
    workflow_run: 30861846261
    artifact_id: 8874630274
    artifact_digest: sha256:31a70ccffba271ac8d07b08f3334cff756a6b77dc3bfcc4a36ffc8b8a317142f
    manifest_file_count: 39
  independent_event_design:
    donor_pairs:
      SPY: UPRO
      IWM: TNA
      DIA: UDOW
      XLK: TECL
      SOXX: SOXL
      XLF: FAS
    donor_cash_proxy: BIL
    excluded_from_training: [QQQ, TQQQ, QQQI, SGOV, ^VXN]
    asset_events: 85
    macro_clusters: 31
    donor_assets: 6
    maximum_single_asset_event_share: 0.21176470588235294
  donor_oof_findings:
    roc_auc: 0.6572535991140642
    spearman_ic: 0.2378737541528239
    top_bottom_quartile_spread: 0.08188500111830338
    positive_asset_spread_count: 5
    largest_positive_cluster_contribution_share: 0.20818172002742308
    donor_gate_passed: true
  leave_one_asset_out_audit:
    aggregate_roc_auc: 0.7491694352159468
    aggregate_spearman_ic: 0.3816689466484268
    aggregate_top_bottom_quartile_spread: 0.14989426517755183
    interpretation: >-
      Cross-asset information is not explained by one donor asset. Five donor
      assets transfer positively; IWM is the material exception. This supports
      retaining the donor event laboratory, not the original QQQ mapping.
  target_domain_findings:
    qqq_target_event_count: 4
    target_event_period: "2020-10-12 through 2022-11-03"
    high_probability_events: 2
    medium_probability_events: 0
    low_probability_events: 2
    actual_product_period_target_events: 0
    interpretation: >-
      The four QQQ events show target-domain mismatch: both high-score events had
      non-positive TQQQ-minus-SGOV outcomes, while the largest positive event was
      classified low. Four observed target events are insufficient for calibration,
      and probability inversion or threshold search is prohibited.
  actual_product_findings:
    sample_start: "2024-01-30"
    sample_end: "2026-07-31"
    observations: 613
    current_v4_2_cagr: 0.315496
