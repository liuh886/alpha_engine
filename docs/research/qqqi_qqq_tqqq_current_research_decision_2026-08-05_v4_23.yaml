structural_diagnosis:
  nonlinear_ranking_information_exists: true
  stable_five_state_machine_found: false
  primary_failure: >-
    Ranking terminal ten-session return across convex cash, QQQ and TQQQ
    mixtures makes extreme actions structurally dominant. The ranker therefore
    learns a strong action prior rather than sufficiently stable market-state
    timing across all five allocations.
  evidence:
    - 199 of 201 OOF selections are defense or accelerated.
    - Candidate-action descriptors supply approximately 73.5 percent of mean absolute SHAP.
    - The 2022-2023 fold has negative regret improvement and aggregate advantage.
    - Mean regret improves only 9.65 percent and top-two accuracy is 55.22 percent.

retained_components:
  - grouped_market_state_action_rank_dataset
  - exact_cost_aware_within_date_relevance_labels
  - native_xgboost_lambdarank_implementation
  - chronological_outer_fold_and_placebo_framework
  - gain_and_shap_family_concentration_audit
  - fail_closed_phase1_before_phase2_runtime
  - audited_adjusted_open_close_research_adapter
  - ten_session_embargo_translation_for_ten_session_grid

closed_retrospective_directions:
  - reduce_regret_or_top_two_gates
  - remove_balanced_core_or_leveraged_after_results
  - promote_accelerated_only
  - promote_defense_accelerated_binary_policy
  - change_xgboost_parameters_on_current_history
  - select_features_from_shap
  - change_action_weights
  - change_relevance_labels_or_ten_session_horizon
  - use_positive_actual_diagnostic_to_override_oof_failure
  - change_v4_2_or_telegram_from_v4_23

next_admissible_research:
