  audit: audit_pass_nonpromotion_result_valid
  shadow_monitor_authorized: false
  actionable_alert_authorized: false
  direct_promotion_authorized: false
  interpretation: >-
    The accelerator mechanism is economically meaningful: it recovered 80% of
    the defense-only CAGR sacrifice and kept a 5.12 percentage-point maximum
    drawdown improvement versus v4.2. However, almost all actual-sample positive
    marginal benefit came from the 2026-04-10 to 2026-05-11 episode, late-sample
    Calmar remained below v4.2, and turnover exceeded the frozen limit. The
    result is promising but not sufficiently independent or stable for shadow
    promotion.

