name: Focus Signal Contract CI

on:
  push:
    branches: [main]
    paths:
      - "src/research/focus_watchlist_signal.py"
      - "src/research/focus_watchlist_validation.py"
      - "scripts/run_focus_watchlist_cycle_signal.py"
      - "scripts/run_focus_watchlist_validation.py"
      - "configs/research_paradigms/us_focus_watchlist_cycle_signal_v1.yaml"
      - "tests/test_focus_watchlist_cycle_signal_contract.py"
      - "tests/test_focus_watchlist_signal_engine.py"
      - "tests/test_focus_watchlist_validation.py"
      - "tests/test_focus_watchlist_validation_contract.py"
      - ".github/workflows/focus-signal-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/research/focus_watchlist_signal.py"
      - "src/research/focus_watchlist_validation.py"
      - "scripts/run_focus_watchlist_cycle_signal.py"
      - "scripts/run_focus_watchlist_validation.py"
      - "configs/research_paradigms/us_focus_watchlist_cycle_signal_v1.yaml"
      - "tests/test_focus_watchlist_cycle_signal_contract.py"
      - "tests/test_focus_watchlist_signal_engine.py"
      - "tests/test_focus_watchlist_validation.py"
      - "tests/test_focus_watchlist_validation_contract.py"
      - ".github/workflows/focus-signal-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus-signal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff focus signal files
        run: >-
          uv run ruff check
          src/research/focus_watchlist_signal.py
          src/research/focus_watchlist_validation.py
          scripts/run_focus_watchlist_cycle_signal.py
          scripts/run_focus_watchlist_validation.py
          tests/test_focus_watchlist_cycle_signal_contract.py
          tests/test_focus_watchlist_signal_engine.py
          tests/test_focus_watchlist_validation.py
          tests/test_focus_watchlist_validation_contract.py
      - name: Focus signal tests
        run: >-
          uv run pytest
          tests/test_focus_watchlist_cycle_signal_contract.py
          tests/test_focus_watchlist_signal_engine.py
          tests/test_focus_watchlist_validation.py
          tests/test_focus_watchlist_validation_contract.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
