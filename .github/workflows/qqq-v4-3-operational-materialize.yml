name: QQQ v4.3 Operational Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqq-v4-3-operational-materialize.yml"

permissions:
  contents: write

env:
  LEGACY_PROMOTION_BRANCH: feat/qqq-v4-3-formal-promotion
  MODEL_ID: qqqi_qqq_tqqq_v4_3
  CUTOFF: "2026-08-07"

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Import only v4.3 model-specific components
        run: |
          set -euo pipefail
          git fetch origin "$LEGACY_PROMOTION_BRANCH"
          git checkout "origin/$LEGACY_PROMOTION_BRANCH" -- \
            src/artifacts/qqq_v4_3_formal.py \
            scripts/refresh_qqq_v4_3_formal.py \
            src/research/qqq_v4_3_monitor.py \
            scripts/run_qqq_v4_3_monitor.py \
            src/research/qqq_v4_3_signal_alerts.py \
            scripts/run_qqq_v4_3_signal_alert.py \
            tests/test_qqq_v4_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_qqq_v4_3_monitor_signal.py \
            configs/research_paradigms/qqqi_qqq_tqqq_current_baseline.yaml \
            configs/research_experiments/qqq_rotation_v4_3_research_loop_onboarding_v1.yaml \
            data/research/experiment_receipts/qqq_rotation_v4_3_research_loop_onboarding_v1.json \
            data/research/formal_backtests/qqqi_qqq_tqqq_v4_3.json
          rm -f data/research/formal_backtests/qqqi_qqq_tqqq_v4_2.json
          rm -f \
            configs/research_experiments/qqq_rotation_v4_2_research_loop_onboarding_v1.yaml \
            data/research/experiment_receipts/qqq_rotation_v4_2_research_loop_onboarding_v1.json
      - name: Bind v4.3 signal to canonical factor evidence
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          alerts = Path('src/research/qqq_v4_3_signal_alerts.py')
          text = alerts.read_text(encoding='utf-8')
          needle = '    alert["title"] = f"[策略信号] QQQ v4.3 {signal_date} {_weight_text(target_weights)}"\n'
          if needle not in text:
              raise SystemExit('v4.3 signal insertion point missing')
          block = '''    context = alert["context"]\n    qqq_close = float(context["qqq_close"])\n    ma20 = float(context["ma20"])\n    ma50 = float(context["ma50"])\n    ma200 = float(context["ma200"])\n    alert["current_state"] = alert["current_formal_state"]\n    alert["target_state"] = alert["target_formal_state"]\n    alert["transition_type"] = "risk_budget_change" if orders else "hold"\n    alert["decision_reason_label"] = (\n        f"{alert['current_overlay']} → {alert['target_overlay']}"\n    )\n    alert["price_context"] = {\n        "qqq_close": qqq_close,\n        "ma20": ma20,\n        "ma50": ma50,\n        "ma200": ma200,\n        "qqq_vs_ma20": qqq_close / ma20 - 1.0,\n        "qqq_vs_ma50": qqq_close / ma50 - 1.0,\n        "qqq_vs_ma200": qqq_close / ma200 - 1.0,\n        "stress_price_failure": bool(context.get("stress_price_failure", False)),\n        "long_break": qqq_close < ma200,\n    }\n    alert["data_context"] = {\n        **dict(alert["data_context"]),\n        "latest_data_date": latest_data_date,\n    }\n'''
          alerts.write_text(text.replace(needle, block + needle, 1), encoding='utf-8')

          runner = Path('scripts/run_qqq_v4_3_signal_alert.py')
          text = runner.read_text(encoding='utf-8')
          text = text.replace(
              'from pathlib import Path\n\nfrom src.research.qqq_v4_3_signal_alerts import build_v4_3_signal_alert\n',
              'from pathlib import Path\n\nfrom src.factors.strategy_snapshot import build_strategy_factor_snapshot\nfrom src.research.qqq_v4_3_signal_alerts import build_v4_3_signal_alert\n\nMODEL_FAMILY_ID = "qqq_rotation"\n',
              1,
          )
          text = text.replace(
              '    alert = build_v4_3_signal_alert(summary)\n',
              '''    alert = build_v4_3_signal_alert(summary)\n    factor_evidence = build_strategy_factor_snapshot(\n        model_family_id=MODEL_FAMILY_ID, signal=alert\n    )\n    alert["factor_evidence"] = factor_evidence\n    alert["factor_freshness_ok"] = factor_evidence["freshness"] == "current"\n    if not alert["factor_freshness_ok"]:\n        alert["should_alert"] = False\n''',
              1,
          )
          text = text.replace(
              '            handle.write(f"fingerprint={alert[\'fingerprint\']}\\n")\n',
              '''            handle.write(\n                "factor_freshness_ok="\n                f"{str(bool(alert['factor_freshness_ok'])).lower()}\\n"\n            )\n            handle.write(f"fingerprint={alert['fingerprint']}\\n")\n''',
              1,
          )
          runner.write_text(text, encoding='utf-8')
          PY
      - name: Switch formal v1/v2 active identity to v4.3
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          sync = Path('scripts/sync_formal_bundle_v2.py')
          text = sync.read_text(encoding='utf-8')
          old = '    "qqqi_qqq_tqqq_v4_2": ("qqq_rotation", "rules_based_allocation"),'
          new = '    "qqqi_qqq_tqqq_v4_3": ("qqq_rotation", "rules_based_allocation"),'
          if old not in text:
              raise SystemExit('formal v2 adapter registry no longer matches expected mainline')
          sync.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_sync_formal_bundle_v2.py')
          test.write_text(
              test.read_text(encoding='utf-8').replace(
                  '"qqqi_qqq_tqqq_v4_2",', '"qqqi_qqq_tqqq_v4_3",', 1
              ),
              encoding='utf-8',
          )

          freshness_path = Path('data/research/formal_backtests/freshness.json')
          freshness = json.loads(freshness_path.read_text(encoding='utf-8'))
          freshness['required_models'] = [
              'qqqi_qqq_tqqq_v4_3' if value == 'qqqi_qqq_tqqq_v4_2' else value
              for value in freshness['required_models']
          ]
          freshness_path.write_text(json.dumps(freshness, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Refresh v4.3 through the latest completed US session
        run: |
          set -euo pipefail
          rm -rf artifacts/v43-closeout
          mkdir -p artifacts/v43-closeout
          uv run python scripts/data/build_etf_reference_bundle.py \
            --end-date "$CUTOFF" \
            --output-root artifacts/v43-closeout/etf \
            --require-professional
          uv run python scripts/refresh_qqq_v4_3_formal.py \
            --current-package data/research/formal_backtests/qqqi_qqq_tqqq_v4_3.json \
            --bundle-dir artifacts/v43-closeout/etf \
            --cutoff "$CUTOFF" \
            --generated-at 2026-08-08T05:30:00Z \
            --output artifacts/v43-closeout/qqqi_qqq_tqqq_v4_3.json
          mv artifacts/v43-closeout/qqqi_qqq_tqqq_v4_3.json \
            data/research/formal_backtests/qqqi_qqq_tqqq_v4_3.json
      - name: Reseal formal catalog and rebuild Bundle v2
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('data/research/formal_backtests')
          package = root / 'qqqi_qqq_tqqq_v4_3.json'
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          catalog_path = root / 'catalog.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          records = catalog['records']
          if not records or records[0].get('model_id') != 'qqqi_qqq_tqqq_v4_2':
              raise SystemExit('formal catalog first record is not the superseded QQQ v4.2 identity')
          records[0] = {
              **records[0],
              'model_id': 'qqqi_qqq_tqqq_v4_3',
              'display_name': 'QQQ Rotation v4.3',
              'path': 'qqqi_qqq_tqqq_v4_3.json',
              'sha256': digest,
          }
          catalog['published_at'] = '2026-08-08T05:30:00Z'
          catalog_path.write_text(json.dumps(catalog, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          rm -rf data/research/formal_model_runs qlib-dashboard/public/data/formal-model-runs
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root data/research/formal_backtests \
            --output-root data/research/formal_model_runs \
            --receipt artifacts/v43-closeout/formal-v2-sync.json
          cp -a data/research/formal_model_runs qlib-dashboard/public/data/formal-model-runs
      - name: Rebind QQQ Research Loop onboarding to canonical v4.3 run
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          catalog = json.loads(Path('data/research/formal_model_runs/catalog.json').read_text(encoding='utf-8'))
          qqq = next(row for row in catalog['records'] if row['model_version_id'] == 'qqqi_qqq_tqqq_v4_3')
          spec_path = Path('configs/research_experiments/qqq_rotation_v4_3_research_loop_onboarding_v1.yaml')
          spec = yaml.safe_load(spec_path.read_text(encoding='utf-8'))
          spec['baseline']['bundle_id'] = qqq['bundle_id']
          spec['baseline']['manifest_sha256'] = qqq['manifest_sha256']
          spec['expected_identity']['evidence_cutoff'] = qqq['evidence_cutoff']
          spec_path.write_text(yaml.safe_dump(spec, sort_keys=False), encoding='utf-8')
          receipt_path = Path('data/research/experiment_receipts/qqq_rotation_v4_3_research_loop_onboarding_v1.json')
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          receipt['baseline']['bundle_id'] = qqq['bundle_id']
          receipt['baseline']['manifest_sha256'] = qqq['manifest_sha256']
          receipt['baseline']['manifest_path'] = f"data/research/formal_model_runs/{qqq['manifest_path']}"
          receipt['baseline']['evidence_cutoff'] = qqq['evidence_cutoff']
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Seed factor-bound v4.3 signal ledger and Strategy Operations
        run: |
          set -euo pipefail
          rm -rf artifacts/v43-closeout/monitor artifacts/v43-closeout/signal
          uv run python scripts/run_qqq_v4_3_monitor.py \
            --end-date "$CUTOFF" \
            --etf-data-bundle artifacts/v43-closeout/etf \
            --output-dir artifacts/v43-closeout/monitor
          uv run python scripts/run_qqq_v4_3_signal_alert.py \
            --summary artifacts/v43-closeout/monitor/current_summary.json \
            --output-dir artifacts/v43-closeout/signal
          uv run python - <<'PY'
          import json
          from pathlib import Path
          signal = json.loads(Path('artifacts/v43-closeout/signal/signal_alert.json').read_text(encoding='utf-8'))
          if signal['latest_data_date'] != '2026-08-07':
              raise SystemExit(f"v4.3 signal did not reach 2026-08-07: {signal['latest_data_date']}")
          if signal['data_freshness_ok'] is not True or signal['factor_freshness_ok'] is not True:
              raise SystemExit('v4.3 data/factor evidence is not current')
          if signal['should_alert']:
              raise SystemExit('promotion seed detected a live allocation change; deliver it via the active workflow after merge instead of faking delivery')
          PY
          rm -rf data/research/strategy_signal_ledgers/qqqi_qqq_tqqq_v4_2
          rm -rf data/research/strategy_signal_ledgers/qqqi_qqq_tqqq_v4_3
          uv run python scripts/persist_strategy_signal_evaluation.py \
            --model-version-id "$MODEL_ID" \
            --signal-json artifacts/v43-closeout/signal/signal_alert.json \
            --ledger-dir data/research/strategy_signal_ledgers/qqqi_qqq_tqqq_v4_3 \
            --delivery-status not_required \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --commit-sha "$GITHUB_SHA" \
            --created-at-utc 2026-08-08T05:30:00Z
          uv run python scripts/build_strategy_operations.py \
            --generated-at 2026-08-08T05:30:00Z
          node qlib-dashboard/scripts/sync-strategy-operations.mjs
      - name: Validate complete mainline-native v4.3 publication
        run: |
          set -euo pipefail
          uv run ruff check \
            src/artifacts/qqq_v4_3_formal.py \
            scripts/refresh_qqq_v4_3_formal.py \
            src/research/qqq_v4_3_monitor.py \
            scripts/run_qqq_v4_3_monitor.py \
            src/research/qqq_v4_3_signal_alerts.py \
            scripts/run_qqq_v4_3_signal_alert.py \
            scripts/sync_formal_bundle_v2.py
          uv run pytest \
            tests/test_qqq_v4_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_qqq_v4_3_monitor_signal.py \
            tests/test_sync_formal_bundle_v2.py \
            tests/test_strategy_operations.py \
            -q --strict-markers --tb=short
          uv run python - <<'PY'
          import json
          from pathlib import Path
          v1 = json.loads(Path('data/research/formal_backtests/catalog.json').read_text())
          v2 = json.loads(Path('data/research/formal_model_runs/catalog.json').read_text())
          ops = json.loads(Path('data/research/strategy_operations/snapshots.json').read_text())
          assert v1['records'][0]['model_id'] == 'qqqi_qqq_tqqq_v4_3'
          assert 'qqqi_qqq_tqqq_v4_2' not in {row['model_id'] for row in v1['records']}
          assert 'qqqi_qqq_tqqq_v4_2' not in {row['model_version_id'] for row in v2['records']}
          qqq = next(row for row in ops['records'] if row['model_version_id'] == 'qqqi_qqq_tqqq_v4_3')
          assert qqq['data_freshness'] == 'current'
          assert qqq['factor_freshness'] == 'current'
          assert qqq['status'] in {'current_no_change', 'target_pending_execution'}
          assert qqq['latest_completed_session'] == '2026-08-07'
          print(json.dumps(qqq, indent=2, ensure_ascii=False))
          PY
      - name: Commit verified v4.3 assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/artifacts/qqq_v4_3_formal.py \
            scripts/refresh_qqq_v4_3_formal.py \
            src/research/qqq_v4_3_monitor.py \
            scripts/run_qqq_v4_3_monitor.py \
            src/research/qqq_v4_3_signal_alerts.py \
            scripts/run_qqq_v4_3_signal_alert.py \
            scripts/sync_formal_bundle_v2.py \
            tests/test_qqq_v4_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_qqq_v4_3_monitor_signal.py \
            tests/test_sync_formal_bundle_v2.py \
            configs/research_paradigms/qqqi_qqq_tqqq_current_baseline.yaml \
            configs/research_experiments/qqq_rotation_v4_3_research_loop_onboarding_v1.yaml \
            data/research/experiment_receipts/qqq_rotation_v4_3_research_loop_onboarding_v1.json \
            data/research/formal_backtests \
            data/research/formal_model_runs \
            data/research/strategy_signal_ledgers \
            data/research/strategy_operations/snapshots.json \
            qlib-dashboard/public/data/formal-model-runs \
            qlib-dashboard/public/data/strategy-operations.json
          git add -u \
            configs/research_experiments/qqq_rotation_v4_2_research_loop_onboarding_v1.yaml \
            data/research/experiment_receipts/qqq_rotation_v4_2_research_loop_onboarding_v1.json || true
          if git diff --cached --quiet; then
            echo "No materialized changes."
            exit 0
          fi
          git commit -m "feat: materialize QQQ Rotation v4.3 on current runtime"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
