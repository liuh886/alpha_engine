# Trigger the single title-variant patch after workflow creation.
name: CN130 PIT Event Families Phase 2 Patch

on:
  pull_request:
    branches:
      - data/cn130-pit-event-families-phase1-v1
    paths:
      - scripts/data/apply_cn130_phase2_progress_title_patch.py
      - .github/workflows/cn130-pit-event-families-phase2-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: data/cn130-pit-event-families-phase2-v1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply title variant patch
        run: python scripts/data/apply_cn130_phase2_progress_title_patch.py
      - name: Commit patch
        run: |
          git config user.name 'AlphaEngine Data Research Agent'
          git config user.email 'data-research-agent@alphaengine.local'
          git add src/data/company_events/ashare_primary_announcements.py
          git commit -m 'data: recognize buyback progress title variant'
          git push origin HEAD:data/cn130-pit-event-families-phase2-v1
