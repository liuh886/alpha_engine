name: QQQ VXN v4.1 Churn Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqq-vxn-v4-1-churn-diagnostics.yml"
      - "configs/research_paradigms/qqq_tqqq_vxn_v4_1_churn_diagnostics.yaml"
      - "scripts/run_qqq_tqqq_vxn_v4_1_churn_diagnostics.py"
      - "src/research/vxn_churn_diagnostics.py"
      - "tests/test_vxn_churn_diagnostics.py"
      - "notebooks/16_qqq_tqqq_vxn_v4_1_churn_diagnostics.ipynb"
      - "docs/research/qqq_tqqq_vxn_v4_1_churn_diagnostics_experiment.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff lint churn diagnostic paths
        run: >-
          uv run ruff check
          src/research/vxn_churn_diagnostics.py
          scripts/run_qqq_tqqq_vxn_v4_1_churn_diagnostics.py
          tests/test_vxn_churn_diagnostics.py
      - name: Mypy focused churn diagnostic paths
        run: >-
          uv run mypy --follow-imports=skip
          src/research/vxn_churn_diagnostics.py
          scripts/run_qqq_tqqq_vxn_v4_1_churn_diagnostics.py
      - name: Run focused and inherited strategy tests
        run: >-
          uv run pytest
          tests/test_vxn_churn_diagnostics.py
          tests/test_vxn_attack_layer_long_history.py
          tests/test_vxn_leverage_overlay_experiment.py
          tests/test_vix_rotation_experiment.py
          tests/test_strategy_experiment_journal.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Compile modules and notebook
        run: |
          uv run python -m py_compile \
            src/research/vxn_churn_diagnostics.py \
            scripts/run_qqq_tqqq_vxn_v4_1_churn_diagnostics.py \
            tests/test_vxn_churn_diagnostics.py
          uv run python - <<'PY'
          import json
          from pathlib import Path
          path = Path("notebooks/16_qqq_tqqq_vxn_v4_1_churn_diagnostics.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          for cell in notebook.get("cells", []):
              if cell.get("cell_type") == "code":
                  compile("".join(cell.get("source", [])), str(path), "exec")
          PY
      - name: Run frozen v4.1 churn diagnostics
        run: >-
          uv run python scripts/run_qqq_tqqq_vxn_v4_1_churn_diagnostics.py
          --end-date 2026-08-01
          --output-dir artifacts/evidence/qqq_tqqq_vxn_v4_1_churn_diagnostics
          --strategy-run-dir artifacts/strategy_runs
      - name: Upload evidence and strategy run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-vxn-v4-1-churn-diagnostics
          path: |
            artifacts/evidence/qqq_tqqq_vxn_v4_1_churn_diagnostics
            artifacts/strategy_runs/qqq_tqqq_vxn_v4_1_churn_diagnostics
          if-no-files-found: warn
          retention-days: 14
