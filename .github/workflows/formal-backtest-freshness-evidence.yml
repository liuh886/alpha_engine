name: Formal Backtest Freshness Evidence

on:
  pull_request:
    branches: ["main"]
    paths:
      - "configs/research_paradigms/us_x1_1_frozen_v1.yaml"
      - "configs/research_paradigms/cn_x1_0_frozen_v1.yaml"
      - "scripts/build_latest_formal_backtests.py"
      - "scripts/finalize_latest_formal_backtests.py"
      - "scripts/verify_formal_backtest_freshness.py"
      - "tests/test_build_latest_formal_backtests.py"
      - "tests/test_finalize_latest_formal_backtests.py"
      - "tests/test_formal_backtest_freshness.py"
      - ".github/workflows/formal-backtest-freshness-evidence.yml"
      - "data/research/formal_backtests/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: formal-backtest-freshness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute-latest-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Validate freshness contracts
        run: |
          uv run ruff check \
            scripts/build_latest_formal_backtests.py \
            scripts/finalize_latest_formal_backtests.py \
            scripts/verify_formal_backtest_freshness.py \
            tests/test_build_latest_formal_backtests.py \
            tests/test_finalize_latest_formal_backtests.py \
            tests/test_formal_backtest_freshness.py
          uv run mypy \
            scripts/build_latest_formal_backtests.py \
            scripts/finalize_latest_formal_backtests.py \
            scripts/verify_formal_backtest_freshness.py
          uv run pytest \
            tests/test_build_latest_formal_backtests.py \
            tests/test_finalize_latest_formal_backtests.py \
            tests/test_formal_backtest_freshness.py \
            -q --strict-markers --tb=short

      - name: Download US provider through 2026-07-31
        uses: actions/download-artifact@v4
        with:
          name: us-raw-adjustment-contract-30742690159
          path: artifacts/source/us
          github-token: ${{ github.token }}
          repository: liuh886/alpha_engine
          run-id: 30742690159

      - name: Download exact independently reproduced CN provider
        uses: actions/download-artifact@v4
        with:
          name: cn-provider-pr-2026-07-31-30782858739
          path: artifacts/source/cn-download
          github-token: ${{ github.token }}
          repository: liuh886/alpha_engine
          run-id: 30782858739

      - name: Verify and extract complete CN provider TAR
        run: |
          test "$(sha256sum artifacts/source/cn-download/cn-provider-pr-2026-07-31.tar | cut -d' ' -f1)" = \
            "1d384a87aaaea4656c0f6091d5b0f43f17767cbe06e14edc42b83ffb9765c98b"
          mkdir -p artifacts/source/cn
          tar -C artifacts/source/cn -xf \
            artifacts/source/cn-download/cn-provider-pr-2026-07-31.tar
          test "$(find artifacts/source/cn/data/providers/cn/features -mindepth 1 -maxdepth 1 -type d | wc -l)" = "131"
          test "$(find artifacts/source/cn -maxdepth 1 -name 'shard-*.json' | wc -l)" = "8"

      - name: Verify provider cutoffs, identities and source coverage
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          us = json.loads(
              Path("artifacts/source/us/provider_a/data/providers/us/provider_manifest.json")
              .read_text(encoding="utf-8")
          )
          assert us.get("calendar", {}).get("last_day") == "2026-07-31", us
          assert us.get("calendar", {}).get("session_count") == 1400, us
          assert us.get("provider_identity_sha256") == (
              "5c09d0fbc8348e182ce8829c44d43d96aaae4ed8a2c2ba8901e69034a7c6aa95"
          ), us

          shard_paths = sorted(Path("artifacts/source/cn").glob("shard-*.json"))
          assert len(shard_paths) == 8, shard_paths
          rows = []
          for path in shard_paths:
              shard = json.loads(path.read_text(encoding="utf-8"))
              assert shard.get("status") == "complete", shard
              assert shard.get("cutoff") == "2026-07-31", shard
              assert shard.get("provider") == "akshare_sina", shard
              assert shard.get("research_only") is True, shard
              assert shard.get("trade_ready") is False, shard
              rows.extend(shard.get("records", []))
          symbols = [str(row.get("symbol")) for row in rows]
          assert len(symbols) == 131, len(symbols)
          assert len(set(symbols)) == 131, symbols
          assert all(row.get("last_date") == "2026-07-31" for row in rows), rows
          assert all(row.get("provider") == "akshare_sina" for row in rows), rows

          cn_provider = json.loads(
              Path("artifacts/source/cn/data/providers/cn/provider_manifest.json")
              .read_text(encoding="utf-8")
          )
          assert cn_provider.get("provider_identity_sha256") == (
              "6614e26a4d7cc27dad4e1123ddcc1a73f0e753b7c115e86577a40ab195da2d09"
          ), cn_provider
          assert cn_provider.get("calendar", {}).get("first_day") == "2021-01-04", cn_provider
          assert cn_provider.get("calendar", {}).get("last_day") == "2026-07-31", cn_provider
          assert cn_provider.get("calendar", {}).get("session_count") == 1351, cn_provider
          assert cn_provider.get("instruments", {}).get("count") == 131, cn_provider
          PY

      - name: Execute frozen US x1.1 twice through 2026-07-31
        run: |
          uv run python scripts/run_us_feature_quality_validation.py \
            --spec configs/research_paradigms/us_x1_1_frozen_v1.yaml \
            --provider-uri artifacts/source/us/provider_a/data/providers/us \
            --output-dir artifacts/freshness/us-a
          uv run python scripts/run_us_feature_quality_validation.py \
            --spec configs/research_paradigms/us_x1_1_frozen_v1.yaml \
            --provider-uri artifacts/source/us/provider_a/data/providers/us \
            --output-dir artifacts/freshness/us-b

      - name: Execute frozen CN x1.0 twice through 2026-07-31
        run: |
          uv run python scripts/run_cn_feature_quality_validation.py \
            --spec configs/research_paradigms/cn_x1_0_frozen_v1.yaml \
            --provider-uri artifacts/source/cn/data/providers/cn \
            --output-dir artifacts/freshness/cn-a
          uv run python scripts/run_cn_feature_quality_validation.py \
            --spec configs/research_paradigms/cn_x1_0_frozen_v1.yaml \
            --provider-uri artifacts/source/cn/data/providers/cn \
            --output-dir artifacts/freshness/cn-b

      - name: Verify partial latest-session windows
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          checks = [
              ("us-a", "us_x1_1_frozen_v1"),
              ("us-b", "us_x1_1_frozen_v1"),
              ("cn-a", "cn_x1_0_frozen_v1"),
              ("cn-b", "cn_x1_0_frozen_v1"),
          ]
          for market, experiment in checks:
              root = Path("artifacts/freshness") / market / experiment
              plan = json.loads((root / "walk_forward_windows.json").read_text(encoding="utf-8"))
              assert plan["requested_test_end"] == "2026-07-31", plan
              assert plan["available_end"] == "2026-07-31", plan
              assert plan["partial_window_policy"] == (
                  "allow_horizon_contained_partial_final_window"
              ), plan
              assert plan["partial_window_count"] == 1, plan
              assert plan["complete_window_count"] >= 5, plan
              rows = {row["label"]: row for row in plan["windows"]}
              latest = rows["2026H2"]
              assert latest["status"] == "included", latest
              assert latest["complete"] is False, latest
              assert latest["counts_toward_min_windows"] is False, latest
              assert latest["effective_test_end"] == "2026-07-31", latest
              assert latest["horizon_eligible_sessions"] >= 10, latest
              window = root / "windows" / f"{experiment}_2026H2.json"
              payload = json.loads(window.read_text(encoding="utf-8"))
              traces = [
                  row for row in payload.get("backtest_traces", [])
                  if row.get("orientation") == "original"
                  and str(row.get("candidate_name", "")).startswith("xgb:daily_ranker")
              ]
              assert len(traces) == 1, traces
              assert traces[0]["points"], traces[0]
              assert traces[0]["holdings"], traces[0]
              assert traces[0]["name_contributions"], traces[0]
          PY

      - name: Build and finalize current formal packages without rewriting history
        env:
          GENERATED_AT: "2026-08-03T03:55:00Z"
          CN_PROVIDER_IDENTITY: "6614e26a4d7cc27dad4e1123ddcc1a73f0e753b7c115e86577a40ab195da2d09"
        run: |
          uv run python scripts/build_latest_formal_backtests.py \
            --us-run-a artifacts/freshness/us-a/us_x1_1_frozen_v1 \
            --us-run-b artifacts/freshness/us-b/us_x1_1_frozen_v1 \
            --cn-run-a artifacts/freshness/cn-a/cn_x1_0_frozen_v1 \
            --cn-run-b artifacts/freshness/cn-b/cn_x1_0_frozen_v1 \
            --us-calendar artifacts/source/us/provider_a/data/providers/us/calendars/day.txt \
            --cn-calendar artifacts/source/cn/data/providers/cn/calendars/day.txt \
            --existing-dir data/research/formal_backtests \
            --output-dir artifacts/generated-formal \
            --cutoff 2026-07-31 \
            --generated-at "$GENERATED_AT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-head-sha "$GITHUB_SHA" \
            --receipt artifacts/freshness-build-receipt.json
          uv run python scripts/finalize_latest_formal_backtests.py \
            --generated-dir artifacts/generated-formal \
            --existing-dir data/research/formal_backtests \
            --cn-run-dir artifacts/freshness/cn-a/cn_x1_0_frozen_v1 \
            --cn-provider-identity "$CN_PROVIDER_IDENTITY" \
            --receipt artifacts/formal-finalization-receipt.json
          cp data/research/formal_backtests/freshness.json \
            artifacts/generated-formal/freshness.json
          uv run python scripts/verify_formal_backtest_freshness.py \
            --root artifacts/generated-formal \
            --as-of 2026-08-03T03:55:00Z \
            --receipt artifacts/formal-freshness-receipt.json

      - name: Verify historical prefixes remain byte-equivalent as records
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          old_root = Path("data/research/formal_backtests")
          new_root = Path("artifacts/generated-formal")
          old_us = json.loads((old_root / "us_x1_1.json").read_text(encoding="utf-8"))
          new_us = json.loads((new_root / "us_x1_1.json").read_text(encoding="utf-8"))
          for field in ("report", "positions", "trades"):
              assert new_us[field][:len(old_us[field])] == old_us[field], field
          assert new_us["window_summary"][:4] == old_us["window_summary"], "US windows"

          old_cn = json.loads((old_root / "cn_x1_0.json").read_text(encoding="utf-8"))
          new_cn = json.loads((new_root / "cn_x1_0.json").read_text(encoding="utf-8"))
          for field in ("report", "positions", "trades", "attribution"):
              assert new_cn[field][:len(old_cn[field])] == old_cn[field], field
          assert new_cn["window_summary"][:5] == old_cn["window_summary"], "CN windows"
          assert new_us["evidence_cutoff"] == "2026-07-31"
          assert new_cn["evidence_cutoff"] == "2026-07-31"
          assert new_us["date_range"]["end"] == "2026-07-31"
          assert new_cn["date_range"]["end"] == "2026-07-31"
          assert new_us["window_summary"][-1]["window"] == "2026H2_partial"
          assert new_cn["window_summary"][-1]["window"] == "2026H2_partial"
          assert new_cn["evidence"]["freshness_evidence"]["provider_identity_sha256"] == (
              "6614e26a4d7cc27dad4e1123ddcc1a73f0e753b7c115e86577a40ab195da2d09"
          )
          PY

      - name: Retain latest-window and generated-package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-backtest-freshness-evidence-${{ github.run_id }}
          path: |
            artifacts/freshness
            artifacts/generated-formal
            artifacts/freshness-build-receipt.json
            artifacts/formal-finalization-receipt.json
            artifacts/formal-freshness-receipt.json
            artifacts/source/us/verification.json
            artifacts/source/us/provider_a/artifacts/raw_adjustment_contract_manifest.json
            artifacts/source/us/provider_a/data/providers/us/provider_manifest.json
            artifacts/source/us/provider_a/data/providers/us/calendars/day.txt
            artifacts/source/cn-download/cn-provider-pr-2026-07-31.tar
            artifacts/source/cn/shard-*.json
            artifacts/source/cn/data/providers/cn/provider_manifest.json
            artifacts/source/cn/data/providers/cn/calendars/day.txt
          if-no-files-found: error
          retention-days: 90
