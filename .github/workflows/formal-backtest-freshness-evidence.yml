name: Formal Backtest Freshness Evidence

on:
  pull_request:
    branches: ["main"]
    paths:
      - "configs/research_paradigms/us_x1_1_frozen_v1.yaml"
      - "configs/research_paradigms/cn_x1_0_frozen_v1.yaml"
      - "scripts/build_latest_formal_backtests.py"
      - "scripts/verify_formal_backtest_freshness.py"
      - "tests/test_formal_backtest_freshness.py"
      - ".github/workflows/formal-backtest-freshness-evidence.yml"
      - "data/research/formal_backtests/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: formal-backtest-freshness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute-latest-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Download US provider through 2026-07-31
        uses: actions/download-artifact@v4
        with:
          name: us-raw-adjustment-contract-30742690159
          path: artifacts/source/us
          github-token: ${{ github.token }}
          repository: liuh886/alpha_engine
          run-id: 30742690159

      - name: Download CN provider through 2026-07-31
        uses: actions/download-artifact@v4
        with:
          name: cn130-xgb-optimization-30733728747
          path: artifacts/source/cn
          github-token: ${{ github.token }}
          repository: liuh886/alpha_engine
          run-id: 30733728747

      - name: Verify provider cutoffs
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          us = json.loads(
              Path("artifacts/source/us/provider_a/data/providers/us/provider_manifest.json")
              .read_text(encoding="utf-8")
          )
          assert us.get("calendar", {}).get("last_day") == "2026-07-31", us
          assert us.get("calendar", {}).get("session_count") == 1400, us

          cn_refresh = json.loads(
              Path(
                  "artifacts/source/cn/selected_pool_price_refresh/cn/artifacts/"
                  "selected_pool_price_refresh_manifest.json"
              ).read_text(encoding="utf-8")
          )
          assert cn_refresh.get("cutoff") == "2026-07-31", cn_refresh
          assert cn_refresh.get("promotion_eligible") is True, cn_refresh
          PY

      - name: Execute frozen US x1.1 through 2026-07-31
        run: >-
          uv run python scripts/run_us_feature_quality_validation.py
          --spec configs/research_paradigms/us_x1_1_frozen_v1.yaml
          --provider-uri artifacts/source/us/provider_a/data/providers/us
          --output-dir artifacts/freshness/us

      - name: Execute frozen CN x1.0 through 2026-07-31
        run: >-
          uv run python scripts/run_cn_feature_quality_validation.py
          --spec configs/research_paradigms/cn_x1_0_frozen_v1.yaml
          --provider-uri artifacts/source/cn/selected_pool_price_refresh/cn/data/providers/cn
          --output-dir artifacts/freshness/cn

      - name: Verify partial latest-session evidence
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          checks = [
              ("us", "us_x1_1_frozen_v1"),
              ("cn", "cn_x1_0_frozen_v1"),
          ]
          for market, experiment in checks:
              root = Path("artifacts/freshness") / market / experiment
              plan = json.loads((root / "walk_forward_windows.json").read_text(encoding="utf-8"))
              assert plan["requested_test_end"] == "2026-07-31", plan
              assert plan["partial_window_policy"] == (
                  "allow_horizon_contained_partial_final_window"
              ), plan
              assert plan["partial_window_count"] == 1, plan
              assert plan["complete_window_count"] >= 5, plan
              rows = {row["label"]: row for row in plan["windows"]}
              latest = rows["2026H2"]
              assert latest["status"] == "included", latest
              assert latest["complete"] is False, latest
              assert latest["counts_toward_min_windows"] is False, latest
              assert latest["effective_test_end"] == "2026-07-31", latest
              assert latest["horizon_eligible_sessions"] >= 10, latest
              assert latest["sampled_sessions"] >= 1, latest
              window = root / "windows" / f"{experiment}_2026H2.json"
              assert window.is_file(), window
              payload = json.loads(window.read_text(encoding="utf-8"))
              candidates = payload["comparison_report"]["candidates"]
              original = [
                  row for row in candidates
                  if row.get("candidate_kind") == "xgb_rank_ndcg"
                  and row.get("orientation") == "original"
              ]
              assert len(original) == 1, original
              assert original[0]["test_end"] <= "2026-07-31", original[0]
              assert original[0]["test_end"] >= "2026-07-01", original[0]
          PY

      - name: Retain latest-window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-backtest-freshness-evidence-${{ github.run_id }}
          path: |
            artifacts/freshness
            artifacts/source/us/verification.json
            artifacts/source/us/provider_a/artifacts/raw_adjustment_contract_manifest.json
            artifacts/source/us/provider_a/data/providers/us/provider_manifest.json
            artifacts/source/cn/selected_pool_price_refresh/cn/artifacts/selected_pool_price_refresh_manifest.json
          if-no-files-found: error
          retention-days: 90
