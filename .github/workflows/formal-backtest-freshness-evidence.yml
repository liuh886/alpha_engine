name: Formal Backtest Freshness Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - configs/research_paradigms/us_x1_1_frozen_v1.yaml
      - configs/research_paradigms/cn_x1_0_frozen_v1.yaml
      - scripts/build_latest_formal_backtests.py
      - scripts/finalize_latest_formal_backtests.py
      - scripts/materialize_formal_backtest_base.py
      - scripts/verify_formal_backtest_freshness.py
      - tests/test_build_latest_formal_backtests.py
      - tests/test_finalize_latest_formal_backtests.py
      - tests/test_materialize_formal_backtest_base.py
      - tests/test_formal_backtest_freshness.py
      - data/research/formal_backtests/base_manifest.json
      - data/research/formal_backtests/freshness_source.json
      - .github/workflows/formal-backtest-freshness-evidence.yml

permissions:
  contents: read

concurrency:
  group: formal-backtest-freshness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-accepted-history:
    name: Validate accepted freshness history
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate deterministic freshness contracts
        run: |
          uv run ruff check \
            scripts/build_latest_formal_backtests.py \
            scripts/finalize_latest_formal_backtests.py \
            scripts/materialize_formal_backtest_base.py \
            scripts/verify_formal_backtest_freshness.py \
            tests/test_build_latest_formal_backtests.py \
            tests/test_finalize_latest_formal_backtests.py \
            tests/test_materialize_formal_backtest_base.py \
            tests/test_formal_backtest_freshness.py
          uv run mypy \
            scripts/build_latest_formal_backtests.py \
            scripts/finalize_latest_formal_backtests.py \
            scripts/materialize_formal_backtest_base.py \
            scripts/verify_formal_backtest_freshness.py
          uv run pytest \
            tests/test_build_latest_formal_backtests.py \
            tests/test_finalize_latest_formal_backtests.py \
            tests/test_materialize_formal_backtest_base.py \
            tests/test_formal_backtest_freshness.py \
            -q --strict-markers --tb=short
      - name: Materialize immutable accepted formal base
        run: |
          uv run python scripts/materialize_formal_backtest_base.py \
            --manifest data/research/formal_backtests/base_manifest.json \
            --output-dir artifacts/formal-base \
            --receipt artifacts/formal-base-receipt.json
          test -f artifacts/formal-base/catalog.json
          test -f artifacts/formal-base/qqqi_qqq_tqqq_v4_2.json
          test -f artifacts/formal-base/us_x1_1.json
          test -f artifacts/formal-base/cn_x1_0.json
      - name: Verify accepted 2026-07-31 evidence binding
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("data/research/formal_backtests/freshness_source.json").read_text())
          assert source["schema_version"] == "1.0.0"
          assert source["status"] == "accepted_reproducible_freshness_evidence"
          assert source["cutoff"] == "2026-07-31"
          assert source["research_only"] is True and source["trade_ready"] is False
          assert set(source["models"]) == {"us_x1_1", "cn_x1_0"}
          for model in source["models"].values():
              assert len(model["provider_identity_sha256"]) == 64
              assert model["trace_sha256"]
          receipt = {
              "schema_version": "1.0.0",
              "status": "accepted_history_verified",
              "cutoff": source["cutoff"],
              "workflow_run_id": source["workflow_run_id"],
              "artifact_id": source["artifact_id"],
              "research_only": True,
              "trade_ready": False,
          }
          Path("artifacts/accepted-history-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Retain historical verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accepted-formal-freshness-history-${{ github.run_id }}
          path: |
            artifacts/formal-base
            artifacts/formal-base-receipt.json
            artifacts/accepted-history-receipt.json
          if-no-files-found: error
          retention-days: 90
