name: BYD V1.1 XGBoost Research

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/research_paradigms/byd_v1_1_xgb.yaml"
      - "src/research/byd_xgb_v1_1.py"
      - "scripts/run_byd_v1_1_xgb.py"
      - "scripts/fetch_csi300_for_byd_v1_1.py"
      - "tests/test_byd_xgb_v1_1.py"
      - "docs/research/byd_v1_0_baseline.md"
      - ".github/workflows/byd-v1-1-xgb.yml"
  push:
    branches: [main]
    paths:
      - "configs/research_paradigms/byd_v1_1_xgb.yaml"
      - "src/research/byd_xgb_v1_1.py"
      - "scripts/run_byd_v1_1_xgb.py"
      - "scripts/fetch_csi300_for_byd_v1_1.py"
      - "tests/test_byd_xgb_v1_1.py"
      - "docs/research/byd_v1_0_baseline.md"
      - ".github/workflows/byd-v1-1-xgb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff BYD V1.1 files
        run: >-
          uv run ruff check
          src/research/byd_xgb_v1_1.py
          scripts/run_byd_v1_1_xgb.py
          scripts/fetch_csi300_for_byd_v1_1.py
          tests/test_byd_xgb_v1_1.py
      - name: Run BYD V1.1 tests
        run: >-
          uv run pytest
          tests/test_byd_xgb_v1_1.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

  evidence-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Fetch exact-cutoff CSI300 context
        run: >-
          uv run python scripts/fetch_csi300_for_byd_v1_1.py
          --output-csv artifacts/research/byd_v1_1_xgb_input/csi300.csv
          --manifest artifacts/research/byd_v1_1_xgb_input/csi300_manifest.json
      - name: Run frozen BYD V1.1 evidence
        run: >-
          uv run python scripts/run_byd_v1_1_xgb.py
          --fetch-provider auto
          --benchmark-csv artifacts/research/byd_v1_1_xgb_input/csi300.csv
          --output-dir artifacts/research/byd_v1_1_xgb
      - name: Copy benchmark identity into evidence
        if: always()
        run: |
          mkdir -p artifacts/research/byd_v1_1_xgb
          if [ -f artifacts/research/byd_v1_1_xgb_input/csi300_manifest.json ]; then
            cp artifacts/research/byd_v1_1_xgb_input/csi300_manifest.json \
              artifacts/research/byd_v1_1_xgb/csi300_manifest.json
          fi
      - name: Upload BYD V1.1 evidence or blocker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byd-v1-1-xgb-evidence
          path: artifacts/research/byd_v1_1_xgb
          if-no-files-found: error
          retention-days: 30
