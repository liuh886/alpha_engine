name: BYD v1.3 Formal Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/byd-v1-3-formal.yml"
      - "scripts/promote_byd_v1_3_formal.py"
      - "src/research/byd_v1_3_low_vol_recovery.py"
      - "configs/models/byd_v1_3_recovery_event_low_vol_confirmation_v1.yaml"
      - "configs/models/model_registry_v1.yaml"
      - "tests/test_byd_v1_3_low_vol_recovery.py"
      - "data/research/formal_backtests/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: byd-v1-3-formal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GENERATED_AT: 2026-08-10T15:45:22Z

jobs:
  reproduce-promote-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked Python environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Verify immutable market inputs
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > "$RUNNER_TEMP/515180.zip"
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  $RUNNER_TEMP/515180.zip" | sha256sum --check --strict
          mkdir -p artifacts/input/byd artifacts/input/515180
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/input/byd
          unzip -q "$RUNNER_TEMP/515180.zip" -d artifacts/input/515180

      - name: Validate frozen V1.3 implementation and publisher
        run: |
          uv run ruff check \
            scripts/promote_byd_v1_3_formal.py \
            src/research/byd_v1_3_low_vol_recovery.py \
            tests/test_byd_v1_3_low_vol_recovery.py
          uv run pytest \
            tests/test_byd_v1_3_low_vol_recovery.py \
            tests/test_model_x1_baselines.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1

      - name: Rebuild complete formal package twice
        run: |
          set -euo pipefail
          for suffix in a b; do
            rm -rf "artifacts/formal-${suffix}"
            cp -a data/research/formal_backtests "artifacts/formal-${suffix}"
            uv run python scripts/promote_byd_v1_3_formal.py \
              --root "artifacts/formal-${suffix}" \
              --byd-dir artifacts/input/byd \
              --etf-dir artifacts/input/515180 \
              --signal-ledger data/research/strategy_signal_ledgers/byd_v1_3_recovery_event_low_vol_confirmation_v1 \
              --generated-at "$GENERATED_AT" \
              --receipt "artifacts/promotion-${suffix}.json"
          done
          diff -ru artifacts/formal-a artifacts/formal-b
          cmp artifacts/promotion-a.json artifacts/promotion-b.json

      - name: Rebuild Bundle v2 twice from promoted formal root
        run: |
          set -euo pipefail
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root artifacts/formal-a \
            --output-root artifacts/bundle-a \
            --receipt artifacts/bundle-receipt-a.json
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root artifacts/formal-a \
            --output-root artifacts/bundle-b \
            --receipt artifacts/bundle-receipt-b.json
          diff -ru artifacts/bundle-a artifacts/bundle-b
          cmp artifacts/bundle-receipt-a.json artifacts/bundle-receipt-b.json

      - name: Publish deterministic formal v1 package to promotion branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          rm -rf data/research/formal_backtests
          cp -a artifacts/formal-a data/research/formal_backtests
          git config user.name "AlphaEngine Release Agent"
          git config user.email "release-agent@alphaengine.local"
          git add data/research/formal_backtests
          if git diff --cached --quiet; then
            echo "BYD v1.3 formal package is byte-stable."
          else
            git commit -m "formal: publish BYD v1.3 complete backtest"
            git pull --rebase origin ${{ github.head_ref }}
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload complete formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byd-v1-3-formal-${{ github.run_id }}
          path: |
            artifacts/formal-a
            artifacts/bundle-a
            artifacts/promotion-a.json
            artifacts/bundle-receipt-a.json
          if-no-files-found: error
          retention-days: 30
