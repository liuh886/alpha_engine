name: QQQI VIX v3 Aggressive Evidence

on:
  pull_request:
    branches: [agent/qqqi-qqq-tqqq-rotation]
    paths:
      - ".github/workflows/qqqi-vix-v3-aggressive-evidence.yml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_vix_v2.yaml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_vix_v3_aggressive.yaml"
      - "scripts/run_qqqi_qqq_tqqq_vix_v3_aggressive.py"
      - "src/research/strategy_experiment_journal.py"
      - "src/research/vix_aggressive_tqqq_experiment.py"
      - "src/research/vix_rotation_experiment.py"
      - "src/research/vix_rotation_runtime.py"
      - "tests/test_strategy_experiment_journal.py"
      - "tests/test_vix_aggressive_tqqq_experiment.py"
      - "notebooks/14_qqqi_qqq_tqqq_vix_v3_aggressive.ipynb"
      - "docs/research/qqqi_qqq_tqqq_vix_v3_aggressive_experiment.md"
      - "docs/research/qqqi_qqq_tqqq_vix_v3_aggressive_result_2026-07-31.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff lint new strategy paths
        run: >-
          uv run ruff check
          src/research/strategy_experiment_journal.py
          src/research/vix_aggressive_tqqq_experiment.py
          scripts/run_qqqi_qqq_tqqq_vix_v3_aggressive.py
          tests/test_strategy_experiment_journal.py
          tests/test_vix_aggressive_tqqq_experiment.py
      - name: Mypy focused strategy paths
        run: >-
          uv run mypy --follow-imports=skip
          src/research/strategy_experiment_journal.py
          src/research/vix_aggressive_tqqq_experiment.py
          scripts/run_qqqi_qqq_tqqq_vix_v3_aggressive.py
      - name: Run focused strategy-memory and weight-isolation tests
        run: >-
          uv run pytest
          tests/test_strategy_experiment_journal.py
          tests/test_vix_aggressive_tqqq_experiment.py
          tests/test_vix_rotation_experiment.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Compile research modules and notebook
        run: |
          uv run python -m py_compile \
            src/research/strategy_experiment_journal.py \
            src/research/vix_aggressive_tqqq_experiment.py \
            scripts/run_qqqi_qqq_tqqq_vix_v3_aggressive.py \
            tests/test_strategy_experiment_journal.py \
            tests/test_vix_aggressive_tqqq_experiment.py
          uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path("notebooks/14_qqqi_qqq_tqqq_vix_v3_aggressive.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          for cell in notebook.get("cells", []):
              if cell.get("cell_type") == "code":
                  compile("".join(cell.get("source", [])), str(path), "exec")
          PY
      - name: Run frozen aggressive-TQQQ live-data experiment
        run: >-
          uv run python scripts/run_qqqi_qqq_tqqq_vix_v3_aggressive.py
          --end-date 2026-08-01
          --output-dir artifacts/evidence/qqqi_qqq_tqqq_vix_v3_aggressive
          --strategy-run-dir artifacts/strategy_runs
      - name: Upload evidence and strategy run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-vix-v3-aggressive-evidence
          path: |
            artifacts/evidence/qqqi_qqq_tqqq_vix_v3_aggressive
            artifacts/strategy_runs/qqqi_qqq_tqqq_vix_v3_aggressive
          if-no-files-found: warn
          retention-days: 14
