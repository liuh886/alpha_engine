name: Phase 3 lock refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/phase3-refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/legacy-web-retirement-phase-3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.10'
      - name: Regenerate lockfile
        run: uv lock
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo 'uv.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'build: refresh uv lock after Web dependency removal'
          git push origin HEAD:${{ github.head_ref }}
