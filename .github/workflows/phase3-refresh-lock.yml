name: Phase 3 lock refresh

on:
  push:
    branches:
      - refactor/legacy-web-retirement-phase-3
    paths:
      - pyproject.toml
      - .github/workflows/phase3-refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/legacy-web-retirement-phase-3
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.10'
      - name: Regenerate lockfile
        run: uv lock
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo 'uv.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'build: refresh uv lock after Web dependency removal'
          git push origin HEAD:refactor/legacy-web-retirement-phase-3
