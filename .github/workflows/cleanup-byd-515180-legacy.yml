name: Cleanup BYD 515180 Legacy Execution

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cleanup-byd-515180-legacy.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove duplicate unsafe execution block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/research/byd_515180_allocation.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "\ndef execute_next_common_open("
          end_marker = "\ndef metrics("
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("unexpected allocation source markers")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          cleaned = text[:start] + "\n\n" + text[end:]
          if "def execute_next_common_open(" in cleaned or "def run_allocation(" in cleaned:
              raise SystemExit("legacy execution definitions remain in allocation module")
          path.write_text(cleaned, encoding="utf-8")
          workflow = Path(".github/workflows/cleanup-byd-515180-legacy.yml")
          workflow.unlink()
          PY
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research/byd_515180_allocation.py
          git add -u .github/workflows/cleanup-byd-515180-legacy.yml
          git commit -m "refactor: remove stale BYD 515180 execution path"
          git push origin HEAD:${{ github.head_ref }}
