name: US Hierarchical Rotation Validation CI

on:
  push:
    branches: [main]
    paths:
      - "src/research/hierarchical_rotation_validation.py"
      - "src/research/hierarchical_pool_rotation.py"
      - "scripts/run_us_hierarchical_rotation_validation.py"
      - "scripts/build_us_hierarchical_validation_snapshot.py"
      - "configs/research_paradigms/us_structured_pool_hierarchical_rotation_v2.yaml"
      - "configs/pools/us_small_pool_v1.yaml"
      - "tests/test_hierarchical_rotation_validation.py"
      - ".github/workflows/us-hierarchical-validation-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/research/hierarchical_rotation_validation.py"
      - "src/research/hierarchical_pool_rotation.py"
      - "scripts/run_us_hierarchical_rotation_validation.py"
      - "scripts/build_us_hierarchical_validation_snapshot.py"
      - "configs/research_paradigms/us_structured_pool_hierarchical_rotation_v2.yaml"
      - "configs/pools/us_small_pool_v1.yaml"
      - "tests/test_hierarchical_rotation_validation.py"
      - ".github/workflows/us-hierarchical-validation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff validation files
        run: >-
          uv run ruff check
          src/research/hierarchical_rotation_validation.py
          scripts/run_us_hierarchical_rotation_validation.py
          scripts/build_us_hierarchical_validation_snapshot.py
          tests/test_hierarchical_rotation_validation.py
      - name: Run validation contract tests
        run: >-
          uv run pytest
          tests/test_hierarchical_rotation_validation.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
