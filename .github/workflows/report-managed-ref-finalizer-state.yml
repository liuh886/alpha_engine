name: Report managed-ref finalizer state

on:
  push:
    branches: [main]
    paths:
      - "docs/operations/report_managed_ref_finalizer_state_2026-08-01.flag"

permissions:
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Report finalizer status
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow finalize-managed-ref-history-purge.yml \
            --limit 1 \
            --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt)"
          run_id="$(jq -r '.[0].databaseId // empty' <<< "$run_json")"
          log_tail=""
          if test -n "$run_id"; then
            gh run view "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --log-failed > "${RUNNER_TEMP}/failed.log" 2>&1 || true
            log_tail="$(tail -c 5000 "${RUNNER_TEMP}/failed.log")"
          fi
          body="$(cat <<EOF
          Managed-ref finalizer diagnostic:

          \`\`\`json
          ${run_json}
          \`\`\`

          Failed-log tail:
          \`\`\`
          ${log_tail}
          \`\`\`
          EOF
          )"
          gh issue comment 277 --repo "$GITHUB_REPOSITORY" --body "$body"
