name: CN130 PIT Disclosure Reaction Bootstrap

on:
  pull_request:
    branches:
      - research/cn130-pit-fundamental-veto-v1
    paths:
      - .github/cn130_pit_disclosure_payload.chunk*
      - scripts/apply_cn130_pit_disclosure_payload.py
      - .github/workflows/cn130-pit-disclosure-reaction-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/cn130-pit-disclosure-reaction-v1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify and apply payload
        run: |
          if compgen -G '.github/cn130_pit_disclosure_payload.chunk*' > /dev/null; then
            python scripts/apply_cn130_pit_disclosure_payload.py
          else
            echo 'Disclosure reaction payload already applied.'
          fi
      - name: Commit implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No bootstrap changes to commit.'
            exit 0
          fi
          git config user.name 'AlphaEngine Research Agent'
          git config user.email 'research-agent@alphaengine.local'
          git add -A
          git commit -m 'research: implement CN130 PIT disclosure reaction study'
          git push origin HEAD:research/cn130-pit-disclosure-reaction-v1
