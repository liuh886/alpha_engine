# Replays the exact CNINFO source cache captured by run 31015808683.
name: CN130 PIT Event Families Phase 2

on:
  pull_request:
    branches:
      - data/cn130-pit-event-families-phase1-v1
    paths:
      - src/data/company_events/ashare_primary_announcements.py
      - scripts/data/build_cn130_pit_event_families_phase2.py
      - tests/test_ashare_primary_company_events.py
      - configs/data_contracts/company_information_event_phase2_v1.yaml
      - docs/research/cn130_pit_event_families_phase2_*.md
      - data/research/cn130_pit_event_families_phase2_v1/**
      - .github/workflows/cn130-pit-event-families-phase2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PRICE_PROVIDER_ARTIFACT_ID: '8850463785'
  PIT_SOURCE_ARTIFACT_ID: '8926572265'
  CALIBRATION_LEDGER_ARTIFACT_ID: '8927662386'
  SOURCE_CACHE_ARTIFACT_ID: '8934853788'
  SOURCE_CACHE_ARTIFACT_SHA256: 'f5294e11a0ca7164a59f7420546e9d51870ccea7abafd6582722f758122987bf'
  PYTHONPATH: .
  GH_TOKEN: ${{ github.token }}

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint and focused tests
        run: |
          uv run ruff check \
            src/data/company_events/ashare_primary_announcements.py \
            scripts/data/build_cn130_pit_event_families_phase2.py \
            tests/test_ashare_primary_company_events.py
          uv run pytest \
            tests/test_company_information_event_store.py \
            tests/test_cn130_pit_event_family_audit.py \
            tests/test_ashare_primary_company_events.py \
            -q --strict-markers --tb=short
      - name: Download immutable price provider
        run: |
          mkdir -p .research/provider-artifact .research/provider
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRICE_PROVIDER_ARTIFACT_ID}/zip" > .research/provider.zip
          unzip -q .research/provider.zip -d .research/provider-artifact
          tar -xf .research/provider-artifact/cn-provider-2026-08-03.tar -C .research/provider
          test "$(python -c "import json; print(json.load(open('.research/provider/data/providers/cn/provider_manifest.json'))['provider_identity_sha256'])")" = "abae71f037571a9a847d4582e0bea9fabdd71796cac54a70aa7c6d07b668eeb0"
      - name: Download frozen R0 ledgers
        run: |
          mkdir -p .research/calibration-artifact .research/frozen-artifact
          mkdir -p .research/ledgers/calibration .research/ledgers/frozen
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CALIBRATION_LEDGER_ARTIFACT_ID}/zip" > .research/calibration.zip
          unzip -q .research/calibration.zip -d .research/calibration-artifact
          cp .research/calibration-artifact/calibration-score-ledgers/*.csv.gz .research/ledgers/calibration/
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PIT_SOURCE_ARTIFACT_ID}/zip" > .research/frozen.zip
          unzip -q .research/frozen.zip -d .research/frozen-artifact
          cp .research/frozen-artifact/score_ledgers/*.csv.gz .research/ledgers/frozen/
      - name: Download frozen CNINFO source cache
        run: |
          mkdir -p .research/source-artifact .research/source-cache
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_CACHE_ARTIFACT_ID}/zip" > .research/source.zip
          test "$(sha256sum .research/source.zip | awk '{print $1}')" = "${SOURCE_CACHE_ARTIFACT_SHA256}"
          unzip -q .research/source.zip -d .research/source-artifact
          cp -R .research/source-artifact/source-cache/. .research/source-cache/
          test "$(find .research/source-cache -type f -name '*.json' | wc -l | tr -d ' ')" = "260"
      - name: Execute frozen source cache twice
        run: |
          EXECUTION_AT="2026-08-05T14:34:03+00:00"
          for RUN in a b; do
            uv run python scripts/data/build_cn130_pit_event_families_phase2.py \
              --provider-dir .research/provider/data/providers/cn \
              --ledger-dir .research/ledgers/calibration \
              --ledger-dir .research/ledgers/frozen \
              --source-cache-root .research/source-cache \
              --output-dir ".research/run-${RUN}" \
              --execution-at "$EXECUTION_AT"
          done
      - name: Verify deterministic and committed evidence
        run: |
          diff -ru .research/run-a .research/run-b
          for FILE in \
            decision.json \
            event_family_summary.csv \
            event_family_half_year.csv \
            overlap_matrix.csv \
            manifest.json \
            report.md; do
            diff -u \
              "data/research/cn130_pit_event_families_phase2_v1/${FILE}" \
              ".research/run-a/${FILE}"
          done
      - name: Package complete evidence
        if: always()
        run: |
          mkdir -p artifacts/cn130-pit-event-families-phase2
          test ! -d .research/run-a || cp -R .research/run-a artifacts/cn130-pit-event-families-phase2/final
          test ! -d .research/source-cache || cp -R .research/source-cache artifacts/cn130-pit-event-families-phase2/source-cache
          cp configs/data_contracts/company_information_event_phase2_v1.yaml artifacts/cn130-pit-event-families-phase2/
          cp docs/research/cn130_pit_event_families_phase2_preregistration_2026-08-05.md artifacts/cn130-pit-event-families-phase2/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cn130-pit-event-families-phase2-certified-${{ github.run_id }}
          path: artifacts/cn130-pit-event-families-phase2/
          if-no-files-found: error
          retention-days: 30
