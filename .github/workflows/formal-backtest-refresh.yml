      - "tests/test_refresh_ranker_formal.py"
      - "tests/test_us_x1_3_preview_publication.py"
      - "tests/test_us_x1_3_current_target.py"
      - "tests/test_refresh_byd_v1_3_formal.py"
      - "tests/test_system_health.py"
      - "tests/test_formal_refresh_trigger_scope.py"
      - "tests/test_market_session_clock.py"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: reviewed-formal-backtest-refresh-live
  cancel-in-progress: false

env:
  CURRENT_FORMAL_V2_ROOT: data/research/formal_model_runs
  CURRENT_PREVIEW_ROOT: data/research/model_runs
  CANDIDATE_V2_ROOT: artifacts/formal-refresh/formal-v2
  CANDIDATE_PREVIEW_ROOT: artifacts/formal-refresh/model-runs
  CANDIDATE_FRESHNESS_ROOT: artifacts/formal-refresh/freshness-input
  CANDIDATE_MARKET_EVIDENCE_ROOT: artifacts/formal-refresh/market-evidence
  CANDIDATE_MODEL_DATA_ROOT: artifacts/formal-refresh/model-data-bundle-v1
  REFRESH_RECEIPT: artifacts/formal-refresh/formal-refresh-receipt.json
  FAN_IN_RECEIPT: artifacts/formal-refresh/strategy-fan-in-receipt.json
  REFRESH_BRANCH: automation/formal-backtest-refresh

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      generated_at: ${{ steps.clock.outputs.generated_at }}
      us_cutoff: ${{ steps.clock.outputs.us_cutoff }}
      cn_cutoff: ${{ steps.clock.outputs.cn_cutoff }}
      us_seed_cutoff: ${{ steps.clock.outputs.us_seed_cutoff }}
      cn_seed_cutoff: ${{ steps.clock.outputs.cn_seed_cutoff }}
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: true
          sparse-checkout: |
            .github
            configs
            data/csv_clean
            data/research/formal_model_runs
            data/research/model_runs
            data/research/model_data_bundle_v1
            data/research/strategy_signal_ledgers
            data/research/runs
            data/research/historical_model_evidence
            data/research/byd_prospective_shadow
            data/research/byd_515180_prospective
            data/research/cn_x1_1_regime_gated_candidate_v1
            docs
            qlib-dashboard
            scripts
            src
            supabase
            tests
          sparse-checkout-cone-mode: true
      - name: Verify execution identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked Python preflight environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate refresh implementation before network work
        run: |
          uv run ruff check \
            src/governance/active_strategy_catalog.py \
            src/governance/strategy_runtime_capabilities.py \
            src/artifacts/formal_bundle_reader.py \
            src/artifacts/formal_bundle_v2_builder.py \
            src/artifacts/formal_refresh.py \
            src/artifacts/formal_publication_delta.py \
            src/artifacts/formal_provider_cache.py \
            src/artifacts/us_x1_3_preview.py \
            src/artifacts/qqq_v4_3_formal.py \
            src/artifacts/strategy_operations.py \
            src/artifacts/system_health.py \
            src/dashboard/formal_bundle_market_events.py \
            src/dashboard/market_evidence.py \
            src/factors/library.py \
            src/factors/panel.py \
            src/data \
            src/research/formal_model_replay.py \
            src/research/qqq_authoritative_replay.py \
            src/research/rules_formal_replay_gate.py \
            src/research/cn_x1_2_prospective.py \
            scripts/build_market_evidence.py \
            scripts/govern_formal_provider_cache.py \
            scripts/data/refresh_selected_pool_prices.py \
            scripts/data/refresh_selected_pool_prices_v2.py \
            scripts/run_formal_refresh_transaction.py \
            scripts/run_formal_strategy_refresh.py \
            scripts/ranker_provisional_mtm.py \
            scripts/refresh_ranker_formal.py \
            scripts/build_cn_x1_2_prospective_ledger.py \
            scripts/build_us_x1_3_preview.py \
            scripts/byd_formal_refresh_common.py \
            scripts/byd_v1_3_formal_builder.py \
            scripts/refresh_byd_v1_3_formal.py \
            scripts/refresh_qqq_v4_3_formal.py \
            tests/test_active_strategy_catalog.py \
            tests/test_strategy_runtime_capabilities.py \
            tests/test_formal_bundle_reader.py \
            tests/test_formal_refresh.py \
            tests/test_formal_publication_delta.py \
            tests/test_formal_strategy_refresh.py \
            tests/test_cn_x1_2_prospective.py \
            tests/test_refresh_ranker_formal.py \
            tests/test_formal_refresh_metric_projection.py \
            tests/test_ranker_provisional_mtm.py \
            tests/test_refresh_byd_v1_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_rules_formal_replay_gate.py \
            tests/test_market_evidence.py \
            tests/selected_pool_price_fixtures.py \
            tests/test_formal_provider_cache.py \
            tests/test_refresh_selected_pool_prices.py \
            tests/test_refresh_selected_pool_prices_v2.py \
            tests/test_selected_pool_price_publication.py \
            tests/test_selected_pool_governance.py \
            tests/test_strategy_operations.py \
            tests/test_system_health.py \
            tests/test_model_data_bundle.py \
            tests/test_repository_research_store.py \
            tests/test_us_x1_3_preview_publication.py \
            tests/test_us_x1_3_current_target.py \
            tests/test_market_session_clock.py
          uv run mypy \
            src/artifacts/formal_bundle_reader.py \
            src/artifacts/formal_refresh.py \
            src/artifacts/formal_publication_delta.py \
            src/artifacts/formal_provider_cache.py \
            src/data/selected_pool_price_publication.py \
            src/dashboard/formal_bundle_market_events.py \
            src/dashboard/market_evidence.py \
            scripts/govern_formal_provider_cache.py \
            scripts/build_market_evidence.py \
            scripts/run_formal_refresh_transaction.py \
            scripts/run_formal_strategy_refresh.py
          uv run pytest \
            tests/test_active_strategy_catalog.py \
            tests/test_strategy_runtime_capabilities.py \
            tests/test_formal_bundle_reader.py \
            tests/test_formal_refresh.py \
            tests/test_formal_publication_delta.py \
            tests/test_formal_strategy_refresh.py \
            tests/test_cn_x1_2_prospective.py \
            tests/test_refresh_ranker_formal.py \
            tests/test_formal_refresh_metric_projection.py \
            tests/test_ranker_provisional_mtm.py \
            tests/test_refresh_byd_v1_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_rules_formal_replay_gate.py \
            tests/test_market_evidence.py \
            tests/test_formal_provider_cache.py \
            tests/test_refresh_selected_pool_prices.py \
            tests/test_refresh_selected_pool_prices_v2.py \
            tests/test_selected_pool_price_publication.py \
            tests/test_selected_pool_governance.py \
            tests/test_strategy_operations.py \
            tests/test_system_health.py \
            tests/test_model_data_bundle.py \
            tests/test_repository_research_store.py \
            tests/test_us_x1_3_preview_publication.py \
            tests/test_us_x1_3_current_target.py \
            tests/test_market_session_clock.py \
            -q --strict-markers --tb=short
          cd qlib-dashboard
          npm run check:account
      - name: Resolve immutable workflow start
        id: run_identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created_at="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --jq '.created_at'
          )"
          test -n "$created_at"
          echo "created_at=$created_at" >> "$GITHUB_OUTPUT"
      - name: Resolve transaction timestamp and completed market cutoffs
        id: clock
        env:
          RUN_CREATED_AT: ${{ steps.run_identity.outputs.created_at }}
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import date, datetime, timedelta, timezone
          from src.research.market_session_clock import completed_market_date

          now = datetime.fromisoformat(
              os.environ['RUN_CREATED_AT'].replace('Z', '+00:00')
          ).astimezone(timezone.utc)
          requested = now.date().isoformat()
          us_cutoff = completed_market_date('us', requested, now_utc=now)
          cn_cutoff = completed_market_date('cn', requested, now_utc=now)

          def previous_completed(market: str, cutoff: str) -> str:
              previous_requested = (
                  date.fromisoformat(cutoff) - timedelta(days=1)
              ).isoformat()
              return completed_market_date(market, previous_requested, now_utc=now)

          print(f"generated_at={now.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print(f"us_cutoff={us_cutoff}")
          print(f"cn_cutoff={cn_cutoff}")
          print(f"us_seed_cutoff={previous_completed('us', us_cutoff)}")
          print(f"cn_seed_cutoff={previous_completed('cn', cn_cutoff)}")
          PY

  providers:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        market: [us, cn]
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            configs
            data/csv_clean
            scripts
            src
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve requested provider cache identity
        id: requested_contract
        env:
          MARKET: ${{ matrix.market }}
          REQUESTED_CUTOFF: ${{ matrix.market == 'us' && needs.prepare.outputs.us_cutoff || needs.prepare.outputs.cn_cutoff }}
        run: |
          python -m scripts.govern_formal_provider_cache contract \
            --root . --market "$MARKET" --start 2021-01-01 \
            --cutoff "$REQUESTED_CUTOFF" \
            --output "artifacts/formal-refresh/provider-${MARKET}-contract.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore requested governed provider cache
        id: provider_cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/formal-refresh/provider-${{ matrix.market }}
          key: ${{ steps.requested_contract.outputs.cache_key }}-governed
      - name: Install locked provider environment
        if: steps.provider_cache.outputs.cache-hit != 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Resolve latest complete provider cutoff
        id: readiness
        if: steps.provider_cache.outputs.cache-hit != 'true'
        env:
          MARKET: ${{ matrix.market }}
          REQUESTED_CUTOFF: ${{ matrix.market == 'us' && needs.prepare.outputs.us_cutoff || needs.prepare.outputs.cn_cutoff }}
          SEED_CUTOFF: ${{ matrix.market == 'us' && needs.prepare.outputs.us_seed_cutoff || needs.prepare.outputs.cn_seed_cutoff }}
        run: |
          readiness="artifacts/formal-refresh/provider-${MARKET}-readiness.json"
          if [ "$MARKET" = "us" ]; then
            uv run python scripts/data/resolve_formal_provider_cutoff.py \
              --market "$MARKET" \
              --requested-cutoff "$REQUESTED_CUTOFF" \
              --seed-cutoff "$SEED_CUTOFF" \
              --output "$readiness" \
              --github-output "$GITHUB_OUTPUT"
          else
            python - <<'PY2' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          requested = os.environ["REQUESTED_CUTOFF"]
          seed = os.environ["SEED_CUTOFF"]
          payload = {
              "schema_version": "1.0",
              "evidence_type": "formal_provider_readiness_v1",
              "market": os.environ["MARKET"],
              "status": "current",
              "requested_cutoff": requested,
              "effective_cutoff": requested,
              "effective_seed_cutoff": seed,
              "research_only": True,
              "trade_ready": False,
          }
          path = Path(f"artifacts/formal-refresh/provider-{os.environ['MARKET']}-readiness.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("provider_status=current")
          print(f"effective_cutoff={requested}")
          print(f"effective_seed_cutoff={seed}")
          PY2
          fi
      - name: Resolve effective provider cache identity
        id: contract
        if: steps.provider_cache.outputs.cache-hit != 'true'
        env:
          MARKET: ${{ matrix.market }}
          EFFECTIVE_CUTOFF: ${{ steps.readiness.outputs.effective_cutoff }}
        run: |
          python -m scripts.govern_formal_provider_cache contract \
            --root . --market "$MARKET" --start 2021-01-01 \
            --cutoff "$EFFECTIVE_CUTOFF" \
            --output "artifacts/formal-refresh/provider-${MARKET}-contract.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore exact effective governed provider cache
        id: effective_cache
        if: steps.provider_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: artifacts/formal-refresh/provider-${{ matrix.market }}
          key: ${{ steps.contract.outputs.cache_key }}-governed
      - name: Restore previous governed provider seed
        if: steps.provider_cache.outputs.cache-hit != 'true' && steps.effective_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: artifacts/formal-refresh/provider-${{ matrix.market }}
          key: formal-provider-seed-${{ matrix.market }}-${{ github.run_id }}
          restore-keys: |
            formal-provider-1.1.0-${{ matrix.market }}-${{ steps.readiness.outputs.effective_seed_cutoff }}-
            formal-provider-1.0.0-${{ matrix.market }}-${{ steps.readiness.outputs.effective_seed_cutoff }}-
      - name: Prepare governed provider seed
        id: provider_seed
        if: steps.provider_cache.outputs.cache-hit != 'true' && steps.effective_cache.outputs.cache-hit != 'true'
        env:
          MARKET: ${{ matrix.market }}
        run: |
          restored="artifacts/formal-refresh/provider-${MARKET}"
          seed="artifacts/formal-refresh/provider-${MARKET}-seed"
          if [ -d "$restored/data/csv_source" ]; then
            python - <<'PY2'
          import json
          import os
          from pathlib import Path

          market = os.environ["MARKET"]
          root = Path(f"artifacts/formal-refresh/provider-{market}")
          manifest = json.loads(
              (root / "artifacts/selected_pool_price_refresh_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          receipt = json.loads(
              (root / "artifacts/formal-provider-cache-receipt.json").read_text(
                  encoding="utf-8"
              )
          )
          if manifest.get("status") != "selected_pool_price_refresh_ready":
              raise SystemExit("previous provider seed is not refresh ready")
          if manifest.get("promotion_eligible") is not True:
              raise SystemExit("previous provider seed is not promotion eligible")
          if receipt.get("evidence_type") != "formal_provider_cache_receipt":
              raise SystemExit("previous provider seed is not governed cache evidence")
          PY2
            rm -rf "$seed"
            mv "$restored" "$seed"
            echo "source_csv_dir=$seed/data/csv_source" >> "$GITHUB_OUTPUT"
            echo "seed_source=governed_cache" >> "$GITHUB_OUTPUT"
          else
            echo "source_csv_dir=data/csv_clean" >> "$GITHUB_OUTPUT"
            echo "seed_source=repository_bootstrap" >> "$GITHUB_OUTPUT"
          fi
      - name: Incrementally extend isolated selected-pool provider
        if: steps.provider_cache.outputs.cache-hit != 'true' && steps.effective_cache.outputs.cache-hit != 'true'
        env:
          MARKET: ${{ matrix.market }}
          EFFECTIVE_CUTOFF: ${{ steps.readiness.outputs.effective_cutoff }}
          SOURCE_CSV_DIR: ${{ steps.provider_seed.outputs.source_csv_dir }}
        run: |
          rm -rf "artifacts/formal-refresh/provider-${MARKET}"
          args=(
            --root .
            --market "$MARKET"
            --source-csv-dir "$SOURCE_CSV_DIR"
            --output-root "artifacts/formal-refresh/provider-${MARKET}"
            --start 2021-01-01
            --cutoff "$EFFECTIVE_CUTOFF"
            --max-rounds 3
          )
          while IFS= read -r symbol; do
            args+=(--auxiliary-symbol "$symbol")
          done < <(python - <<'PY2'
          import json
          import os
          from pathlib import Path

          market = os.environ["MARKET"]
          contract = json.loads(
              Path(f"artifacts/formal-refresh/provider-{market}-contract.json").read_text(
                  encoding="utf-8"
              )
          )
          for symbol in contract["auxiliary_symbols"]:
              print(symbol)
          PY2
          )
          timeout --signal=TERM --kill-after=30s 30m \
            uv run python scripts/data/refresh_selected_pool_prices_v2.py "${args[@]}"
      - name: Seal fresh provider cache
        if: steps.provider_cache.outputs.cache-hit != 'true' && steps.effective_cache.outputs.cache-hit != 'true'
        env:
          MARKET: ${{ matrix.market }}
        run: |
          python -m scripts.govern_formal_provider_cache seal \
            --provider-root "artifacts/formal-refresh/provider-${MARKET}" \
            --contract "artifacts/formal-refresh/provider-${MARKET}-contract.json" \
            --receipt "artifacts/formal-refresh/provider-${MARKET}/artifacts/formal-provider-cache-receipt.json"
      - name: Verify restored provider cache
        if: steps.provider_cache.outputs.cache-hit == 'true' || steps.effective_cache.outputs.cache-hit == 'true'
        env:
          MARKET: ${{ matrix.market }}
        run: |
          python -m scripts.govern_formal_provider_cache verify \
            --provider-root "artifacts/formal-refresh/provider-${MARKET}" \
            --contract "artifacts/formal-refresh/provider-${MARKET}-contract.json" \
            --receipt "artifacts/formal-refresh/provider-${MARKET}/artifacts/formal-provider-cache-receipt.json"
      - name: Save exact governed provider cache
        if: steps.provider_cache.outputs.cache-hit != 'true' && steps.effective_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/formal-refresh/provider-${{ matrix.market }}
          key: ${{ steps.contract.outputs.cache_key }}-governed
      - name: Transfer verified provider
        uses: actions/upload-artifact@v6
        with:
          name: formal-provider-${{ matrix.market }}-${{ github.run_id }}
          path: artifacts/formal-refresh/provider-${{ matrix.market }}
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Upload provider readiness evidence
        if: steps.provider_cache.outputs.cache-hit != 'true' && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: formal-provider-readiness-${{ matrix.market }}-${{ github.run_id }}
          path: artifacts/formal-refresh/provider-${{ matrix.market }}-readiness.json
          overwrite: true
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
      - name: Upload failed provider diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: formal-provider-diagnostics-${{ matrix.market }}-${{ github.run_id }}
          path: |
            artifacts/formal-refresh/provider-${{ matrix.market }}-contract.json
            artifacts/formal-refresh/provider-${{ matrix.market }}/artifacts/selected_pool_price_refresh_manifest.json
          overwrite: true
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1

  plan:
    needs: [prepare, providers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      refresh_required: ${{ steps.plan.outputs.refresh_required }}
      us_cutoff: ${{ steps.plan.outputs.us_cutoff }}
      cn_cutoff: ${{ steps.plan.outputs.cn_cutoff }}
      task_matrix: ${{ steps.plan.outputs.task_matrix }}
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            configs
            data/research/formal_model_runs
            data/research/strategy_signal_ledgers
            scripts
            src
          sparse-checkout-cone-mode: true
      - name: Download verified US provider
        uses: actions/download-artifact@v6
        with:
          name: formal-provider-us-${{ github.run_id }}
          path: artifacts/formal-refresh/provider-us
      - name: Download verified CN provider
        uses: actions/download-artifact@v6
        with:
          name: formal-provider-cn-${{ github.run_id }}
          path: artifacts/formal-refresh/provider-cn
      - name: Build pure active-strategy plan
        id: plan
        env:
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
        run: |
          python -m scripts.run_formal_refresh_transaction plan \
            --formal-v2-root "$CURRENT_FORMAL_V2_ROOT" \
            --us-provider-manifest artifacts/formal-refresh/provider-us/artifacts/selected_pool_price_refresh_manifest.json \
            --cn-provider-manifest artifacts/formal-refresh/provider-cn/artifacts/selected_pool_price_refresh_manifest.json \
            --generated-at "$GENERATED_AT" \
            --output artifacts/formal-refresh/plan.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload immutable plan
        uses: actions/upload-artifact@v6
        with:
          name: formal-refresh-plan-${{ github.run_id }}
          path: artifacts/formal-refresh/plan.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  strategy:
    needs: [prepare, plan]
    if: needs.plan.outputs.refresh_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(needs.plan.outputs.task_matrix) }}
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked strategy environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Download strategy provider
        uses: actions/download-artifact@v6
        with:
          name: formal-provider-${{ matrix.task.market }}-${{ github.run_id }}
          path: artifacts/formal-refresh/provider
      - name: Download immutable plan
        uses: actions/download-artifact@v6
        with:
          name: formal-refresh-plan-${{ github.run_id }}
          path: artifacts/formal-refresh/plan
      - name: Execute one active strategy
        env:
          STRATEGY_ID: ${{ matrix.task.strategy_id }}
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
        run: |
          uv run python scripts/run_formal_strategy_refresh.py \
            --strategy-id "$STRATEGY_ID" \
            --plan artifacts/formal-refresh/plan/plan.json \
            --provider-root artifacts/formal-refresh/provider \
            --formal-v2-root "$CURRENT_FORMAL_V2_ROOT" \
            --current-preview-root "$CURRENT_PREVIEW_ROOT" \
            --generated-at "$GENERATED_AT" \
            --output-root artifacts/formal-refresh/strategy-result
      - name: Upload bounded strategy receipt and evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: formal-strategy-${{ matrix.task.strategy_id }}-${{ github.run_id }}
          path: artifacts/formal-refresh/strategy-result
          overwrite: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1

  publish:
    needs: [prepare, providers, plan, strategy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            configs
            data/research/formal_model_runs
            data/research/model_runs
            data/research/model_data_bundle_v1
            scripts
            src
          sparse-checkout-cone-mode: true
      - name: Resolve current Market Evidence tree
        id: market_evidence_tree
        run: |
          tree="$(git rev-parse "${GITHUB_SHA}:data/research/market_evidence")"
          test "$(git cat-file -t "$tree")" = "tree"
          echo "oid=$tree" >> "$GITHUB_OUTPUT"
      - name: Restore exact Market Evidence tree
        id: market_evidence_cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: data/research/market_evidence
          key: formal-market-evidence-v1-${{ runner.os }}-${{ steps.market_evidence_tree.outputs.oid }}
      - name: Materialize and verify current Market Evidence tree
        id: market_evidence
        env:
          CACHE_HIT: ${{ steps.market_evidence_cache.outputs.cache-hit }}
          EXPECTED_TREE: ${{ steps.market_evidence_tree.outputs.oid }}
        run: |
          verify_tree() {
            local index_path root_tree actual_tree
            index_path="$(mktemp)"
            rm -f "$index_path"
            GIT_INDEX_FILE="$index_path" git read-tree --empty
            GIT_INDEX_FILE="$index_path" git add -f --sparse -- \
              data/research/market_evidence
            root_tree="$(GIT_INDEX_FILE="$index_path" git write-tree)"
            actual_tree="$(git rev-parse "${root_tree}:data/research/market_evidence")"
            rm -f "$index_path"
            test "$actual_tree" = "$EXPECTED_TREE"
          }

          source=cache
          if [ "$CACHE_HIT" != "true" ] || ! verify_tree; then
            source=git
            rm -rf data/research/market_evidence
            git sparse-checkout add data/research/market_evidence
            verify_tree
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "Verified Market Evidence source=$source tree=$EXPECTED_TREE"
      - name: Download verified US provider
        uses: actions/download-artifact@v6
        with:
          name: formal-provider-us-${{ github.run_id }}
          path: artifacts/formal-refresh/provider-us
      - name: Download verified CN provider
        uses: actions/download-artifact@v6
        with:
          name: formal-provider-cn-${{ github.run_id }}
          path: artifacts/formal-refresh/provider-cn
      - name: Download immutable plan
        uses: actions/download-artifact@v6
        with:
          name: formal-refresh-plan-${{ github.run_id }}
          path: artifacts/formal-refresh/plan
      - name: Download all strategy results
        if: needs.plan.outputs.refresh_required == 'true'
        uses: actions/download-artifact@v6
        with:
          pattern: formal-strategy-*-${{ github.run_id }}
          path: artifacts/formal-refresh/strategy-results
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked publication Python environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Atomically fan in active preview results
        run: |
          uv run python scripts/run_formal_refresh_transaction.py assemble \
            --plan artifacts/formal-refresh/plan/plan.json \
            --strategy-results-root artifacts/formal-refresh/strategy-results \
            --current-preview-root "$CURRENT_PREVIEW_ROOT" \
            --candidate-preview-root "$CANDIDATE_PREVIEW_ROOT" \
            --receipt "$FAN_IN_RECEIPT"
      - name: Build formal Bundle v2 from preview fan-in
        id: transaction
        env:
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
        run: |
          rm -rf "$CANDIDATE_FRESHNESS_ROOT" "$CANDIDATE_V2_ROOT"
          mkdir -p "$CANDIDATE_FRESHNESS_ROOT"
          uv run python scripts/run_formal_refresh_transaction.py finalize \
            --us-provider-manifest artifacts/formal-refresh/provider-us/artifacts/selected_pool_price_refresh_manifest.json \
            --cn-provider-manifest artifacts/formal-refresh/provider-cn/artifacts/selected_pool_price_refresh_manifest.json \
            --generated-at "$GENERATED_AT" \
            --fan-in-receipt "$FAN_IN_RECEIPT" \
            --freshness-output "$CANDIDATE_FRESHNESS_ROOT/freshness.json" \
            --receipt "$REFRESH_RECEIPT"
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root "$CANDIDATE_FRESHNESS_ROOT" \
            --retained-root "$CURRENT_FORMAL_V2_ROOT" \
            --native-root "$CANDIDATE_PREVIEW_ROOT" \
            --output-root "$CANDIDATE_V2_ROOT" \
            --receipt artifacts/formal-refresh/formal-v2-sync-receipt.json
          outcome="$(jq -er '.status' "$REFRESH_RECEIPT")"
          test "$outcome" = "candidate_ready_for_review"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
      - name: Build shared governed Market Evidence
        run: |
          rm -rf "$CANDIDATE_MARKET_EVIDENCE_ROOT"
          uv run python scripts/build_market_evidence.py \
            --market us --provider-root artifacts/formal-refresh/provider-us \
            --formal-root "$CANDIDATE_V2_ROOT" \
            --output-root "$CANDIDATE_MARKET_EVIDENCE_ROOT" \
            --reuse-root data/research/market_evidence \
            > artifacts/formal-refresh/market-evidence-us.log 2>&1 &
          us_pid="$!"
          uv run python scripts/build_market_evidence.py \
            --market cn --provider-root artifacts/formal-refresh/provider-cn \
            --formal-root "$CANDIDATE_V2_ROOT" \
            --output-root "$CANDIDATE_MARKET_EVIDENCE_ROOT" \
            --reuse-root data/research/market_evidence \
            > artifacts/formal-refresh/market-evidence-cn.log 2>&1 &
          cn_pid="$!"
          status=0
          wait "$us_pid" || status=1
          wait "$cn_pid" || status=1
          cat artifacts/formal-refresh/market-evidence-us.log artifacts/formal-refresh/market-evidence-cn.log
          test "$status" -eq 0
      - name: Build shared Model Data Bundle
        env:
          US_CUTOFF: ${{ needs.plan.outputs.us_cutoff }}
          CN_CUTOFF: ${{ needs.plan.outputs.cn_cutoff }}
          EXPECTED_US_CUTOFF: ${{ needs.prepare.outputs.us_cutoff }}
          EXPECTED_CN_CUTOFF: ${{ needs.prepare.outputs.cn_cutoff }}
        run: |
          evidence_cutoff="$(printf '%s\n%s\n' "$US_CUTOFF" "$CN_CUTOFF" | sort | tail -1)"
          rm -rf "$CANDIDATE_MODEL_DATA_ROOT"
          mkdir -p "$CANDIDATE_MODEL_DATA_ROOT/components"
          cp artifacts/formal-refresh/provider-us/artifacts/selected_pool_price_publication_manifest.json \
            "$CANDIDATE_MODEL_DATA_ROOT/components/us-selected-pool-prices.json"
          cp artifacts/formal-refresh/provider-cn/artifacts/selected_pool_price_publication_manifest.json \
            "$CANDIDATE_MODEL_DATA_ROOT/components/cn-selected-pool-prices.json"
          uv run python scripts/data/build_model_data_bundle.py \
            --component "prices.us_selected_equities_v2:selected_pool_prices:${CANDIDATE_MODEL_DATA_ROOT}/components/us-selected-pool-prices.json:us" \
            --component "prices.cn_selected_equities_v3:selected_pool_prices:${CANDIDATE_MODEL_DATA_ROOT}/components/cn-selected-pool-prices.json:cn" \
            --evidence-cutoff "$evidence_cutoff" \
            --output-root "$CANDIDATE_MODEL_DATA_ROOT"
      - name: Classify canonical publication delta
        id: delta
        run: |
          uv run python scripts/run_formal_refresh_transaction.py publication-delta \
            --current-formal-root data/research/formal_model_runs \
            --current-preview-root data/research/model_runs \
            --current-market-evidence-root data/research/market_evidence \
            --current-model-data-root data/research/model_data_bundle_v1 \
            --candidate-formal-root "$CANDIDATE_V2_ROOT" \
            --candidate-preview-root "$CANDIDATE_PREVIEW_ROOT" \
            --candidate-market-evidence-root "$CANDIDATE_MARKET_EVIDENCE_ROOT" \
            --candidate-model-data-root "$CANDIDATE_MODEL_DATA_ROOT" \
            --plan artifacts/formal-refresh/plan/plan.json \
            --fan-in-receipt "$FAN_IN_RECEIPT" \
            --refresh-receipt "$REFRESH_RECEIPT" \
            --receipt artifacts/formal-refresh/publication-delta-receipt.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Save verified Market Evidence tree
        if: success() && steps.market_evidence.outputs.source == 'git'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: data/research/market_evidence
          key: formal-market-evidence-v1-${{ runner.os }}-${{ steps.market_evidence_tree.outputs.oid }}
      - name: Hydrate complete reviewed revision
        if: steps.delta.outputs.publication_required == 'true'
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
          else
            git fetch --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
          fi
          git lfs install --local
          git sparse-checkout disable
          git lfs pull
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git config --bool core.sparseCheckout || true)" != "true"
          test -n "$(git merge-base HEAD origin/main)"
      - name: Install complete candidate and materialize read models
        if: steps.delta.outputs.publication_required == 'true'
        env:
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
        run: |
          rm -rf \
            data/research/formal_model_runs \
            data/research/model_runs \
            data/research/market_evidence \
            data/research/model_data_bundle_v1
          cp -a "$CANDIDATE_V2_ROOT" data/research/formal_model_runs
          cp -a "$CANDIDATE_PREVIEW_ROOT" data/research/model_runs
          cp -a "$CANDIDATE_MARKET_EVIDENCE_ROOT" data/research/market_evidence
          cp -a "$CANDIDATE_MODEL_DATA_ROOT" data/research/model_data_bundle_v1
          uv run alpha ops build \
            --formal-catalog data/research/formal_model_runs/catalog.json \
            --generated-at "$GENERATED_AT"
      - uses: actions/setup-node@v6
        if: steps.delta.outputs.publication_required == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json
      - name: Install locked frontend publication environment
        if: steps.delta.outputs.publication_required == 'true'
        run: |
          cd qlib-dashboard
          npm ci --no-audit --no-fund
      - name: Validate complete candidate publication
        if: steps.delta.outputs.publication_required == 'true'
        run: |
          uv run pytest \
            tests/test_active_strategy_catalog.py \
            tests/test_strategy_runtime_capabilities.py \
            tests/test_formal_bundle_reader.py \
            tests/test_formal_refresh.py \
            tests/test_formal_strategy_refresh.py \
            tests/test_cn_x1_2_prospective.py \
            tests/test_refresh_ranker_formal.py \
            tests/test_formal_refresh_metric_projection.py \
            tests/test_refresh_byd_v1_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_rules_formal_replay_gate.py \
            tests/test_market_evidence.py \
            tests/test_sync_formal_bundle_v2.py \
            tests/test_strategy_operations.py \
            tests/test_system_health.py \
            tests/test_model_data_bundle.py \
            tests/test_repository_research_store.py \
            tests/test_model_x1_baselines.py \
            tests/test_us_x1_3_preview_publication.py \
            tests/test_us_x1_3_current_target.py \
            -q --strict-markers --tb=short
          uv run python scripts/check_repository_model_runs.py
          cd qlib-dashboard
          npm run lint
          npx tsc --noEmit
          npm test -- --run
          npm run build
          test -f dist/data/formal-model-runs/catalog.json
          test -f dist/data/model-runs/catalog.json
          test -f dist/data/market-evidence/us/catalog.json
          test -f dist/data/market-evidence/cn/catalog.json
          test -f dist/data/strategy-operations/snapshots.json
          test -f dist/data/strategy-operations/system-health.json
          test -f dist/data/model-data-readiness.json
          test -f dist/data/data-components.json
          test -f dist/data/training-profiles.json
          test ! -e dist/data/formal-backtests
      - name: Open or update reviewed refresh PR
        id: pull_request
        if: steps.delta.outputs.publication_required == 'true'
        env:
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
          US_CUTOFF: ${{ needs.plan.outputs.us_cutoff }}
          CN_CUTOFF: ${{ needs.plan.outputs.cn_cutoff }}
        run: |
          git config user.name "AlphaEngine Formal Refresh Agent"
          git config user.email "formal-refresh-agent@alphaengine.local"
          git fetch origin main
          git checkout -B "$REFRESH_BRANCH"
          git add \
            data/research/formal_model_runs \
            data/research/model_runs \
            data/research/market_evidence \
            data/research/model_data_bundle_v1
          if git diff --cached --quiet; then
            echo "No canonical evidence bytes changed after refresh validation."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: publish governed evidence through US ${US_CUTOFF} and CN ${CN_CUTOFF}"
          if ! git merge --no-edit origin/main; then
            git merge --abort || true
            echo "Reviewed refresh overlaps newer main changes; rerun from the latest main." >&2
            exit 1
          fi
          git push --force origin "HEAD:${REFRESH_BRANCH}"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          ## Reviewed formal + market evidence refresh

          - US latest completed common session: \`${US_CUTOFF}\`
          - CN latest completed common session: \`${CN_CUTOFF}\`
          - Generated at: \`${GENERATED_AT}\`
          - Active strategy membership: Active Strategy Catalog
          - Strategy execution: independent receipt-bound matrix, fail-fast disabled
          - Publication: one atomic Bundle v2 preview fan-in; no flat formal state
          - Historical reports, positions and trades: immutable prefix verified against accepted Bundle v2
          - Model selection: not reopened
          - Research only: true
          - Trade ready: false
          EOF
          existing="$(gh pr list --head "$REFRESH_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" \
              --title "data: refresh governed evidence through US ${US_CUTOFF} / CN ${CN_CUTOFF}" \
              --body-file "$body_file"
            gh pr ready --undo "$existing" || true
            number="$existing"
          else
            gh pr create --base main --head "$REFRESH_BRANCH" --draft \
              --title "data: refresh governed evidence through US ${US_CUTOFF} / CN ${CN_CUTOFF}" \
              --body-file "$body_file"
            number="$(gh pr list --head "$REFRESH_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          fi
          test -n "$number"
          echo "pr_number=$number" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for candidate checks, merge reviewed refresh, and verify Pages
        id: release
        if: steps.pull_request.outputs.pr_number != ''
        timeout-minutes: 120
        env:
          PR_NUMBER: ${{ steps.pull_request.outputs.pr_number }}
          CANDIDATE_SHA: ${{ steps.pull_request.outputs.candidate_sha }}
        run: |
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          before_run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow formal-backtest-refresh-ci.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // 0')"
          gh workflow run formal-backtest-refresh-ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$REFRESH_BRANCH" \
            -f "candidate_sha=${CANDIDATE_SHA}" \
            -f "pr_number=${PR_NUMBER}"
          validation_run=""
          for attempt in $(seq 1 30); do
            validation_run="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow formal-backtest-refresh-ci.yml \
              --branch "$REFRESH_BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${CANDIDATE_SHA}\" and .databaseId > ${before_run_id}) | .databaseId" \
              | head -n 1)"
            [[ -n "$validation_run" ]] && break
            sleep 10
          done
          test -n "$validation_run"
          gh run watch "$validation_run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          validation_conclusion="$(gh run view "$validation_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          test "$validation_conclusion" = "success"
          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          [[ "$state" != "CLOSED" ]]
          if [[ "$state" != "MERGED" ]]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash
          fi
          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          test "$state" = "MERGED"
          merge_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$merge_sha"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$merge_sha"
          dispatch_payload="$(mktemp)"
          jq -nc --arg target_sha "$merge_sha" \
            '{
              ref: "main",
              inputs: {target_sha: $target_sha},
              return_run_details: true
            }' > "$dispatch_payload"
          pages_run="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            --input "$dispatch_payload" \
            --jq '.workflow_run_id // empty')"
          test -n "$pages_run"
          echo "pages_run_id=$pages_run" >> "$GITHUB_OUTPUT"
          gh run watch "$pages_run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          pages_conclusion="$(gh run view "$pages_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          test "$pages_conclusion" = "success"
      - name: Upsert refresh operating status
        if: ${{ !cancelled() }}
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.pull_request.outputs.pr_number }}
          US_CUTOFF: ${{ needs.plan.outputs.us_cutoff }}
          CN_CUTOFF: ${{ needs.plan.outputs.cn_cutoff }}
          REVIEWED_MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
          PAGES_RUN_ID: ${{ steps.release.outputs.pages_run_id }}
          JOB_STATUS: ${{ job.status }}
          TRANSACTION_STATUS: ${{ steps.transaction.outputs.outcome }}
          PUBLICATION_REQUIRED: ${{ steps.delta.outputs.publication_required }}
          PUBLICATION_DELTA_STATUS: ${{ steps.delta.outputs.status }}
        with:
          script: |
            const marker = '<!-- reviewed-formal-backtest-refresh -->';
            const prNumber = process.env.PR_NUMBER || '';
            const mergeSha = process.env.REVIEWED_MERGE_SHA || '';
            const pagesRunId = process.env.PAGES_RUN_ID || '';
            const deltaStatus = process.env.PUBLICATION_DELTA_STATUS || '';
            const publicationRequired = process.env.PUBLICATION_REQUIRED === 'true';
            const deltaInvalid = publicationRequired
              ? deltaStatus !== 'publication_required'
              : deltaStatus !== 'semantic_no_change';
            const releaseIncomplete = publicationRequired
              && (!prNumber || !mergeSha || !pagesRunId);
            const failed = process.env.JOB_STATUS !== 'success'
              || process.env.TRANSACTION_STATUS !== 'candidate_ready_for_review'
              || deltaInvalid
              || releaseIncomplete;
            const semanticNoChange = !failed && !publicationRequired;
            const providerDelayed = !failed && (
              (process.env.EXPECTED_US_CUTOFF && process.env.US_CUTOFF
                && process.env.US_CUTOFF < process.env.EXPECTED_US_CUTOFF)
              || (process.env.EXPECTED_CN_CUTOFF && process.env.CN_CUTOFF
                && process.env.CN_CUTOFF < process.env.EXPECTED_CN_CUTOFF)
            );
            const status = failed ? 'blocked' : providerDelayed ? 'delayed' : 'current';
            const body = [
              marker,
              '',
              `## 正式回测与市场证据刷新：${status}`,
              '',
              `- **US expected / provider cutoff**: \`${process.env.EXPECTED_US_CUTOFF || 'unresolved'} / ${process.env.US_CUTOFF || 'unresolved'}\``,
              `- **CN expected / provider cutoff**: \`${process.env.EXPECTED_CN_CUTOFF || 'unresolved'} / ${process.env.CN_CUTOFF || 'unresolved'}\``,
              `- **Workflow run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- **Review PR**: ${prNumber ? `#${prNumber}` : 'none'}`,
              `- **Reviewed merge SHA**: ${mergeSha ? `\`${mergeSha}\`` : 'none'}`,
              `- **Pages acceptance run**: ${pagesRunId ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${pagesRunId}` : 'none'}`,
              `- **Publication delta**: ${deltaStatus || 'unresolved'}`,
              '- Strategy execution: independent receipt-bound tasks',
              '- Canonical evidence transaction: one atomic Bundle v2 preview fan-in',
              '- Strategy Operations and System Health: generated from canonical evidence',
              '- Model selection reopened: no',
              publicationRequired
                ? '- Pages live acceptance: required before current/closed status'
                : '- Candidate CI and Pages: intentionally skipped for semantic identity',
              '- Research only: yes',
              '- Trade ready: no',
              '',
              failed
                ? 'The refresh failed closed before the governed publication transaction finished.'
                : providerDelayed
                  ? 'Governed provider evidence remains valid but trails the latest completed market session; publication did not move any strategy backwards.'
                  : semanticNoChange
                    ? 'The candidate publication was semantically identical to current evidence; review PR, candidate CI and Pages were intentionally skipped.'
                    : 'All active strategy receipts passed the Bundle v2 fan-in and the reviewed evidence transaction reached live Pages acceptance.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) =>
              !issue.pull_request && String(issue.body || '').includes(marker)
            );
            const desiredState = status === 'current' ? 'closed' : 'open';
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: `[运行健康] 正式回测与市场证据刷新：${status}`,
                body,
                state: desiredState,
              });
            } else if (status !== 'current') {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[运行健康] 正式回测与市场证据刷新：${status}`,
                body,
                assignees: [context.repo.owner],
              });
            }
      - name: Upload bounded refresh evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: formal-backtest-refresh-${{ github.run_id }}
          path: |
            artifacts/formal-refresh/plan/plan.json
            artifacts/formal-refresh/strategy-results/**/receipt.json
            artifacts/formal-refresh/strategy-fan-in-receipt.json
            artifacts/formal-refresh/formal-refresh-receipt.json
            artifacts/formal-refresh/formal-v2-sync-receipt.json
            artifacts/formal-refresh/publication-delta-receipt.json
            artifacts/formal-refresh/freshness-input/freshness.json
            artifacts/formal-refresh/provider-us/artifacts/selected_pool_price_refresh_manifest.json
            artifacts/formal-refresh/provider-us/artifacts/selected_pool_price_publication_manifest.json
            artifacts/formal-refresh/provider-cn/artifacts/selected_pool_price_refresh_manifest.json
            artifacts/formal-refresh/provider-cn/artifacts/selected_pool_price_publication_manifest.json
            artifacts/formal-refresh/market-evidence/us/catalog.json
            artifacts/formal-refresh/market-evidence/cn/catalog.json
          overwrite: true
          if-no-files-found: warn
          retention-days: 30
