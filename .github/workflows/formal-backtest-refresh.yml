name: Reviewed Formal Backtest Refresh

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/formal-backtest-refresh.yml"
      - ".github/workflows/formal-backtest-refresh-ci.yml"
      - "src/artifacts/formal_refresh.py"
      - "src/artifacts/formal_provider_cache.py"
      - "src/artifacts/qqq_v4_3_formal.py"
      - "src/artifacts/strategy_operations.py"
      - "src/dashboard/market_evidence.py"
      - "src/factors/library.py"
      - "src/factors/panel.py"
      - "src/data/router.py"
      - "src/data/provider_catalog.py"
      - "src/data/*.py"
      - "src/data/adapters/**"
      - "src/data/validation/**"
      - "src/research/selected_pool_guard.py"
      - "src/research/byd_515180_allocation.py"
      - "src/research/byd_v1_2_recovery_state.py"
      - "src/research/byd_v1_3_low_vol_recovery.py"
      - "scripts/build_market_providers.py"
      - "scripts/dump_bin.py"
      - "scripts/build_market_evidence.py"
      - "scripts/govern_formal_provider_cache.py"
      - "scripts/build_strategy_operations.py"
      - "scripts/run_formal_refresh_transaction.py"
      - "scripts/ranker_provisional_mtm.py"
      - "scripts/refresh_ranker_formal.py"
      - "scripts/byd_formal_refresh_common.py"
      - "scripts/byd_v1_3_formal_builder.py"
      - "scripts/refresh_byd_v1_3_formal.py"
      - "scripts/refresh_qqq_v4_3_formal.py"
      - "scripts/promote_byd_v1_3_formal.py"
      - "scripts/data/refresh_selected_pool_prices.py"
      - "scripts/data/refresh_selected_pool_prices_v2.py"
      - "scripts/data/build_etf_reference_bundle.py"
      - "src/data/etf_reference_bundle.py"
      - "scripts/sync_formal_bundle_v2.py"
      - "configs/factor_libraries/ohlcv.yaml"
      - "configs/pools/selected_pool_registry_v1.yaml"
      - "configs/pools/reference_instrument_registry_v1.yaml"
      - "configs/research_universes/us_selected_equities_v2.yaml"
      - "configs/research_universes/cn_selected_equities_v3.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/test_formal_refresh.py"
      - "tests/test_ranker_provisional_mtm.py"
      - "tests/test_refresh_byd_v1_3_formal.py"
      - "tests/test_refresh_qqq_v4_3_formal.py"
      - "tests/test_market_evidence.py"
      - "tests/test_formal_provider_cache.py"
      - "tests/test_formal_backtest_freshness.py"
      - "tests/test_strategy_operations.py"
      - "tests/test_sync_formal_bundle_v2.py"
      - "data/research/formal_backtests/**"
      - "data/research/formal_model_runs/**"
      - "data/research/market_evidence/**"
      - "data/research/strategy_signal_ledgers/**"
      - "data/research/strategy_operations/**"
      - "qlib-dashboard/public/data/formal-model-runs/**"
      - "qlib-dashboard/public/data/market-evidence/**"
      - "qlib-dashboard/public/data/strategy-operations/**"
      - "qlib-dashboard/scripts/**"
      - "qlib-dashboard/src/**"
      - "qlib-dashboard/package.json"
      - "qlib-dashboard/package-lock.json"
      - "qlib-dashboard/vite.config.*"
      - "qlib-dashboard/tsconfig*.json"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: reviewed-formal-backtest-refresh-live
  cancel-in-progress: true

env:
  CURRENT_FORMAL_ROOT: data/research/formal_backtests
  CANDIDATE_FORMAL_ROOT: artifacts/formal-refresh/formal-v1
  CANDIDATE_V2_ROOT: artifacts/formal-refresh/formal-v2
  CANDIDATE_MARKET_EVIDENCE_ROOT: artifacts/formal-refresh/market-evidence
  REFRESH_RECEIPT: artifacts/formal-refresh/formal-refresh-receipt.json
  REFRESH_BRANCH: automation/formal-backtest-refresh

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      generated_at: ${{ steps.clock.outputs.generated_at }}
      requested_cutoff: ${{ steps.clock.outputs.requested_cutoff }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
      - name: Verify execution identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json
      - name: Install locked preflight environments
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
          cd qlib-dashboard
          npm ci
      - name: Validate refresh implementation before network work
        run: |
          uv run ruff check \
            src/artifacts/formal_refresh.py \
            src/artifacts/formal_provider_cache.py \
            src/artifacts/qqq_v4_3_formal.py \
            src/artifacts/strategy_operations.py \
            src/dashboard/market_evidence.py \
            src/factors/library.py \
            src/factors/panel.py \
            src/data/router.py \
            src/data/provider_catalog.py \
            src/data/adapters \
            src/research/byd_v1_3_low_vol_recovery.py \
            scripts/build_market_evidence.py \
            scripts/govern_formal_provider_cache.py \
            scripts/build_strategy_operations.py \
            scripts/run_formal_refresh_transaction.py \
            scripts/ranker_provisional_mtm.py \
            scripts/refresh_ranker_formal.py \
            scripts/byd_formal_refresh_common.py \
            scripts/byd_v1_3_formal_builder.py \
            scripts/refresh_byd_v1_3_formal.py \
            scripts/refresh_qqq_v4_3_formal.py \
            scripts/data/refresh_selected_pool_prices.py \
            scripts/data/refresh_selected_pool_prices_v2.py \
            tests/test_formal_refresh.py \
            tests/test_ranker_provisional_mtm.py \
            tests/test_refresh_byd_v1_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_market_evidence.py \
            tests/test_formal_provider_cache.py \
            tests/test_strategy_operations.py
          uv run pytest \
            tests/test_formal_refresh.py \
            tests/test_ranker_provisional_mtm.py \
            tests/test_refresh_byd_v1_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_market_evidence.py \
            tests/test_formal_provider_cache.py \
            tests/test_strategy_operations.py \
            -q --strict-markers --tb=short
          cd qlib-dashboard
          npm run check:account
      - name: Resolve transaction timestamp
        id: clock
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          requested_cutoff="$(date -u +%Y-%m-%d)"
          echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
          echo "requested_cutoff=$requested_cutoff" >> "$GITHUB_OUTPUT"

  providers:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        market: [us, cn]
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve manifest-bound provider cache identity
        id: contract
        env:
          MARKET: ${{ matrix.market }}
          REQUESTED_CUTOFF: ${{ needs.prepare.outputs.requested_cutoff }}
        run: |
          set -euo pipefail
          python -m scripts.govern_formal_provider_cache contract \
            --root . --market "$MARKET" --start 2021-01-01 \
            --cutoff "$REQUESTED_CUTOFF" \
            --output "artifacts/formal-refresh/provider-${MARKET}-contract.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore exact scheduled provider cache
        if: github.event_name == 'schedule'
        id: provider_cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/formal-refresh/provider-${{ matrix.market }}
          key: ${{ steps.contract.outputs.cache_key }}-scheduled
      - name: Install locked provider environment
        if: github.event_name != 'schedule' || steps.provider_cache.outputs.cache-hit != 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Rebuild isolated selected-pool provider
        if: github.event_name != 'schedule' || steps.provider_cache.outputs.cache-hit != 'true'
        env:
          MARKET: ${{ matrix.market }}
          REQUESTED_CUTOFF: ${{ needs.prepare.outputs.requested_cutoff }}
        run: |
          set -euo pipefail
          rm -rf "artifacts/formal-refresh/provider-${MARKET}"
          uv run python scripts/data/refresh_selected_pool_prices_v2.py \
            --root . --market "$MARKET" --source-csv-dir data/csv_clean \
            --output-root "artifacts/formal-refresh/provider-${MARKET}" \
            --start 2021-01-01 --cutoff "$REQUESTED_CUTOFF" --max-rounds 3 --full-refresh
      - name: Seal fresh provider cache
        if: github.event_name != 'schedule' || steps.provider_cache.outputs.cache-hit != 'true'
        env:
          MARKET: ${{ matrix.market }}
        run: |
          python -m scripts.govern_formal_provider_cache seal \
            --provider-root "artifacts/formal-refresh/provider-${MARKET}" \
            --contract "artifacts/formal-refresh/provider-${MARKET}-contract.json" \
            --receipt "artifacts/formal-refresh/provider-${MARKET}/artifacts/formal-provider-cache-receipt.json"
      - name: Verify restored provider cache
        if: github.event_name == 'schedule' && steps.provider_cache.outputs.cache-hit == 'true'
        env:
          MARKET: ${{ matrix.market }}
        run: |
          python -m scripts.govern_formal_provider_cache verify \
            --provider-root "artifacts/formal-refresh/provider-${MARKET}" \
            --contract "artifacts/formal-refresh/provider-${MARKET}-contract.json" \
            --receipt "artifacts/formal-refresh/provider-${MARKET}/artifacts/formal-provider-cache-receipt.json"
      - name: Save exact scheduled provider cache
        if: github.event_name == 'schedule' && steps.provider_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/formal-refresh/provider-${{ matrix.market }}
          key: ${{ steps.contract.outputs.cache_key }}-scheduled
      - name: Transfer verified provider to refresh job
        uses: actions/upload-artifact@v4
        with:
          name: formal-provider-${{ matrix.market }}-${{ github.run_id }}
          path: artifacts/formal-refresh/provider-${{ matrix.market }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  refresh:
    needs: [prepare, providers]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json
      - name: Install locked publication environments
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
          cd qlib-dashboard
          npm ci
      - name: Download verified US provider
        uses: actions/download-artifact@v5
        with:
          name: formal-provider-us-${{ github.run_id }}
          path: artifacts/formal-refresh/provider-us
      - name: Download verified CN provider
        uses: actions/download-artifact@v5
        with:
          name: formal-provider-cn-${{ github.run_id }}
          path: artifacts/formal-refresh/provider-cn
      - name: Reverify transferred provider caches
        env:
          REQUESTED_CUTOFF: ${{ needs.prepare.outputs.requested_cutoff }}
        run: |
          set -euo pipefail
          for market in us cn; do
            python -m scripts.govern_formal_provider_cache contract \
              --root . --market "$market" --start 2021-01-01 \
              --cutoff "$REQUESTED_CUTOFF" \
              --output "artifacts/formal-refresh/provider-${market}-contract.json"
            python -m scripts.govern_formal_provider_cache verify \
              --provider-root "artifacts/formal-refresh/provider-${market}" \
              --contract "artifacts/formal-refresh/provider-${market}-contract.json" \
              --receipt "artifacts/formal-refresh/provider-${market}/artifacts/formal-provider-cache-receipt.json"
          done
      - name: Plan catalog-driven refresh
        id: plan
        env:
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
        run: |
          uv run python scripts/run_formal_refresh_transaction.py plan \
            --formal-root "$CURRENT_FORMAL_ROOT" \
            --us-provider-manifest artifacts/formal-refresh/provider-us/artifacts/selected_pool_price_refresh_manifest.json \
            --cn-provider-manifest artifacts/formal-refresh/provider-cn/artifacts/selected_pool_price_refresh_manifest.json \
            --generated-at "$GENERATED_AT" \
            --output artifacts/formal-refresh/plan.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Initialize isolated candidate publication tree
        if: steps.plan.outputs.refresh_required == 'true'
        run: |
          uv run python scripts/run_formal_refresh_transaction.py initialize \
            --current-root "$CURRENT_FORMAL_ROOT" \
            --candidate-root "$CANDIDATE_FORMAL_ROOT"
      - name: Refresh QQQ Rotation v4.3 append-only
        if: steps.plan.outputs.refresh_required == 'true' && contains(steps.plan.outputs.stale_model_ids, 'qqqi_qqq_tqqq_v4_3')
        env:
          US_CUTOFF: ${{ steps.plan.outputs.us_cutoff }}
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
        run: |
          set -euo pipefail
          uv run python scripts/data/build_etf_reference_bundle.py \
            --end-date "$US_CUTOFF" \
            --output-root artifacts/formal-refresh/qqq-bundle \
            --require-professional
          uv run python scripts/refresh_qqq_v4_3_formal.py \
            --current-package "$CURRENT_FORMAL_ROOT/qqqi_qqq_tqqq_v4_3.json" \
            --bundle-dir artifacts/formal-refresh/qqq-bundle \
            --cutoff "$US_CUTOFF" \
            --generated-at "$GENERATED_AT" \
            --output "$CANDIDATE_FORMAL_ROOT/qqqi_qqq_tqqq_v4_3.json"
      - name: Reproduce and refresh US x1.1 twice
        if: steps.plan.outputs.refresh_required == 'true' && contains(steps.plan.outputs.stale_model_ids, 'us_x1_1')
        env:
          US_CUTOFF: ${{ steps.plan.outputs.us_cutoff }}
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          source = Path('configs/research_paradigms/us_x1_1_frozen_v1.yaml')
          payload = yaml.safe_load(source.read_text(encoding='utf-8'))
          payload['walk_forward']['test_end'] = os.environ['US_CUTOFF']
          target = Path('artifacts/formal-refresh/us_x1_1_refresh.yaml')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(yaml.safe_dump(payload, sort_keys=False), encoding='utf-8')
          PY
          pids=()
          for suffix in a b; do
            uv run python scripts/run_us_feature_quality_validation.py \
              --spec artifacts/formal-refresh/us_x1_1_refresh.yaml \
              --provider-uri artifacts/formal-refresh/provider-us/data/providers/us \
              --output-dir "artifacts/formal-refresh/us-run-${suffix}" \
              > "artifacts/formal-refresh/us-run-${suffix}.log" 2>&1 &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          cat artifacts/formal-refresh/us-run-a.log artifacts/formal-refresh/us-run-b.log
          test "$status" -eq 0
          RUN_A="$(find artifacts/formal-refresh/us-run-a -name walk_forward_windows.json -printf '%h\n' | head -n 1)"
          RUN_B="$(find artifacts/formal-refresh/us-run-b -name walk_forward_windows.json -printf '%h\n' | head -n 1)"
          test -n "$RUN_A" && test -n "$RUN_B"
          uv run python scripts/refresh_ranker_formal.py us \
            --current-package "$CURRENT_FORMAL_ROOT/us_x1_1.json" \
            --run-a "$RUN_A" --run-b "$RUN_B" \
            --calendar artifacts/formal-refresh/provider-us/data/providers/us/calendars/day.txt \
            --provider-manifest artifacts/formal-refresh/provider-us/artifacts/selected_pool_price_refresh_manifest.json \
            --cutoff "$US_CUTOFF" --generated-at "$GENERATED_AT" \
            --output "$CANDIDATE_FORMAL_ROOT/us_x1_1.json"
      - name: Reproduce and refresh CN x1.1 twice
        if: steps.plan.outputs.refresh_required == 'true' && contains(steps.plan.outputs.stale_model_ids, 'cn_x1_1')
        env:
          CN_CUTOFF: ${{ steps.plan.outputs.cn_cutoff }}
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
        run: |
          set -euo pipefail
          pids=()
          for suffix in a b; do
            uv run python scripts/run_cn130_ranking_batch.py \
              --root . \
              --provider-dir artifacts/formal-refresh/provider-cn/data/providers/cn \
              --output-dir "artifacts/formal-refresh/cn-ledger-${suffix}" \
              --window 2026H2_PARTIAL --batch r0r1 \
              > "artifacts/formal-refresh/cn-ledger-${suffix}.log" 2>&1 &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          cat artifacts/formal-refresh/cn-ledger-a.log artifacts/formal-refresh/cn-ledger-b.log
          test "$status" -eq 0
          LEDGER_A="artifacts/formal-refresh/cn-ledger-a/score_ledgers/2026H2_PARTIAL__r0_cn_x1_0_raw_return_rank__current_cn_ohlcv.csv.gz"
          LEDGER_B="artifacts/formal-refresh/cn-ledger-b/score_ledgers/2026H2_PARTIAL__r0_cn_x1_0_raw_return_rank__current_cn_ohlcv.csv.gz"
          test -f "$LEDGER_A" && test -f "$LEDGER_B"
          uv run python scripts/refresh_ranker_formal.py cn \
            --repository-root . \
            --current-package "$CURRENT_FORMAL_ROOT/cn_x1_1.json" \
            --provider-dir artifacts/formal-refresh/provider-cn/data/providers/cn \
            --provider-manifest artifacts/formal-refresh/provider-cn/artifacts/selected_pool_price_refresh_manifest.json \
            --ledger-a "$LEDGER_A" --ledger-b "$LEDGER_B" \
            --cutoff "$CN_CUTOFF" --generated-at "$GENERATED_AT" \
            --output "$CANDIDATE_FORMAL_ROOT/cn_x1_1.json"
      - name: Extend canonical inputs and refresh BYD v1.3
        if: steps.plan.outputs.refresh_required == 'true' && contains(steps.plan.outputs.stale_model_ids, 'byd_v1_3_recovery_event_low_vol_confirmation_v1')
        env:
          CN_CUTOFF: ${{ steps.plan.outputs.cn_cutoff }}
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/formal-refresh/input/byd artifacts/formal-refresh/input/515180
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/formal-refresh/input/byd
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > artifacts/formal-refresh/515180.zip
          unzip -q artifacts/formal-refresh/515180.zip -d artifacts/formal-refresh/input/515180
          uv run python scripts/refresh_byd_v1_3_formal.py \
            --current-package "$CURRENT_FORMAL_ROOT/byd_v1_3_recovery_event_low_vol_confirmation_v1.json" \
            --predecessor-package "$CURRENT_FORMAL_ROOT/byd_v1_2_convex_momentum_budget_v1.json" \
            --base-byd-dir artifacts/formal-refresh/input/byd \
            --base-etf-dir artifacts/formal-refresh/input/515180 \
            --shadow-store data/research/byd_prospective_shadow \
            --paired-store data/research/byd_515180_prospective \
            --signal-ledger data/research/strategy_signal_ledgers/byd_v1_3_recovery_event_low_vol_confirmation_v1 \
            --cutoff "$CN_CUTOFF" --generated-at "$GENERATED_AT" \
            --output "$CANDIDATE_FORMAL_ROOT/byd_v1_3_recovery_event_low_vol_confirmation_v1.json"
      - name: Seal formal v1 and build Bundle v2
        if: steps.plan.outputs.refresh_required == 'true'
        env:
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
        run: |
          set -euo pipefail
          uv run python scripts/run_formal_refresh_transaction.py finalize \
            --current-root "$CURRENT_FORMAL_ROOT" \
            --candidate-root "$CANDIDATE_FORMAL_ROOT" \
            --us-provider-manifest artifacts/formal-refresh/provider-us/artifacts/selected_pool_price_refresh_manifest.json \
            --cn-provider-manifest artifacts/formal-refresh/provider-cn/artifacts/selected_pool_price_refresh_manifest.json \
            --generated-at "$GENERATED_AT" --receipt "$REFRESH_RECEIPT"
          rm -rf "$CANDIDATE_V2_ROOT"
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root "$CANDIDATE_FORMAL_ROOT" \
            --output-root "$CANDIDATE_V2_ROOT" \
            --receipt artifacts/formal-refresh/formal-v2-sync-receipt.json
          uv run python scripts/verify_formal_backtest_freshness.py \
            --root "$CANDIDATE_FORMAL_ROOT" --as-of "$GENERATED_AT" \
            --receipt artifacts/formal-refresh/freshness-verification.json
      - name: Build shared governed Market Evidence
        if: steps.plan.outputs.refresh_required == 'true'
        run: |
          set -euo pipefail
          rm -rf "$CANDIDATE_MARKET_EVIDENCE_ROOT"
          uv run python scripts/build_market_evidence.py \
            --market us --provider-root artifacts/formal-refresh/provider-us \
            --formal-root "$CANDIDATE_FORMAL_ROOT" \
            --output-root "$CANDIDATE_MARKET_EVIDENCE_ROOT" \
            --reuse-root data/research/market_evidence \
            > artifacts/formal-refresh/market-evidence-us.log 2>&1 &
          us_pid="$!"
          uv run python scripts/build_market_evidence.py \
            --market cn --provider-root artifacts/formal-refresh/provider-cn \
            --formal-root "$CANDIDATE_FORMAL_ROOT" \
            --output-root "$CANDIDATE_MARKET_EVIDENCE_ROOT" \
            --reuse-root data/research/market_evidence \
            > artifacts/formal-refresh/market-evidence-cn.log 2>&1 &
          cn_pid="$!"
          status=0
          wait "$us_pid" || status=1
          wait "$cn_pid" || status=1
          cat artifacts/formal-refresh/market-evidence-us.log artifacts/formal-refresh/market-evidence-cn.log
          test "$status" -eq 0
      - name: Install candidate and rebuild Strategy Operations
        if: steps.plan.outputs.refresh_required == 'true'
        env:
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
        run: |
          set -euo pipefail
          rm -rf data/research/formal_backtests data/research/formal_model_runs data/research/market_evidence
          cp -a "$CANDIDATE_FORMAL_ROOT" data/research/formal_backtests
          cp -a "$CANDIDATE_V2_ROOT" data/research/formal_model_runs
          cp -a "$CANDIDATE_MARKET_EVIDENCE_ROOT" data/research/market_evidence
          cp "$REFRESH_RECEIPT" data/research/formal_backtests/latest_refresh_receipt.json
          uv run python scripts/build_strategy_operations.py \
            --formal-catalog data/research/formal_model_runs/catalog.json \
            --ledger-root data/research/strategy_signal_ledgers \
            --generated-at "$GENERATED_AT" \
            --output data/research/strategy_operations/snapshots.json
          cd qlib-dashboard
          npm run sync:formal-model-runs
          npm run sync:market-evidence
          npm run sync:strategy-operations
      - name: Validate complete candidate publication
        if: steps.plan.outputs.refresh_required == 'true'
        run: |
          set -euo pipefail
          uv run pytest \
            tests/test_formal_refresh.py \
            tests/test_refresh_byd_v1_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_market_evidence.py \
            tests/test_formal_backtest_freshness.py \
            tests/test_sync_formal_bundle_v2.py \
            tests/test_strategy_operations.py \
            tests/test_model_x1_baselines.py \
            -q --strict-markers --tb=short
          uv run python scripts/check_repository_model_runs.py
          cd qlib-dashboard
          npm run lint
          npx tsc --noEmit
          npm test -- --run
          npm run build
          test -f dist/data/formal-model-runs/catalog.json
          test -f dist/data/market-evidence/us/catalog.json
          test -f dist/data/market-evidence/cn/catalog.json
          test -f dist/data/strategy-operations/snapshots.json
          test ! -e dist/data/formal-backtests
      - name: Open or update reviewed refresh PR
        id: pull_request
        if: steps.plan.outputs.refresh_required == 'true'
        env:
          GENERATED_AT: ${{ needs.prepare.outputs.generated_at }}
          US_CUTOFF: ${{ steps.plan.outputs.us_cutoff }}
          CN_CUTOFF: ${{ steps.plan.outputs.cn_cutoff }}
        run: |
          set -euo pipefail
          git config user.name "AlphaEngine Formal Refresh Agent"
          git config user.email "formal-refresh-agent@alphaengine.local"
          git checkout -B "$REFRESH_BRANCH"
          git add \
            data/research/formal_backtests \
            data/research/formal_model_runs \
            data/research/market_evidence \
            data/research/strategy_operations/snapshots.json \
            qlib-dashboard/public/data/formal-model-runs \
            qlib-dashboard/public/data/market-evidence \
            qlib-dashboard/public/data/strategy-operations
          if git diff --cached --quiet; then
            echo "No publication bytes changed after refresh validation."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh governed evidence through US ${US_CUTOFF} and CN ${CN_CUTOFF}"
          git push --force origin "HEAD:${REFRESH_BRANCH}"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          ## Reviewed formal + market evidence refresh

          - US latest completed common session: \`${US_CUTOFF}\`
          - CN latest completed common session: \`${CN_CUTOFF}\`
          - Generated at: \`${GENERATED_AT}\`
          - Accepted model membership: derived from the formal catalog
          - QQQ formal model: QQQ Rotation v4.3 append-only
          - BYD formal model: BYD v1.3 append-only
          - Historical reports, positions and trades: immutable prefix verified
          - Formal v1, Bundle v2, Market Evidence and Strategy Operations: one reviewed publication
          - Model selection: not reopened
          - Protected merge: all candidate PR checks must pass before explicit squash merge
          - Pages publication: explicit workflow dispatch is pinned to the reviewed merge SHA and must pass live acceptance before operating status becomes current
          - Research only: true
          - Trade ready: false
          EOF
          existing="$(gh pr list --head "$REFRESH_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" \
              --title "data: refresh governed evidence through US ${US_CUTOFF} / CN ${CN_CUTOFF}" \
              --body-file "$body_file"
            gh pr ready --undo "$existing" || true
            number="$existing"
          else
            gh pr create --base main --head "$REFRESH_BRANCH" --draft \
              --title "data: refresh governed evidence through US ${US_CUTOFF} / CN ${CN_CUTOFF}" \
              --body-file "$body_file"
            number="$(gh pr list --head "$REFRESH_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          fi
          test -n "$number"
          echo "pr_number=$number" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for candidate checks, merge reviewed refresh, and verify Pages
        id: release
        if: steps.pull_request.outputs.pr_number != ''
        timeout-minutes: 120
        env:
          PR_NUMBER: ${{ steps.pull_request.outputs.pr_number }}
          CANDIDATE_SHA: ${{ steps.pull_request.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          before_run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow formal-backtest-refresh-ci.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // 0')"
          echo "Dispatching candidate contract validation for ${CANDIDATE_SHA}."
          gh workflow run formal-backtest-refresh-ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$REFRESH_BRANCH" \
            -f "candidate_sha=${CANDIDATE_SHA}" \
            -f "pr_number=${PR_NUMBER}"
          validation_run=""
          for attempt in $(seq 1 30); do
            validation_run="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow formal-backtest-refresh-ci.yml \
              --branch "$REFRESH_BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${CANDIDATE_SHA}\" and .databaseId > ${before_run_id}) | .databaseId" \
              | head -n 1)"
            if [[ -n "$validation_run" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$validation_run" ]]; then
            echo "Candidate validation run did not appear for ${CANDIDATE_SHA}." >&2
            exit 1
          fi
          echo "Watching candidate validation run ${validation_run}."
          gh run watch "$validation_run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          validation_conclusion="$(gh run view "$validation_run" \
            --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          test "$validation_conclusion" = "success"
          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          if [[ "$state" == "CLOSED" ]]; then
            echo "Reviewed refresh PR closed without merge." >&2
            exit 1
          fi
          if [[ "$state" != "MERGED" ]]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash
          fi
          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          test "$state" = "MERGED"
          merge_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$merge_sha"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$merge_sha" ]]; then
            echo "main moved after reviewed refresh merge: expected ${merge_sha}, got ${current_main}." >&2
            exit 1
          fi
          echo "Reviewed refresh merged at ${merge_sha}; dispatching exact SHA to Pages."
          dispatch_payload="$(mktemp)"
          jq -nc --arg target_sha "$merge_sha" \
            '{ref:"main",inputs:{target_sha:$target_sha}}' > "$dispatch_payload"
          pages_run="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            --input "$dispatch_payload" \
            --jq '.workflow_run_id // empty')"
          if [[ -z "$pages_run" ]]; then
            echo "Pages dispatch did not return a workflow run id for ${merge_sha}." >&2
            exit 1
          fi
          echo "pages_run_id=$pages_run" >> "$GITHUB_OUTPUT"
          echo "Watching Pages run ${pages_run} for reviewed merge ${merge_sha}."
          gh run watch "$pages_run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          pages_conclusion="$(gh run view "$pages_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          test "$pages_conclusion" = "success"
      - name: Upsert refresh operating status
        if: always()
        uses: actions/github-script@v8
        env:
          REFRESH_REQUIRED: ${{ steps.plan.outputs.refresh_required }}
          PR_NUMBER: ${{ steps.pull_request.outputs.pr_number }}
          US_CUTOFF: ${{ steps.plan.outputs.us_cutoff }}
          CN_CUTOFF: ${{ steps.plan.outputs.cn_cutoff }}
          REVIEWED_MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
          PAGES_RUN_ID: ${{ steps.release.outputs.pages_run_id }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const marker = '<!-- reviewed-formal-backtest-refresh -->';
            const failed = process.env.JOB_STATUS !== 'success';
            const prNumber = process.env.PR_NUMBER || '';
            const mergeSha = process.env.REVIEWED_MERGE_SHA || '';
            const pagesRunId = process.env.PAGES_RUN_ID || '';
            const status = failed ? 'blocked' : 'current';
            const body = [
              marker,
              '',
              `## 正式回测与市场证据刷新：${status}`,
              '',
              `- US common cutoff: \`${process.env.US_CUTOFF || 'unresolved'}\``,
              `- CN common cutoff: \`${process.env.CN_CUTOFF || 'unresolved'}\``,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Review PR: ${prNumber ? `#${prNumber}` : 'none'}`,
              `- Reviewed merge SHA: ${mergeSha ? `\`${mergeSha}\`` : 'none'}`,
              `- Pages acceptance run: ${pagesRunId ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${pagesRunId}` : 'none'}`,
              '- Formal + Market Evidence transaction: one reviewed publication',
              '- Model selection reopened: no',
              '- Automatic merge: only after required PR checks pass',
              '- Pages live acceptance: required before current/closed status',
              '- Research only: yes',
              '- Trade ready: no',
              '',
              failed
                ? 'The refresh failed closed before the complete reviewed publication and live Pages acceptance transaction finished.'
                : 'Accepted formal evidence, Market Evidence, Strategy Operations and live Pages match the latest provider-resolved common sessions.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) =>
              !issue.pull_request && String(issue.body || '').includes(marker)
            );
            const desiredState = status === 'current' ? 'closed' : 'open';
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: `[运行健康] 正式回测与市场证据刷新：${status}`,
                body,
                state: desiredState,
              });
            } else if (status !== 'current') {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[运行健康] 正式回测与市场证据刷新：${status}`,
                body,
                assignees: [context.repo.owner],
              });
            }
      - name: Upload bounded refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-backtest-refresh-${{ github.run_id }}
          path: |
            artifacts/formal-refresh/plan.json
            artifacts/formal-refresh/formal-refresh-receipt.json
            artifacts/formal-refresh/formal-v2-sync-receipt.json
            artifacts/formal-refresh/freshness-verification.json
            artifacts/formal-refresh/provider-us/artifacts/selected_pool_price_refresh_manifest.json
            artifacts/formal-refresh/provider-cn/artifacts/selected_pool_price_refresh_manifest.json
            artifacts/formal-refresh/market-evidence/us/catalog.json
            artifacts/formal-refresh/market-evidence/cn/catalog.json
            artifacts/formal-refresh/qqq-bundle/bundle_manifest.json
            artifacts/formal-refresh/qqq-bundle/coverage.csv
            artifacts/formal-refresh/qqq-bundle/reconciliation.csv
          if-no-files-found: warn
          retention-days: 30
