name: Apply bounded provider retry patch

on:
  push:
    branches: [fix/pool-level-provider-retry]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pool-level-provider-retry
          fetch-depth: 1
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/data/refresh_selected_pool_prices.py')
          text = path.read_text(encoding='utf-8')
          old = 'INCOMPLETE_CUTOFF_RETRY_SECONDS = 30.0\n'
          new = 'INCOMPLETE_CUTOFF_RETRY_SECONDS = 2.0\n'
          if text.count(old) != 1:
              raise SystemExit('expected retry constant exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/patch-pool-retry.yml')
          workflow.unlink()
          PY
          git config user.name "AlphaEngine Maintenance Agent"
          git config user.email "maintenance-agent@alphaengine.local"
          git add scripts/data/refresh_selected_pool_prices.py .github/workflows/patch-pool-retry.yml
          git diff --cached --check
          git commit -m "fix(data): bound completed-cutoff retry waits"
          git push origin HEAD:fix/pool-level-provider-retry
