name: US x1.1 Sector Style Attribution

on:
  pull_request:
    branches:
      - main
    paths:
      - "configs/research_classifications/us87_sector_industry_v1.yaml"
      - "src/research/us87_sector_style.py"
      - "scripts/run_us_x1_1_sector_style_attribution.py"
      - "tests/test_us_x1_1_sector_style_attribution.py"
      - ".github/workflows/us-x1-1-sector-style-attribution.yml"
      - "docs/research/us_x1_1_sector_style_attribution_result_2026-08-03.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: us-x1-1-sector-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate classification and attribution contract
        run: |
          uv run ruff check \
            src/research/us87_sector_style.py \
            scripts/run_us_x1_1_sector_style_attribution.py \
            tests/test_us_x1_1_sector_style_attribution.py
          uv run mypy \
            src/research/us87_sector_style.py \
            scripts/run_us_x1_1_sector_style_attribution.py
          uv run pytest \
            tests/test_us_x1_1_sector_style_attribution.py \
            tests/test_us_x1_1_drawdown_attribution_phase_a.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Download frozen provider
        uses: actions/download-artifact@v4
        with:
          name: us-raw-adjustment-contract-30742690159
          path: artifacts/source/provider
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: liuh886/alpha_engine
          run-id: 30742690159
      - name: Download deterministic US x1.1 ledgers
        uses: actions/download-artifact@v4
        with:
          name: us-x1-1-deterministic-reproduction-30743067256
          path: artifacts/source/reproduction
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: liuh886/alpha_engine
          run-id: 30743067256
      - name: Run sector, style and drawdown attribution
        run: >-
          uv run python scripts/run_us_x1_1_sector_style_attribution.py
          --provider-uri artifacts/source/provider/provider_a/data/providers/us
          --score-ledger-root artifacts/source/reproduction/evidence/us_x1_1_deterministic_reproduction_v1/ledgers/a
          --reproduction-result artifacts/source/reproduction/evidence/us_x1_1_deterministic_reproduction_v1/deterministic_reproduction.json
          --output-dir artifacts/evidence/us_x1_1_sector_style_attribution_v1
      - name: Verify governed evidence
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/evidence/us_x1_1_sector_style_attribution_v1")
          payload = json.loads((root / "sector_style_attribution.json").read_text(encoding="utf-8"))
          assert payload["provider_identity_sha256"] == "5c09d0fbc8348e182ce8829c44d43d96aaae4ed8a2c2ba8901e69034a7c6aa95"
          assert payload["pool_count"] == 87
          assert payload["classification"]["manifest"]["candidate_count"] == 87
          assert len(payload["baseline_reproduction_checks"]) == 4
          assert all(row["status"] == "exact_within_1e-6" for row in payload["baseline_reproduction_checks"])
          assert payload["mechanism_2025H1"]["decision"]["decision"] in {
              "sector_concentration_dominated",
              "market_style_exposure_dominated",
              "mixed_sector_style_regime",
              "broad_cross_sector_style_shock",
              "data_blocked",
          }
          assert payload["governance"]["automatic_model_update"] is False
          assert payload["governance"]["creates_us_x1_2_candidate"] is False
          assert (root / "evidence_manifest.json").exists()
          print(json.dumps({
              "decision": payload["mechanism_2025H1"]["decision"],
              "drawdown": payload["mechanism_2025H1"]["drawdown_path"],
              "shock": payload["mechanism_2025H1"]["shock_split"],
              "sector_loss": payload["mechanism_2025H1"]["sector_loss"],
              "style_losses": payload["mechanism_2025H1"]["style_losses"],
              "window_summaries": payload["window_summaries"],
          }, indent=2))
          PY
      - name: Upload complete sector-style evidence
        uses: actions/upload-artifact@v4
        with:
          name: us-x1-1-sector-style-attribution-${{ github.run_id }}
          path: |
            artifacts/evidence/us_x1_1_sector_style_attribution_v1
            artifacts/source/provider/verification.json
            artifacts/source/reproduction/evidence/us_x1_1_deterministic_reproduction_v1/run_identity_manifest.json
          if-no-files-found: error
          retention-days: 90
