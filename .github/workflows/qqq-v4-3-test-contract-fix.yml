name: QQQ v4.3 Test Contract Fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqq-v4-3-test-contract-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Replace the superseded active QQQ test identity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_strategy_operations.py')
          text = path.read_text(encoding='utf-8')
          old = 'QQQ_MODEL = "qqqi_qqq_tqqq_v4_2"'
          new = 'QQQ_MODEL = "qqqi_qqq_tqqq_v4_3"'
          if old not in text:
              raise SystemExit('superseded QQQ_MODEL test identity not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '"experiment_id": "qqqi_qqq_tqqq_vxn_bridge_v4_2",',
              '"model_id": QQQ_MODEL,',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit test contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_strategy_operations.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: make v4.3 the active QQQ operations identity"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
