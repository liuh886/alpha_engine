name: BYD V1.3 Recovery Overlay

on:
  pull_request:
    branches: [main]
    paths:
      - "data/research/byd_canonical_v1_snapshot.tar.xz"
      - "src/research/byd_v1_3_recovery_overlay.py"
      - "scripts/run_byd_v1_3_recovery_overlay.py"
      - "configs/research_paradigms/byd_v1_3_recovery_overlay.yaml"
      - "tests/test_byd_v1_3_recovery_overlay.py"
      - "docs/research/byd_v1_3_recovery_overlay.md"
      - "docs/evidence/byd_v1_3_recovery_overlay/**"
      - ".github/workflows/byd-v1-3-recovery-overlay.yml"
  push:
    branches: [main]
    paths:
      - "data/research/byd_canonical_v1_snapshot.tar.xz"
      - "src/research/byd_v1_3_recovery_overlay.py"
      - "scripts/run_byd_v1_3_recovery_overlay.py"
      - "configs/research_paradigms/byd_v1_3_recovery_overlay.yaml"
      - "tests/test_byd_v1_3_recovery_overlay.py"
      - "docs/research/byd_v1_3_recovery_overlay.md"
      - "docs/evidence/byd_v1_3_recovery_overlay/**"
      - ".github/workflows/byd-v1-3-recovery-overlay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Verify immutable canonical snapshot
        run: >-
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz"
          | sha256sum --check --strict
      - name: Ruff V1.3 research
        run: >-
          uv run ruff check
          src/research/byd_v1_3_recovery_overlay.py
          scripts/run_byd_v1_3_recovery_overlay.py
          tests/test_byd_v1_3_recovery_overlay.py
      - name: Run V1.3 contract tests
        run: >-
          uv run pytest tests/test_byd_v1_3_recovery_overlay.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Extract immutable canonical snapshot
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          mkdir -p artifacts/data/byd_canonical_v1
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz \
            -C artifacts/data/byd_canonical_v1
      - name: Run frozen V1.3 research
        run: >-
          uv run python scripts/run_byd_v1_3_recovery_overlay.py
          --canonical-dir artifacts/data/byd_canonical_v1
          --contract configs/research_paradigms/byd_v1_3_recovery_overlay.yaml
          --output-dir artifacts/research/byd_v1_3_recovery_overlay
      - name: Upload V1.3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byd-v1-3-recovery-overlay-evidence
          path: |
            data/research/byd_canonical_v1_snapshot.tar.xz
            artifacts/data/byd_canonical_v1/manifest.json
            artifacts/data/byd_canonical_v1/quarantined_open_dates.csv
            artifacts/research/byd_v1_3_recovery_overlay
          if-no-files-found: error
          retention-days: 30
