name: Frontend Static PWA

on:
  pull_request:
    paths:
      - 'qlib-dashboard/**'
      - 'data/research/formal_backtests/**'
      - 'Makefile'
      - 'pyproject.toml'
      - '.env.example'
      - 'src/common/runtime_settings.py'
      - 'scripts/check_legacy_web_boundary.py'
      - 'docs/architecture/legacy_web_inventory.json'
      - '.github/workflows/frontend-static-pwa.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-static-pwa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-static-pwa:
    runs-on: ubuntu-latest
    env:
      VITE_RUNTIME_MODE: static_artifact
      FORMAL_BACKTEST_VALIDATION_MODE: candidate
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize formal BYD v1.2 frontend source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('qlib-dashboard/src/pages/StrategyOperationsPage.tsx')
          text = page.read_text(encoding='utf-8')
          replacements = [
              ("  type BydSignalRecord,\n", ""),
              (
                  '          <Badge className="gap-1.5"><Activity className="h-3 w-3" /> BYD v1.2</Badge>\n          <Badge variant="outline">Research only</Badge>',
                  '          <Badge className="gap-1.5"><Activity className="h-3 w-3" /> BYD v1.2</Badge>\n          <Badge variant="secondary">Formal baseline</Badge>\n          <Badge variant="outline">Research only</Badge>',
              ),
              ('bydIndex.latestSignal.record.target_state_label', 'bydIndex.latestSignal.record.target_mode_label'),
              (
                  "Expansion: {bydIndex.latestSignal.record.expansion_active ? 'Active' : 'Inactive'}",
                  "Expansion: {bydIndex.latestSignal.record.expansion_active ? 'Active' : 'Inactive'} · financed {formatPercent(bydIndex.latestSignal.record.financed_increment, 2)}",
              ),
              ('<CardHeader><CardTitle className="text-base">Current allocation</CardTitle></CardHeader>', '<CardHeader><CardTitle className="text-base">Formal target allocation</CardTitle></CardHeader>'),
              (
                  "['Mom accel 20/60', formatNumber(bydIndex!.latestSignal!.record.factor_context.momentum_accel_20_60, 4)]",
                  "['Momentum 20d', formatPercent(bydIndex!.latestSignal!.record.factor_context.mom_20, 2)]",
              ),
              (
                  "['Open autocorr 20d', formatNumber(bydIndex!.latestSignal!.record.factor_context.open_return_autocorr_20, 4)]",
                  "['Momentum 60d', formatPercent(bydIndex!.latestSignal!.record.factor_context.mom_60, 2)]",
              ),
              (
                  "['Dist from 20d low', formatPercent(bydIndex!.latestSignal!.record.factor_context.distance_from_low_20)]",
                  "['Momentum scale', formatPercent(bydIndex!.latestSignal!.record.factor_context.momentum_scale, 2)]",
              ),
          ]
          for old, new in replacements:
              if new and new in text:
                  continue
              if old not in text:
                  raise RuntimeError(f'missing frontend promotion anchor: {old}')
              text = text.replace(old, new, 1)
          obsolete = ('BydSignalRecord', 'target_state_label', 'momentum_accel_20_60', 'open_return_autocorr_20', 'distance_from_low_20')
          if any(item in text for item in obsolete):
              raise RuntimeError('obsolete BYD frontend contract remains')
          page.write_text(text, encoding='utf-8')

          deploy = Path('.github/workflows/deploy-pages.yml')
          text = deploy.read_text(encoding='utf-8')
          node_pattern = re.compile(
              r"          const expected = new Set\(\['qqqi_qqq_tqqq_v4_2', 'us_x1_1', 'cn_x1_0', 'byd_dividend_sleeve_v1_0'\]\);\n"
              r"          if \(catalog\.records\.length !== 4\).*?"
              r"          if \(expected\.size\) throw new Error\(`missing formal versions: \$\{\[\.\.\.expected\]\.join\(', '\)\}`\);\n",
              re.S,
          )
          node_replacement = """          if (!Array.isArray(catalog.records) || catalog.records.length === 0) throw new Error('formal catalog is empty');
          const seen = new Set();
          for (const record of catalog.records) {
            if (!record.model_version_id || seen.has(record.model_version_id)) throw new Error(`duplicate formal version: ${record.model_version_id}`);
            seen.add(record.model_version_id);
            const manifestPath = path.join(root, record.manifest_path);
            if (!fs.existsSync(manifestPath)) throw new Error(`missing manifest: ${record.manifest_path}`);
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (manifest.bundle_id !== record.bundle_id) throw new Error(`bundle mismatch: ${record.model_version_id}`);
            if (manifest.publication_channel !== 'formal' || manifest.publication_status !== 'accepted_formal_baseline') throw new Error(`status mismatch: ${record.model_version_id}`);
            for (const section of manifest.sections) {
              if (section.availability_status !== 'available') continue;
              const sectionPath = path.join(path.dirname(manifestPath), section.path);
              if (!fs.existsSync(sectionPath)) throw new Error(`missing section: ${record.model_version_id}/${section.section_id}`);
            }
          }
"""
          text, count = node_pattern.subn(node_replacement, text, count=1)
          if count != 1 and node_replacement not in text:
              raise RuntimeError('missing deploy Node catalog validator anchor')
          python_pattern = re.compile(
              r"          assert \{row\['model_version_id'\] for row in catalog\['records'\]\} == \{\n"
              r"              'qqqi_qqq_tqqq_v4_2', 'us_x1_1', 'cn_x1_0', 'byd_dividend_sleeve_v1_0'\n"
              r"          \}\n"
          )
          python_replacement = """          model_ids = [row['model_version_id'] for row in catalog['records']]
          assert model_ids and len(model_ids) == len(set(model_ids))
"""
          text, count = python_pattern.subn(python_replacement, text, count=1)
          if count != 1 and python_replacement not in text:
              raise RuntimeError('missing deploy Python catalog validator anchor')
          deploy.write_text(text, encoding='utf-8')
          PY
          git checkout origin/main -- .github/workflows/frontend-static-pwa.yml
          git config user.name "AlphaEngine Release Agent"
          git config user.email "release-agent@alphaengine.local"
          git add qlib-dashboard/src/pages/StrategyOperationsPage.tsx .github/workflows/deploy-pages.yml .github/workflows/frontend-static-pwa.yml
          if git diff --cached --quiet; then
            echo "Frontend source is already current."
          else
            git commit -m "feat: expose formal BYD v1.2 operations and catalog-driven deploy"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify zero-server architecture boundary
        run: python scripts/check_legacy_web_boundary.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: qlib-dashboard
        run: npm ci

      - name: TypeScript
        working-directory: qlib-dashboard
        run: npx tsc --noEmit

      - name: Lint
        working-directory: qlib-dashboard
        run: npm run lint

      - name: Unit tests
        working-directory: qlib-dashboard
        run: npm test -- --run

      - name: Build static artifact studio
        working-directory: qlib-dashboard
        run: npm run build

      - name: Validate PWA output
        working-directory: qlib-dashboard
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/alpha-engine.svg
          grep -q "Alpha Engine Research Studio" dist/index.html
          grep -q '"display": "standalone"' dist/manifest.webmanifest

      - name: Bundle budget
        working-directory: qlib-dashboard
        run: npm run check:bundle-budget

      - name: Install Playwright Chromium
        working-directory: qlib-dashboard
        run: npx playwright install --with-deps chromium

      - name: Static browser acceptance
        working-directory: qlib-dashboard
        run: npx playwright test --config=playwright.static.config.ts

      - name: Upload static screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-engine-static-browser-evidence
          path: |
            qlib-dashboard/test-results/static-artifact
            qlib-dashboard/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: alpha-engine-static-pwa
          path: qlib-dashboard/dist
          if-no-files-found: error
          retention-days: 14
