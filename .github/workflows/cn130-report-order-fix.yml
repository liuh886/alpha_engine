name: CN130 Report Order Fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cn130-report-order-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/cn130-cross-sectional-ranking-v1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Add deterministic tie-break ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/aggregate_cn130_ranking_batches.py')
          text = script.read_text(encoding='utf-8')
          old = 'economic.loc[economic["cost_bps"] == 20].sort_values("compounded_relative_excess_return", ascending=False)'
          new = 'economic.loc[economic["cost_bps"] == 20].sort_values(["compounded_relative_excess_return", "ranking_id", "feature_family"], ascending=[False, True, True], kind="mergesort")'
          if old not in text:
              raise RuntimeError('expected report sort expression not found')
          script.write_text(text.replace(old, new), encoding='utf-8')

          report = Path('docs/research/cn130_cross_sectional_ranking_rotation_result_2026-08-04.md')
          text = report.read_text(encoding='utf-8')
          old_rows = '| r1_benchmark_relative_rank | current_cn_ohlcv | eligible | 20bps | 84.71% | 39.29% | 32.61% | -21.60% | 4/4 |\n| r0_cn_x1_0_raw_return_rank | current_cn_ohlcv | eligible | 20bps | 84.71% | 39.29% | 32.61% | -21.60% | 4/4 |'
          new_rows = '| r0_cn_x1_0_raw_return_rank | current_cn_ohlcv | eligible | 20bps | 84.71% | 39.29% | 32.61% | -21.60% | 4/4 |\n| r1_benchmark_relative_rank | current_cn_ohlcv | eligible | 20bps | 84.71% | 39.29% | 32.61% | -21.60% | 4/4 |'
          if old_rows not in text:
              raise RuntimeError('expected equal-return report rows not found')
          report.write_text(text.replace(old_rows, new_rows), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'AlphaEngine Research Agent'
          git config user.email 'research-agent@alphaengine.local'
          git add scripts/aggregate_cn130_ranking_batches.py docs/research/cn130_cross_sectional_ranking_rotation_result_2026-08-04.md
          git commit -m 'fix(research): stabilize CN130 equal-return report ordering'
          git push origin HEAD:research/cn130-cross-sectional-ranking-v1
