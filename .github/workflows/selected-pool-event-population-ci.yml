name: Selected Pool Event Population CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/selected-pool-event-population-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
      - "configs/data/selected_pool_event_population_v1.yaml"
      - "configs/providers/us_selected_equities_sec_cik_v3.yaml"
      - "src/data/selected_pool_event_population.py"
      - "src/data/cn_selected_pool_event_sources.py"
      - "src/data/exact_frame_cache.py"
      - "src/data/fundamentals/**"
      - "src/data/corporate_actions/**"
      - "scripts/data/populate_selected_pool_events.py"
      - "scripts/data/build_us_selected_sec_mapping.py"
      - "tests/test_selected_pool_event_population.py"
      - "tests/test_cn_selected_pool_event_sources.py"
      - "tests/test_exact_frame_cache.py"
      - "tests/test_selected_pool_event_readiness.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/selected-pool-event-population-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
      - "configs/data/selected_pool_event_population_v1.yaml"
      - "configs/providers/us_selected_equities_sec_cik_v3.yaml"
      - "src/data/selected_pool_event_population.py"
      - "src/data/cn_selected_pool_event_sources.py"
      - "src/data/exact_frame_cache.py"
      - "scripts/data/populate_selected_pool_events.py"
      - "tests/test_selected_pool_event_population.py"
      - "tests/test_cn_selected_pool_event_sources.py"
      - "tests/test_exact_frame_cache.py"
      - "tests/test_selected_pool_event_readiness.py"
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:
    inputs:
      market:
        description: "Live market population"
        required: true
        default: "both"
        type: choice
        options: [us, cn, both]
      cutoff:
        description: "Evidence cutoff (YYYY-MM-DD)"
        required: true
        default: "2026-07-31"
        type: string

concurrency:
  group: selected-pool-event-population-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-uv
      - name: Ruff event population paths
        run: >-
          uv run ruff check
          src/data/selected_pool_event_population.py
          src/data/cn_selected_pool_event_sources.py
          src/data/exact_frame_cache.py
          src/data/fundamentals/sec_companyfacts.py
          src/data/fundamentals/ashare_public_financials.py
          src/data/fundamentals/tushare_financials.py
          src/data/corporate_actions/ashare_public_actions.py
          src/data/corporate_actions/yfinance_events.py
          src/data/corporate_actions/tiingo_events.py
          scripts/data/populate_selected_pool_events.py
          scripts/data/build_us_selected_sec_mapping.py
          tests/test_selected_pool_event_population.py
          tests/test_cn_selected_pool_event_sources.py
          tests/test_exact_frame_cache.py
          tests/test_selected_pool_event_readiness.py
      - name: Mypy event population paths
        run: >-
          uv run mypy --follow-imports=skip
          src/data/selected_pool_event_population.py
          src/data/cn_selected_pool_event_sources.py
          src/data/exact_frame_cache.py
          scripts/data/populate_selected_pool_events.py
      - name: Test event population and stores
        run: >-
          uv run pytest
          tests/test_selected_pool_event_population.py
          tests/test_cn_selected_pool_event_sources.py
          tests/test_exact_frame_cache.py
          tests/test_selected_pool_event_readiness.py
          tests/test_fundamental_event_store_contract.py
          tests/test_corporate_action_store_contract.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

  fixture-artifacts:
    if: github.event_name == 'pull_request'
    needs: contract
    strategy:
      matrix:
        market: [us, cn]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-uv
      - name: Build exact-pool fixture evidence
        run: >-
          uv run python scripts/data/populate_selected_pool_events.py
          --market "${{ matrix.market }}"
          --cutoff 2026-07-31
          --fixture
          --output-root "artifacts/data/event_population/${{ matrix.market }}"
      - name: Verify sealed selected-pool evidence
        run: >-
          uv run python scripts/data/populate_selected_pool_events.py
          --market "${{ matrix.market }}"
          --cutoff 2026-07-31
          --output-root "artifacts/data/event_population/${{ matrix.market }}"
          --verify-only
      - uses: actions/upload-artifact@v7
        with:
          name: selected-pool-event-fixture-${{ matrix.market }}-${{ github.run_id }}
          path: artifacts/data/event_population/${{ matrix.market }}
          if-no-files-found: error

  live-population:
    if: github.event_name != 'pull_request'
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        market: [us, cn]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Resolve requested market
        id: selected
        shell: bash
        run: |
          requested="${{ inputs.market || 'both' }}"
          if [[ "$requested" == "both" || "$requested" == "${{ matrix.market }}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.selected.outputs.run == 'true'
      - uses: ./.github/actions/setup-python-uv
        if: steps.selected.outputs.run == 'true'
      - name: Restore exact-cutoff event source snapshots
        if: steps.selected.outputs.run == 'true' && matrix.market == 'cn'
        id: event-source-cache
        uses: actions/cache/restore@v6
        with:
          path: artifacts/cache/selected_pool_events/cn
          key: >-
            ${{ runner.os }}-selected-pool-events-cn-v2-generation-${{ hashFiles('configs/research_universes/cn_selected_equities_v3.yaml', 'configs/data/selected_pool_event_population_v1.yaml') }}-${{ inputs.cutoff || '2026-07-31' }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-selected-pool-events-cn-v2-generation-${{ hashFiles('configs/research_universes/cn_selected_equities_v3.yaml', 'configs/data/selected_pool_event_population_v1.yaml') }}-${{ inputs.cutoff || '2026-07-31' }}-
      - name: Populate public primary event stores
        if: steps.selected.outputs.run == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_EGRESS_MODE: ${{ vars.SEC_EGRESS_MODE || 'direct' }}
          SEC_EGRESS_PROXY_ID: ${{ vars.SEC_EGRESS_PROXY_ID || '' }}
          SEC_EGRESS_PROXY_URL: ${{ secrets.SEC_EGRESS_PROXY_URL || '' }}
        run: >-
          uv run python scripts/data/populate_selected_pool_events.py
          --market "${{ matrix.market }}"
          --start 2021-01-01
          --cutoff "${{ inputs.cutoff || '2026-07-31' }}"
          ${{ matrix.market == 'cn' && '--source-cache-root artifacts/cache/selected_pool_events/cn' || '' }}
          --output-root "artifacts/data/event_population/${{ matrix.market }}"
      - name: Save exact-cutoff event source snapshots
        if: always() && steps.selected.outputs.run == 'true' && matrix.market == 'cn'
        uses: actions/cache/save@v6
        with:
          path: artifacts/cache/selected_pool_events/cn
          key: ${{ steps.event-source-cache.outputs.cache-primary-key }}
      - name: Upload source-bound event evidence
        if: success() && steps.selected.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: selected-pool-event-live-${{ matrix.market }}-${{ github.run_id }}
          path: artifacts/data/event_population/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 90
