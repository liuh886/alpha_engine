name: QQQI v4.17 State Conditioned Action

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-v4-17-state-conditioned-action.yml"
      - "configs/research_paradigms/qqqi_tqqq_sgov_voo_state_conditioned_action_advantage_v4_17_research.yaml"
      - "src/research/v4_17_state_conditioned_action_advantage.py"
      - "scripts/run_qqqi_v4_17_state_conditioned_action_advantage.py"
      - "tests/test_v4_17_state_conditioned_action_advantage.py"
  workflow_dispatch:
    inputs:
      end_date:
        description: Optional exclusive market-data end date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint and test state-conditioned action research
        run: |
          uv run ruff check \
            src/research/v4_17_state_conditioned_action_advantage.py \
            scripts/run_qqqi_v4_17_state_conditioned_action_advantage.py \
            tests/test_v4_17_state_conditioned_action_advantage.py
          uv run pytest \
            tests/test_v4_17_state_conditioned_action_advantage.py \
            tests/test_v4_16_action_advantage_model.py \
            tests/test_v4_15_transition_event_discovery.py \
            tests/test_vxn_bridge_allocation_experiment.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Run governed state-conditioned evidence with bounded retry
        run: |
          for attempt in 1 2 3; do
            if uv run python scripts/run_qqqi_v4_17_state_conditioned_action_advantage.py \
              --end-date "${{ inputs.end_date }}" \
              --output-dir artifacts/evidence/qqqi_tqqq_sgov_voo_state_conditioned_action_advantage_v4_17_research; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            rm -rf artifacts/evidence/qqqi_tqqq_sgov_voo_state_conditioned_action_advantage_v4_17_research
            sleep $((attempt * 30))
          done
      - name: Upload evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-v4-17-state-conditioned-action-${{ github.run_id }}
          path: artifacts/evidence/qqqi_tqqq_sgov_voo_state_conditioned_action_advantage_v4_17_research
          if-no-files-found: error
          retention-days: 90
