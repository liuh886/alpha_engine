name: US x1.1 Drawdown Attribution Phase A

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_us_x1_1_drawdown_attribution_phase_a.py"
      - "scripts/run_us_x1_1_drawdown_attribution_phase_a_canonical.py"
      - "tests/test_us_x1_1_drawdown_attribution_phase_a.py"
      - ".github/workflows/us-x1-1-drawdown-attribution-phase-a.yml"
      - "docs/research/us_x1_1_drawdown_attribution_phase_a_result_2026-08-02.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: us-x1-1-drawdown-attribution-a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      evidence: ${{ steps.scope.outputs.evidence }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect evidence-affecting changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "evidence=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event.action }}" != "synchronize" ]]; then
            echo "evidence=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          after="${{ github.event.after }}"
          changed="$(git diff --name-only "$before" "$after")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(scripts/run_us_x1_1_drawdown_attribution_phase_a(_canonical)?\.py|tests/test_us_x1_1_drawdown_attribution_phase_a\.py)$'; then
            echo "evidence=true" >> "$GITHUB_OUTPUT"
          else
            echo "evidence=false" >> "$GITHUB_OUTPUT"
          fi

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate attribution contract
        run: |
          uv run ruff check \
            scripts/run_us_x1_1_drawdown_attribution_phase_a.py \
            scripts/run_us_x1_1_drawdown_attribution_phase_a_canonical.py \
            tests/test_us_x1_1_drawdown_attribution_phase_a.py
          uv run mypy \
            scripts/run_us_x1_1_drawdown_attribution_phase_a.py \
            scripts/run_us_x1_1_drawdown_attribution_phase_a_canonical.py
          uv run pytest \
            tests/test_us_x1_1_drawdown_attribution_phase_a.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1

  evidence:
    needs:
      - changes
      - contract
    if: needs.changes.outputs.evidence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Download frozen provider
        uses: actions/download-artifact@v4
        with:
          name: us-raw-adjustment-contract-30742690159
          path: artifacts/source/provider
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: liuh886/alpha_engine
          run-id: 30742690159
      - name: Download deterministic reproduction ledgers
        uses: actions/download-artifact@v4
        with:
          name: us-x1-1-deterministic-reproduction-30743067256
          path: artifacts/source/reproduction
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: liuh886/alpha_engine
          run-id: 30743067256
      - name: Align scores and run Phase A attribution
        run: >-
          uv run python scripts/run_us_x1_1_drawdown_attribution_phase_a_canonical.py
          --provider-uri artifacts/source/provider/provider_a/data/providers/us
          --source-score-ledger artifacts/source/reproduction/evidence/us_x1_1_deterministic_reproduction_v1/ledgers/a/2025H1/scores.csv
          --reproduction-result artifacts/source/reproduction/evidence/us_x1_1_deterministic_reproduction_v1/deterministic_reproduction.json
          --output-dir artifacts/evidence/us_x1_1_drawdown_attribution_phase_a_v1
      - name: Verify governed attribution output
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/evidence/us_x1_1_drawdown_attribution_phase_a_v1/drawdown_attribution_phase_a.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["provider_identity_sha256"] == "5c09d0fbc8348e182ce8829c44d43d96aaae4ed8a2c2ba8901e69034a7c6aa95"
          assert payload["source_model_score_identity_sha256"] == "3e4390f38615118ab3ae0218e0d4df7855a82654b829584db47520685b7b0301"
          assert payload["score_alignment"]["economic_rows"] <= payload["score_alignment"]["source_rows"]
          assert payload["baseline_reproduction_check"]["status"] == "exact_within_1e-6"
          assert payload["decision"]["decision"] in {
              "portfolio_control_path_supported",
              "drawdown_is_name_concentration_dominated",
              "drawdown_is_regime_exposure_dominated",
              "mixed_name_and_regime_drawdown",
          }
          assert payload["decision"]["automatic_model_update"] is False
          assert payload["governance"]["sector_analysis"] == "deferred_pending_governed_map_issue_366"
          print(json.dumps({
              "decision": payload["decision"],
              "score_alignment": payload["score_alignment"],
              "drawdown_path": payload["drawdown_path"],
              "top_negative_names": payload["contribution_attribution"]["top_negative_names"],
              "strategy_results": payload["strategy_results"],
          }, indent=2))
          PY
      - name: Upload complete attribution evidence
        uses: actions/upload-artifact@v4
        with:
          name: us-x1-1-drawdown-attribution-phase-a-${{ github.run_id }}
          path: |
            artifacts/evidence/us_x1_1_drawdown_attribution_phase_a_v1
            artifacts/source/provider/verification.json
            artifacts/source/reproduction/evidence/us_x1_1_deterministic_reproduction_v1/run_identity_manifest.json
          if-no-files-found: error
          retention-days: 90
