name: Apply Formal Provider Incremental Seed Fix

on:
  push:
    branches: [fix/formal-provider-incremental-seed]
    paths:
      - ".github/workflows/apply-formal-provider-incremental-seed.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/formal-provider-incremental-seed
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply bounded source edits
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/formal-backtest-refresh.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''      - name: Restore exact governed provider cache
        id: provider_cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/formal-refresh/provider-${{ matrix.market }}
          key: ${{ steps.contract.outputs.cache_key }}-governed
      - name: Install locked provider environment
        if: steps.provider_cache.outputs.cache-hit != 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Rebuild isolated selected-pool provider
        if: steps.provider_cache.outputs.cache-hit != 'true'
        env:
          MARKET: ${{ matrix.market }}
          REQUESTED_CUTOFF: ${{ matrix.market == 'us' && needs.prepare.outputs.us_cutoff || needs.prepare.outputs.cn_cutoff }}
        run: |
          rm -rf "artifacts/formal-refresh/provider-${MARKET}"
          uv run python scripts/data/refresh_selected_pool_prices_v2.py \\
            --root . --market "$MARKET" --source-csv-dir data/csv_clean \\
            --output-root "artifacts/formal-refresh/provider-${MARKET}" \\
            --start 2021-01-01 --cutoff "$REQUESTED_CUTOFF" --max-rounds 3 --full-refresh
'''
          new = '''      - name: Restore exact governed provider cache
        id: provider_cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/formal-refresh/provider-${{ matrix.market }}
          key: ${{ steps.contract.outputs.cache_key }}-governed
      - name: Restore latest governed provider seed
        if: steps.provider_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: artifacts/formal-refresh/provider-${{ matrix.market }}
          key: formal-provider-seed-${{ matrix.market }}-${{ github.run_id }}
          restore-keys: |
            formal-provider-1.0.0-${{ matrix.market }}-
      - name: Prepare governed provider seed
        id: provider_seed
        if: steps.provider_cache.outputs.cache-hit != 'true'
        env:
          MARKET: ${{ matrix.market }}
        run: |
          restored="artifacts/formal-refresh/provider-${MARKET}"
          seed="artifacts/formal-refresh/provider-${MARKET}-seed"
          if [ -d "$restored/data/csv_source" ]; then
            rm -rf "$seed"
            mv "$restored" "$seed"
            echo "source_csv_dir=$seed/data/csv_source" >> "$GITHUB_OUTPUT"
            echo "seed_source=governed_cache" >> "$GITHUB_OUTPUT"
          else
            echo "source_csv_dir=data/csv_clean" >> "$GITHUB_OUTPUT"
            echo "seed_source=repository_bootstrap" >> "$GITHUB_OUTPUT"
          fi
      - name: Install locked provider environment
        if: steps.provider_cache.outputs.cache-hit != 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Incrementally extend isolated selected-pool provider
        if: steps.provider_cache.outputs.cache-hit != 'true'
        env:
          MARKET: ${{ matrix.market }}
          REQUESTED_CUTOFF: ${{ matrix.market == 'us' && needs.prepare.outputs.us_cutoff || needs.prepare.outputs.cn_cutoff }}
          SOURCE_CSV_DIR: ${{ steps.provider_seed.outputs.source_csv_dir }}
        run: |
          rm -rf "artifacts/formal-refresh/provider-${MARKET}"
          args=(
            --root .
            --market "$MARKET"
            --source-csv-dir "$SOURCE_CSV_DIR"
            --output-root "artifacts/formal-refresh/provider-${MARKET}"
            --start 2021-01-01
            --cutoff "$REQUESTED_CUTOFF"
            --max-rounds 3
          )
          while IFS= read -r symbol; do
            args+=(--auxiliary-symbol "$symbol")
          done < <(python - <<'PY_AUX'
          import json
          import os
          from pathlib import Path

          market = os.environ["MARKET"]
          contract = json.loads(
              Path(f"artifacts/formal-refresh/provider-{market}-contract.json").read_text(
                  encoding="utf-8"
              )
          )
          for symbol in contract["auxiliary_symbols"]:
              print(symbol)
          PY_AUX
          )
          uv run python scripts/data/refresh_selected_pool_prices_v2.py "${args[@]}"
'''
          if text.count(old) != 1:
              raise SystemExit('formal provider workflow block did not match exactly once')
          workflow.write_text(text.replace(old, new), encoding='utf-8')

          cache = Path('src/artifacts/formal_provider_cache.py')
          text = cache.read_text(encoding='utf-8')
          old_mode = '        "refresh_mode": "full_refresh",\n'
          new_mode = '        "refresh_mode": "incremental_from_governed_seed",\n'
          if text.count(old_mode) != 1:
              raise SystemExit('provider cache refresh_mode did not match exactly once')
          cache.write_text(text.replace(old_mode, new_mode), encoding='utf-8')

          tests = Path('tests/test_formal_provider_cache.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              '        "refresh_mode": "full_refresh",\n',
              '        "refresh_mode": "incremental_from_governed_seed",\n',
              1,
          )
          marker = '    assert cache_key(contract).startswith("formal-provider-1.0.0-us-2026-08-07-")\n'
          addition = marker + '    assert contract["refresh_mode"] == "incremental_from_governed_seed"\n'
          if marker not in text:
              raise SystemExit('formal provider cache test marker missing')
          tests.write_text(text.replace(marker, addition, 1), encoding='utf-8')

          trigger_tests = Path('tests/test_formal_refresh_trigger_scope.py')
          text = trigger_tests.read_text(encoding='utf-8')
          addition = '''\n\ndef test_heavy_formal_refresh_reuses_latest_governed_provider_seed_incrementally() -> None:\n    text = WORKFLOW.read_text(encoding="utf-8")\n    assert "Restore latest governed provider seed" in text\n    assert "formal-provider-1.0.0-${{ matrix.market }}-" in text\n    assert "seed_source=governed_cache" in text\n    assert "Incrementally extend isolated selected-pool provider" in text\n    assert '--source-csv-dir "$SOURCE_CSV_DIR"' in text\n    assert "--full-refresh" not in text\n\n'''
          if 'def test_heavy_formal_refresh_reuses_latest_governed_provider_seed_incrementally' in text:
              raise SystemExit('provider seed trigger test already exists')
          trigger_tests.write_text(text + addition, encoding='utf-8')

          refresh_tests = Path('tests/test_refresh_selected_pool_prices.py')
          text = refresh_tests.read_text(encoding='utf-8')
          marker = '    assert payload["all_sources_current"] is False\n\n\ndef test_auxiliary_symbols_share_provider_without_entering_candidate_identity('
          replacement = '''    assert payload["all_sources_current"] is False\n    retained = pd.read_csv(output / "data" / "csv_source" / "000002.csv")\n    assert retained["date"].max() == "2021-01-05"\n    assert payload["before"]["000002"]["last_date"] == "2021-01-05"\n    assert payload["after"]["000002"]["last_date"] == "2021-01-05"\n\n\ndef test_auxiliary_symbols_share_provider_without_entering_candidate_identity('''
          if marker not in text:
              raise SystemExit('incremental stale retention test marker missing')
          refresh_tests.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Install locked test environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate bounded provider fix
        run: |
          uv run ruff check \
            src/artifacts/formal_provider_cache.py \
            tests/test_formal_provider_cache.py \
            tests/test_refresh_selected_pool_prices.py \
            tests/test_formal_refresh_trigger_scope.py
          uv run pytest \
            tests/test_formal_provider_cache.py \
            tests/test_refresh_selected_pool_prices.py \
            tests/test_formal_refresh_trigger_scope.py \
            -q --strict-markers --tb=short
      - name: Commit validated fix
        run: |
          git config user.name "AlphaEngine Repair"
          git config user.email "repair@alphaengine.local"
          git add \
            .github/workflows/formal-backtest-refresh.yml \
            src/artifacts/formal_provider_cache.py \
            tests/test_formal_provider_cache.py \
            tests/test_refresh_selected_pool_prices.py \
            tests/test_formal_refresh_trigger_scope.py
          git diff --cached --check
          git commit -m "fix: extend formal providers from governed history"
          git push origin HEAD:fix/formal-provider-incremental-seed
