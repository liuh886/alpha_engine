name: CN130 Regime Payload Bootstrap

on:
  pull_request:
    branches:
      - research/cn130-tail-factor-discovery-v1
    paths:
      - .github/cn130_regime_payload.part*
      - scripts/apply_cn130_regime_payload.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/cn130-regime-confidence-v1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify and apply payload
        run: python scripts/apply_cn130_regime_payload.py
      - name: Commit implementation and evidence
        run: |
          git config user.name 'AlphaEngine Research Agent'
          git config user.email 'research-agent@alphaengine.local'
          git add -A
          git commit -m 'research: execute CN130 regime confidence study'
          git push origin HEAD:research/cn130-regime-confidence-v1
