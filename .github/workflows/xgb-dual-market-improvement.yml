name: XGBoost Dual-Market Improvement Study

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/research_paradigms/xgb_dual_market_improvement_v1.yaml"
      - "configs/research_paradigms/xgb_dual_market_baseline_identity_v1.yaml"
      - "configs/research_paradigms/xgb_dual_market_diagnostic_v1.yaml"
      - "docs/research/xgb_dual_market_improvement_plan_2026-08-02.md"
      - "docs/research/xgb_dual_market_baseline_identity_2026-08-02.md"
      - "scripts/audit_xgb_baseline_provenance.py"
      - "scripts/build_xgb_dual_market_diagnostic.py"
      - "tests/test_xgb_dual_market_improvement_contract.py"
      - "tests/test_xgb_dual_market_baseline_identity.py"
      - "tests/test_xgb_dual_market_diagnostic.py"
      - ".github/workflows/xgb-dual-market-improvement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xgb-dual-market-improvement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-provenance-and-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint research and diagnostic contracts
        run: >-
          uv run ruff check
          scripts/audit_xgb_baseline_provenance.py
          scripts/build_xgb_dual_market_diagnostic.py
          tests/test_xgb_dual_market_improvement_contract.py
          tests/test_xgb_dual_market_baseline_identity.py
          tests/test_xgb_dual_market_diagnostic.py
      - name: Type-check research tools
        run: >-
          uv run mypy
          scripts/audit_xgb_baseline_provenance.py
          scripts/build_xgb_dual_market_diagnostic.py
      - name: Test research contract, identity and diagnosis
        run: >-
          uv run pytest
          tests/test_xgb_dual_market_improvement_contract.py
          tests/test_xgb_dual_market_baseline_identity.py
          tests/test_xgb_dual_market_diagnostic.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Audit current tree and full Git history
        run: >-
          uv run python scripts/audit_xgb_baseline_provenance.py
          --output artifacts/evidence/xgb_baseline_provenance_report.json
      - name: Build market-specific diagnostic report
        run: >-
          uv run python scripts/build_xgb_dual_market_diagnostic.py
          --output-dir artifacts/evidence/xgb_dual_market_diagnostic
      - name: Stage baseline identity evidence
        run: |
          mkdir -p artifacts/evidence/xgb_dual_market_baseline_identity
          cp configs/research_paradigms/xgb_dual_market_baseline_identity_v1.yaml \
            artifacts/evidence/xgb_dual_market_baseline_identity/
          cp configs/research_paradigms/xgb_dual_market_diagnostic_v1.yaml \
            artifacts/evidence/xgb_dual_market_baseline_identity/
          cp docs/research/xgb_dual_market_baseline_identity_2026-08-02.md \
            artifacts/evidence/xgb_dual_market_baseline_identity/
      - name: Upload provenance, identity and diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: xgb-baseline-diagnostic-${{ github.run_id }}
          path: |
            artifacts/evidence/xgb_baseline_provenance_report.json
            artifacts/evidence/xgb_dual_market_baseline_identity
            artifacts/evidence/xgb_dual_market_diagnostic
          if-no-files-found: error
          retention-days: 90
