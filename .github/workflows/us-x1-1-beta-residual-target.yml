name: US x1.1 Beta Residual Target

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/research/relative_return_target.py"
      - "scripts/run_us_x1_1_beta_residual_target.py"
      - "tests/test_relative_return_target.py"
      - "configs/models/us_x1_1.yaml"
      - "configs/research_experiments/us_x1_1_native_xgb_calibration_v1.yaml"
      - "configs/research_universes/us_selected_equities_v2.yaml"
      - ".github/workflows/us-x1-1-beta-residual-target.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: us-x1-1-beta-residual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate target and runner contracts
        run: |
          uv run ruff check \
            src/research/relative_return_target.py \
            scripts/run_us_x1_1_beta_residual_target.py \
            tests/test_relative_return_target.py
          uv run mypy \
            src/research/relative_return_target.py \
            scripts/run_us_x1_1_beta_residual_target.py
          uv run pytest \
            tests/test_relative_return_target.py \
            tests/test_us_x1_1_deterministic_reproduction.py \
            tests/test_xgb_native_calibration.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Download frozen deterministic provider artifact
        uses: actions/download-artifact@v4
        with:
          name: us-raw-adjustment-contract-30742690159
          path: artifacts/source/us_raw_adjustment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: liuh886/alpha_engine
          run-id: 30742690159
      - name: Verify provider identity and fixed pool source
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/source/us_raw_adjustment")
          verification = json.loads((root / "verification.json").read_text())
          assert verification["provider_identity"] == "5c09d0fbc8348e182ce8829c44d43d96aaae4ed8a2c2ba8901e69034a7c6aa95"
          assert verification["instrument_count"] == 88
          provider = root / "provider_a/data/providers/us/provider_manifest.json"
          assert provider.is_file(), provider
          PY
      - name: Run baseline and beta-residual target twice
        run: >-
          uv run python scripts/run_us_x1_1_beta_residual_target.py
          --provider-uri artifacts/source/us_raw_adjustment/provider_a/data/providers/us
          --output-dir artifacts/evidence/us_x1_1_beta_residual_target_v1
      - name: Verify governed experiment output
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/evidence/us_x1_1_beta_residual_target_v1/beta_residual_target_experiment.json")
          payload = json.loads(path.read_text())
          assert payload["fixed_pool"] == {
              "universe_id": "us_selected_equities_v2",
              "candidate_count": 87,
              "pool_external_claim": False,
          }
          assert payload["provider"]["matches_expected"] is True
          assert all(
              row["rank_identity"]
              for row in payload["naive_rank_invariance"]
          )
          assert all(
              row["baseline_repeat_match"] and row["residual_repeat_match"]
              for row in payload["identity_checks"]
          )
          assert all(row["targets_differ"] for row in payload["identity_checks"])
          allowed = {
              "beta_residual_target_supported",
              "relative_label_is_rank_equivalent",
              "beta_residual_reduces_risk_but_costs_too_much_alpha",
              "beta_residual_adds_no_value",
              "data_blocked",
          }
          assert payload["decision"]["decision"] in allowed
          print(json.dumps({
              "decision": payload["decision"],
              "baseline": payload["baseline"],
              "beta_residual": payload["beta_residual"],
              "selection_comparison": payload["selection_comparison"],
              "regime_attribution": payload["regime_attribution"],
          }, indent=2))
          PY
      - name: Upload complete experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: us-x1-1-beta-residual-target-${{ github.run_id }}
          path: |
            artifacts/evidence/us_x1_1_beta_residual_target_v1
            artifacts/source/us_raw_adjustment/verification.json
            artifacts/source/us_raw_adjustment/provider_a/artifacts/raw_adjustment_contract_manifest.json
            artifacts/source/us_raw_adjustment/provider_a/data/providers/us/provider_manifest.json
          if-no-files-found: error
          retention-days: 90
