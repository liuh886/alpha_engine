name: QQQI v4.2 State-2 Tail Experiment

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-v4-2-state2-tail-experiment.yml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_v4_2_state2_tail_diagnostics.yaml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_v4_2_risk_confirmation_v4_3_research.yaml"
      - "src/research/v4_2_state2_tail_experiment.py"
      - "src/research/v4_2_risk_confirmation_experiment.py"
      - "scripts/run_qqqi_v4_2_state2_tail_experiment.py"
      - "scripts/run_qqqi_v4_2_risk_confirmation_experiment.py"
      - "tests/test_v4_2_state2_tail_experiment.py"
      - "tests/test_v4_2_risk_confirmation_experiment.py"
      - "notebooks/19_qqqi_qqq_tqqq_v4_2_state2_tail_diagnostics.ipynb"
      - "notebooks/20_qqqi_qqq_tqqq_v4_2_risk_confirmation_ablation.ipynb"
  workflow_dispatch:
    inputs:
      end_date:
        description: Optional exclusive market-data end date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint and test state-2 research
        run: |
          uv run ruff check \
            src/research/v4_2_state2_tail_experiment.py \
            src/research/v4_2_risk_confirmation_experiment.py \
            scripts/run_qqqi_v4_2_state2_tail_experiment.py \
            scripts/run_qqqi_v4_2_risk_confirmation_experiment.py \
            tests/test_v4_2_state2_tail_experiment.py \
            tests/test_v4_2_risk_confirmation_experiment.py
          uv run pytest \
            tests/test_v4_2_state2_tail_experiment.py \
            tests/test_v4_2_risk_confirmation_experiment.py \
            tests/test_vxn_bridge_allocation_experiment.py \
            tests/test_vxn_leverage_overlay_experiment.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Build governed ETF bundle
        run: >-
          uv run python scripts/data/build_etf_reference_bundle.py
          --output-root artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
      - name: Run frozen state-2 tail experiment
        run: >-
          uv run python scripts/run_qqqi_v4_2_state2_tail_experiment.py
          --end-date "${{ inputs.end_date }}"
          --etf-data-bundle artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
          --output-dir
          artifacts/evidence/qqqi_qqq_tqqq_v4_2_state2_tail_diagnostics
      - name: Run risk-confirmation ablation
        run: >-
          uv run python scripts/run_qqqi_v4_2_risk_confirmation_experiment.py
          --end-date "${{ inputs.end_date }}"
          --etf-data-bundle artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
          --output-dir
          artifacts/evidence/qqqi_qqq_tqqq_v4_2_risk_confirmation_v4_3_research
      - name: Execute research notebooks
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          paths = [
              Path(
                  "notebooks/"
                  "19_qqqi_qqq_tqqq_v4_2_state2_tail_diagnostics.ipynb"
              ),
              Path(
                  "notebooks/"
                  "20_qqqi_qqq_tqqq_v4_2_risk_confirmation_ablation.ipynb"
              ),
          ]
          for path in paths:
              notebook = nbformat.read(path, as_version=4)
              executed = NotebookClient(
                  notebook,
                  timeout=900,
                  kernel_name="python3",
                  allow_errors=False,
              ).execute(cwd=".")
              for index, cell in enumerate(executed.cells):
                  if cell.cell_type != "code":
                      continue
                  if cell.get("execution_count") is None:
                      raise ValueError(f"unexecuted code cell: {path}:{index}")
                  for output in cell.get("outputs", []):
                      if output.get("output_type") == "error":
                          raise ValueError(
                              f"notebook error in {path}:{index}: {output}"
                          )
              nbformat.write(executed, path)
          PY
      - name: Upload evidence and executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-v4-2-state2-tail-${{ github.run_id }}
          path: |
            artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1/bundle_manifest.json
            artifacts/evidence/qqqi_qqq_tqqq_v4_2_state2_tail_diagnostics
            artifacts/evidence/qqqi_qqq_tqqq_v4_2_risk_confirmation_v4_3_research
            notebooks/19_qqqi_qqq_tqqq_v4_2_state2_tail_diagnostics.ipynb
            notebooks/20_qqqi_qqq_tqqq_v4_2_risk_confirmation_ablation.ipynb
          if-no-files-found: error
          retention-days: 90
