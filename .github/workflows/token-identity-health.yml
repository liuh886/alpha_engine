name: Automation Token Identity Health

# Temporary diagnostic: confirm the reviewed-refresh token exists, is valid and
# carries a user identity. Dispatch-only; removed once verified.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report the automation token identity
        env:
          GH_TOKEN: ${{ secrets.FORMAL_REFRESH_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "FORMAL_REFRESH_TOKEN is not configured"
            exit 1
          fi
          echo "identity: $(gh api user --jq '"login=\(.login) type=\(.type)"')"
          echo "repository: $(gh api "repos/${REPOSITORY}" --jq '.full_name')"
          echo "permissions: $(gh api "repos/${REPOSITORY}" --jq '.permissions | tostring')"
          echo "can push main: $(gh api "repos/${REPOSITORY}/branches/main" --jq '.name')"
