name: QQQ Rotation v4.3 Signal Alert

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqq-v4-3-signal-alert.yml"
      - "src/research/qqq_v4_3_monitor.py"
      - "src/research/qqq_v4_3_signal_alerts.py"
      - "scripts/run_qqq_v4_3_monitor.py"
      - "scripts/run_qqq_v4_3_signal_alert.py"
      - "tests/test_qqq_v4_3_monitor_signal.py"
      - "configs/research_paradigms/qqqi_qqq_tqqq_current_baseline.yaml"
  schedule:
    - cron: "30 0 * * 2-6"
  workflow_dispatch:
    inputs:
      end_date:
        description: Optional market-data end date (YYYY-MM-DD)
        required: false
        type: string

concurrency:
  group: qqq-v4-3-signal-alert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  DATA_ROOT: artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
  MONITOR_ROOT: artifacts/evidence/qqq_rotation_v4_3_current_monitor
  SIGNAL_ROOT: artifacts/signals/qqq_rotation_v4_3

jobs:
  signal-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate v4.3 signal implementation
        run: |
          uv run ruff check \
            src/research/qqq_v4_3_monitor.py \
            src/research/qqq_v4_3_signal_alerts.py \
            scripts/run_qqq_v4_3_monitor.py \
            scripts/run_qqq_v4_3_signal_alert.py \
            tests/test_qqq_v4_3_monitor_signal.py
          uv run pytest tests/test_qqq_v4_3_monitor_signal.py -q --strict-markers --tb=short
      - name: Build governed QQQ reference bundle
        run: >-
          uv run python scripts/data/build_etf_reference_bundle.py
          --output-root "$DATA_ROOT"
      - name: Evaluate formal v4.3 current and next-open targets
        env:
          END_DATE: ${{ inputs.end_date }}
        run: |
          args=()
          if [[ -n "$END_DATE" ]]; then args+=(--end-date "$END_DATE"); fi
          uv run python scripts/run_qqq_v4_3_monitor.py \
            --etf-data-bundle "$DATA_ROOT" \
            --output-dir "$MONITOR_ROOT" \
            "${args[@]}"
      - name: Build weight-aware next-open decision alert
        id: alert
        run: >-
          uv run python scripts/run_qqq_v4_3_signal_alert.py
          --summary "$MONITOR_ROOT/current_summary.json"
          --output-dir "$SIGNAL_ROOT"
          --github-output "$GITHUB_OUTPUT"
      - name: Create deduplicated GitHub signal Issue
        id: issue
        if: >-
          github.event_name != 'pull_request' &&
          steps.alert.outputs.should_alert == 'true' &&
          steps.alert.outputs.data_freshness_ok == 'true'
        uses: actions/github-script@v7
        env:
          ALERT_FINGERPRINT: ${{ steps.alert.outputs.fingerprint }}
          ALERT_TITLE: ${{ steps.alert.outputs.title }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- signal-fingerprint:${process.env.ALERT_FINGERPRINT} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((item) =>
              !item.pull_request && String(item.body || '').includes(marker)
            );
            if (existing) {
              core.setOutput('status', 'existing');
              core.setOutput('issue_number', String(existing.number));
              return;
            }
            const report = fs.readFileSync(`${process.env.SIGNAL_ROOT}/signal_alert.md`, 'utf8');
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: process.env.ALERT_TITLE,
              body: `@${context.repo.owner}\n\n${report}`,
              assignees: [context.repo.owner],
            });
            core.setOutput('status', 'created');
            core.setOutput('issue_number', String(created.data.number));
      - name: Inspect prior Telegram delivery
        id: prior
        if: >-
          github.event_name != 'pull_request' &&
          steps.alert.outputs.should_alert == 'true' &&
          steps.issue.outputs.issue_number != ''
        uses: actions/github-script@v7
        env:
          ALERT_FINGERPRINT: ${{ steps.alert.outputs.fingerprint }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              per_page: 100,
            });
            const marker = `signal-delivery:${process.env.ALERT_FINGERPRINT}:sent`;
            core.setOutput('already_sent', comments.some((comment) =>
              String(comment.body || '').includes(marker)
            ) ? 'true' : 'false');
      - name: Send Telegram alert once
        id: telegram
        if: >-
          github.event_name != 'pull_request' &&
          steps.alert.outputs.should_alert == 'true' &&
          steps.alert.outputs.data_freshness_ok == 'true' &&
          steps.prior.outputs.already_sent != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "status=skipped_not_configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          response=$(curl --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@${SIGNAL_ROOT}/signal_alert_telegram.txt" \
            --data-urlencode "disable_web_page_preview=true")
          curl_status=$?
          set -e
          if [[ $curl_status -ne 0 ]]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(jq -r '.ok // false' <<< "$response")" == "true" ]]; then
            echo "status=sent" >> "$GITHUB_OUTPUT"
            echo "message_id=$(jq -r '.result.message_id // empty' <<< "$response")" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Persist Telegram delivery marker
        if: >-
          github.event_name != 'pull_request' &&
          steps.telegram.outputs.status == 'sent' &&
          steps.issue.outputs.issue_number != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          FINGERPRINT: ${{ steps.alert.outputs.fingerprint }}
          MESSAGE_ID: ${{ steps.telegram.outputs.message_id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `<!-- signal-delivery:${process.env.FINGERPRINT}:sent -->\n\nTelegram sent: ${process.env.MESSAGE_ID || 'unknown'}\n\n研究用途：是；自动交易授权：否。`,
            });
      - name: Upload v4.3 signal context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-v4-3-signal-${{ github.run_id }}
          path: |
            artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1/bundle_manifest.json
            artifacts/evidence/qqq_rotation_v4_3_current_monitor
            artifacts/signals/qqq_rotation_v4_3
          if-no-files-found: warn
          retention-days: 90
      - name: Fail visibly when required Telegram delivery failed
        if: >-
          always() &&
          steps.alert.outputs.should_alert == 'true' &&
          steps.telegram.outputs.status == 'failed'
        run: exit 1
