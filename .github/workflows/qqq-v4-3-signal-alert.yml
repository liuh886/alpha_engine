name: QQQ Rotation v4.3 Signal Alert

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqq-v4-3-signal-alert.yml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_current_baseline.yaml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_vxn_bridge_v4_2.yaml"
      - "configs/strategies/registry.json"
      - "src/cli/main.py"
      - "src/governance/active_strategy_catalog.py"
      - "src/research/qqq_v4_3_monitor.py"
      - "src/research/qqq_v4_3_signal_alerts.py"
      - "src/factors/strategy_snapshot.py"
      - "src/artifacts/strategy_signal_ledger.py"
      - "src/artifacts/strategy_operations.py"
      - "scripts/run_qqq_v4_3_monitor.py"
      - "scripts/run_qqq_v4_3_signal_alert.py"
      - "tests/test_qqq_v4_3_monitor_signal.py"
      - "tests/test_strategy_operations.py"
      - "tests/test_active_strategy_catalog.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/qqq-v4-3-signal-alert.yml"
      - "configs/strategies/registry.json"
      - "src/cli/main.py"
      - "src/governance/active_strategy_catalog.py"
      - "src/research/qqq_v4_3_monitor.py"
      - "src/research/qqq_v4_3_signal_alerts.py"
      - "src/factors/strategy_snapshot.py"
      - "src/artifacts/strategy_signal_ledger.py"
      - "src/artifacts/strategy_operations.py"
      - "scripts/run_qqq_v4_3_monitor.py"
      - "scripts/run_qqq_v4_3_signal_alert.py"
  schedule:
    - cron: "30 0 * * 2-6"
  workflow_dispatch:
    inputs:
      end_date:
        description: Optional exclusive market-data end date (YYYY-MM-DD)
        required: false
        type: string

concurrency:
  group: qqq-v4-3-signal-alert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  SIGNAL_ROOT: artifacts/signals/qqq_rotation_v4_3
  MONITOR_ROOT: artifacts/evidence/qqq_rotation_v4_3_current_monitor
  MODEL_VERSION_ID: qqqi_qqq_tqqq_v4_3
  LEDGER_DIR: data/research/strategy_signal_ledgers/qqqi_qqq_tqqq_v4_3

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate v4.3 signal and operations contracts
        run: |
          uv run ruff check \
            src/cli/main.py \
            src/governance/active_strategy_catalog.py \
            src/research/qqq_v4_3_monitor.py \
            src/research/qqq_v4_3_signal_alerts.py \
            src/factors/strategy_snapshot.py \
            src/artifacts/strategy_signal_ledger.py \
            src/artifacts/strategy_operations.py \
            scripts/run_qqq_v4_3_monitor.py \
            scripts/run_qqq_v4_3_signal_alert.py \
            tests/test_qqq_v4_3_monitor_signal.py \
            tests/test_strategy_operations.py \
            tests/test_active_strategy_catalog.py
          uv run pytest \
            tests/test_qqq_v4_3_monitor_signal.py \
            tests/test_strategy_operations.py \
            tests/test_active_strategy_catalog.py \
            -q --strict-markers --tb=short

  evaluate-and-deliver:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Build governed QQQ QQQI TQQQ reference bundle
        run: >-
          uv run python scripts/data/build_etf_reference_bundle.py
          --output-root artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
          --require-professional
      - name: Evaluate current v4.3 allocation
        run: >-
          uv run python scripts/run_qqq_v4_3_monitor.py
          --end-date "${{ inputs.end_date }}"
          --etf-data-bundle artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
          --output-dir "$MONITOR_ROOT"
      - name: Build factor-bound next-open decision alert
        id: alert
        run: >-
          uv run python scripts/run_qqq_v4_3_signal_alert.py
          --summary "$MONITOR_ROOT/current_summary.json"
          --output-dir "$SIGNAL_ROOT"
          --github-output "$GITHUB_OUTPUT"
      - name: Create deduplicated GitHub signal issue
        id: issue
        if: >-
          steps.alert.outputs.should_alert == 'true' &&
          steps.alert.outputs.data_freshness_ok == 'true' &&
          steps.alert.outputs.factor_freshness_ok == 'true'
        uses: actions/github-script@v8
        env:
          ALERT_FINGERPRINT: ${{ steps.alert.outputs.fingerprint }}
          ALERT_TITLE: ${{ steps.alert.outputs.title }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = `<!-- signal-fingerprint:${process.env.ALERT_FINGERPRINT} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((item) => !item.pull_request && String(item.body || '').includes(marker));
            if (existing) {
              core.setOutput('issue_number', String(existing.number));
              core.setOutput('created', 'false');
              return;
            }
            const report = fs.readFileSync(`${process.env.SIGNAL_ROOT}/signal_alert.md`, 'utf8');
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: process.env.ALERT_TITLE,
              body: `@${context.repo.owner}\n\n${report}`,
              assignees: [context.repo.owner],
            });
            core.setOutput('issue_number', String(created.data.number));
            core.setOutput('created', 'true');
      - name: Read prior durable delivery state
        id: prior
        env:
          FINGERPRINT: ${{ steps.alert.outputs.fingerprint }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['LEDGER_DIR']) / 'latest.json'
          already_sent = False
          message_id = ''
          if path.is_file():
              payload = json.loads(path.read_text(encoding='utf-8'))
              delivery = payload.get('delivery', {})
              if payload.get('fingerprint') == os.environ['FINGERPRINT'] and delivery.get('status') == 'sent':
                  already_sent = True
                  message_id = str(delivery.get('telegram_message_id') or '')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"already_sent={'true' if already_sent else 'false'}\n")
              handle.write(f"message_id={message_id}\n")
          PY
      - name: Send decision-grade Telegram alert once
        id: telegram
        if: >-
          steps.alert.outputs.should_alert == 'true' &&
          steps.alert.outputs.data_freshness_ok == 'true' &&
          steps.alert.outputs.factor_freshness_ok == 'true' &&
          steps.prior.outputs.already_sent != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "status=skipped_not_configured" >> "$GITHUB_OUTPUT"
            echo "error_class=missing_secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          response=$(curl --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@${SIGNAL_ROOT}/signal_alert_telegram.txt" \
            --data-urlencode "disable_web_page_preview=true")
          curl_status=$?
          set -e
          if [[ $curl_status -ne 0 ]]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "error_class=transport_error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(jq -r '.ok // false' <<< "$response")" == "true" ]]; then
            echo "status=sent" >> "$GITHUB_OUTPUT"
            echo "message_id=$(jq -r '.result.message_id // empty' <<< "$response")" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "error_class=telegram_api_rejected" >> "$GITHUB_OUTPUT"
          fi
      - name: Persist governed decision and rebuild operations read model
        env:
          SHOULD_ALERT: ${{ steps.alert.outputs.should_alert }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          PRIOR_SENT: ${{ steps.prior.outputs.already_sent }}
          PRIOR_MESSAGE_ID: ${{ steps.prior.outputs.message_id }}
          TELEGRAM_STATUS: ${{ steps.telegram.outputs.status }}
          TELEGRAM_MESSAGE_ID: ${{ steps.telegram.outputs.message_id }}
          TELEGRAM_ERROR_CLASS: ${{ steps.telegram.outputs.error_class }}
        run: |
          set -euo pipefail
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$SHOULD_ALERT" != "true" ]]; then
            delivery_status="not_required"
            message_id=""
            delivery_error=""
          elif [[ "$PRIOR_SENT" == "true" ]]; then
            delivery_status="sent"
            message_id="${PRIOR_MESSAGE_ID:-}"
            delivery_error=""
          else
            delivery_status="${TELEGRAM_STATUS:-failed}"
            message_id="${TELEGRAM_MESSAGE_ID:-}"
            delivery_error="${TELEGRAM_ERROR_CLASS:-}"
          fi
          uv run alpha ops record-decision \
            --model-version-id "$MODEL_VERSION_ID" \
            --signal-json "$SIGNAL_ROOT/signal_alert.json" \
            --delivery-status "$delivery_status" \
            --github-issue-number "${ISSUE_NUMBER:-}" \
            --telegram-message-id "$message_id" \
            --delivery-error "$delivery_error" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --commit-sha "$GITHUB_SHA" \
            --created-at-utc "$created_at"
          uv run alpha ops build --generated-at "$created_at"
          echo "delivery_status=$delivery_status" >> "$GITHUB_ENV"
      - name: Commit durable decision and operations state
        run: |
          set -euo pipefail
          git config user.name "AlphaEngine Signal Agent"
          git config user.email "signal-agent@alphaengine.local"
          git add \
            data/research/strategy_signal_ledgers/qqqi_qqq_tqqq_v4_3 \
            data/research/strategy_operations/snapshots.json
          if git diff --cached --quiet; then
            echo "Decision evaluation is already persisted."
          else
            git commit -m "signal: publish QQQ v4.3 evaluation ${{ steps.alert.outputs.fingerprint }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload hash-bound decision and operations evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-v4-3-signal-${{ github.run_id }}
          path: |
            artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1/bundle_manifest.json
            artifacts/evidence/qqq_rotation_v4_3_current_monitor/current_summary.json
            artifacts/signals/qqq_rotation_v4_3
            data/research/strategy_signal_ledgers/qqqi_qqq_tqqq_v4_3
            data/research/strategy_operations/snapshots.json
          if-no-files-found: warn
          retention-days: 90
      - name: Fail visibly after persisting required Telegram delivery failure
        if: env.delivery_status == 'failed'
        run: exit 1
