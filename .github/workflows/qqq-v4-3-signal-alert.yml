name: QQQ Rotation v4.3 Signal Alert

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqq-v4-3-signal-alert.yml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_current_baseline.yaml"
      - "configs/strategies/registry.json"
      - "src/research/qqq_v4_3_monitor.py"
      - "src/research/qqq_v4_3_signal_alerts.py"
      - "src/factors/strategy_snapshot.py"
      - "src/artifacts/strategy_signal_ledger.py"
      - "scripts/run_qqq_v4_3_monitor.py"
      - "scripts/run_qqq_v4_3_signal_alert.py"
      - "tests/test_qqq_v4_3_monitor_signal.py"
      - "tests/test_strategy_signal_ledger.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/qqq-v4-3-signal-alert.yml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_current_baseline.yaml"
      - "configs/strategies/registry.json"
      - "src/research/qqq_v4_3_monitor.py"
      - "src/research/qqq_v4_3_signal_alerts.py"
      - "src/factors/strategy_snapshot.py"
      - "scripts/run_qqq_v4_3_monitor.py"
      - "scripts/run_qqq_v4_3_signal_alert.py"
  schedule:
    - cron: "30 0 * * 2-6"
  workflow_dispatch:
    inputs:
      end_date:
        description: Optional exclusive market-data end date (YYYY-MM-DD)
        required: false
        type: string

concurrency:
  group: qqq-v4-3-signal-alert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  SIGNAL_ROOT: artifacts/signals/qqq_rotation_v4_3
  MONITOR_ROOT: artifacts/evidence/qqq_rotation_v4_3_current_monitor
  MODEL_VERSION_ID: qqqi_qqq_tqqq_v4_3
  LEDGER_DIR: data/research/strategy_signal_ledgers/qqqi_qqq_tqqq_v4_3

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate QQQ evaluation contract
        run: |
          uv run ruff check \
            src/research/qqq_v4_3_monitor.py \
            src/research/qqq_v4_3_signal_alerts.py \
            src/factors/strategy_snapshot.py \
            src/artifacts/strategy_signal_ledger.py \
            scripts/run_qqq_v4_3_monitor.py \
            scripts/run_qqq_v4_3_signal_alert.py \
            tests/test_qqq_v4_3_monitor_signal.py \
            tests/test_strategy_signal_ledger.py
          uv run pytest \
            tests/test_qqq_v4_3_monitor_signal.py \
            tests/test_strategy_signal_ledger.py \
            -q --strict-markers --tb=short

  evaluate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Capture executed source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Build governed QQQ reference bundle
        run: >-
          uv run python scripts/data/build_etf_reference_bundle.py
          --output-root artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
          --require-professional
      - name: Evaluate current allocation
        run: >-
          uv run python scripts/run_qqq_v4_3_monitor.py
          --end-date "${{ inputs.end_date }}"
          --etf-data-bundle artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
          --output-dir "$MONITOR_ROOT"
      - name: Build factor-bound decision
        id: signal
        run: >-
          uv run python scripts/run_qqq_v4_3_signal_alert.py
          --summary "$MONITOR_ROOT/current_summary.json"
          --output-dir "$SIGNAL_ROOT"
          --github-output "$GITHUB_OUTPUT"
      - name: Seal canonical QQQ decision
        env:
          EXECUTION_SHA: ${{ steps.source.outputs.sha }}
        run: |
          uv run alpha ops record-decision \
            --model-version-id "$MODEL_VERSION_ID" \
            --signal-json "$SIGNAL_ROOT/signal_alert.json" \
            --delivery-status pending \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --commit-sha "$EXECUTION_SHA" \
            --created-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Commit canonical QQQ decision
        run: |
          set -euo pipefail
          git config user.name "AlphaEngine Signal Agent"
          git config user.email "signal-agent@alphaengine.local"
          git add "$LEDGER_DIR"
          if git diff --cached --quiet; then
            echo "Canonical QQQ decision already sealed."
          else
            git commit -m "signal: seal QQQ v4.3 decision ${{ steps.signal.outputs.signal_date }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Retain decision evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qqq-v4-3-signal-${{ github.run_id }}
          path: |
            artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1/bundle_manifest.json
            artifacts/evidence/qqq_rotation_v4_3_current_monitor/current_summary.json
            artifacts/signals/qqq_rotation_v4_3
            data/research/strategy_signal_ledgers/qqqi_qqq_tqqq_v4_3
          if-no-files-found: warn
          retention-days: 30
