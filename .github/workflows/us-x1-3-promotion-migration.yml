name: US x1.3 Promotion Migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/us-x1-3-promotion-migration.yml"
      - "scripts/migrate_us_x1_3_promotion.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-x1-3-promotion-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Materialize US x1.3 promotion changes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/migrate_us_x1_3_promotion.py')
          text = path.read_text(encoding='utf-8')
          old = '        text = replace_required(text, old, new, label=source)\n'
          new = '        text = text.replace(old, new)\n'
          if old not in text:
              raise SystemExit('clone_text migration anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/migrate_us_x1_3_promotion.py
          python -m compileall -q \
            scripts/run_us_x1_3_current_target.py \
            scripts/build_us_x1_3_preview.py \
            scripts/run_formal_refresh_transaction.py \
            scripts/run_formal_strategy_refresh.py \
            scripts/sync_formal_bundle_v2.py \
            src/artifacts/us_x1_3_preview.py \
            src/artifacts/us_x1_3_formal.py \
            src/research/us_x1_3_current_target.py
      - name: Prepare connector-safe review branch
        run: |
          # GitHub's Actions token intentionally cannot update workflow files.
          # Keep workflow changes for the GitHub connector to apply directly to
          # the generated review branch, while publishing all ordinary code now.
          git checkout HEAD -- .github/workflows
          rm -f scripts/migrate_us_x1_3_promotion.py
      - name: Publish review branch
        run: |
          set -euo pipefail
          git config user.name "AlphaEngine Promotion Agent"
          git config user.email "promotion-agent@alphaengine.local"
          git add -A
          git diff --cached --stat
          test -n "$(git status --porcelain)"
          git commit -m "feat: promote Stage-B winner to US x1.3"
          git push --force origin HEAD:automation/us-x1-3-finalize
