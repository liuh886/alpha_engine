name: Fundamental Event Store CI

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/data_contracts/fundamental_event_store_v1.yaml"
      - "src/data/fundamentals/**"
      - "scripts/data/**"
      - "tests/test_fundamental_event_store_contract.py"
      - "docs/research/fundamental_event_store_v1_2026-08-01.md"
      - ".github/workflows/fundamental-event-store-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
  push:
    branches: [main]
    paths:
      - "configs/data_contracts/fundamental_event_store_v1.yaml"
      - "src/data/fundamentals/**"
      - "scripts/data/**"
      - "tests/test_fundamental_event_store_contract.py"
      - "docs/research/fundamental_event_store_v1_2026-08-01.md"
      - ".github/workflows/fundamental-event-store-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-uv
      - name: Ruff event-store files
        run: >-
          uv run ruff check
          src/data/fundamentals
          scripts/data
          tests/test_fundamental_event_store_contract.py
      - name: Mypy event-store files
        run: >-
          uv run mypy
          src/data/fundamentals
          scripts/data/audit_fundamental_coverage.py
      - name: Run event-store contract tests
        run: >-
          uv run pytest
          tests/test_fundamental_event_store_contract.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
