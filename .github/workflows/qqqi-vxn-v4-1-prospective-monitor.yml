name: QQQI VXN v4.1 Prospective Monitor

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-vxn-v4-1-prospective-monitor.yml"
      - "configs/data/qqqi_qqq_tqqq_reference_bundle_v1.yaml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_vxn_v4_1_prospective_monitor.yaml"
      - "scripts/data/build_etf_reference_bundle.py"
      - "scripts/run_qqqi_vxn_v4_1_prospective_monitor.py"
      - "src/data/adapters/tiingo_adapter.py"
      - "src/data/etf_reference_bundle.py"
      - "src/research/etf_strategy_data.py"
      - "src/research/vxn_prospective_monitor.py"
      - "tests/test_etf_reference_bundle.py"
      - "tests/test_tiingo_adapter.py"
      - "tests/test_vxn_prospective_monitor.py"
      - "docs/research/qqqi_qqq_tqqq_vxn_v4_1_prospective_monitoring.md"
      - "docs/research/qqqi_qqq_tqqq_sequential_factor_cycle_2026-08-01.md"
  workflow_run:
    workflows: ["ETF Reference Bundle CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prospective-monitor:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff lint monitor and ETF data paths
        run: >-
          uv run ruff check
          src/data/adapters/tiingo_adapter.py
          src/data/etf_reference_bundle.py
          src/research/etf_strategy_data.py
          src/research/vxn_prospective_monitor.py
          scripts/data/build_etf_reference_bundle.py
          scripts/run_qqqi_vxn_v4_1_prospective_monitor.py
          tests/test_tiingo_adapter.py
          tests/test_etf_reference_bundle.py
          tests/test_vxn_prospective_monitor.py
      - name: Mypy focused monitor and ETF data paths
        run: >-
          uv run mypy --follow-imports=skip
          src/data/adapters/tiingo_adapter.py
          src/data/etf_reference_bundle.py
          src/research/etf_strategy_data.py
          src/research/vxn_prospective_monitor.py
          scripts/data/build_etf_reference_bundle.py
          scripts/run_qqqi_vxn_v4_1_prospective_monitor.py
      - name: Run monitor and ETF data tests
        run: >-
          uv run pytest
          tests/test_tiingo_adapter.py
          tests/test_etf_reference_bundle.py
          tests/test_vxn_prospective_monitor.py
          tests/test_vxn_leverage_overlay_experiment.py
          tests/test_vix_rotation_experiment.py
          tests/test_strategy_experiment_journal.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Download shared professional ETF bundle
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: qqqi-qqq-tqqq-reference-bundle-${{ github.event.workflow_run.id }}
          path: artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Build PR validation ETF bundle without credentialed requests
        if: github.event_name != 'workflow_run'
        env:
          TIINGO_API_TOKEN: ""
        run: >-
          uv run python scripts/data/build_etf_reference_bundle.py
          --output-root artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
      - name: Run frozen prospective monitor
        run: >-
          uv run python scripts/run_qqqi_vxn_v4_1_prospective_monitor.py
          --etf-data-bundle artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
          --output-dir artifacts/evidence/qqqi_qqq_tqqq_vxn_v4_1_prospective_monitor
          --strategy-run-dir artifacts/strategy_runs
      - name: Upload ETF identity, prospective evidence and run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-vxn-v4-1-prospective-${{ github.run_id }}
          path: |
            artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1/bundle_manifest.json
            artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1/coverage.csv
            artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1/reconciliation.csv
            artifacts/evidence/qqqi_qqq_tqqq_vxn_v4_1_prospective_monitor
            artifacts/strategy_runs/qqqi_qqq_tqqq_vxn_v4_1_prospective_monitor
          if-no-files-found: warn
          retention-days: 90
