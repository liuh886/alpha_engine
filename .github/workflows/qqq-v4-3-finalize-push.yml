name: QQQ v4.3 Finalize Push

on:
  push:
    branches:
      - feat/qqq-v4-3-operational-closeout
    paths:
      - ".github/workflows/qqq-v4-3-finalize-push.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/qqq-v4-3-operational-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json
      - name: Install locked environments
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
          cd qlib-dashboard && npm ci
      - name: Stabilize model-scoped bundle identity and browser fixtures
        run: |
          set -euo pipefail
          git fetch origin main
          uv run python - <<'PY'
          from pathlib import Path
          path = Path('scripts/migrate_formal_v1_to_bundle_v2.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('def build_plan(source_path: Path, *, catalog_sha256: str) -> RunExportPlan:', 'def build_plan(source_path: Path) -> RunExportPlan:', 1)
          text = text.replace('        "source_catalog_sha256": catalog_sha256,\n', '', 1)
          text = text.replace('                build_plan(source_paths[model_id], catalog_sha256=catalog_sha),', '                build_plan(source_paths[model_id]),', 1)
          if 'catalog_sha256: str' in text or '"source_catalog_sha256": catalog_sha256' in text:
              raise SystemExit('global catalog hash still contaminates model bundle identity')
          path.write_text(text, encoding='utf-8')
          PY
          git checkout origin/main -- qlib-dashboard/e2e/static-artifact.spec.ts
          python - <<'PY'
          from pathlib import Path
          for name in ['qlib-dashboard/e2e/static-artifact.spec.ts', 'qlib-dashboard/e2e/strategy-operations.spec.ts']:
              path = Path(name)
              text = path.read_text(encoding='utf-8').replace('qqqi_qqq_tqqq_v4_2', 'qqqi_qqq_tqqq_v4_3').replace('QQQ Rotation v4.2', 'QQQ Rotation v4.3')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Rebuild Bundle v2 and governed operations
        run: |
          set -euo pipefail
          rm -rf data/research/formal_model_runs qlib-dashboard/public/data/formal-model-runs
          uv run python scripts/sync_formal_bundle_v2.py --source-root data/research/formal_backtests --output-root data/research/formal_model_runs --receipt artifacts/finalize/formal-v2.json
          generated_at="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('data/research/formal_backtests/catalog.json').read_text())['published_at'])
          PY
          )"
          uv run python scripts/build_strategy_operations.py --formal-catalog data/research/formal_model_runs/catalog.json --ledger-root data/research/strategy_signal_ledgers --generated-at "$generated_at" --output data/research/strategy_operations/snapshots.json
          cd qlib-dashboard
          npm run sync:formal-model-runs
          npm run sync:strategy-operations
      - name: Repin active Research Loop baseline specs
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          catalog = json.loads(Path('data/research/formal_model_runs/catalog.json').read_text())
          records = {row['model_version_id']: row for row in catalog['records']}
          mapping = {
              'configs/research_experiments/cn_x1_1_research_loop_onboarding_v1.yaml': 'cn_x1_1',
              'configs/research_experiments/byd_v1_2_research_loop_onboarding_v1.yaml': 'byd_v1_2_convex_momentum_budget_v1',
              'configs/research_experiments/qqq_rotation_v4_3_research_loop_onboarding_v1.yaml': 'qqqi_qqq_tqqq_v4_3',
          }
          for filename, model_id in mapping.items():
              path = Path(filename)
              spec = yaml.safe_load(path.read_text(encoding='utf-8'))
              row = records[model_id]
              spec['baseline']['bundle_id'] = row['bundle_id']
              spec['baseline']['manifest_sha256'] = row['manifest_sha256']
              if 'expected_identity' in spec:
                  spec['expected_identity']['evidence_cutoff'] = row['evidence_cutoff']
              path.write_text(yaml.safe_dump(spec, sort_keys=False), encoding='utf-8')
              receipt_path = Path('data/research/experiment_receipts') / f"{spec['experiment_id']}.json"
              if receipt_path.is_file():
                  receipt = json.loads(receipt_path.read_text())
                  baseline = receipt.setdefault('baseline', {})
                  baseline['bundle_id'] = row['bundle_id']
                  baseline['manifest_sha256'] = row['manifest_sha256']
                  baseline['manifest_path'] = f"data/research/formal_model_runs/{row['manifest_path']}"
                  baseline['evidence_cutoff'] = row['evidence_cutoff']
                  receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          Path('configs/research_experiments/qqq_rotation_v4_2_research_loop_onboarding_v1.yaml').unlink(missing_ok=True)
          Path('data/research/experiment_receipts/qqq_rotation_v4_2_research_loop_onboarding_v1.json').unlink(missing_ok=True)
          print({model: records[model]['bundle_id'] for model in records})
          PY
      - name: Validate stable publication
        run: |
          set -euo pipefail
          uv run ruff check scripts/migrate_formal_v1_to_bundle_v2.py tests/test_formal_baseline_onboarding.py tests/test_sync_formal_bundle_v2.py tests/test_strategy_operations.py
          uv run pytest tests/test_formal_baseline_onboarding.py tests/test_sync_formal_bundle_v2.py tests/test_strategy_operations.py -q --strict-markers --tb=short
          cd qlib-dashboard
          npx tsc --noEmit
          npm test -- --run
          npm run build
      - name: Commit final stable publication
        run: |
          set -euo pipefail
          git config user.name "AlphaEngine Release Agent"
          git config user.email "release-agent@alphaengine.local"
          git add scripts/migrate_formal_v1_to_bundle_v2.py data/research/formal_model_runs data/research/strategy_operations/snapshots.json configs/research_experiments data/research/experiment_receipts qlib-dashboard/public/data/formal-model-runs qlib-dashboard/public/data/strategy-operations qlib-dashboard/e2e/static-artifact.spec.ts qlib-dashboard/e2e/strategy-operations.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: stabilize formal bundle identities across catalog changes"
          git push origin HEAD:feat/qqq-v4-3-operational-closeout
