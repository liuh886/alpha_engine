name: US Low-Turnover Decision Pipeline CI

on:
  push:
    branches: [main]
    paths:
      - "configs/factors/us_low_turnover_multifactor_v1.yaml"
      - "src/research/low_turnover_multifactor.py"
      - "src/research/low_turnover_multifactor_pipeline.py"
      - "src/decision_support/us_low_turnover_decision_pipeline.py"
      - "scripts/build_low_turnover_multifactor.py"
      - "scripts/run_us_low_turnover_decision_pipeline.py"
      - "scripts/setup_cron.py"
      - "scripts/summarize_daily_us_decision_run.py"
      - "tests/test_low_turnover_multifactor.py"
      - "tests/test_us_low_turnover_decision_pipeline.py"
      - "tests/test_daily_us_decision_operations.py"
      - ".github/workflows/daily-us-low-turnover-decision.yml"
      - "docs/operations/daily_us_low_turnover_decision.md"
      - ".env.example"
      - ".github/workflows/us-low-turnover-decision-pipeline-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "configs/factors/us_low_turnover_multifactor_v1.yaml"
      - "src/research/low_turnover_multifactor.py"
      - "src/research/low_turnover_multifactor_pipeline.py"
      - "src/decision_support/us_low_turnover_decision_pipeline.py"
      - "scripts/build_low_turnover_multifactor.py"
      - "scripts/run_us_low_turnover_decision_pipeline.py"
      - "scripts/setup_cron.py"
      - "scripts/summarize_daily_us_decision_run.py"
      - "tests/test_low_turnover_multifactor.py"
      - "tests/test_us_low_turnover_decision_pipeline.py"
      - "tests/test_daily_us_decision_operations.py"
      - ".github/workflows/daily-us-low-turnover-decision.yml"
      - "docs/operations/daily_us_low_turnover_decision.md"
      - ".env.example"
      - ".github/workflows/us-low-turnover-decision-pipeline-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  end-to-end-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff low-turnover and operations path
        run: >-
          uv run ruff check
          src/research/low_turnover_multifactor.py
          src/research/low_turnover_multifactor_pipeline.py
          src/decision_support/us_low_turnover_decision_pipeline.py
          scripts/build_low_turnover_multifactor.py
          scripts/run_us_low_turnover_decision_pipeline.py
          scripts/setup_cron.py
          scripts/summarize_daily_us_decision_run.py
          tests/test_low_turnover_multifactor.py
          tests/test_us_low_turnover_decision_pipeline.py
          tests/test_daily_us_decision_operations.py
      - name: Run low-turnover and operations tests
        run: >-
          uv run pytest
          tests/test_low_turnover_multifactor.py
          tests/test_us_low_turnover_decision_pipeline.py
          tests/test_daily_us_decision_operations.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: CLI import checks
        run: |
          uv run python scripts/build_low_turnover_multifactor.py --help
          uv run python scripts/run_us_low_turnover_decision_pipeline.py --help
          uv run python -c "import scripts.setup_cron"
          uv run python scripts/summarize_daily_us_decision_run.py --help
