name: Materialize Formal Refresh Core

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-formal-refresh-core.yml"
      - ".materialize-formal-refresh-core-trigger"

permissions:
  contents: write

concurrency:
  group: materialize-formal-refresh-core-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/formal-refresh-closed-loop
          fetch-depth: 0

      - name: Apply remaining focused corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          ranker = Path('scripts/refresh_ranker_formal.py')
          text = ranker.read_text(encoding='utf-8')
          old = '''            "run_a_identity_sha256": sha256(run_a / "effective_contract.json"),
            "run_b_identity_sha256": sha256(run_b / "effective_contract.json"),
'''
          new = '''            "run_a_identity_sha256": sha256(run_a / "candidate_manifest.json"),
            "run_b_identity_sha256": sha256(run_b / "candidate_manifest.json"),
'''
          if old not in text:
              raise SystemExit('US run identity block not found')
          ranker.write_text(text.replace(old, new, 1), encoding='utf-8')

          router = Path('scripts/data/refresh_selected_pool_prices_v2.py')
          text = router.read_text(encoding='utf-8')
          if 'from src.data.adapters.tiingo_adapter import TiingoAdapter\n' not in text:
              text = text.replace(
                  'from src.data.adapters.tushare_adapter import TushareAdapter\n',
                  'from src.data.adapters.tiingo_adapter import TiingoAdapter\n'
                  'from src.data.adapters.tushare_adapter import TushareAdapter\n',
                  1,
              )
          old_us = '''    elif market_key == "us":
        adapters.append(YFinanceAdapter())
        providers.append("yfinance")
'''
          new_us = '''    elif market_key == "us":
        tiingo_token = os.getenv("TIINGO_API_TOKEN", "").strip()
        if tiingo_token:
            adapters.append(TiingoAdapter(token=tiingo_token))
            providers.append("tiingo")
        adapters.append(YFinanceAdapter())
        providers.append("yfinance")
'''
          if old_us not in text:
              raise SystemExit('US provider router block not found')
          router.write_text(text.replace(old_us, new_us, 1), encoding='utf-8')

          Path('.github/workflows/materialize-formal-refresh-core.yml').unlink()
          Path('.materialize-formal-refresh-core-trigger').unlink()
          PY

      - name: Commit corrected sources
        run: |
          git config user.name "AlphaEngine Maintenance Agent"
          git config user.email "maintenance-agent@alphaengine.local"
          git add \
            scripts/refresh_ranker_formal.py \
            scripts/data/refresh_selected_pool_prices_v2.py \
            .github/workflows/materialize-formal-refresh-core.yml \
            .materialize-formal-refresh-core-trigger
          git commit -m "fix: harden formal refresh provider and run identities"
          git push origin HEAD:feat/formal-refresh-closed-loop
