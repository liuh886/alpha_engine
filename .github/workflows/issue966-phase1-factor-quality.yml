name: Issue 966 Phase1 Factor Quality

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/issue966-phase1-factor-quality.yml"
      - "configs/factor_libraries/volume_stat_research.yaml"
      - "configs/research_paradigms/us_issue966_phase1_feature_quality_v1.yaml"
      - "configs/research_paradigms/cn_issue966_phase1_feature_quality_v1.yaml"
      - "configs/research_universes/us_selected_equities_v2.yaml"
      - "configs/research_universes/cn_selected_equities_v3.yaml"
      - "data/csv_source/**"
      - "src/research/factor_feature_quality.py"
      - "scripts/build_market_providers.py"
      - "scripts/run_factor_feature_quality.py"
      - "tests/test_factor_feature_quality.py"
      - "tests/test_volume_stat_research.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue966-phase1-factor-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate Phase1 code and contracts
        run: |
          uv run ruff check \
            src/research/factor_feature_quality.py \
            scripts/run_factor_feature_quality.py \
            tests/test_factor_feature_quality.py \
            tests/test_volume_stat_research.py
          uv run pytest \
            tests/test_factor_feature_quality.py \
            tests/test_volume_stat_research.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
          uv run python - <<'PY'
          from src.research.paradigm import load_research_paradigm_spec
          for path in (
              "configs/research_paradigms/us_issue966_phase1_feature_quality_v1.yaml",
              "configs/research_paradigms/cn_issue966_phase1_feature_quality_v1.yaml",
          ):
              spec = load_research_paradigm_spec(path)
              assert spec.walk_forward["test_end"] == "2026-06-30"
          PY

  quality:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        market: [us, cn]
        include:
          - market: us
            spec: configs/research_paradigms/us_issue966_phase1_feature_quality_v1.yaml
            universe: configs/research_universes/us_selected_equities_v2.yaml
            benchmark: QQQ
            expected_count: 87
          - market: cn
            spec: configs/research_paradigms/cn_issue966_phase1_feature_quality_v1.yaml
            universe: configs/research_universes/cn_selected_equities_v3.yaml
            benchmark: "000300"
            expected_count: 130
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Stage exact governed universe and benchmark sources
        env:
          MARKET: ${{ matrix.market }}
          UNIVERSE: ${{ matrix.universe }}
          BENCHMARK: ${{ matrix.benchmark }}
          EXPECTED_COUNT: ${{ matrix.expected_count }}
        run: |
          uv run python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import yaml

          universe_path = Path(os.environ["UNIVERSE"])
          payload = yaml.safe_load(universe_path.read_text(encoding="utf-8"))
          if payload.get("market") != os.environ["MARKET"]:
              raise SystemExit("selected-pool market identity mismatch")
          symbols = [str(item) for item in payload.get("symbols", [])]
          expected = int(os.environ["EXPECTED_COUNT"])
          if len(symbols) != expected or int(payload.get("candidate_count", 0)) != expected:
              raise SystemExit("selected-pool candidate count mismatch")

          source = Path("data/csv_source")
          stage = Path("artifacts/research/issue966_phase1") / os.environ["MARKET"] / "csv_source"
          stage.mkdir(parents=True, exist_ok=True)
          for symbol in [*symbols, os.environ["BENCHMARK"]]:
              path = source / f"{symbol}.csv"
              if not path.is_file():
                  raise SystemExit(f"missing canonical source: {path}")
              shutil.copy2(path, stage / path.name)
          print(f"staged {len(symbols)} candidates plus benchmark")
          PY
      - name: Build deterministic exact-cutoff Qlib provider
        run: >-
          uv run python scripts/build_market_providers.py
          --csv-dir artifacts/research/issue966_phase1/${{ matrix.market }}/csv_source
          --markets ${{ matrix.market }}
          --cutoff 2026-06-30
      - name: Run Gate1 structural feature quality
        run: >-
          uv run python scripts/run_factor_feature_quality.py
          --spec ${{ matrix.spec }}
          --output artifacts/research/issue966_phase1/${{ matrix.market }}/factor_feature_quality.json
      - name: Verify receipt identity
        env:
          MARKET: ${{ matrix.market }}
          EXPECTED_COUNT: ${{ matrix.expected_count }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/research/issue966_phase1") / os.environ["MARKET"] / "factor_feature_quality.json"
          receipt = json.loads(path.read_text(encoding="utf-8"))
          assert receipt["gate1_pass"] is True
          assert receipt["quality_scope"] == "feature_mechanics_only_no_forward_label"
          assert receipt["provider"]["cutoff"] == "2026-06-30"
          assert receipt["universe"]["requested_symbol_count"] == int(os.environ["EXPECTED_COUNT"])
          assert receipt["factor_count"] == 1
          assert receipt["factors"][0]["checks"]["no_future_data"] is True
          assert receipt["factors"][0]["checks"]["symbol_isolation"] is True
          PY
      - name: Upload Gate1 receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue966-phase1-${{ matrix.market }}-${{ github.run_id }}
          path: artifacts/research/issue966_phase1/${{ matrix.market }}/
          if-no-files-found: error
          retention-days: 90
