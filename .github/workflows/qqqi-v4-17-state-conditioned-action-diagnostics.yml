name: QQQI v4.17 State Conditioned Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-v4-17-state-conditioned-action-diagnostics.yml"
      - "configs/research_paradigms/qqqi_tqqq_sgov_voo_state_conditioned_action_advantage_v4_17_research.yaml"
      - "src/research/v4_17_state_conditioned_action_advantage.py"
      - "scripts/run_qqqi_v4_17_state_conditioned_action_advantage.py"
      - "tests/test_v4_17_state_conditioned_action_advantage.py"

permissions:
  contents: read

jobs:
  static-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff v4.17
        run: |
          uv run ruff check \
            src/research/v4_17_state_conditioned_action_advantage.py \
            scripts/run_qqqi_v4_17_state_conditioned_action_advantage.py \
            tests/test_v4_17_state_conditioned_action_advantage.py
      - name: V4.17 focused tests
        run: |
          uv run pytest tests/test_v4_17_state_conditioned_action_advantage.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Inherited action tests
        run: |
          uv run pytest \
            tests/test_v4_16_action_advantage_model.py \
            tests/test_v4_15_transition_event_discovery.py \
            tests/test_vxn_bridge_allocation_experiment.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
