name: CN130 PIT Event Families Phase 2 Normalization Patch

on:
  pull_request:
    branches:
      - data/cn130-pit-event-families-phase1-v1
    paths:
      - scripts/data/apply_cn130_phase2_markup_normalization_patch.py
      - .github/workflows/cn130-pit-event-families-phase2-normalization-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: data/cn130-pit-event-families-phase2-v1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply normalization patch
        run: python scripts/data/apply_cn130_phase2_markup_normalization_patch.py
      - name: Commit formal files
        run: |
          git config user.name 'AlphaEngine Data Research Agent'
          git config user.email 'data-research-agent@alphaengine.local'
          git add \
            src/data/company_events/ashare_primary_announcements.py \
            scripts/data/build_cn130_pit_event_families_phase2.py \
            tests/test_ashare_primary_company_events.py
          git commit -m 'data: normalize CNINFO titles and repair Phase 2 overlap audit'
          git push origin HEAD:data/cn130-pit-event-families-phase2-v1
