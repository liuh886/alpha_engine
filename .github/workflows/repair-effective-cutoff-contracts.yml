name: Repair effective cutoff contracts

on:
  push:
    branches: [fix/provider-effective-cutoff]
    paths: [.github/workflows/repair-effective-cutoff-contracts.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/provider-effective-cutoff
          fetch-depth: 0
      - name: Repair contracts and materialize workflow blobs
        run: |
          python scripts/maintenance/repair_effective_cutoff_contracts.py
          cp .github/workflows/formal-backtest-refresh.yml scripts/maintenance/formal-backtest-refresh.repaired.yml
          cp .github/workflows/formal-backtest-refresh-ci.yml scripts/maintenance/formal-backtest-refresh-ci.repaired.yml
          git restore .github/workflows/formal-backtest-refresh.yml .github/workflows/formal-backtest-refresh-ci.yml
      - name: Commit ordinary files and workflow blobs
        run: |
          git config user.name "AlphaEngine Maintenance Agent"
          git config user.email "maintenance-agent@alphaengine.local"
          git add tests/test_formal_refresh.py tests/test_formal_refresh_trigger_scope.py scripts/maintenance/formal-backtest-refresh.repaired.yml scripts/maintenance/formal-backtest-refresh-ci.repaired.yml
          git commit -m "test: align effective-cutoff workflow contracts"
          git push origin HEAD:fix/provider-effective-cutoff
