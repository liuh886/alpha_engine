name: QQQ v4.3 Finalize Identities

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqq-v4-3-finalize-identities.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json
      - name: Install locked environments
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
          cd qlib-dashboard
          npm ci
      - name: Make per-model bundle identity independent of global catalog changes
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          path = Path('scripts/migrate_formal_v1_to_bundle_v2.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'def build_plan(source_path: Path, *, catalog_sha256: str) -> RunExportPlan:',
              'def build_plan(source_path: Path) -> RunExportPlan:',
              1,
          )
          text = text.replace('        "source_catalog_sha256": catalog_sha256,\n', '', 1)
          text = text.replace(
              '                build_plan(source_paths[model_id], catalog_sha256=catalog_sha),',
              '                build_plan(source_paths[model_id]),',
              1,
          )
          if 'catalog_sha256: str' in text or '"source_catalog_sha256": catalog_sha256' in text:
              raise SystemExit('per-model global catalog identity dependency survived')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Restore full browser fixtures and switch only active QQQ identity
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- qlib-dashboard/e2e/static-artifact.spec.ts
          python - <<'PY'
          from pathlib import Path
          for filename in [
              'qlib-dashboard/e2e/static-artifact.spec.ts',
              'qlib-dashboard/e2e/strategy-operations.spec.ts',
          ]:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('qqqi_qqq_tqqq_v4_2', 'qqqi_qqq_tqqq_v4_3')
              text = text.replace('QQQ Rotation v4.2', 'QQQ Rotation v4.3')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Rebuild canonical Bundle v2 and Strategy Operations
        run: |
          set -euo pipefail
          rm -rf data/research/formal_model_runs qlib-dashboard/public/data/formal-model-runs
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root data/research/formal_backtests \
            --output-root data/research/formal_model_runs \
            --receipt artifacts/finalize-identities/formal-v2.json
          generated_at="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/research/formal_backtests/catalog.json').read_text(encoding='utf-8'))
          print(payload['published_at'])
          PY
          )"
          uv run python scripts/build_strategy_operations.py \
            --formal-catalog data/research/formal_model_runs/catalog.json \
            --ledger-root data/research/strategy_signal_ledgers \
            --generated-at "$generated_at" \
            --output data/research/strategy_operations/snapshots.json
          cd qlib-dashboard
          npm run sync:formal-model-runs
          npm run sync:strategy-operations
      - name: Repin current Research Loop baselines to stable model identities
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          catalog = json.loads(Path('data/research/formal_model_runs/catalog.json').read_text(encoding='utf-8'))
          records = {row['model_version_id']: row for row in catalog['records']}
          specs = {
              'configs/research_experiments/cn_x1_1_research_loop_onboarding_v1.yaml': 'cn_x1_1',
              'configs/research_experiments/byd_v1_2_research_loop_onboarding_v1.yaml': 'byd_v1_2_convex_momentum_budget_v1',
              'configs/research_experiments/qqq_rotation_v4_3_research_loop_onboarding_v1.yaml': 'qqqi_qqq_tqqq_v4_3',
          }
          for filename, model_id in specs.items():
              path = Path(filename)
              payload = yaml.safe_load(path.read_text(encoding='utf-8'))
              record = records[model_id]
              payload['baseline']['bundle_id'] = record['bundle_id']
              payload['baseline']['manifest_sha256'] = record['manifest_sha256']
              if 'expected_identity' in payload:
                  payload['expected_identity']['evidence_cutoff'] = record['evidence_cutoff']
              path.write_text(yaml.safe_dump(payload, sort_keys=False), encoding='utf-8')

              receipt_path = Path('data/research/experiment_receipts') / f"{payload['experiment_id']}.json"
              if receipt_path.is_file():
                  receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
                  baseline = receipt.setdefault('baseline', {})
                  baseline['bundle_id'] = record['bundle_id']
                  baseline['manifest_sha256'] = record['manifest_sha256']
                  baseline['manifest_path'] = f"data/research/formal_model_runs/{record['manifest_path']}"
                  baseline['evidence_cutoff'] = record['evidence_cutoff']
                  receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          Path('configs/research_experiments/qqq_rotation_v4_2_research_loop_onboarding_v1.yaml').unlink(missing_ok=True)
          Path('data/research/experiment_receipts/qqq_rotation_v4_2_research_loop_onboarding_v1.json').unlink(missing_ok=True)
          print({model_id: records[model_id]['bundle_id'] for model_id in records})
          PY
      - name: Validate stable identity architecture
        run: |
          set -euo pipefail
          uv run ruff check \
            scripts/migrate_formal_v1_to_bundle_v2.py \
            scripts/sync_formal_bundle_v2.py \
            tests/test_formal_baseline_onboarding.py \
            tests/test_sync_formal_bundle_v2.py \
            tests/test_strategy_operations.py
          uv run pytest \
            tests/test_formal_baseline_onboarding.py \
            tests/test_sync_formal_bundle_v2.py \
            tests/test_strategy_operations.py \
            -q --strict-markers --tb=short
          cd qlib-dashboard
          npx tsc --noEmit
          npm test -- --run
          npm run build
      - name: Commit stable identities and browser fixtures
        run: |
          set -euo pipefail
          git config user.name "AlphaEngine Release Agent"
          git config user.email "release-agent@alphaengine.local"
          git add \
            scripts/migrate_formal_v1_to_bundle_v2.py \
            data/research/formal_model_runs \
            data/research/strategy_operations/snapshots.json \
            configs/research_experiments/cn_x1_1_research_loop_onboarding_v1.yaml \
            configs/research_experiments/byd_v1_2_research_loop_onboarding_v1.yaml \
            configs/research_experiments/qqq_rotation_v4_3_research_loop_onboarding_v1.yaml \
            data/research/experiment_receipts \
            qlib-dashboard/public/data/formal-model-runs \
            qlib-dashboard/public/data/strategy-operations \
            qlib-dashboard/e2e/static-artifact.spec.ts \
            qlib-dashboard/e2e/strategy-operations.spec.ts
          git add -u configs/research_experiments data/research/experiment_receipts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: stabilize formal bundle identities across catalog changes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
