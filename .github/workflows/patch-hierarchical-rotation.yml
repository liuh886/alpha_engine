name: Patch Hierarchical Rotation

on:
  push:
    branches:
      - research/multi-market-hierarchical-rotation-contract
    paths:
      - ".github/workflows/patch-hierarchical-rotation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/multi-market-hierarchical-rotation-contract
          fetch-depth: 0
      - name: Generalize benchmark and add within-basket cross-section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/research/small_pool_rotation.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              '''_SCORE_FIELDS = (\n    "median_relative_momentum_63_vs_qqq",\n    "median_momentum_20",\n    "breadth_above_sma50",\n    "median_drawdown_from_63d_high",\n)''',
              '''_SCORE_FIELDS = (\n    "median_relative_momentum_63_vs_benchmark",\n    "median_momentum_20",\n    "breadth_above_sma50",\n    "median_drawdown_from_63d_high",\n)\n_SECURITY_SCORE_FIELDS = (\n    "relative_momentum_63_vs_benchmark",\n    "momentum_20",\n    "drawdown_from_63d_high",\n    "realized_volatility_20",\n)''',
          )

          def replace_function(name: str, next_name: str, replacement: str) -> None:
              global text
              pattern = rf"def {name}\(.*?(?=\ndef {next_name}\()"
              updated, count = re.subn(pattern, replacement.rstrip() + "\n\n", text, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected one {name} function, found {count}")
              text = updated

          replace_function(
              "validate_rotation_contract",
              "load_rotation_contract",
              r'''def validate_rotation_contract(
    spec: Mapping[str, Any],
    pool: Mapping[str, Any],
) -> None:
    baskets = pool.get("baskets", {})
    references = pool.get("references", {})
    if not isinstance(baskets, dict) or len(baskets) < 2:
        raise ValueError("rotation pool must contain at least two baskets")
    if not isinstance(references, dict) or len(references) < 2:
        raise ValueError("rotation pool must contain benchmark and context references")
    if str(pool.get("market")) != str(spec.get("market")):
        raise ValueError("rotation pool and spec market must match")

    benchmark = str(spec.get("market_regime", {}).get("reference", ""))
    context = str(spec.get("sector_context", {}).get("reference", ""))
    if benchmark not in references:
        raise ValueError(f"market benchmark {benchmark} is absent from pool references")
    if context not in references:
        raise ValueError(f"sector/style context {context} is absent from pool references")
    if references[benchmark].get("role") != "market_regime_and_benchmark":
        raise ValueError("benchmark reference role is invalid")

    symbols = _candidate_symbols(pool)
    if not symbols or len(symbols) != len(set(symbols)):
        raise ValueError("pool candidates must be non-empty and unique")
    if set(symbols).intersection(references):
        raise ValueError("reference instruments cannot be trading candidates")
    for name, basket in baskets.items():
        members = list(basket.get("symbols", []))
        if len(members) < 2:
            raise ValueError(f"basket {name} must contain at least two symbols")

    architecture = spec.get("architecture", {})
    if architecture.get("layers") != [
        "market_regime",
        "basket_cross_section",
        "security_cross_section",
        "security_timing",
    ]:
        raise ValueError("unexpected hierarchical rotation layers")
    if architecture.get("cross_market_ranking_allowed") is not False:
        raise ValueError("cross-market ranking must remain disabled")
    timing = architecture.get("security_timing_component", {})
    if timing.get("source_universe_reused") is not False:
        raise ValueError("legacy timing universe must not be reused")
    if timing.get("candidate_universe_source") != "pool_spec.baskets":
        raise ValueError("candidate universe must come from the versioned pool")

    rotation = spec.get("rotation", {})
    if int(rotation.get("rebalance_every_n_benchmark_sessions", 0)) <= 0:
        raise ValueError("rotation frequency must be positive")
    if int(rotation.get("maximum_selected_baskets", 0)) <= 0:
        raise ValueError("maximum selected baskets must be positive")
    if int(rotation.get("maximum_selected_symbols_per_basket", 0)) <= 0:
        raise ValueError("maximum symbols per basket must be positive")
    if not str(rotation.get("rotation_anchor_date", "")).strip():
        raise ValueError("rotation anchor date is required")

    components = rotation.get("score", {}).get("components", {})
    if set(components) != set(_SCORE_FIELDS):
        raise ValueError("unexpected basket score components")
    weights = [float(components[field]["weight"]) for field in _SCORE_FIELDS]
    if not np.isclose(sum(weights), 1.0):
        raise ValueError("basket score weights must sum to one")
    if any(components[field].get("direction") != "higher_is_better" for field in _SCORE_FIELDS):
        raise ValueError("all v1 basket score components must rank higher as better")

    selection = spec.get("security_selection", {})
    if selection.get("state_is_absolute_filter_not_primary_rank") is not True:
        raise ValueError("security state must remain an absolute filter")
    security_components = selection.get("cross_section", {}).get("components", {})
    if set(security_components) != set(_SECURITY_SCORE_FIELDS):
        raise ValueError("unexpected security cross-sectional score components")
    security_weights = [
        float(security_components[field]["weight"]) for field in _SECURITY_SCORE_FIELDS
    ]
    if not np.isclose(sum(security_weights), 1.0):
        raise ValueError("security score weights must sum to one")
    for field in _SECURITY_SCORE_FIELDS:
        direction = security_components[field].get("direction")
        if direction not in {"higher_is_better", "lower_is_better"}:
            raise ValueError(f"invalid security score direction for {field}")

    parameter_search = spec.get("parameter_search", {})
    if not parameter_search or any(bool(value) for value in parameter_search.values()):
        raise ValueError("all parameter-search switches must remain disabled")
    if spec.get("objective", {}).get("model_fitting") is not False:
        raise ValueError("rotation v1 cannot fit a model")
    if spec.get("pool_governance", {}).get("membership_hash_required") is not True:
        raise ValueError("pool membership hash must be required")''',
          )

          replace_function(
              "build_runtime_timing_spec",
              "build_pool_identity",
              r'''def build_runtime_timing_spec(
    spec: Mapping[str, Any],
    pool: Mapping[str, Any],
    *,
    repository_root: Path,
) -> tuple[dict[str, Any], Path]:
    component = spec["architecture"]["security_timing_component"]
    formula_path = repository_root / str(component["formula_source"])
    runtime = copy.deepcopy(load_focus_signal_spec(formula_path))

    candidates = _candidate_symbols(pool)
    references = pool["references"]
    benchmark = str(spec["market_regime"]["reference"])
    context = str(spec["sector_context"]["reference"])
    provider_aliases: dict[str, str] = {}
    for display, metadata in references.items():
        provider = str(metadata.get("provider_symbol", display))
        if provider != str(display):
            provider_aliases[str(display)] = provider
    for display, metadata in pool.get("symbol_metadata", {}).items():
        provider = str(metadata.get("provider_symbol", display))
        if provider != str(display):
            provider_aliases[str(display)] = provider

    runtime["market"] = str(spec["market"])
    runtime["benchmark"] = benchmark
    runtime["universe"] = {
        "source": str(pool["pool_id"]),
        "universe_id": str(pool["pool_id"]),
        "membership_mode": "fixed_predeclared",
        "symbols": [*candidates, benchmark, context],
        "signal_symbols": candidates,
        "market_reference_symbols": [benchmark],
        "sector_reference_symbols": [context],
        "provider_aliases": provider_aliases,
        "minimum_sessions_for_full_evaluation": 504,
        "insufficient_history_policy": "short_history_diagnostic_or_forward_only",
        "silent_exclusion_allowed": False,
    }
    runtime["signal"]["market_regime"]["reference"] = benchmark
    runtime["signal"]["sector_context"]["reference"] = context
    runtime["risk"]["symbol_tiers"] = {symbol: "core" for symbol in candidates}
    runtime["risk"]["reference_roles"] = {
        str(symbol): str(metadata.get("role", "informational_context"))
        for symbol, metadata in references.items()
    }
    validate_focus_signal_spec(runtime)
    return runtime, formula_path''',
          )

          replace_function(
              "build_pool_identity",
              "compute_rotation_indicators",
              r'''def build_pool_identity(
    pool: Mapping[str, Any],
    *,
    pool_path: Path,
) -> dict[str, Any]:
    baskets = {
        str(name): [str(symbol) for symbol in basket["symbols"]]
        for name, basket in pool["baskets"].items()
    }
    references = {
        str(symbol): dict(metadata)
        for symbol, metadata in pool["references"].items()
    }
    symbol_metadata = {
        str(symbol): dict(metadata)
        for symbol, metadata in pool.get("symbol_metadata", {}).items()
    }
    membership_payload = {
        "pool_id": str(pool["pool_id"]),
        "market": str(pool["market"]),
        "status": str(pool.get("status", "frozen")),
        "baskets": baskets,
        "references": references,
        "symbol_metadata": symbol_metadata,
        "primary_basket_only": bool(pool["primary_basket_only"]),
    }
    candidates = [symbol for symbols in baskets.values() for symbol in symbols]
    return {
        "schema_version": "1.1",
        "pool_id": str(pool["pool_id"]),
        "market": str(pool["market"]),
        "status": str(pool.get("status", "frozen")),
        "authoritative_for_performance": bool(
            pool.get("authoritative_for_performance", True)
        ),
        "pool_file_sha256": sha256_file(pool_path),
        "membership_identity_sha256": canonical_sha256(membership_payload),
        "candidate_count": len(candidates),
        "basket_count": len(baskets),
        "baskets": baskets,
        "references": references,
        "symbol_metadata": symbol_metadata,
    }''',
          )

          replace_function(
              "compute_rotation_indicators",
              "_state_frame",
              r'''def compute_rotation_indicators(
    prices: pd.DataFrame,
    timing_spec: Mapping[str, Any],
) -> pd.DataFrame:
    indicators = compute_focus_indicators(prices, timing_spec)
    enriched: list[pd.DataFrame] = []
    for _, raw_group in indicators.groupby("symbol", sort=False):
        group = raw_group.sort_values("date").copy()
        returns = group["close"].pct_change()
        group["momentum_20"] = group["close"] / group["close"].shift(20) - 1.0
        group["high_63"] = group["close"].rolling(63, min_periods=63).max()
        group["drawdown_from_63d_high"] = group["close"] / group["high_63"] - 1.0
        group["realized_volatility_20"] = returns.rolling(20, min_periods=20).std()
        group["relative_momentum_63_vs_benchmark"] = group[
            "rel_mom_63_vs_qqq"
        ]
        enriched.append(group)
    return pd.concat(enriched, ignore_index=True).sort_values(
        ["symbol", "date"]
    ).reset_index(drop=True)''',
          )

          replace_function(
              "_rotation_dates",
              "_basket_snapshot",
              r'''def _rotation_dates(
    indicators: pd.DataFrame,
    spec: Mapping[str, Any],
) -> list[pd.Timestamp]:
    benchmark = str(spec["market_regime"]["reference"])
    benchmark_dates = [
        pd.Timestamp(value)
        for value in sorted(
            indicators.loc[
                indicators["symbol"] == benchmark, "date"
            ].dropna().unique()
        )
    ]
    anchor = pd.Timestamp(spec["rotation"]["rotation_anchor_date"])
    eligible = [date for date in benchmark_dates if date >= anchor]
    step = int(spec["rotation"]["rebalance_every_n_benchmark_sessions"])
    return eligible[::step]''',
          )

          replace_function(
              "_basket_snapshot",
              "_add_component_ranks",
              r'''def _basket_snapshot(
    date: pd.Timestamp,
    basket_name: str,
    members: list[str],
    indicators: pd.DataFrame,
    states: pd.DataFrame,
    spec: Mapping[str, Any],
) -> dict[str, Any]:
    day = indicators[
        (indicators["date"] == date) & indicators["symbol"].isin(members)
    ].copy()
    metric_columns = (
        "relative_momentum_63_vs_benchmark",
        "momentum_20",
        "sma_50",
        "drawdown_from_63d_high",
    )
    ready = day.dropna(subset=list(metric_columns))
    eligible_count = int(ready.shape[0])
    coverage_ratio = eligible_count / len(members)
    breadth = None
    median_relative = None
    median_momentum = None
    median_drawdown = None
    if not ready.empty:
        breadth = float((ready["close"] > ready["sma_50"]).mean())
        median_relative = float(
            ready["relative_momentum_63_vs_benchmark"].median()
        )
        median_momentum = float(ready["momentum_20"].median())
        median_drawdown = float(ready["drawdown_from_63d_high"].median())

    eligibility = spec["rotation"]["eligibility"]
    reasons: list[str] = []
    if eligible_count < int(eligibility["minimum_eligible_constituents"]):
        reasons.append("BASKET_INSUFFICIENT_ELIGIBLE_CONSTITUENTS")
    if coverage_ratio < float(eligibility["minimum_constituent_coverage_ratio"]):
        reasons.append("BASKET_INSUFFICIENT_COVERAGE")
    if breadth is None or breadth < float(eligibility["minimum_breadth_above_sma50"]):
        reasons.append("BASKET_BREADTH_BELOW_GATE")
    if (
        bool(eligibility["require_positive_median_relative_momentum_63"])
        and (median_relative is None or median_relative <= 0)
    ):
        reasons.append("BASKET_RELATIVE_MOMENTUM_NONPOSITIVE")

    state_day = states[
        (states["date"] == date) & states["symbol"].isin(members)
    ]
    eligible_states = {
        state
        for state, multiplier in spec["security_selection"]["eligible_states"].items()
        if float(multiplier) > 0
    }
    state_eligible_count = int(state_day["state"].isin(eligible_states).sum())
    return {
        "date": date.date().isoformat(),
        "basket": basket_name,
        "members": members,
        "eligible_constituents": sorted(ready["symbol"].astype(str).tolist()),
        "eligible_constituent_count": eligible_count,
        "constituent_coverage_ratio": float(coverage_ratio),
        "state_eligible_security_count": state_eligible_count,
        "median_relative_momentum_63_vs_benchmark": median_relative,
        "median_momentum_20": median_momentum,
        "breadth_above_sma50": breadth,
        "median_drawdown_from_63d_high": median_drawdown,
        "pre_score_eligible": not reasons,
        "composite_percentile": None,
        "score_gate_passed": False,
        "selected": False,
        "reason_codes": reasons,
    }''',
          )

          replace_function(
              "_select_securities",
              "build_rotation_history",
              r'''def _select_securities(
    date: pd.Timestamp,
    basket_name: str,
    members: list[str],
    indicators: pd.DataFrame,
    states: pd.DataFrame,
    spec: Mapping[str, Any],
) -> tuple[list[dict[str, Any]], list[dict[str, Any]]]:
    day = indicators[
        (indicators["date"] == date) & indicators["symbol"].isin(members)
    ][["symbol", *_SECURITY_SCORE_FIELDS]].copy()
    state_day = states[
        (states["date"] == date) & states["symbol"].isin(members)
    ].merge(day, on="symbol", how="left", validate="one_to_one")

    multipliers = {
        str(state): float(value)
        for state, value in spec["security_selection"]["eligible_states"].items()
    }
    priorities = {
        str(state): int(value)
        for state, value in spec["security_selection"]["cross_section"][
            "state_priority"
        ].items()
    }
    state_day["exposure_multiplier"] = state_day["state"].map(multipliers).fillna(0.0)
    state_day["state_priority"] = state_day["state"].map(priorities).fillna(0).astype(int)
    state_day["absolute_state_eligible"] = state_day["exposure_multiplier"] > 0
    state_day["indicator_complete"] = state_day[
        list(_SECURITY_SCORE_FIELDS)
    ].notna().all(axis=1)
    eligible = state_day[
        state_day["absolute_state_eligible"] & state_day["indicator_complete"]
    ].copy()

    cross_section = spec["security_selection"]["cross_section"]
    components = cross_section["components"]
    for field in _SECURITY_SCORE_FIELDS:
        ascending = components[field]["direction"] == "higher_is_better"
        eligible[f"{field}_percentile"] = eligible[field].rank(
            method="average", pct=True, ascending=ascending
        )
    if not eligible.empty:
        eligible["security_composite_percentile"] = sum(
            eligible[f"{field}_percentile"] * float(components[field]["weight"])
            for field in _SECURITY_SCORE_FIELDS
        )
    else:
        eligible["security_composite_percentile"] = pd.Series(dtype="float64")
    minimum = float(cross_section["minimum_composite_percentile"])
    eligible["security_score_gate_passed"] = (
        eligible["security_composite_percentile"] >= minimum
    )
    eligible = eligible.sort_values(
        ["security_composite_percentile", "state_priority", "symbol"],
        ascending=[False, False, True],
    )

    limit = int(spec["rotation"]["maximum_selected_symbols_per_basket"])
    selected_symbols = set(
        eligible.loc[eligible["security_score_gate_passed"], "symbol"].head(limit)
    )
    score_rows: list[dict[str, Any]] = []
    eligible_by_symbol = eligible.set_index("symbol", drop=False)
    for _, row in state_day.sort_values("symbol").iterrows():
        symbol = str(row["symbol"])
        scored = symbol in eligible_by_symbol.index
        scored_row = eligible_by_symbol.loc[symbol] if scored else None
        reasons: list[str] = []
        if not bool(row["absolute_state_eligible"]):
            reasons.append("SECURITY_ABSOLUTE_STATE_INELIGIBLE")
        if not bool(row["indicator_complete"]):
            reasons.append("SECURITY_SCORE_INPUT_INCOMPLETE")
        gate_passed = bool(scored_row["security_score_gate_passed"]) if scored else False
        if scored and not gate_passed:
            reasons.append("SECURITY_COMPOSITE_BELOW_GATE")
        selected = symbol in selected_symbols
        if selected:
            reasons.append("SECURITY_SELECTED_WITHIN_BASKET")
        elif gate_passed:
            reasons.append("SECURITY_NOT_SELECTED_SCORE_ORDER")
        payload: dict[str, Any] = {
            "date": date.date().isoformat(),
            "basket": basket_name,
            "symbol": symbol,
            "state": str(row["state"]),
            "absolute_state_eligible": bool(row["absolute_state_eligible"]),
            "indicator_complete": bool(row["indicator_complete"]),
            "security_composite_percentile": (
                None if not scored else float(scored_row["security_composite_percentile"])
            ),
            "security_score_gate_passed": gate_passed,
            "selected": selected,
            "reason_codes": reasons,
        }
        for field in _SECURITY_SCORE_FIELDS:
            payload[field] = None if pd.isna(row[field]) else float(row[field])
            payload[f"{field}_percentile"] = (
                None if not scored else float(scored_row[f"{field}_percentile"])
            )
        score_rows.append(payload)

    selected_rows: list[dict[str, Any]] = []
    for _, row in eligible[
        eligible["security_score_gate_passed"] & eligible["symbol"].isin(selected_symbols)
    ].head(limit).iterrows():
        selected_rows.append(
            {
                "symbol": str(row["symbol"]),
                "state": str(row["state"]),
                "state_priority": int(row["state_priority"]),
                "security_composite_percentile": float(
                    row["security_composite_percentile"]
                ),
                "relative_momentum_63_vs_benchmark": float(
                    row["relative_momentum_63_vs_benchmark"]
                ),
                "momentum_20": float(row["momentum_20"]),
                "drawdown_from_63d_high": float(row["drawdown_from_63d_high"]),
                "realized_volatility_20": float(row["realized_volatility_20"]),
                "exposure_multiplier": float(row["exposure_multiplier"]),
                "state_reason_codes": list(row["reason_codes"]),
                "trailing_stop_3atr": row["trailing_stop_3atr"],
            }
        )
    return selected_rows, score_rows''',
          )

          replace_function(
              "build_rotation_history",
              "build_portfolio_state_history",
              r'''def build_rotation_history(
    indicators: pd.DataFrame,
    signal_history: list[dict[str, Any]],
    spec: Mapping[str, Any],
    pool: Mapping[str, Any],
) -> tuple[list[dict[str, Any]], list[dict[str, Any]], list[dict[str, Any]]]:
    states = _state_frame(signal_history)
    benchmark_symbol = str(spec["market_regime"]["reference"])
    benchmark = indicators[indicators["symbol"] == benchmark_symbol].set_index("date")
    next_sessions = _next_session_map(benchmark.reset_index()["date"])
    basket_score_history: list[dict[str, Any]] = []
    security_score_history: list[dict[str, Any]] = []
    rotations: list[dict[str, Any]] = []

    for date in _rotation_dates(indicators, spec):
        snapshots = [
            _basket_snapshot(
                date,
                str(name),
                [str(symbol) for symbol in basket["symbols"]],
                indicators,
                states,
                spec,
            )
            for name, basket in pool["baskets"].items()
        ]
        _add_component_ranks(snapshots, spec)

        benchmark_row = benchmark.loc[date]
        risk_on = (
            bool(benchmark_row["risk_on"])
            if not pd.isna(benchmark_row["risk_on"])
            else False
        )
        selected_baskets: list[str] = []
        selected_symbols: dict[str, list[dict[str, Any]]] = {}
        rotation_reasons: list[str] = []
        if not risk_on:
            rotation_reasons.append("ROTATION_MARKET_RISK_OFF")
        else:
            candidates = sorted(
                [snapshot for snapshot in snapshots if snapshot["score_gate_passed"]],
                key=lambda item: (-float(item["composite_percentile"]), item["basket"]),
            )
            for snapshot in candidates:
                securities, security_scores = _select_securities(
                    date,
                    str(snapshot["basket"]),
                    list(snapshot["members"]),
                    indicators,
                    states,
                    spec,
                )
                security_score_history.extend(security_scores)
                if not securities:
                    snapshot["reason_codes"].append(
                        "BASKET_NO_CROSS_SECTION_ELIGIBLE_SECURITY"
                    )
                    continue
                basket_name = str(snapshot["basket"])
                selected_baskets.append(basket_name)
                selected_symbols[basket_name] = securities
                snapshot["selected"] = True
                snapshot["reason_codes"].append("BASKET_SELECTED")
                if len(selected_baskets) >= int(
                    spec["rotation"]["maximum_selected_baskets"]
                ):
                    break
            if not selected_baskets:
                rotation_reasons.append("ROTATION_NO_ELIGIBLE_BASKET")

        selected_set = set(selected_baskets)
        for snapshot in snapshots:
            if (
                snapshot["score_gate_passed"]
                and snapshot["basket"] not in selected_set
                and "BASKET_NO_CROSS_SECTION_ELIGIBLE_SECURITY"
                not in snapshot["reason_codes"]
            ):
                snapshot["reason_codes"].append("BASKET_NOT_SELECTED_SCORE_ORDER")
            basket_score_history.append(snapshot)

        actionable = next_sessions.get(date)
        rotations.append(
            {
                "date": date.date().isoformat(),
                "actionable_from": (
                    None if actionable is None else actionable.date().isoformat()
                ),
                "risk_on": risk_on,
                "market_regime": str(benchmark_row["market_regime"]),
                "benchmark": benchmark_symbol,
                "selected_baskets": selected_baskets,
                "selected_symbols_by_basket": selected_symbols,
                "reason_codes": rotation_reasons or ["ROTATION_SELECTION_COMPLETED"],
            }
        )
    return basket_score_history, security_score_history, rotations''',
          )

          replace_function(
              "build_portfolio_state_history",
              "run_small_pool_rotation",
              r'''def build_portfolio_state_history(
    indicators: pd.DataFrame,
    signal_history: list[dict[str, Any]],
    rotations: list[dict[str, Any]],
    spec: Mapping[str, Any],
) -> list[dict[str, Any]]:
    states = _state_frame(signal_history).set_index(["date", "symbol"])
    benchmark_symbol = str(spec["market_regime"]["reference"])
    benchmark = indicators[indicators["symbol"] == benchmark_symbol].sort_values("date")
    next_sessions = _next_session_map(benchmark["date"])
    rotations_by_date = {
        pd.Timestamp(row["date"]): row
        for row in rotations
    }
    multipliers = {
        str(state): float(value)
        for state, value in spec["security_selection"]["eligible_states"].items()
    }

    current_rotation: dict[str, Any] | None = None
    history: list[dict[str, Any]] = []
    for _, benchmark_row in benchmark.iterrows():
        date = pd.Timestamp(benchmark_row["date"])
        if date in rotations_by_date:
            current_rotation = rotations_by_date[date]

        risk_on = (
            bool(benchmark_row["risk_on"])
            if not pd.isna(benchmark_row["risk_on"])
            else False
        )
        selected_baskets = (
            list(current_rotation["selected_baskets"])
            if current_rotation is not None
            else []
        )
        selected_map = (
            dict(current_rotation["selected_symbols_by_basket"])
            if current_rotation is not None
            else {}
        )
        positions: list[dict[str, Any]] = []
        reasons: list[str] = []
        if not risk_on:
            reasons.append("PORTFOLIO_MARKET_RISK_OFF")
        if not selected_baskets:
            reasons.append("PORTFOLIO_NO_SELECTED_BASKET")

        basket_weight = 1.0 / len(selected_baskets) if selected_baskets else 0.0
        for basket in selected_baskets:
            selected = list(selected_map.get(basket, []))
            symbol_weight = basket_weight / len(selected) if selected else 0.0
            for selected_row in selected:
                symbol = str(selected_row["symbol"])
                state = "MISSING"
                state_reasons = ["MISSING_STATE_FAIL_CLOSED"]
                trailing_stop = None
                if (date, symbol) in states.index:
                    state_row = states.loc[(date, symbol)]
                    if isinstance(state_row, pd.DataFrame):
                        raise ValueError(f"duplicate signal state for {date} {symbol}")
                    state = str(state_row["state"])
                    state_reasons = list(state_row["reason_codes"])
                    trailing_stop = state_row["trailing_stop_3atr"]
                multiplier = multipliers.get(state, 0.0)
                target_weight = symbol_weight * multiplier if risk_on else 0.0
                positions.append(
                    {
                        "basket": basket,
                        "symbol": symbol,
                        "state": state,
                        "target_weight": float(target_weight),
                        "state_multiplier": float(multiplier),
                        "security_composite_percentile": selected_row.get(
                            "security_composite_percentile"
                        ),
                        "state_reason_codes": state_reasons,
                        "trailing_stop_3atr": trailing_stop,
                    }
                )

        gross = float(sum(position["target_weight"] for position in positions))
        if gross > float(spec["portfolio"]["maximum_gross_exposure"]) + 1e-12:
            raise ValueError("portfolio gross exposure exceeds frozen maximum")
        actionable = next_sessions.get(date)
        history.append(
            {
                "date": date.date().isoformat(),
                "actionable_from": (
                    None if actionable is None else actionable.date().isoformat()
                ),
                "rotation_date": (
                    None if current_rotation is None else current_rotation["date"]
                ),
                "risk_on": risk_on,
                "market_regime": str(benchmark_row["market_regime"]),
                "benchmark": benchmark_symbol,
                "selected_baskets": selected_baskets,
                "positions": positions,
                "gross_exposure": gross,
                "cash_weight": float(1.0 - gross),
                "reason_codes": reasons or ["PORTFOLIO_ROTATION_ACTIVE"],
            }
        )
    return history''',
          )

