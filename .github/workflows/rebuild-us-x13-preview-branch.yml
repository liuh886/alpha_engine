name: Rebuild US x1.3 Preview Branch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-us-x13-preview-branch.yml"
      - "scripts/build_us_x1_3_preview.py"
      - "src/artifacts/us_x1_3_preview.py"
      - "tests/test_us_x1_3_preview_publication.py"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      US_CUTOFF: "2026-08-18"
      GENERATED_AT: "2026-08-19T16:49:37Z"
      SOURCE_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve exact governed provider cache
        id: contract
        run: |
          python -m scripts.govern_formal_provider_cache contract \
            --root . --market us --start 2021-01-01 \
            --cutoff "$US_CUTOFF" \
            --output artifacts/provider-us-contract.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore exact US provider cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/formal-refresh/provider-us
          key: ${{ steps.contract.outputs.cache_key }}-governed
          fail-on-cache-miss: true

      - name: Verify restored provider cache
        run: |
          python -m scripts.govern_formal_provider_cache verify \
            --provider-root artifacts/formal-refresh/provider-us \
            --contract artifacts/provider-us-contract.json \
            --receipt artifacts/formal-refresh/provider-us/artifacts/formal-provider-cache-receipt.json

      - name: Install locked runtime
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Rebuild US x1.3 preview from canonical signal ledger
        run: |
          rm -rf artifacts/us-preview
          uv run python scripts/build_us_x1_3_preview.py \
            --root . \
            --provider-dir artifacts/formal-refresh/provider-us/data/providers/us \
            --generated-at "$GENERATED_AT" \
            --output-root artifacts/us-preview/model-runs

      - name: Install rebuilt US bundle into preview catalog
        run: |
          uv run python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          from src.artifacts.model_run_exporter import update_catalog

          repo = Path.cwd()
          generated = repo / "artifacts/us-preview/model-runs"
          manifests = list(generated.glob("us_ranker/us_x1_3/*/manifest.json"))
          if len(manifests) != 1:
              raise SystemExit(f"expected one rebuilt US x1.3 manifest, found {len(manifests)}")
          generated_manifest = manifests[0]
          destination_root = repo / "data/research/model_runs"
          current_catalog = json.loads((destination_root / "catalog.json").read_text(encoding="utf-8"))
          retained = [
              destination_root / str(row["manifest_path"])
              for row in current_catalog["records"]
              if row.get("model_version_id") != "us_x1_3"
          ]
          us_root = destination_root / "us_ranker/us_x1_3"
          if us_root.exists():
              shutil.rmtree(us_root)
          target = us_root / generated_manifest.parent.name
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(generated_manifest.parent, target)
          retained.append(target / "manifest.json")
          update_catalog(
              retained,
              catalog_path=destination_root / "catalog.json",
              channel="preview",
          )
          PY

      - name: Validate rebuilt preview
        run: |
          uv run pytest tests/test_us_x1_3_preview_publication.py -q --strict-markers --tb=short
          uv run python scripts/check_repository_model_runs.py

      - name: Commit rebuilt evidence to source branch
        run: |
          git config user.name "AlphaEngine Evidence Builder"
          git config user.email "evidence-builder@alphaengine.local"
          git add data/research/model_runs
          if git diff --cached --quiet; then
            echo "No preview evidence changed."
            exit 0
          fi
          git commit -m "data: rebuild US x1.3 preview through ${US_CUTOFF}"
          git push origin "HEAD:${SOURCE_BRANCH}"
