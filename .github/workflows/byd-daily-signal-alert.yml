name: BYD v1.2 Daily Signal

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/byd-daily-signal-alert.yml"
      - "src/research/byd_signal_alerts.py"
      - "scripts/run_byd_signal_alert.py"
      - "tests/test_byd_signal_alerts.py"
      - "qlib-dashboard/src/lib/byd-runtime.ts"
      - "qlib-dashboard/src/pages/StrategyOperationsPage.tsx"
  push:
    branches: [main]
    paths:
      - "data/research/byd_v1_2_trend_expansion_prospective/observations/**"
      - "data/research/byd_v1_2_trend_expansion_prospective/manifest.json"
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

concurrency:
  group: byd-v1-2-daily-signal-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  SIGNAL_DIR: artifacts/signals/byd_v1_2
  LEDGER_DIR: data/research/byd_v1_2_signal_ledger

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate formal signal contract
        run: |
          uv run ruff check \
            src/research/byd_signal_alerts.py \
            scripts/run_byd_signal_alert.py \
            tests/test_byd_signal_alerts.py
          uv run pytest tests/test_byd_signal_alerts.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1

  evaluate-and-deliver:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate signal implementation
        run: |
          uv run ruff check \
            src/research/byd_signal_alerts.py \
            scripts/run_byd_signal_alert.py \
            tests/test_byd_signal_alerts.py
          uv run pytest tests/test_byd_signal_alerts.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Build exact formal signal
        id: signal
        run: |
          uv run python scripts/run_byd_signal_alert.py \
            --shadow-store data/research/byd_prospective_shadow \
            --paired-store data/research/byd_515180_prospective \
            --expansion-store data/research/byd_v1_2_trend_expansion_prospective \
            --state-store "$LEDGER_DIR" \
            --output-dir "$SIGNAL_DIR" \
            --github-output "$GITHUB_OUTPUT"
      - name: Create deduplicated evidence issue
        id: issue
        if: steps.signal.outputs.should_alert == 'true'
        uses: actions/github-script@v8
        env:
          ALERT_FINGERPRINT: ${{ steps.signal.outputs.fingerprint }}
          ALERT_TITLE: ${{ steps.signal.outputs.title }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = `<!-- signal-fingerprint:${process.env.ALERT_FINGERPRINT} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((item) =>
              !item.pull_request && String(item.body || '').includes(marker)
            );
            if (existing) {
              core.notice(`Signal already recorded in issue #${existing.number}.`);
              core.setOutput('issue_number', String(existing.number));
              core.setOutput('created', 'false');
              return;
            }
            const report = fs.readFileSync(`${process.env.SIGNAL_DIR}/signal_alert.md`, 'utf8');
            const signal = fs.readFileSync(`${process.env.SIGNAL_DIR}/signal_alert.json`, 'utf8').trim();
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: process.env.ALERT_TITLE,
              body: `@${context.repo.owner}\n\n${report}\n\n\u0060\u0060\u0060json\n${signal}\n\u0060\u0060\u0060\n`,
              assignees: [context.repo.owner],
            });
            core.setOutput('issue_number', String(created.data.number));
            core.setOutput('created', 'true');
      - name: Send Telegram signal
        id: telegram
        if: steps.signal.outputs.should_alert == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "status=skipped_not_configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          response="$(curl --fail --silent --show-error --write-out '\n%{http_code}' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@${SIGNAL_DIR}/signal_alert_telegram.txt" \
            --data-urlencode "disable_web_page_preview=true" 2>&1)"
          status=$?
          set -e
          http_code="$(printf '%s\n' "$response" | tail -n 1)"
          body="$(printf '%s\n' "$response" | head -n -1)"
          if [[ "$status" -eq 0 && "$http_code" == "200" ]]; then
            message_id="$(printf '%s' "$body" | python -c "import json,sys; print(json.load(sys.stdin)['result']['message_id'])")"
            echo "status=sent" >> "$GITHUB_OUTPUT"
            echo "message_id=$message_id" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            printf 'error=%s\n' "${body:0:500}" >> "$GITHUB_OUTPUT"
          fi
      - name: Persist evaluation and delivery receipt
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          ISSUE_CREATED: ${{ steps.issue.outputs.created }}
          TELEGRAM_STATUS: ${{ steps.telegram.outputs.status }}
          TELEGRAM_MESSAGE_ID: ${{ steps.telegram.outputs.message_id }}
          TELEGRAM_ERROR: ${{ steps.telegram.outputs.error }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          signal_dir = Path(os.environ['SIGNAL_DIR'])
          ledger = Path(os.environ['LEDGER_DIR'])
          signal = json.loads((signal_dir / 'signal_alert.json').read_text(encoding='utf-8'))
          fingerprint = signal['fingerprint']
          signal_date = signal['signal_date']
          records = ledger / 'records'
          deliveries = ledger / 'deliveries'
          records.mkdir(parents=True, exist_ok=True)
          deliveries.mkdir(parents=True, exist_ok=True)

          canonical = json.dumps(
              signal,
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
              allow_nan=False,
          ) + '\n'
          record_path = records / f'{signal_date}-{fingerprint}.json'
          if record_path.exists() and record_path.read_text(encoding='utf-8') != canonical:
              raise RuntimeError(f'append-only signal drift: {record_path}')
          record_path.write_text(canonical, encoding='utf-8')

          old_latest = None
          latest_path = ledger / 'latest.json'
          if latest_path.exists():
              old_latest = json.loads(latest_path.read_text(encoding='utf-8'))
          delivery_status = os.environ.get('TELEGRAM_STATUS') or 'not_required'
          if (
              old_latest
              and old_latest.get('fingerprint') == fingerprint
              and old_latest.get('delivery_status') == 'sent'
              and delivery_status == 'not_required'
          ):
              delivery_status = 'sent'
          latest = dict(signal)
          latest['delivery_status'] = delivery_status
          latest['github_issue_number'] = (
              int(os.environ['ISSUE_NUMBER']) if os.environ.get('ISSUE_NUMBER') else None
          )
          latest_path.parent.mkdir(parents=True, exist_ok=True)
          latest_path.write_text(
              json.dumps(latest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          delivery_path = deliveries / f'{fingerprint}.json'
          if not delivery_path.exists():
              receipt = {
                  'schema_version': 'byd_v1_2_delivery_v1',
                  'model_id': signal['model_id'],
                  'fingerprint': fingerprint,
                  'signal_date': signal_date,
                  'should_alert': signal['should_alert'],
                  'github_issue': {
                      'number': int(os.environ['ISSUE_NUMBER']) if os.environ.get('ISSUE_NUMBER') else None,
                      'created': os.environ.get('ISSUE_CREATED') == 'true',
                  },
                  'telegram': {
                      'status': os.environ.get('TELEGRAM_STATUS') or 'not_required',
                      'message_id': int(os.environ['TELEGRAM_MESSAGE_ID']) if os.environ.get('TELEGRAM_MESSAGE_ID') else None,
                      'error': os.environ.get('TELEGRAM_ERROR') or None,
                  },
                  'workflow': {
                      'run_id': os.environ['GITHUB_RUN_ID'],
                      'commit_sha': os.environ['GITHUB_SHA'],
                  },
                  'record_sha256': hashlib.sha256(canonical.encode()).hexdigest(),
                  'created_at_utc': datetime.now(timezone.utc).isoformat(),
                  'research_only': True,
                  'trade_ready': False,
              }
              delivery_path.write_text(
                  json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )

          manifest = {
              'schema_version': 'byd_v1_2_signal_ledger_v1',
              'model_id': signal['model_id'],
              'latest_signal_date': signal_date,
              'latest_fingerprint': fingerprint,
              'record_count': len(list(records.glob('*.json'))),
              'delivery_count': len(list(deliveries.glob('*.json'))),
              'append_only_records': True,
              'research_only': True,
              'trade_ready': False,
          }
          (ledger / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Commit durable signal ledger
        run: |
          git config user.name "AlphaEngine Signal Agent"
          git config user.email "signal-agent@alphaengine.local"
          git add "$LEDGER_DIR"
          if git diff --cached --quiet; then
            echo "Signal evaluation is already persisted."
          else
            git commit -m "signal: append BYD v1.2 evaluation ${{ steps.signal.outputs.signal_date }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload finalized signal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byd-v1-2-signal-${{ github.run_id }}
          path: |
            artifacts/signals/byd_v1_2
            data/research/byd_v1_2_signal_ledger
          if-no-files-found: error
          retention-days: 90
      - name: Fail after persisting a configured Telegram delivery error
        if: steps.telegram.outputs.status == 'failed'
        run: exit 1
