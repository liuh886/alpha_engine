name: BYD v1.3 Daily Signal

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/byd-daily-signal-alert.yml"
      - "src/research/byd_signal_alerts.py"
      - "src/research/byd_signal_evidence.py"
      - "src/factors/strategy_snapshot.py"
      - "configs/factor_libraries/strategy_inputs.yaml"
      - "src/artifacts/strategy_signal_ledger.py"
      - "scripts/run_byd_signal_alert.py"
      - "scripts/persist_strategy_signal_evaluation.py"
      - "tests/test_byd_signal_alerts.py"
      - "tests/test_byd_signal_evidence.py"
      - "data/research/byd_v1_3_low_vol_prospective/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/byd-daily-signal-alert.yml"
      - "src/research/byd_signal_alerts.py"
      - "src/research/byd_signal_evidence.py"
      - "src/factors/strategy_snapshot.py"
      - "configs/factor_libraries/strategy_inputs.yaml"
      - "src/artifacts/strategy_signal_ledger.py"
      - "scripts/run_byd_signal_alert.py"
      - "scripts/persist_strategy_signal_evaluation.py"
      - "data/research/byd_v1_3_low_vol_prospective/**"
  workflow_run:
    workflows:
      - "BYD v1.3 Prospective Evidence"
      - "Reviewed Formal Backtest Refresh"
    types: [completed]
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

concurrency:
  group: strategy-operations-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  SIGNAL_DIR: artifacts/signals/byd_v1_3
  MODEL_VERSION_ID: byd_v1_3_recovery_event_low_vol_confirmation_v1
  LEDGER_DIR: data/research/strategy_signal_ledgers/byd_v1_3_recovery_event_low_vol_confirmation_v1
  SOURCE_STORE: data/research/byd_v1_3_low_vol_prospective
  OPERATIONS_PATH: data/research/strategy_operations/snapshots.json

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate formal V1.3 signal contract
        run: |
          uv run ruff check \
            src/research/byd_signal_alerts.py \
            src/research/byd_signal_evidence.py \
            src/artifacts/strategy_signal_ledger.py \
            scripts/run_byd_signal_alert.py \
            scripts/persist_strategy_signal_evaluation.py \
            tests/test_byd_signal_alerts.py \
            tests/test_byd_signal_evidence.py
          uv run pytest \
            tests/test_byd_signal_alerts.py \
            tests/test_byd_signal_evidence.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1

  evaluate-and-deliver:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Capture executed source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate signal implementation
        run: |
          uv run ruff check \
            src/research/byd_signal_alerts.py \
            src/research/byd_signal_evidence.py \
            src/artifacts/strategy_signal_ledger.py \
            scripts/run_byd_signal_alert.py \
            scripts/persist_strategy_signal_evaluation.py
          uv run pytest \
            tests/test_byd_signal_alerts.py \
            tests/test_byd_signal_evidence.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Build exact formal V1.3 signal
        id: signal
        run: |
          uv run python scripts/run_byd_signal_alert.py \
            --source-store "$SOURCE_STORE" \
            --state-store "$LEDGER_DIR" \
            --output-dir "$SIGNAL_DIR" \
            --github-output "$GITHUB_OUTPUT"
      - name: Create deduplicated evidence issue
        id: issue
        if: steps.signal.outputs.should_alert == 'true'
        uses: actions/github-script@v8
        env:
          ALERT_FINGERPRINT: ${{ steps.signal.outputs.fingerprint }}
          ALERT_TITLE: ${{ steps.signal.outputs.title }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = `<!-- signal-fingerprint:${process.env.ALERT_FINGERPRINT} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((item) =>
              !item.pull_request && String(item.body || '').includes(marker)
            );
            if (existing) {
              core.notice(`Signal already recorded in issue #${existing.number}.`);
              core.setOutput('issue_number', String(existing.number));
              core.setOutput('created', 'false');
              return;
            }
            const report = fs.readFileSync(`${process.env.SIGNAL_DIR}/signal_alert.md`, 'utf8');
            const signal = fs.readFileSync(`${process.env.SIGNAL_DIR}/signal_alert.json`, 'utf8').trim();
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: process.env.ALERT_TITLE,
              body: `@${context.repo.owner}\n\n${report}\n\n\u0060\u0060\u0060json\n${signal}\n\u0060\u0060\u0060\n`,
              assignees: [context.repo.owner],
            });
            core.setOutput('issue_number', String(created.data.number));
            core.setOutput('created', 'true');
      - name: Send Telegram signal
        id: telegram
        if: steps.signal.outputs.should_alert == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "status=skipped_not_configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          response="$(curl --fail --silent --show-error --write-out '\n%{http_code}' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@${SIGNAL_DIR}/signal_alert_telegram.txt" \
            --data-urlencode "disable_web_page_preview=true" 2>&1)"
          status=$?
          set -e
          http_code="$(printf '%s\n' "$response" | tail -n 1)"
          body="$(printf '%s\n' "$response" | head -n -1)"
          if [[ "$status" -eq 0 && "$http_code" == "200" ]]; then
            message_id="$(printf '%s' "$body" | python -c "import json,sys; print(json.load(sys.stdin)['result']['message_id'])")"
            echo "status=sent" >> "$GITHUB_OUTPUT"
            echo "message_id=$message_id" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            printf 'error=%s\n' "${body:0:500}" >> "$GITHUB_OUTPUT"
          fi
      - name: Persist governed evaluation and rebuild operations read model
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          TELEGRAM_STATUS: ${{ steps.telegram.outputs.status }}
          TELEGRAM_MESSAGE_ID: ${{ steps.telegram.outputs.message_id }}
          TELEGRAM_ERROR: ${{ steps.telegram.outputs.error }}
          SHOULD_ALERT: ${{ steps.signal.outputs.should_alert }}
          EXECUTION_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          delivery_status="${TELEGRAM_STATUS:-not_required}"
          if [[ "$SHOULD_ALERT" != "true" ]]; then delivery_status="not_required"; fi
          uv run python scripts/persist_strategy_signal_evaluation.py \
            --model-version-id "$MODEL_VERSION_ID" \
            --signal-json "$SIGNAL_DIR/signal_alert.json" \
            --ledger-dir "$LEDGER_DIR" \
            --delivery-status "$delivery_status" \
            --github-issue-number "${ISSUE_NUMBER:-}" \
            --telegram-message-id "${TELEGRAM_MESSAGE_ID:-}" \
            --delivery-error "${TELEGRAM_ERROR:-}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --commit-sha "$EXECUTION_SHA" \
            --created-at-utc "$created_at"
          uv run python scripts/build_strategy_operations.py --generated-at "$created_at"
      - name: Commit durable signal and operations state
        id: publish
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          git config user.name "AlphaEngine Signal Agent"
          git config user.email "signal-agent@alphaengine.local"
          git add data/research/strategy_signal_ledgers data/research/strategy_operations/snapshots.json
          if git diff --cached --quiet; then
            echo "Signal evaluation is already persisted."
          else
            git commit -m "signal: publish BYD v1.3 evaluation ${{ steps.signal.outputs.signal_date }}"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload finalized signal evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: byd-v1-3-signal-${{ github.run_id }}
          path: |
            artifacts/signals/byd_v1_3
            data/research/strategy_signal_ledgers/byd_v1_3_recovery_event_low_vol_confirmation_v1
            data/research/strategy_operations/snapshots.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail after persisting a configured Telegram delivery error
        if: steps.telegram.outputs.status == 'failed'
        run: exit 1
