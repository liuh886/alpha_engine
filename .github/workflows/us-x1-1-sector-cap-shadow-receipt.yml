name: US x1.1 Sector-Cap Shadow Receipt

on:
  pull_request:
    branches:
      - main
    paths:
      - "configs/research_experiments/us_x1_1_sector_cap_shadow_v1.yaml"
      - "schemas/research/us_x1_1_sector_cap_shadow_receipt_v1.schema.json"
      - "src/research/us_x1_1_sector_cap_shadow_receipt.py"
      - "scripts/create_us_x1_1_sector_cap_shadow_receipt.py"
      - "tests/test_us_x1_1_sector_cap_shadow_receipt.py"
      - ".github/workflows/us-x1-1-sector-cap-shadow-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-x1-1-sector-cap-shadow-receipt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate shadow receipt contract
        run: |
          uv run ruff check \
            src/research/us_x1_1_sector_cap_shadow_receipt.py \
            scripts/create_us_x1_1_sector_cap_shadow_receipt.py \
            tests/test_us_x1_1_sector_cap_shadow_receipt.py
          uv run mypy \
            src/research/us_x1_1_sector_cap_shadow_receipt.py \
            scripts/create_us_x1_1_sector_cap_shadow_receipt.py
          uv run pytest \
            tests/test_us_x1_1_sector_cap_shadow_receipt.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Validate machine-readable contract and schema
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator

          contract = yaml.safe_load(
              Path("configs/research_experiments/us_x1_1_sector_cap_shadow_v1.yaml").read_text(encoding="utf-8")
          )
          assert contract["shadow_contract_id"] == "us_x1_1_sector_cap_shadow_v1"
          assert contract["prospective_boundary"]["first_signal_must_be_strictly_after"] == "2026-08-03"
          assert contract["candidate_domain"]["pool_count"] == 87
          assert contract["challenger_portfolio"]["maximum_names_per_sector"] == 4
          assert contract["receipt_contract"]["outcomes_available_at_creation"] is False
          assert contract["governance"]["automatic_model_update"] is False

          schema = json.loads(
              Path("schemas/research/us_x1_1_sector_cap_shadow_receipt_v1.schema.json").read_text(encoding="utf-8")
          )
          Draft202012Validator.check_schema(schema)
          PY
