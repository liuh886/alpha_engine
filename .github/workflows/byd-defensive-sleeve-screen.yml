name: BYD Defensive Sleeve Screen

on:
  pull_request:
    branches: [main]
    paths:
      - "src/data/cn_etf_candidate_canonical.py"
      - "scripts/data/build_cn_etf_candidate_bundle.py"
      - "src/research/byd_defensive_sleeve_screen.py"
      - "src/research/byd_defensive_sleeve_governance.py"
      - "scripts/run_byd_defensive_sleeve_screen.py"
      - "tests/test_cn_etf_candidate_canonical.py"
      - "tests/test_byd_defensive_sleeve_governance.py"
      - ".github/workflows/byd-defensive-sleeve-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Verify immutable BYD and 515180 bases
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > "$RUNNER_TEMP/515180-canonical-v1-artifact.zip"
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  $RUNNER_TEMP/515180-canonical-v1-artifact.zip" | sha256sum --check --strict
      - name: Lint and run contract tests
        run: |
          uv run ruff check \
            src/data/cn_etf_candidate_canonical.py \
            scripts/data/build_cn_etf_candidate_bundle.py \
            src/research/byd_defensive_sleeve_screen.py \
            src/research/byd_defensive_sleeve_governance.py \
            scripts/run_byd_defensive_sleeve_screen.py \
            tests/test_cn_etf_candidate_canonical.py \
            tests/test_byd_defensive_sleeve_governance.py
          uv run pytest \
            tests/test_cn_etf_candidate_canonical.py \
            tests/test_byd_defensive_sleeve_governance.py \
            tests/test_byd_515180_allocation.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Extract immutable bases
        run: |
          set -euo pipefail
          mkdir -p artifacts/data/byd_canonical_v1 artifacts/data/515180_canonical_v1
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/data/byd_canonical_v1
          unzip -q "$RUNNER_TEMP/515180-canonical-v1-artifact.zip" -d artifacts/data/515180_canonical_v1
      - name: Build 512890 canonical candidate
        id: build_512890
        continue-on-error: true
        run: >-
          uv run python scripts/data/build_cn_etf_candidate_bundle.py
          --symbol 512890.SH
          --provider-symbol 512890.SS
          --sina-symbol sh512890
          --start 2012-01-01
          --cutoff 2026-08-03
          --secondary-retries 3
          --output-dir artifacts/data/512890_canonical_v1
      - name: Build 511010 canonical candidate
        id: build_511010
        continue-on-error: true
        run: >-
          uv run python scripts/data/build_cn_etf_candidate_bundle.py
          --symbol 511010.SH
          --provider-symbol 511010.SS
          --sina-symbol sh511010
          --start 2012-01-01
          --cutoff 2026-08-03
          --secondary-retries 3
          --output-dir artifacts/data/511010_canonical_v1
      - name: Run frozen convergence screen
        id: screen
        if: always() && steps.build_511010.outcome == 'success'
        run: >-
          uv run python scripts/run_byd_defensive_sleeve_screen.py
          --byd-dir artifacts/data/byd_canonical_v1
          --etf-515180-dir artifacts/data/515180_canonical_v1
          --etf-512890-dir artifacts/data/512890_canonical_v1
          --etf-511010-dir artifacts/data/511010_canonical_v1
          --output-dir artifacts/research/byd_defensive_sleeve_screen
      - name: Publish evidence summary
        if: steps.screen.outcome == 'success'
        run: cat artifacts/research/byd_defensive_sleeve_screen/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload candidate data and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byd-defensive-sleeve-screen-evidence
          path: |
            artifacts/data/512890_canonical_v1
            artifacts/data/511010_canonical_v1
            artifacts/research/byd_defensive_sleeve_screen
          if-no-files-found: error
          retention-days: 30
      - name: Enforce data and screen completion
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.build_511010.outcome }}" = "success"
          test "${{ steps.screen.outcome }}" = "success"
          if [[ "${{ steps.build_512890.outcome }}" != "success" ]]; then
            test -f artifacts/data/512890_canonical_v1/data_blocked.json
          fi
