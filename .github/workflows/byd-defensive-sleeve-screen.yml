name: BYD Defensive Sleeve Screen

on:
  pull_request:
    branches: [main]
    paths:
      - "src/data/cn_etf_candidate_canonical.py"
      - "scripts/data/build_cn_etf_candidate_bundle.py"
      - "src/research/byd_defensive_sleeve_screen.py"
      - "src/research/byd_defensive_sleeve_governance.py"
      - "scripts/run_byd_defensive_sleeve_screen.py"
      - "tests/test_cn_etf_candidate_canonical.py"
      - "tests/test_byd_defensive_sleeve_governance.py"
      - "data/research/byd_defensive_sleeve_screen_v1_artifact.zip.b64"
      - "docs/evidence/byd_defensive_sleeve_screen/**"
      - "docs/research/byd_defensive_sleeve_convergence.md"
      - ".github/workflows/byd-defensive-sleeve-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Verify immutable artifacts
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > "$RUNNER_TEMP/515180-canonical-v1-artifact.zip"
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  $RUNNER_TEMP/515180-canonical-v1-artifact.zip" | sha256sum --check --strict
          base64 --decode data/research/byd_defensive_sleeve_screen_v1_artifact.zip.b64 > "$RUNNER_TEMP/byd-defensive-sleeve-screen-v1.zip"
          echo "0997467e867cbc3189292befcbfa758d442d05f389b0b39deb1caf3b2aeab7a6  $RUNNER_TEMP/byd-defensive-sleeve-screen-v1.zip" | sha256sum --check --strict
      - name: Extract immutable evidence
        run: |
          set -euo pipefail
          mkdir -p \
            artifacts/data/byd_canonical_v1 \
            artifacts/data/515180_canonical_v1 \
            artifacts/sealed
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/data/byd_canonical_v1
          unzip -q "$RUNNER_TEMP/515180-canonical-v1-artifact.zip" -d artifacts/data/515180_canonical_v1
          unzip -q "$RUNNER_TEMP/byd-defensive-sleeve-screen-v1.zip" -d artifacts/sealed
      - name: Verify exact candidate and blocker identities
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          sealed_manifest = json.loads(
              Path(
                  "docs/evidence/byd_defensive_sleeve_screen/sealed_manifest.json"
              ).read_text(encoding="utf-8")
          )
          if sealed_manifest["artifact_sha256"] != (
              "0997467e867cbc3189292befcbfa758d442d05f389b0b39deb1caf3b2aeab7a6"
          ):
              raise SystemExit("sealed artifact identity drifted")

          manifest = json.loads(
              Path(
                  "artifacts/sealed/data/511010_canonical_v1/manifest.json"
              ).read_text(encoding="utf-8")
          )
          exact_511010 = {
              "symbol": "511010.SH",
              "cutoff": "2026-08-03",
              "data_quality_status": "canonical_v1_pass",
              "raw_sha256": "c7a287b580fa02e84feb7563c692aeff38d04c66f9135650e35319a1549fc65a",
              "adjusted_sha256": "bd095082899a40be28bcd5d5b3a0f263e03affca04d383012123411b25231d5d",
              "session_audit_sha256": "a143c905bba7ba26e8fc6036da265d138981679716ae075b03398b0cbffcb8f4",
              "manifest_sha256": "5a64da9036639fa34c185afb9ceabd0d55f0bb4ea873fd73791b1d83eebf3380",
              "cross_provider_stitching": False,
          }
          for key, expected in exact_511010.items():
              if manifest.get(key) != expected:
                  raise SystemExit(
                      f"511010 identity mismatch for {key}: "
                      f"{manifest.get(key)!r} != {expected!r}"
                  )

          blocker = json.loads(
              Path(
                  "artifacts/sealed/data/512890_canonical_v1/data_blocked.json"
              ).read_text(encoding="utf-8")
          )
          exact_blocker = {
              "status": "data_blocked",
              "symbol": "512890.SH",
              "cutoff": "2026-08-03",
              "error": (
                  "provider OHLC envelope violations exceed tolerance: 2024-03-29"
              ),
              "provider_reference_preserved": True,
              "provider_envelope_audit_preserved": True,
          }
          for key, expected in exact_blocker.items():
              if blocker.get(key) != expected:
                  raise SystemExit(
                      f"512890 blocker mismatch for {key}: "
                      f"{blocker.get(key)!r} != {expected!r}"
                  )

          evidence_dir = Path("docs/evidence/byd_defensive_sleeve_screen")
          for name, expected in sealed_manifest["evidence_sha256"].items():
              actual = hashlib.sha256((evidence_dir / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f"sealed evidence mismatch for {name}: {actual} != {expected}"
                  )
          PY
      - name: Lint and run frozen contract tests
        run: |
          uv run ruff check \
            src/data/cn_etf_candidate_canonical.py \
            scripts/data/build_cn_etf_candidate_bundle.py \
            src/research/byd_defensive_sleeve_screen.py \
            src/research/byd_defensive_sleeve_governance.py \
            scripts/run_byd_defensive_sleeve_screen.py \
            tests/test_cn_etf_candidate_canonical.py \
            tests/test_byd_defensive_sleeve_governance.py
          uv run pytest \
            tests/test_cn_etf_candidate_canonical.py \
            tests/test_byd_defensive_sleeve_governance.py \
            tests/test_byd_515180_allocation.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Reproduce governed screen offline
        run: >-
          uv run python scripts/run_byd_defensive_sleeve_screen.py
          --byd-dir artifacts/data/byd_canonical_v1
          --etf-515180-dir artifacts/data/515180_canonical_v1
          --etf-512890-dir artifacts/sealed/data/512890_canonical_v1
          --etf-511010-dir artifacts/sealed/data/511010_canonical_v1
          --output-dir artifacts/reproduced/byd_defensive_sleeve_screen
      - name: Require byte-stable evidence
        run: |
          set -euo pipefail
          for file in README.md summary.json evaluation.csv period_contribution.csv correlation_diagnostics.csv; do
            diff -u \
              "docs/evidence/byd_defensive_sleeve_screen/$file" \
              "artifacts/reproduced/byd_defensive_sleeve_screen/$file"
          done
      - name: Enforce governed decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path(
                  "artifacts/reproduced/byd_defensive_sleeve_screen/summary.json"
              ).read_text(encoding="utf-8")
          )
          if summary["governed_decision"] != (
              "retain_515180_as_only_prospective_etf"
          ):
              raise SystemExit("governed decision drifted")
          if summary["selected_challenger"] is not None:
              raise SystemExit("an unapproved challenger was selected")
          if not summary["gate_matrix"]["515180.SH"]["cash_qualified"]:
              raise SystemExit("515180 qualification drifted")
          if summary["gate_matrix"]["511010.SH"]["cash_qualified"]:
              raise SystemExit("511010 qualification drifted")
          failed = summary["gate_matrix"]["511010.SH"]["cash_gates"]
          if failed["cagr_delta_at_least_50bp"]:
              raise SystemExit("511010 CAGR gate unexpectedly passed")
          if summary["gate_matrix"]["512890.SH"]["data_status"] != "blocked":
              raise SystemExit("512890 blocker status drifted")
          if summary["research_only"] is not True or summary["trade_ready"] is not False:
              raise SystemExit("research governance flags drifted")
          PY
      - name: Publish evidence summary
        run: cat artifacts/reproduced/byd_defensive_sleeve_screen/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload offline reproduction
        uses: actions/upload-artifact@v4
        with:
          name: byd-defensive-sleeve-offline-reproduction
          path: artifacts/reproduced/byd_defensive_sleeve_screen
          if-no-files-found: error
          retention-days: 30
