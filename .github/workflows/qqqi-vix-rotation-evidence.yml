name: QQQI VIX Rotation Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-vix-rotation-evidence.yml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_vix_v2.yaml"
      - "scripts/run_qqqi_qqq_tqqq_vix_v2.py"
      - "src/research/vix_rotation_experiment.py"
      - "src/research/vix_rotation_runtime.py"
      - "tests/test_vix_rotation_experiment.py"
      - "notebooks/13_qqqi_qqq_tqqq_vix_v2.ipynb"
      - "docs/research/qqqi_qqq_tqqq_vix_v2_experiment.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Run focused VIX contract tests
        run: >-
          uv run pytest tests/test_vix_rotation_experiment.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Compile VIX research modules and notebook
        run: |
          uv run python -m py_compile \
            src/research/vix_rotation_experiment.py \
            src/research/vix_rotation_runtime.py \
            scripts/run_qqqi_qqq_tqqq_vix_v2.py \
            tests/test_vix_rotation_experiment.py
          uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path("notebooks/13_qqqi_qqq_tqqq_vix_v2.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          for cell in notebook.get("cells", []):
              if cell.get("cell_type") == "code":
                  compile("".join(cell.get("source", [])), str(path), "exec")
          PY
      - name: Run frozen VIX live-data experiment
        run: >-
          uv run python scripts/run_qqqi_qqq_tqqq_vix_v2.py
          --end-date 2026-08-01
          --output-dir artifacts/evidence/qqqi_qqq_tqqq_vix_v2
      - name: Upload VIX evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-qqq-tqqq-vix-v2-evidence
          path: artifacts/evidence/qqqi_qqq_tqqq_vix_v2
          if-no-files-found: warn
          retention-days: 14
