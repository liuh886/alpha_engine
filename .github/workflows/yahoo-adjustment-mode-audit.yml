name: Yahoo Adjustment Mode Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/audit_yahoo_adjustment_modes.py"
      - "tests/test_yahoo_adjustment_mode_audit.py"
      - "docs/research/yahoo_adjustment_mode_audit_result_2026-08-02.md"
      - ".github/workflows/yahoo-adjustment-mode-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yahoo-adjustment-mode-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_evidence: ${{ steps.scope.outputs.run_evidence }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Detect evidence-affecting changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_evidence=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event.action }}" != "synchronize" ]]; then
            echo "run_evidence=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          after="${{ github.event.after }}"
          changed="$(git diff --name-only "$before" "$after")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(scripts/audit_yahoo_adjustment_modes\.py|tests/test_yahoo_adjustment_mode_audit\.py)'; then
            echo "run_evidence=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_evidence=false" >> "$GITHUB_OUTPUT"
          fi

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate mode-audit contract
        run: |
          uv run ruff check \
            scripts/audit_yahoo_adjustment_modes.py \
            tests/test_yahoo_adjustment_mode_audit.py
          uv run mypy scripts/audit_yahoo_adjustment_modes.py
          uv run pytest \
            tests/test_yahoo_adjustment_mode_audit.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1

  evidence:
    needs:
      - changes
      - contract
    if: needs.changes.outputs.run_evidence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Run controlled Yahoo mode audit
        run: >-
          uv run python scripts/audit_yahoo_adjustment_modes.py
          --start 2021-01-01
          --cutoff 2026-07-31
          --output-dir artifacts/evidence/yahoo_adjustment_mode_audit
      - name: Print governed decision summary
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/evidence/yahoo_adjustment_mode_audit/audit.json")
          if path.is_file():
              payload = json.loads(path.read_text(encoding="utf-8"))
              print(json.dumps({
                  "decision": payload.get("decision"),
                  "symbols": payload.get("symbols"),
                  "modes": payload.get("modes"),
              }, indent=2))
          else:
              print("audit.json was not created")
          PY
      - name: Upload all mode snapshots and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-adjustment-mode-audit-${{ github.run_id }}
          path: artifacts/evidence/yahoo_adjustment_mode_audit
          if-no-files-found: error
          retention-days: 90
