name: QQQI VXN Research Bundle

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-vxn-research-bundle.yml"
      - ".github/workflows/qqqi-vxn-notebook-refresh.yml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_*.yaml"
      - "docs/research/qqqi_qqq_tqqq_*.md"
      - "docs/research/qqqi_vxn_*.md"
      - "docs/research/snapshots/qqqi_vxn_*.json"
      - "notebooks/16_qqqi_qqq_tqqq_vxn_v4_1_backtest_review.ipynb"
      - "notebooks/README.md"
      - "scripts/refresh_qqqi_vxn_current_notebook.py"
      - "scripts/validate_qqqi_vxn_research_bundle.py"
      - "src/research/vix_*.py"
      - "src/research/vxn_*.py"
      - "tests/test_qqqi_vxn_research_bundle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint maintenance scripts and tests
        run: >-
          uv run ruff check
          scripts/refresh_qqqi_vxn_current_notebook.py
          scripts/validate_qqqi_vxn_research_bundle.py
          tests/test_qqqi_vxn_research_bundle.py
      - name: Compile maintenance scripts
        run: >-
          uv run python -m py_compile
          scripts/refresh_qqqi_vxn_current_notebook.py
          scripts/validate_qqqi_vxn_research_bundle.py
          tests/test_qqqi_vxn_research_bundle.py
      - name: Run research-bundle tests
        run: >-
          uv run pytest tests/test_qqqi_vxn_research_bundle.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Validate committed source bundle
        run: uv run python scripts/validate_qqqi_vxn_research_bundle.py
      - name: Execute rolling current-strategy notebook
        run: >-
          uv run python scripts/refresh_qqqi_vxn_current_notebook.py
          --timeout 900
      - name: Validate saved notebook outputs
        run: >-
          uv run python scripts/validate_qqqi_vxn_research_bundle.py
          --require-executed
      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-vxn-current-strategy-notebook-${{ github.run_id }}
          path: notebooks/17_qqqi_qqq_tqqq_vxn_current_strategy_review.ipynb
          if-no-files-found: error
          retention-days: 90
