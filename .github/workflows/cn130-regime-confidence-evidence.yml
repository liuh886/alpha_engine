name: CN130 PIT Fundamental Veto Evidence

on:
  pull_request:
    branches:
      - research/cn130-pit-fundamental-v1
    paths:
      - configs/research_experiments/cn130_pit_fundamental_veto_v1.yaml
      - docs/research/cn130_pit_fundamental_veto_*.md
      - scripts/run_cn130_calibration_r0_batch.py
      - scripts/run_cn130_pit_fundamental_veto.py
      - tests/test_cn130_pit_fundamental_veto.py
      - .github/workflows/cn130-regime-confidence-evidence.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PRICE_PROVIDER_ARTIFACT_ID: '8850463785'
  FROZEN_PIT_ARTIFACT_ID: '8926572265'
  PYTHONPATH: .
  GH_TOKEN: ${{ github.token }}

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint and focused tests
        run: |
          uv run ruff check \
            scripts/run_cn130_calibration_r0_batch.py \
            scripts/run_cn130_pit_fundamental_veto.py \
            tests/test_cn130_pit_fundamental_veto.py
          uv run pytest tests/test_cn130_pit_fundamental_veto.py -q --strict-markers --tb=short
      - name: Download immutable price provider
        run: |
          mkdir -p .research/provider-artifact .research/provider
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRICE_PROVIDER_ARTIFACT_ID}/zip" > .research/provider.zip
          unzip -q .research/provider.zip -d .research/provider-artifact
          tar -xf .research/provider-artifact/cn-provider-2026-08-03.tar -C .research/provider
      - name: Download frozen PIT event and validation ledger artifact
        run: |
          mkdir -p .research/frozen
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_PIT_ARTIFACT_ID}/zip" > .research/frozen.zip
          unzip -q .research/frozen.zip -d .research/frozen
          test "$(sha256sum .research/frozen/event-population/fundamentals/events.jsonl | awk '{print $1}')" = "9d0babbf78a9a95272c15a94b56306194ff0a320d4fb92de4f7f78951fc7b8c7"
      - name: Build calibration R0 ledgers
        run: |
          mkdir -p .research/calibration
          for window in 2022H1 2022H2 2023H1 2023H2; do
            uv run python scripts/run_cn130_calibration_r0_batch.py \
              --provider-dir .research/provider/data/providers/cn \
              --output-dir .research/calibration \
              --window "$window"
          done
      - name: Run staged calibration and frozen validation twice
        run: |
          for run in a b; do
            uv run python scripts/run_cn130_pit_fundamental_veto.py \
              --provider-dir .research/provider/data/providers/cn \
              --calibration-ledger-dir .research/calibration \
              --frozen-ledger-dir .research/frozen \
              --events-path .research/frozen/event-population/fundamentals/events.jsonl \
              --output-dir ".research/run-${run}"
          done
      - name: Verify deterministic evidence
        run: diff -ru .research/run-a .research/run-b
      - name: Package complete evidence
        if: always()
        run: |
          mkdir -p artifacts/cn130-pit-fundamental-veto
          test ! -d .research/run-a || cp -R .research/run-a artifacts/cn130-pit-fundamental-veto/final
          test ! -d .research/calibration/score_ledgers || cp -R .research/calibration/score_ledgers artifacts/cn130-pit-fundamental-veto/calibration-score-ledgers
          cp .research/frozen/event-population/fundamentals/coverage.json artifacts/cn130-pit-fundamental-veto/fundamental_source_coverage.json
          cp .research/frozen/event-population/fundamentals/component_manifest.json artifacts/cn130-pit-fundamental-veto/fundamental_source_manifest.json
          cp configs/research_experiments/cn130_pit_fundamental_veto_v1.yaml artifacts/cn130-pit-fundamental-veto/
          cp docs/research/cn130_pit_fundamental_veto_preregistration_2026-08-05.md artifacts/cn130-pit-fundamental-veto/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cn130-pit-fundamental-veto-${{ github.run_id }}
          path: artifacts/cn130-pit-fundamental-veto/
          if-no-files-found: error
          retention-days: 30
