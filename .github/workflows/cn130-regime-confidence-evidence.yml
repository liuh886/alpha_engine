name: CN130 PIT Calibration Window Patch

on:
  pull_request:
    branches:
      - research/cn130-pit-fundamental-v1
    paths:
      - scripts/patch_cn130_pit_veto_calibration_windows.py
      - .github/workflows/cn130-regime-confidence-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/cn130-pit-fundamental-veto-v1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply calibration-window patch
        run: python scripts/patch_cn130_pit_veto_calibration_windows.py
      - name: Commit governed feasibility amendment
        run: |
          git config user.name 'AlphaEngine Research Agent'
          git config user.email 'research-agent@alphaengine.local'
          git add scripts/run_cn130_pit_fundamental_veto.py
          git rm scripts/patch_cn130_pit_veto_calibration_windows.py
          git commit -m 'fix(research): use feasible CN130 PIT calibration history'
          git push origin HEAD:research/cn130-pit-fundamental-veto-v1
