name: CN130 PIT Nullable Boolean Patch

on:
  pull_request:
    branches:
      - research/cn130-regime-confidence-v1
    paths:
      - scripts/patch_cn130_pit_nullable_bool.py
      - .github/workflows/cn130-regime-confidence-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/cn130-pit-fundamental-v1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply regression patch
        run: python scripts/patch_cn130_pit_nullable_bool.py
      - name: Commit code and test fix
        run: |
          git config user.name 'AlphaEngine Research Agent'
          git config user.email 'research-agent@alphaengine.local'
          git add scripts/run_cn130_pit_fundamental_model.py tests/test_cn130_pit_fundamental_model.py
          git rm scripts/patch_cn130_pit_nullable_bool.py
          git commit -m 'fix(research): normalize PIT fundamental eligibility mask'
          git push origin HEAD:research/cn130-pit-fundamental-v1
