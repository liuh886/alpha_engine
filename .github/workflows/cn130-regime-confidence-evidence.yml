name: CN130 PIT Fundamental Veto Payload Bootstrap

on:
  pull_request:
    branches:
      - research/cn130-pit-fundamental-v1
    paths:
      - .github/cn130_pit_fundamental_veto_payload.chunk*
      - scripts/apply_cn130_pit_fundamental_veto_payload.py
      - .github/workflows/cn130-regime-confidence-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/cn130-pit-fundamental-veto-v1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify and apply payload
        run: python scripts/apply_cn130_pit_fundamental_veto_payload.py
      - name: Commit implementation
        run: |
          git config user.name 'AlphaEngine Research Agent'
          git config user.email 'research-agent@alphaengine.local'
          git add -A
          git commit -m 'research: implement CN130 PIT fundamental veto study'
          git push origin HEAD:research/cn130-pit-fundamental-veto-v1
