name: XGBoost Native Calibration Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "src/research/xgb_native_calibration.py"
      - "configs/research_experiments/us_x1_1_native_xgb_calibration_v1.yaml"
      - "tests/test_xgb_native_calibration.py"
      - "docs/research/us_x1_1_native_xgb_calibration_plan_2026-08-02.md"
      - ".github/workflows/xgb-native-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xgb-native-calibration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint and type-check native contract
        run: |
          uv run ruff check \
            src/research/xgb_native_calibration.py \
            tests/test_xgb_native_calibration.py
          uv run mypy src/research/xgb_native_calibration.py
      - name: Test native calibration identity and fit path
        run: >-
          uv run pytest tests/test_xgb_native_calibration.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Stage contract evidence
        run: |
          mkdir -p artifacts/evidence/xgb_native_calibration_contract
          cp configs/research_experiments/us_x1_1_native_xgb_calibration_v1.yaml \
            artifacts/evidence/xgb_native_calibration_contract/
          cp docs/research/us_x1_1_native_xgb_calibration_plan_2026-08-02.md \
            artifacts/evidence/xgb_native_calibration_contract/
      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: xgb-native-calibration-contract-${{ github.run_id }}
          path: artifacts/evidence/xgb_native_calibration_contract
          if-no-files-found: error
          retention-days: 90
