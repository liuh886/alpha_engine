name: CN Live Evidence Sources CI

on:
  push:
    branches: [main]
    paths:
      - "src/research/cn_live_evidence_sources.py"
      - "scripts/build_cn_live_evidence_sources.py"
      - "tests/test_cn_live_evidence_sources.py"
      - ".github/workflows/cn-live-evidence-sources-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/research/cn_live_evidence_sources.py"
      - "scripts/build_cn_live_evidence_sources.py"
      - "tests/test_cn_live_evidence_sources.py"
      - ".github/workflows/cn-live-evidence-sources-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff focused files
        run: uv run ruff check src/research/cn_live_evidence_sources.py scripts/build_cn_live_evidence_sources.py tests/test_cn_live_evidence_sources.py
      - name: Run source tests
        run: uv run pytest tests/test_cn_live_evidence_sources.py -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: CLI import check
        run: uv run python scripts/build_cn_live_evidence_sources.py --help
