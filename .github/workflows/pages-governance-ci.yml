name: Pages Governance CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/pages-release-receipt.yml"
      - ".github/workflows/pages-governance-ci.yml"
      - "scripts/detect_pages_impact.py"
      - "scripts/verify_pages_release.py"
      - "src/artifacts/pages_release_verification.py"
      - "tests/test_pages_impact.py"
      - "tests/test_pages_release_verification.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/pages-release-receipt.yml"
      - ".github/workflows/pages-governance-ci.yml"
      - "scripts/detect_pages_impact.py"
      - "scripts/verify_pages_release.py"
      - "src/artifacts/pages_release_verification.py"
      - "tests/test_pages_impact.py"
      - "tests/test_pages_release_verification.py"

permissions:
  contents: read

jobs:
  publication-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Validate Pages publication contracts
        run: |
          uv run ruff check \
            scripts/detect_pages_impact.py \
            scripts/verify_pages_release.py \
            src/artifacts/pages_release_verification.py \
            tests/test_pages_impact.py \
            tests/test_pages_release_verification.py
          uv run mypy \
            scripts/detect_pages_impact.py \
            scripts/verify_pages_release.py \
            src/artifacts/pages_release_verification.py
          uv run pytest \
            tests/test_pages_impact.py \
            tests/test_pages_release_verification.py \
            -q --strict-markers --tb=short
