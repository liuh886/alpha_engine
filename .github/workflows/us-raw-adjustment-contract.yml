name: US Raw Adjustment Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/data/us_raw_adjustment_snapshot.py"
      - "scripts/data/build_us_raw_adjustment_snapshot.py"
      - "tests/test_us_raw_adjustment_snapshot.py"
      - ".github/workflows/us-raw-adjustment-contract.yml"
      - "docs/research/us_x1_1_data_reproducibility_experiments_2026-08-02.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-raw-adjustment-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      evidence: ${{ steps.scope.outputs.evidence }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect evidence-affecting changes
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "evidence=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > /tmp/changed.txt
          if grep -Eq '^(src/data/us_raw_adjustment_snapshot.py|scripts/data/build_us_raw_adjustment_snapshot.py|tests/test_us_raw_adjustment_snapshot.py)$' /tmp/changed.txt; then
            echo "evidence=true" >> "$GITHUB_OUTPUT"
          else
            echo "evidence=false" >> "$GITHUB_OUTPUT"
          fi

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate raw adjustment contract
        run: |
          uv run ruff check \
            src/data/us_raw_adjustment_snapshot.py \
            scripts/data/build_us_raw_adjustment_snapshot.py \
            tests/test_us_raw_adjustment_snapshot.py
          uv run mypy \
            src/data/us_raw_adjustment_snapshot.py \
            scripts/data/build_us_raw_adjustment_snapshot.py
          uv run pytest \
            tests/test_us_raw_adjustment_snapshot.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1

  evidence:
    needs:
      - changes
      - contract
    if: needs.changes.outputs.evidence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Fetch one immutable US87 raw plus adjustment snapshot
        run: >-
          uv run python scripts/data/build_us_raw_adjustment_snapshot.py
          fetch
          --output-dir artifacts/us_raw_adjustment/raw
          --start 2021-01-01
          --cutoff 2026-07-31
      - name: Materialize provider A from the frozen raw snapshot
        run: >-
          uv run python scripts/data/build_us_raw_adjustment_snapshot.py
          materialize
          --raw-dir artifacts/us_raw_adjustment/raw
          --output-root artifacts/us_raw_adjustment/provider_a
          --retain-raw-copy
      - name: Materialize provider B from the same frozen raw snapshot
        run: >-
          uv run python scripts/data/build_us_raw_adjustment_snapshot.py
          materialize
          --raw-dir artifacts/us_raw_adjustment/raw
          --output-root artifacts/us_raw_adjustment/provider_b
      - name: Verify deterministic identities
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/us_raw_adjustment")
          paths = [
              root / name / "artifacts/raw_adjustment_contract_manifest.json"
              for name in ("provider_a", "provider_b")
          ]
          a, b = [json.loads(path.read_text(encoding="utf-8")) for path in paths]
          assert a["raw_snapshot"]["identity_sha256"] == b["raw_snapshot"]["identity_sha256"]
          assert a["model_input_snapshot"]["identity_sha256"] == b["model_input_snapshot"]["identity_sha256"]
          assert a["provider_identity_sha256"] == b["provider_identity_sha256"]
          assert a["formula"] == b["formula"]
          assert a["instrument_count"] == b["instrument_count"] == 88
          summary = {
              "decision": "deterministic_raw_adjustment_contract_ready",
              "raw_snapshot_identity": a["raw_snapshot"]["identity_sha256"],
              "model_input_identity": a["model_input_snapshot"]["identity_sha256"],
              "provider_identity": a["provider_identity_sha256"],
              "formula_identity": a["formula"]["identity_sha256"],
              "instrument_count": a["instrument_count"],
              "research_only": True,
              "trade_ready": False,
          }
          evidence = root / "verification.json"
          evidence.write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload frozen source, both providers and verification
        uses: actions/upload-artifact@v4
        with:
          name: us-raw-adjustment-contract-${{ github.run_id }}
          path: artifacts/us_raw_adjustment
          if-no-files-found: error
          retention-days: 90
