name: Patch Focus Stop Evidence

on:
  push:
    branches:
      - research/focus-signal-validation-infra
    paths:
      - ".github/workflows/patch-focus-stop-evidence.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/focus-signal-validation-infra
          fetch-depth: 0
      - name: Preserve the stop used on EXIT rows
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/research/focus_watchlist_signal.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '        for _, row in group.iterrows():\n            required = (',
                  '        for _, row in group.iterrows():\n            reported_trailing_stop = trailing_stop\n            required = (',
              ),
              (
                  '                    trailing_stop = peak_high - multiple * float(row["atr_20"])\n                else:',
                  '                    trailing_stop = peak_high - multiple * float(row["atr_20"])\n                    reported_trailing_stop = trailing_stop\n                else:',
              ),
              (
                  '                trailing_stop = max(float(trailing_stop), candidate_stop)\n                if not bool(row["risk_on"]):',
                  '                trailing_stop = max(float(trailing_stop), candidate_stop)\n                reported_trailing_stop = trailing_stop\n                if not bool(row["risk_on"]):',
              ),
              (
                  '                    "indicators": _indicator_payload(row, trailing_stop),',
                  '                    "indicators": _indicator_payload(row, reported_trailing_stop),',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research/focus_watchlist_signal.py
          git commit -m "fix(research): retain stop evidence on exit rows"
          git push origin HEAD:research/focus-signal-validation-infra
