name: BYD v1.3 Prospective Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "src/research/byd_recovery_event_prospective.py"
      - "src/research/byd_v1_3_low_vol_prospective.py"
      - "src/artifacts/append_only_store.py"
      - "scripts/run_byd_recovery_event_prospective.py"
      - "scripts/run_byd_v1_3_low_vol_prospective.py"
      - "scripts/check_append_only_store_prefix.py"
      - "tests/test_byd_recovery_event_prospective.py"
      - "tests/test_byd_v1_3_low_vol_prospective.py"
      - "tests/test_append_only_store.py"
      - "data/research/byd_recovery_event_prospective/**"
      - "data/research/byd_v1_3_low_vol_prospective/**"
      - ".github/workflows/byd-v1-3-prospective.yml"
  workflow_run:
    workflows: ["BYD 515180 Prospective Sleeve"]
    types: [completed]
  schedule:
    - cron: "15 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: byd-v1-3-prospective-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

jobs:
  contract-and-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Verify immutable bases and source stores
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > "$RUNNER_TEMP/515180-canonical-v1-artifact.zip"
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  $RUNNER_TEMP/515180-canonical-v1-artifact.zip" | sha256sum --check --strict
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("data/research/byd_prospective_shadow/manifest.json"),
              Path("data/research/byd_515180_prospective/manifest.json"),
              Path("data/research/byd_recovery_event_prospective/manifest.json"),
          ):
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload["append_only"] is True, path
              assert payload["research_only"] is True, path
              assert payload["trade_ready"] is False, path
          seed = Path("data/research/byd_recovery_event_prospective/observations/2026-08-10.json")
          assert seed.is_file(), "low-vol launch requires immutable 2026-08-10 recovery-event seed"
          PY
      - name: Validate prospective contracts
        run: |
          uv run ruff check \
            src/research/byd_recovery_event_prospective.py \
            src/research/byd_v1_3_low_vol_prospective.py \
            src/artifacts/append_only_store.py \
            scripts/run_byd_recovery_event_prospective.py \
            scripts/run_byd_v1_3_low_vol_prospective.py \
            scripts/check_append_only_store_prefix.py \
            tests/test_byd_recovery_event_prospective.py \
            tests/test_byd_v1_3_low_vol_prospective.py \
            tests/test_append_only_store.py
          uv run mypy \
            src/research/byd_recovery_event_prospective.py \
            src/research/byd_v1_3_low_vol_prospective.py \
            src/artifacts/append_only_store.py \
            scripts/run_byd_recovery_event_prospective.py \
            scripts/run_byd_v1_3_low_vol_prospective.py \
            scripts/check_append_only_store_prefix.py
          uv run pytest \
            tests/test_byd_recovery_event_prospective.py \
            tests/test_byd_v1_3_low_vol_prospective.py \
            tests/test_append_only_store.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Reproduce current V1.3 prospective stores from immutable sources
        run: |
          set -euo pipefail
          mkdir -p artifacts/data/byd_canonical_v1
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/data/byd_canonical_v1
          uv run python scripts/run_byd_recovery_event_prospective.py \
            --baseline-dir artifacts/data/byd_canonical_v1 \
            --byd-store data/research/byd_prospective_shadow \
            --paired-store data/research/byd_515180_prospective \
            --store-dir artifacts/research/byd_recovery_event_prospective
          uv run python scripts/run_byd_v1_3_low_vol_prospective.py \
            --source-store artifacts/research/byd_recovery_event_prospective \
            --store-dir artifacts/research/byd_v1_3_low_vol_prospective
      - name: Enforce append-only prospective prefixes on review changes
        if: github.event_name == 'pull_request'
        run: |
          uv run python scripts/check_append_only_store_prefix.py \
            --current data/research/byd_recovery_event_prospective \
            --candidate artifacts/research/byd_recovery_event_prospective
          if [[ -d data/research/byd_v1_3_low_vol_prospective ]]; then
            uv run python scripts/check_append_only_store_prefix.py \
              --current data/research/byd_v1_3_low_vol_prospective \
              --candidate artifacts/research/byd_v1_3_low_vol_prospective
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          event = Path("artifacts/research/byd_recovery_event_prospective")
          event_manifest = json.loads((event / "manifest.json").read_text())
          event_scorecard = json.loads((event / "scorecard.json").read_text())
          assert event_manifest["append_only"] is True
          assert event_manifest["candidate_model_id"] == "byd_recovery_event_hold20_v1"
          assert event_scorecard["automatic_promotion_allowed"] is False

          low_vol = Path("artifacts/research/byd_v1_3_low_vol_prospective")
          low_vol_manifest = json.loads((low_vol / "manifest.json").read_text())
          low_vol_scorecard = json.loads((low_vol / "scorecard.json").read_text())
          assert low_vol_manifest["append_only"] is True
          assert low_vol_manifest["research_only"] is True
          assert low_vol_manifest["trade_ready"] is False
          assert low_vol_manifest["shadow_only"] is True
          assert low_vol_manifest["launch_after"] == "2026-08-10"
          assert low_vol_manifest["required_entry_vol_state"] == "low"
          assert low_vol_manifest["candidate_model_id"] == "byd_v1_3_recovery_event_low_vol_confirmation_v1"
          assert low_vol_scorecard["automatic_promotion_allowed"] is False
          assert low_vol_scorecard["trade_ready"] is False
          PY
      - name: Upload reproduced prospective stores
        uses: actions/upload-artifact@v6
        with:
          name: byd-v1-3-prospective-${{ github.run_id }}
          path: |
            artifacts/research/byd_recovery_event_prospective
            artifacts/research/byd_v1_3_low_vol_prospective
          if-no-files-found: error
          retention-days: 30

  live-update:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    needs: contract-and-reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Extract immutable BYD base
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          mkdir -p artifacts/data/byd_canonical_v1
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/data/byd_canonical_v1
      - name: Append current V1.3 prospective evidence
        run: |
          uv run python scripts/run_byd_recovery_event_prospective.py \
            --baseline-dir artifacts/data/byd_canonical_v1 \
            --byd-store data/research/byd_prospective_shadow \
            --paired-store data/research/byd_515180_prospective \
            --store-dir data/research/byd_recovery_event_prospective
          uv run python scripts/run_byd_v1_3_low_vol_prospective.py \
            --source-store data/research/byd_recovery_event_prospective \
            --store-dir data/research/byd_v1_3_low_vol_prospective
      - name: Verify append-only scope
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^data/research/(byd_recovery_event_prospective|byd_v1_3_low_vol_prospective)/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected prospective updater changes:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit new prospective evidence
        run: |
          set -euo pipefail
          event=data/research/byd_recovery_event_prospective
          lowvol=data/research/byd_v1_3_low_vol_prospective
          if git diff --quiet -- "$event" "$lowvol" && [[ -z "$(git ls-files --others --exclude-standard "$event" "$lowvol")" ]]; then
            echo "No new BYD v1.3 prospective evidence"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$event" "$lowvol"
          git commit -m "research: append BYD v1.3 prospective evidence"
          git pull --rebase origin main
          git push origin HEAD:main
