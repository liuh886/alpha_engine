name: Daily US Low-Turnover Decision

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-us-low-turnover-decision
  cancel-in-progress: false

jobs:
  run-diagnostic-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'AlphaEngine research https://github.com/liuh886/alpha_engine' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Prepare persistent state root
        run: |
          mkdir -p artifacts/decision_ledger
          touch artifacts/decision_ledger/.state-root
      - name: Restore prior Decision Desk state
        id: state_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/decision_ledger
            artifacts/factor_registry.db
          key: daily-us-decision-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            daily-us-decision-state-
      - name: Run latest complete US decision cycle
        id: live_run
        shell: bash
        run: |
          mkdir -p artifacts/operations
          set +e
          uv run python scripts/run_latest_us_low_turnover_decision.py \
            2>&1 | tee artifacts/operations/daily_us_decision.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build answer-first run summary
        if: always()
        run: |
          uv run python scripts/summarize_daily_us_decision_run.py \
            --artifacts-root artifacts \
            --exit-code "${{ steps.live_run.outputs.exit_code || '1' }}" \
            --state-restored "${{ steps.state_restore.outputs.cache-matched-key != '' }}" \
            --output artifacts/operations/daily_us_decision_summary.md
          cat artifacts/operations/daily_us_decision_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-us-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/market_snapshots
            artifacts/forward_shadow_runs
            artifacts/decision_ledger
            artifacts/factor_registry.db
            artifacts/operations
          if-no-files-found: warn
          retention-days: 30
      - name: Save Decision Desk state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/decision_ledger
            artifacts/factor_registry.db
          key: daily-us-decision-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve governed failure status
        if: always()
        shell: bash
        run: |
          status="${{ steps.live_run.outputs.exit_code || '1' }}"
          if [ "$status" != "0" ]; then
            echo "Governed daily pipeline was blocked; inspect the uploaded summary and artifacts."
            exit "$status"
          fi
