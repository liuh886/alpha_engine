name: Research Experiment

on:
  pull_request:
    branches: [main]
    paths:
      - 'configs/research_experiments/**'
      - 'configs/research_optimization/**'
      - 'configs/factor_libraries/**'
      - 'configs/research_classifications/**'
      - 'data/source_repairs/**'
      - 'data/csv_source/**'
      - 'data/research/formal_model_runs/**'
      - 'src/cli/main.py'
      - 'src/factors/**'
      - 'src/research/cross_sectional_experiment_runner.py'
      - 'src/research/experiment_harness.py'
      - 'src/research/formal_baseline.py'
      - 'src/research/formal_baseline_onboarding.py'
      - 'src/research/formal_model_replay.py'
      - 'src/research/rules_based_allocation_experiment_runner.py'
      - 'src/research/byd_v1_3_candidate.py'
      - 'src/research/research_receipt.py'
      - 'src/research/optimization_campaign.py'
      - 'src/research/us_ranker_exact_portfolio_replay.py'
      - 'src/research/cn_ranker_exact_portfolio_replay.py'
      - 'scripts/prepare_research_source_repair.py'
      - 'scripts/promote_approved_research_source_repair.py'
      - 'scripts/rebuild_active_research_providers.py'
      - 'scripts/run_research_experiment.py'
      - 'scripts/run_active_research_experiments.py'
      - 'scripts/run_model_optimization_campaign.py'
      - 'scripts/run_us_ranker_exact_portfolio_replay.py'
      - 'scripts/run_cn_ranker_exact_portfolio_replay.py'
      - 'tests/test_cross_sectional_experiment_runner.py'
      - 'tests/test_experiment_harness.py'
      - 'tests/test_formal_baseline_onboarding.py'
      - 'tests/test_formal_model_replay.py'
      - 'tests/test_rules_based_allocation_experiment_runner.py'
      - 'tests/test_research_receipt.py'
      - 'tests/test_optimization_campaign.py'
      - '.github/workflows/research-experiment.yml'
  workflow_dispatch:
    inputs:
      spec:
        description: Optional committed experiment spec path; blank runs active mission
        required: false
        type: string
      campaign:
        description: Optional fixed-context optimization campaign contract
        required: false
        type: string
      submissions:
        description: Candidate delta submissions; required with campaign
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: research-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-promotion:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Detect approved missing-source repair
        id: detect
        shell: bash
        run: |
          approval=$(awk '/^[[:space:]]+approval_manifest:/ {print $2; exit}' configs/research_experiments/*.yaml || true)
          if [[ -z "$approval" || ! -f "$approval" ]]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          readarray -t state < <(python3 - "$approval" <<'PY'
          import json
          import pathlib
          import sys

          approval = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          missing = [
              symbol
              for symbol in approval.get('targets', {})
              if not pathlib.Path(f'data/csv_source/{symbol}.csv').is_file()
          ]
          artifact_id = approval.get('source_artifact', {}).get('artifact_id', '')
          print(len(missing))
          print(artifact_id)
          PY
          )
          if [[ "${state[0]}" == '0' ]]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${state[1]}" ]]; then
            echo 'approval manifest has no artifact_id' >&2
            exit 1
          fi
          echo 'needed=true' >> "$GITHUB_OUTPUT"
          echo "approval=$approval" >> "$GITHUB_OUTPUT"
          echo "artifact_id=${state[1]}" >> "$GITHUB_OUTPUT"

      - name: Download immutable approved repair artifact
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf artifacts/research_source_repair
          mkdir -p artifacts/research_source_repair
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ steps.detect.outputs.artifact_id }}/zip" \
            -o /tmp/research-source-repair.zip
          unzip -q /tmp/research-source-repair.zip -d artifacts/research_source_repair

      - name: Promote exact approved hashes
        if: steps.detect.outputs.needed == 'true'
        run: >-
          python3 scripts/promote_approved_research_source_repair.py
          --approval "${{ steps.detect.outputs.approval }}"

      - name: Upload source promotion receipt
        if: steps.detect.outputs.needed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: approved-research-source-promotion
          path: artifacts/research_source_repair/*/artifacts/source_repair_promotion_receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit approved canonical sources
        id: commit
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          git add data/csv_source
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: add approved research source repair'
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git push origin "HEAD:${{ github.head_ref }}"

  experiment:
    needs: source-promotion
    if: >-
      always() &&
      (needs.source-promotion.result == 'success' || needs.source-promotion.result == 'skipped') &&
      needs.source-promotion.outputs.changed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Validate research harness
        run: |
          uv run ruff check \
            src/cli/main.py \
            src/research/experiment_harness.py \
            src/research/cross_sectional_experiment_runner.py \
            src/research/formal_baseline.py \
            src/research/formal_baseline_onboarding.py \
            src/research/formal_model_replay.py \
            src/research/rules_based_allocation_experiment_runner.py \
            src/research/byd_v1_3_candidate.py \
            src/research/research_receipt.py \
            src/research/optimization_campaign.py \
            src/research/us_ranker_exact_portfolio_replay.py \
            src/research/cn_ranker_exact_portfolio_replay.py \
            src/research/cn_x1_2_breadth_veto_development.py \
            src/research/cn_x1_2_breadth_scaled_development.py \
            scripts/prepare_research_source_repair.py \
            scripts/promote_approved_research_source_repair.py \
            scripts/rebuild_active_research_providers.py \
            scripts/run_research_experiment.py \
            scripts/run_active_research_experiments.py \
            scripts/run_model_optimization_campaign.py \
            scripts/run_us_ranker_exact_portfolio_replay.py \
            scripts/run_cn_ranker_exact_portfolio_replay.py \
            tests/test_experiment_harness.py \
            tests/test_cross_sectional_experiment_runner.py \
            tests/test_cn_x1_2_breadth_veto_development.py \
            tests/test_cn_x1_2_breadth_scaled_development.py \
            tests/test_formal_baseline_onboarding.py \
            tests/test_formal_model_replay.py \
            tests/test_rules_based_allocation_experiment_runner.py \
            tests/test_research_receipt.py \
            tests/test_optimization_campaign.py
          uv run pytest \
            tests/test_experiment_harness.py \
            tests/test_cross_sectional_experiment_runner.py \
            tests/test_cn_x1_2_breadth_veto_development.py \
            tests/test_cn_x1_2_breadth_scaled_development.py \
            tests/test_formal_baseline_onboarding.py \
            tests/test_formal_model_replay.py \
            tests/test_rules_based_allocation_experiment_runner.py \
            tests/test_research_receipt.py \
            tests/test_optimization_campaign.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1

      - name: Prepare authoritative source repair candidate
        if: github.event_name == 'workflow_dispatch' && inputs.campaign == ''
        shell: bash
        run: |
          if [[ -n "${{ inputs.spec }}" ]]; then
            uv run python scripts/prepare_research_source_repair.py --spec "${{ inputs.spec }}"
          else
            uv run python scripts/prepare_research_source_repair.py
          fi

      - name: Upload source repair candidate
        if: github.event_name == 'workflow_dispatch' && inputs.campaign == '' && always()
        uses: actions/upload-artifact@v6
        with:
          name: research-source-repair
          path: artifacts/research_source_repair/
          if-no-files-found: warn
          retention-days: 30

      - name: Require canonical research sources
        if: github.event_name == 'workflow_dispatch' && inputs.campaign == ''
        shell: bash
        run: |
          if [[ -f artifacts/research_source_repair/repair_required ]]; then
            cat artifacts/research_source_repair/summary.json
            echo 'Research source repair is required before model execution.' >&2
            exit 1
          fi

      - name: Rebuild exact mission provider when required
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ -n "${{ inputs.campaign }}" ]]; then
            test -n "${{ inputs.submissions }}"
            output="artifacts/model_optimization_campaigns/${GITHUB_RUN_ID}"
            uv run python scripts/run_model_optimization_campaign.py \
              --campaign "${{ inputs.campaign }}" \
              --submissions "${{ inputs.submissions }}" \
              --output-dir "$output"
            uv run python scripts/rebuild_active_research_providers.py \
              --spec "$output/compiled-experiment.yaml"
          elif [[ -n "${{ inputs.spec }}" ]]; then
            uv run python scripts/rebuild_active_research_providers.py --spec "${{ inputs.spec }}"
          else
            uv run python scripts/rebuild_active_research_providers.py
          fi

      - name: Run committed research mission
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ -n "${{ inputs.campaign }}" ]]; then
            output="artifacts/model_optimization_campaigns/${GITHUB_RUN_ID}"
            uv run python scripts/run_model_optimization_campaign.py \
              --manifest "$output/campaign-manifest.json" \
              --execute
          elif [[ -n "${{ inputs.spec }}" ]]; then
            uv run python scripts/run_active_research_experiments.py --spec "${{ inputs.spec }}"
          else
            uv run python scripts/run_active_research_experiments.py
          fi

      - name: Upload research receipts
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v6
        with:
          name: research-experiment-receipts
          path: |
            artifacts/research_experiments/
            artifacts/model_optimization_campaigns/
          if-no-files-found: warn
          retention-days: 30
