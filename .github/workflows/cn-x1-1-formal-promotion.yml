name: CN x1.1 Formal Promotion

on:
  pull_request:
    branches: [main]
    paths:
      - configs/models/cn_x1_1.yaml
      - configs/models/model_registry_v1.yaml
      - notebooks/models/cn_x1_1_complete_backtest.ipynb
      - data/research/cn_x1_1_regime_gated_candidate_v1/**
      - data/research/formal_backtests/cn_x1_1.json
      - data/research/formal_backtests/catalog.json
      - data/research/formal_backtests/freshness.json
      - scripts/promote_cn_x1_1_formal.py
      - tests/test_promote_cn_x1_1_formal.py
      - .github/workflows/cn-x1-1-formal-promotion.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cn-x1-1-formal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate code and frozen evidence
        run: |
          uv run ruff check scripts/promote_cn_x1_1_formal.py tests/test_promote_cn_x1_1_formal.py
          uv run mypy scripts/promote_cn_x1_1_formal.py
          uv run pytest tests/test_promote_cn_x1_1_formal.py -q --strict-markers --tb=short
      - name: Reproduce immutable CN package from prior formal release
        run: |
          set -euo pipefail
          mkdir -p artifacts/reproduced-formal
          git show 3b732ede15f0c0fc622fe5be153ad5e21a98889e:data/research/formal_backtests/catalog.json > artifacts/reproduced-formal/catalog.json
          git show 3b732ede15f0c0fc622fe5be153ad5e21a98889e:data/research/formal_backtests/freshness.json > artifacts/reproduced-formal/freshness.json
          uv run python scripts/promote_cn_x1_1_formal.py \
            --root artifacts/reproduced-formal \
            --evidence-root data/research/cn_x1_1_regime_gated_candidate_v1 \
            --generated-at 2026-08-05T17:36:00Z \
            --receipt artifacts/cn-x1-1-promotion-receipt.json
          cmp artifacts/reproduced-formal/cn_x1_1.json data/research/formal_backtests/cn_x1_1.json
      - name: Verify current catalog still references the reproduced CN package
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('data/research/formal_backtests')
          package = root / 'cn_x1_1.json'
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          catalog = json.loads((root / 'catalog.json').read_text(encoding='utf-8'))
          freshness = json.loads((root / 'freshness.json').read_text(encoding='utf-8'))
          rows = [row for row in catalog['records'] if row['model_id'] == 'cn_x1_1']
          assert len(rows) == 1
          assert rows[0]['path'] == 'cn_x1_1.json'
          assert rows[0]['sha256'] == digest
          assert 'cn_x1_0' not in {row['model_id'] for row in catalog['records']}
          assert 'cn_x1_1' in freshness['required_models']
          assert 'cn_x1_0' not in freshness['required_models']
          print('CN x1.1 package is byte-reproducible and correctly referenced by the current publication.')
          PY
      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cn-x1-1-formal-promotion-${{ github.run_id }}
          path: |
            artifacts/cn-x1-1-promotion-receipt.json
            artifacts/reproduced-formal/cn_x1_1.json
            data/research/cn_x1_1_regime_gated_candidate_v1
          if-no-files-found: error
          retention-days: 90
