name: Frontend 978 979 closeout

on:
  push:
    branches:
      - fix/frontend-quality-978-979

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/frontend-quality-978-979
          fetch-depth: 0

      - name: Apply product patch
        run: python3 scripts/frontend_978_979_patch.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json

      - name: Install locked frontend toolchain
        working-directory: qlib-dashboard
        run: npm ci --no-audit --no-fund

      - name: Validate changed frontend boundaries
        working-directory: qlib-dashboard
        run: |
          node scripts/check-account.mjs
          npx tsc --noEmit
          npx eslint src/components/PerformanceCharts.tsx src/components/ChartBenchmarkControl.tsx src/components/ProductShareButton.tsx src/components/PwaInstall.tsx src/pages/LandingPage.tsx src/hooks/useMarketComparisons.ts src/hooks/useMarketComparisons.test.ts --max-warnings 0
          npx vitest run src/hooks/useMarketComparisons.test.ts

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/frontend-978-979-closeout.yml' ':!scripts/frontend_978_979_patch.py'
          git diff --cached --quiet && exit 0
          git commit -m "fix(frontend): close comparison lifecycle and sharing gaps"
          git push origin HEAD:fix/frontend-quality-978-979
