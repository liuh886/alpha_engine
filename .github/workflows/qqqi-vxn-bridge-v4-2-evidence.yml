name: QQQI VXN Bridge v4.2 Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-vxn-bridge-v4-2-evidence.yml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_vxn_bridge_v4_2.yaml"
      - "scripts/run_qqqi_qqq_tqqq_vxn_bridge_v4_2.py"
      - "src/research/vxn_bridge_allocation_experiment.py"
      - "tests/test_vxn_bridge_allocation_experiment.py"
      - "notebooks/16_qqqi_qqq_tqqq_vxn_v4_1_backtest_review.ipynb"
      - "docs/research/qqqi_qqq_tqqq_vxn_bridge_v4_2_experiment.md"
      - "docs/research/qqqi_qqq_tqqq_vxn_v4_1_full_backtest_review_2026-07-31.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff lint bridge paths
        run: >-
          uv run ruff check
          src/research/vxn_bridge_allocation_experiment.py
          scripts/run_qqqi_qqq_tqqq_vxn_bridge_v4_2.py
          tests/test_vxn_bridge_allocation_experiment.py
      - name: Mypy focused bridge paths
        run: >-
          uv run mypy --follow-imports=skip
          src/research/vxn_bridge_allocation_experiment.py
          scripts/run_qqqi_qqq_tqqq_vxn_bridge_v4_2.py
      - name: Run bridge and inherited strategy tests
        run: >-
          uv run pytest
          tests/test_vxn_bridge_allocation_experiment.py
          tests/test_vxn_leverage_overlay_experiment.py
          tests/test_breadth_vxn_rotation_experiment.py
          tests/test_vix_rotation_experiment.py
          tests/test_strategy_experiment_journal.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Compile modules and notebook
        run: |
          uv run python -m py_compile \
            src/research/vxn_bridge_allocation_experiment.py \
            scripts/run_qqqi_qqq_tqqq_vxn_bridge_v4_2.py \
            tests/test_vxn_bridge_allocation_experiment.py
          uv run python - <<'PY'
          import json
          from pathlib import Path
          path = Path("notebooks/16_qqqi_qqq_tqqq_vxn_v4_1_backtest_review.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          for cell in notebook.get("cells", []):
              if cell.get("cell_type") == "code":
                  compile("".join(cell.get("source", [])), str(path), "exec")
          PY
      - name: Run frozen v4.2 bridge experiment
        run: >-
          uv run python scripts/run_qqqi_qqq_tqqq_vxn_bridge_v4_2.py
          --end-date 2026-08-01
          --output-dir artifacts/evidence/qqqi_qqq_tqqq_vxn_bridge_v4_2
          --strategy-run-dir artifacts/strategy_runs
      - name: Upload evidence and strategy run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-vxn-bridge-v4-2-evidence
          path: |
            artifacts/evidence/qqqi_qqq_tqqq_vxn_bridge_v4_2
            artifacts/strategy_runs/qqqi_qqq_tqqq_vxn_bridge_v4_2
          if-no-files-found: warn
          retention-days: 14
