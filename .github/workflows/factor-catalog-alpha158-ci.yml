name: Factor Catalog Alpha158 CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/factors/**"
      - "configs/factor_libraries/**"
      - "scripts/factors/**"
      - "tests/test_factor_library.py"
      - "tests/test_strategy_factor_snapshot.py"
      - "tests/test_factor_catalog_alpha158.py"
      - "tests/test_factor_asset_inventory.py"
      - "docs/research/factor_catalog_alpha158_v1_2026-08-01.md"
      - ".github/workflows/factor-catalog-alpha158-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
  push:
    branches: [main]
    paths:
      - "src/factors/**"
      - "configs/factor_libraries/**"
      - "scripts/factors/**"
      - "tests/test_factor_library.py"
      - "tests/test_strategy_factor_snapshot.py"
      - "tests/test_factor_catalog_alpha158.py"
      - "tests/test_factor_asset_inventory.py"
      - "docs/research/factor_catalog_alpha158_v1_2026-08-01.md"
      - ".github/workflows/factor-catalog-alpha158-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-uv
      - name: Ruff factor catalog
        run: >-
          uv run ruff check
          src/factors
          scripts/factors
          tests/test_factor_library.py
          tests/test_strategy_factor_snapshot.py
          tests/test_factor_catalog_alpha158.py
          tests/test_factor_asset_inventory.py
      - name: Mypy factor catalog
        run: >-
          uv run mypy
          src/factors
          scripts/factors
      - name: Run factor foundation tests
        run: >-
          uv run pytest
          tests/test_factor_library.py
          tests/test_strategy_factor_snapshot.py
          tests/test_factor_catalog_alpha158.py
          tests/test_factor_asset_inventory.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Build catalog and inventory artifacts
        run: |
          uv run python scripts/factors/build_factor_catalog.py
          uv run python scripts/factors/audit_existing_factor_assets.py
      - name: Upload catalog artifacts
        uses: actions/upload-artifact@v7
        with:
          name: factor-catalog-alpha158-${{ github.run_id }}
          path: artifacts/factor_catalog
          if-no-files-found: error
          retention-days: 90
