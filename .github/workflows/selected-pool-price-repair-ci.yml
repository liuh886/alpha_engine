name: Selected Pool Price Repair CI

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/pools/selected_pool_registry_v1.yaml"
      - "src/data/provider_catalog.py"
      - "src/data/adapters/akshare_adapter.py"
      - "src/data/adapters/efinance_adapter.py"
      - "src/data/adapters/tushare_adapter.py"
      - "src/data/adapters/yfinance_adapter.py"
      - "scripts/data/refresh_selected_pool_prices.py"
      - "scripts/data/refresh_selected_pool_prices_v2.py"
      - "tests/test_provider_catalog.py"
      - "tests/test_tushare_adapter.py"
      - "tests/test_yfinance_adapter.py"
      - "tests/test_refresh_selected_pool_prices.py"
      - "tests/test_refresh_selected_pool_prices_v2.py"
      - "docs/research/selected_pool_price_repair_v1_2026-08-01.md"
      - ".github/workflows/selected-pool-price-repair-ci.yml"
  push:
    branches: [main]
    paths:
      - "configs/pools/selected_pool_registry_v1.yaml"
      - "src/data/provider_catalog.py"
      - "src/data/adapters/akshare_adapter.py"
      - "src/data/adapters/efinance_adapter.py"
      - "src/data/adapters/tushare_adapter.py"
      - "src/data/adapters/yfinance_adapter.py"
      - "scripts/data/refresh_selected_pool_prices.py"
      - "scripts/data/refresh_selected_pool_prices_v2.py"
      - "tests/test_provider_catalog.py"
      - "tests/test_tushare_adapter.py"
      - "tests/test_yfinance_adapter.py"
      - "tests/test_refresh_selected_pool_prices.py"
      - "tests/test_refresh_selected_pool_prices_v2.py"
      - "docs/research/selected_pool_price_repair_v1_2026-08-01.md"
      - ".github/workflows/selected-pool-price-repair-ci.yml"
  workflow_dispatch:
    inputs:
      market:
        description: "Market to refresh in an isolated build"
        required: true
        default: "cn"
        type: choice
        options: [cn, us]
      max_rounds:
        description: "Provider retry rounds per symbol"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3"]

concurrency:
  group: selected-pool-price-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff provider and selected-pool repair
        run: >-
          uv run ruff check
          src/data/provider_catalog.py
          src/data/adapters/akshare_adapter.py
          src/data/adapters/efinance_adapter.py
          src/data/adapters/tushare_adapter.py
          src/data/adapters/yfinance_adapter.py
          scripts/data/refresh_selected_pool_prices.py
          scripts/data/refresh_selected_pool_prices_v2.py
          tests/test_provider_catalog.py
          tests/test_tushare_adapter.py
          tests/test_yfinance_adapter.py
          tests/test_refresh_selected_pool_prices.py
          tests/test_refresh_selected_pool_prices_v2.py
      - name: Mypy provider and selected-pool repair
        run: >-
          uv run mypy
          src/data/provider_catalog.py
          src/data/adapters/akshare_adapter.py
          src/data/adapters/efinance_adapter.py
          src/data/adapters/tushare_adapter.py
          src/data/adapters/yfinance_adapter.py
          scripts/data/refresh_selected_pool_prices.py
          scripts/data/refresh_selected_pool_prices_v2.py
      - name: Run provider and selected-pool repair tests
        run: >-
          uv run pytest
          tests/test_provider_catalog.py
          tests/test_tushare_adapter.py
          tests/test_yfinance_adapter.py
          tests/test_refresh_selected_pool_prices.py
          tests/test_refresh_selected_pool_prices_v2.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

  live-repair-on-pr:
    if: github.event_name == 'pull_request'
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        market: [cn, us]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Rebuild complete selected-pool history and provider
        run: >-
          uv run python scripts/data/refresh_selected_pool_prices_v2.py
          --market "${{ matrix.market }}"
          --source-csv-dir data/csv_clean
          --output-root "artifacts/selected_pool_price_refresh/${{ matrix.market }}"
          --start 2021-01-01
          --cutoff 2026-06-18
          --max-rounds 1
          --full-refresh
      - name: Upload complete source, provider and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-pool-price-repair-${{ matrix.market }}-${{ github.run_id }}
          path: artifacts/selected_pool_price_refresh/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 90

  manual-live-repair:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Rebuild complete selected-pool history and provider
        run: >-
          uv run python scripts/data/refresh_selected_pool_prices_v2.py
          --market "${{ inputs.market }}"
          --source-csv-dir data/csv_clean
          --output-root "artifacts/selected_pool_price_refresh/${{ inputs.market }}"
          --start 2021-01-01
          --cutoff 2026-06-18
          --max-rounds "${{ inputs.max_rounds }}"
          --full-refresh
      - name: Upload complete source, provider and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-pool-price-repair-${{ inputs.market }}-${{ github.run_id }}
          path: artifacts/selected_pool_price_refresh/${{ inputs.market }}
          if-no-files-found: error
          retention-days: 90
