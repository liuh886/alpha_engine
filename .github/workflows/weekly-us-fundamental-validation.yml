name: Weekly US Fundamental Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-us-fundamental-validation.yml"
      - "src/research/latest_us_fundamental_validation.py"
      - "src/research/minimal_fundamental_validation.py"
      - "configs/factors/us_fundamental_acceleration_v1.yaml"
      - "configs/providers/us_small_pool_sec_cik_v1.yaml"
  schedule:
    - cron: "45 23 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-us-fundamental-validation
  cancel-in-progress: false

jobs:
  run-observed-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Run latest fundamental validation
        id: validation
        shell: bash
        run: |
          mkdir -p artifacts/operations
          set +e
          uv run python scripts/run_latest_us_fundamental_validation.py \
            2>&1 | tee artifacts/operations/weekly_us_fundamental_validation.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Inspect blocked SEC concept shapes
        if: always()
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          from src.research.latest_us_fundamental_validation import (
              CompressedSecHttpClient,
              SEC_CONTRACT,
          )

          coverage_files = sorted(
              Path("artifacts/evidence/latest_us_fundamental_validation").glob(
                  "*/sec_companyfacts/coverage_report.json"
              )
          )
          if not coverage_files:
              raise SystemExit(0)
          coverage = json.loads(coverage_files[-1].read_text(encoding="utf-8"))
          blocked = [
              row
              for row in coverage.get("rows", [])
              if not row.get("factor_ready") and row.get("cik")
          ]
          if not blocked:
              raise SystemExit(0)

          contract = yaml.safe_load(SEC_CONTRACT.read_text(encoding="utf-8"))
          http = contract["http"]
          client = CompressedSecHttpClient(
              user_agent=os.environ["SEC_USER_AGENT"],
              ticker_mapping_url=str(http["ticker_mapping_url"]),
              companyfacts_url_template=str(http["companyfacts_url_template"]),
              minimum_interval_seconds=float(http["minimum_request_interval_seconds"]),
              timeout_seconds=int(http["timeout_seconds"]),
          )
          accepted_forms = {str(value) for value in contract["forms"]["accepted"]}
          tokens = (
              "revenue",
              "sales",
              "grossprofit",
              "costofrevenue",
              "costofgoods",
              "costofsales",
          )
          inventory = {}
          for blocked_row in blocked:
              symbol = str(blocked_row["symbol"])
              cik = str(blocked_row["cik"])
              try:
                  payload = client.companyfacts(cik)
              except Exception as exc:
                  inventory[symbol] = {
                      "cik": cik,
                      "fetch_error": type(exc).__name__,
                  }
                  continue
              relevant = {}
              for namespace, namespace_facts in payload.get("facts", {}).items():
                  if namespace not in {"us-gaap", "ifrs-full"}:
                      continue
                  if not isinstance(namespace_facts, dict):
                      continue
                  for concept_name, concept_payload in namespace_facts.items():
                      compact_name = str(concept_name).replace("_", "").lower()
                      if not any(token in compact_name for token in tokens):
                          continue
                      if not isinstance(concept_payload, dict):
                          continue
                      entries = []
                      for unit, unit_rows in concept_payload.get("units", {}).items():
                          if not isinstance(unit_rows, list):
                              continue
                          for row in unit_rows:
                              if not isinstance(row, dict):
                                  continue
                              if str(row.get("form", "")) not in accepted_forms:
                                  continue
                              start = row.get("start")
                              end = row.get("end")
                              duration_days = None
                              if start and end:
                                  try:
                                      duration_days = (
                                          __import__("datetime").date.fromisoformat(str(end))
                                          - __import__("datetime").date.fromisoformat(str(start))
                                      ).days + 1
                                  except ValueError:
                                      duration_days = None
                              entries.append(
                                  {
                                      "unit": str(unit),
                                      "form": str(row.get("form", "")),
                                      "fp": str(row.get("fp", "")),
                                      "frame": str(row.get("frame", "")),
                                      "start": start,
                                      "end": end,
                                      "filed": row.get("filed"),
                                      "duration_days": duration_days,
                                  }
                              )
                      if not entries:
                          continue
                      durations = [
                          row["duration_days"]
                          for row in entries
                          if row["duration_days"] is not None
                      ]
                      relevant[f"{namespace}:{concept_name}"] = {
                          "count": len(entries),
                          "units": sorted({row["unit"] for row in entries}),
                          "forms": sorted({row["form"] for row in entries}),
                          "fps": sorted({row["fp"] for row in entries}),
                          "frames": sorted(
                              {row["frame"] for row in entries if row["frame"]}
                          )[:20],
                          "duration_days_min": min(durations) if durations else None,
                          "duration_days_max": max(durations) if durations else None,
                          "recent_samples": sorted(
                              entries,
                              key=lambda row: str(row.get("filed") or ""),
                          )[-5:],
                      }
              inventory[symbol] = {
                  "cik": cik,
                  "entity_name": payload.get("entityName"),
                  "existing_reason_codes": blocked_row.get("reason_codes", []),
                  "concepts": relevant,
              }

          output = Path("artifacts/operations/sec_blocked_concept_inventory.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(inventory, ensure_ascii=False, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY
      - name: Write run summary
        if: always()
        shell: bash
        run: |
          echo "# Weekly US Fundamental Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: diagnostic only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trade ready: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exit code: ${{ steps.validation.outputs.exit_code || '1' }}" >> "$GITHUB_STEP_SUMMARY"
          latest=$(find artifacts/evidence/latest_us_fundamental_validation -name decision.json -type f 2>/dev/null | sort | tail -1)
          blocked=$(find artifacts/evidence/latest_us_fundamental_validation -name blocked.json -type f 2>/dev/null | sort | tail -1)
          if [ -n "$latest" ]; then
            echo "- Validation decision artifact: \`$latest\`" >> "$GITHUB_STEP_SUMMARY"
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$blocked" ]; then
            echo "- Source-blocked artifact: \`$blocked\`" >> "$GITHUB_STEP_SUMMARY"
            cat "$blocked" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No validation artifact was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish first-run result to Issue 225
        if: always() && github.event_name != 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comment=artifacts/operations/fundamental_issue_comment.md
          latest=$(find artifacts/evidence/latest_us_fundamental_validation -path '*/validation/decision.json' -type f 2>/dev/null | sort | tail -1)
          blocked=$(find artifacts/evidence/latest_us_fundamental_validation -name blocked.json -type f 2>/dev/null | sort | tail -1)
          {
            echo "### Live fundamental validation run"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Exit code: \`${{ steps.validation.outputs.exit_code || '1' }}\`"
            echo "- Mode: \`diagnostic_only\`"
            echo "- Trade ready: \`false\`"
            echo
            if [ -n "$latest" ]; then
              echo "#### Validation decision"
              echo '```json'
              cat "$latest"
              echo '```'
            elif [ -n "$blocked" ]; then
              echo "#### Source blocker"
              echo '```json'
              cat "$blocked"
              echo '```'
            else
              echo "#### Run did not reach a decision artifact"
              echo '```text'
              tail -30 artifacts/operations/weekly_us_fundamental_validation.log 2>/dev/null || true
              echo '```'
            fi
          } > "$comment"
          gh issue comment 225 --repo "$GITHUB_REPOSITORY" --body-file "$comment"
      - name: Upload evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-us-fundamental-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence/latest_us_fundamental_validation
            artifacts/market_snapshots/us_small_pool_v1
            artifacts/factor_registry.db
            artifacts/operations
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve governed failure status
        if: always()
        shell: bash
        run: |
          status="${{ steps.validation.outputs.exit_code || '1' }}"
          if [ "$status" != "0" ]; then
            echo "Fundamental validation was blocked before completion; inspect uploaded evidence."
            exit "$status"
          fi
