name: Weekly US Fundamental Validation

on:
  schedule:
    - cron: "45 23 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-us-fundamental-validation
  cancel-in-progress: false

jobs:
  run-observed-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SEC_EGRESS_MODE: ${{ vars.SEC_EGRESS_MODE || 'direct' }}
      SEC_EGRESS_PROXY_ID: ${{ vars.SEC_EGRESS_PROXY_ID || '' }}
      SEC_EGRESS_PROXY_URL: ${{ secrets.SEC_EGRESS_PROXY_URL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Run latest fundamental validation
        id: validation
        shell: bash
        run: |
          mkdir -p artifacts/operations
          set +e
          uv run python scripts/run_latest_us_fundamental_validation.py \
            2>&1 | tee artifacts/operations/weekly_us_fundamental_validation.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Write run summary
        if: always()
        shell: bash
        run: |
          echo "# Weekly US Fundamental Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: diagnostic only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trade ready: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exit code: ${{ steps.validation.outputs.exit_code || '1' }}" >> "$GITHUB_STEP_SUMMARY"
          latest=$(find artifacts/evidence/latest_us_fundamental_validation -path '*/validation/decision.json' -type f 2>/dev/null | sort | tail -1)
          blocked=$(find artifacts/evidence/latest_us_fundamental_validation -name blocked.json -type f 2>/dev/null | sort | tail -1)
          if [ -n "$latest" ]; then
            echo "- Validation decision artifact: \`$latest\`" >> "$GITHUB_STEP_SUMMARY"
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$blocked" ]; then
            echo "- Source-blocked artifact: \`$blocked\`" >> "$GITHUB_STEP_SUMMARY"
            cat "$blocked" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No validation artifact was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish manual-run result to Issue 225
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comment=artifacts/operations/fundamental_issue_comment.md
          latest=$(find artifacts/evidence/latest_us_fundamental_validation -path '*/validation/decision.json' -type f 2>/dev/null | sort | tail -1)
          blocked=$(find artifacts/evidence/latest_us_fundamental_validation -name blocked.json -type f 2>/dev/null | sort | tail -1)
          applicability=$(find artifacts/evidence/latest_us_fundamental_validation -name factor_applicability.json -type f 2>/dev/null | sort | tail -1)
          {
            echo "### Live fundamental validation run"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Exit code: \`${{ steps.validation.outputs.exit_code || '1' }}\`"
            echo "- Mode: \`diagnostic_only\`"
            echo "- Trade ready: \`false\`"
            echo
            if [ -n "$applicability" ]; then
              echo "#### Factor applicability"
              echo '```json'
              cat "$applicability"
              echo '```'
              echo
            fi
            if [ -n "$latest" ]; then
              echo "#### Validation decision"
              echo '```json'
              cat "$latest"
              echo '```'
            elif [ -n "$blocked" ]; then
              echo "#### Source blocker"
              echo '```json'
              cat "$blocked"
              echo '```'
            else
              echo "#### Run did not reach a decision artifact"
              echo '```text'
              tail -30 artifacts/operations/weekly_us_fundamental_validation.log 2>/dev/null || true
              echo '```'
            fi
          } > "$comment"
          gh issue comment 225 --repo "$GITHUB_REPOSITORY" --body-file "$comment"
      - name: Upload evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-us-fundamental-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence/latest_us_fundamental_validation
            artifacts/market_snapshots/us_small_pool_v1
            artifacts/factor_registry.db
            artifacts/operations
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve governed failure status
        if: always()
        shell: bash
        run: |
          status="${{ steps.validation.outputs.exit_code || '1' }}"
          if [ "$status" != "0" ]; then
            echo "Fundamental validation was blocked before completion; inspect uploaded evidence."
            exit "$status"
          fi
