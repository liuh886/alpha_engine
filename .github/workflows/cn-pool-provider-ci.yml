name: A-Share Pool Provider Contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/providers/cn_small_pool_v1_provider_contract.yaml"
      - "configs/pools/cn_small_pool_v1.yaml"
      - "configs/research_paradigms/cn_small_pool_sector_rotation_v1.yaml"
      - "src/data/adapters/akshare_adapter.py"
      - "src/research/cn_pool_provider.py"
      - "scripts/build_cn_pool_provider.py"
      - "tests/test_cn_pool_provider.py"
      - "docs/research/cn_pool_provider_contract_2026-07-30.md"
      - ".github/workflows/cn-pool-provider-ci.yml"
  push:
    branches: [main]
    paths:
      - "configs/providers/cn_small_pool_v1_provider_contract.yaml"
      - "configs/pools/cn_small_pool_v1.yaml"
      - "configs/research_paradigms/cn_small_pool_sector_rotation_v1.yaml"
      - "src/data/adapters/akshare_adapter.py"
      - "src/research/cn_pool_provider.py"
      - "scripts/build_cn_pool_provider.py"
      - "tests/test_cn_pool_provider.py"
      - "docs/research/cn_pool_provider_contract_2026-07-30.md"
      - ".github/workflows/cn-pool-provider-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff provider files
        run: >-
          uv run ruff check
          src/data/adapters/akshare_adapter.py
          src/research/cn_pool_provider.py
          scripts/build_cn_pool_provider.py
          tests/test_cn_pool_provider.py
      - name: Run provider contract tests
        run: >-
          uv run pytest
          tests/test_cn_pool_provider.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
