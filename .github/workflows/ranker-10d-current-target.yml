name: 10D Ranker Current Target

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ranker-10d-current-target.yml"
      - "scripts/run_ranker_current_target.py"
      - "src/research/ranker_current_target.py"
      - "src/research/us_x1_3_current_target.py"
      - "src/research/cn_x1_2_current_target.py"
      - "src/research/cn_x1_2_prospective.py"
      - "src/artifacts/strategy_signal_ledger.py"
      - "src/artifacts/strategy_operations.py"
      - "src/governance/active_strategy_catalog.py"
      - "src/governance/strategy_runtime_capabilities.py"
      - "configs/strategies/registry.json"
      - "configs/models/us_x1_3.yaml"
      - "configs/models/cn_x1_2.yaml"
      - "data/research/formal_model_runs/**"
      - "data/research/market_evidence/**"

permissions:
  contents: write

concurrency:
  group: ranker-10d-current-target
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Capture executed source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate active ranker runtime
        run: |
          uv run ruff check \
            scripts/run_ranker_current_target.py \
            src/research/ranker_current_target.py \
            src/research/us_x1_3_current_target.py \
            src/research/cn_x1_2_current_target.py \
            src/governance/strategy_runtime_capabilities.py \
            tests/test_strategy_runtime_capabilities.py \
            tests/test_ranker_current_target_runtime.py
          uv run pytest \
            tests/test_strategy_runtime_capabilities.py \
            tests/test_ranker_current_target_runtime.py \
            tests/test_strategy_signal_ledger.py \
            -q --strict-markers --tb=short
      - name: Evaluate active markets independently
        env:
          EXECUTION_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/ranker-current-target
          git config user.name "AlphaEngine Ranker Operations"
          git config user.email "ranker-operations@alphaengine.local"
          as_of="$(date -u +%F)"
          failures=()

          for market in us cn; do
            echo "::group::${market} current target"
            due_file="artifacts/ranker-current-target/${market}_due.json"

            if ! uv run python scripts/run_ranker_current_target.py due \
              --market "$market" \
              --formal-root data/research/formal_model_runs \
              --as-of "$as_of" \
              --output "$due_file"; then
              failures+=("${market}:due")
              echo "::error::${market} due resolution failed"
              echo "::endgroup::"
              continue
            fi

            due="$(uv run python -c "import json; print('true' if json.load(open('$due_file'))['due'] else 'false')")"
            signal_date="$(uv run python -c "import json; print(json.load(open('$due_file')).get('signal_date') or '')")"
            if [ "$due" != "true" ]; then
              echo "${market}: no decision due"
              echo "::endgroup::"
              continue
            fi

            provider="artifacts/ranker-current-target/${market}_provider"
            signal="artifacts/ranker-current-target/${market}_signal.json"
            if ! uv run python scripts/data/refresh_selected_pool_prices_v2.py \
              --market "$market" \
              --source-csv-dir data/csv_clean \
              --output-root "$provider" \
              --start 2021-01-01 \
              --cutoff "$signal_date" \
              --max-rounds 3; then
              failures+=("${market}:provider")
              echo "::error::${market} provider refresh failed"
              echo "::endgroup::"
              continue
            fi

            if ! uv run python scripts/run_ranker_current_target.py build \
              --market "$market" \
              --formal-root data/research/formal_model_runs \
              --provider-dir "$provider/data/providers/$market" \
              --signal-date "$signal_date" \
              --market-cutoff "$signal_date" \
              --output "$signal"; then
              failures+=("${market}:build")
              echo "::error::${market} current-target build failed"
              echo "::endgroup::"
              continue
            fi

            model="$(uv run python -c "import json; print(json.load(open('$signal'))['model_version_id'])")"
            created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if ! uv run alpha ops record-decision \
              --model-version-id "$model" \
              --signal-json "$signal" \
              --delivery-status pending \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --commit-sha "$EXECUTION_SHA" \
              --created-at-utc "$created_at"; then
              failures+=("${market}:seal")
              echo "::error::${market} canonical decision seal failed"
              git reset -- data/research/strategy_signal_ledgers >/dev/null 2>&1 || true
              echo "::endgroup::"
              continue
            fi

            git add "data/research/strategy_signal_ledgers/$model"
            if git diff --cached --quiet; then
              echo "${market}: canonical decision already sealed"
            else
              git commit -m "ops: seal ${model} decision ${signal_date}"
              if ! git pull --rebase origin main || ! git push origin HEAD:main; then
                failures+=("${market}:publish")
                echo "::error::${market} canonical decision publication failed"
                git rebase --abort >/dev/null 2>&1 || true
                git reset --hard origin/main >/dev/null 2>&1 || true
                echo "::endgroup::"
                continue
              fi
            fi
            echo "::endgroup::"
          done

          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run alpha ops build \
            --generated-at "$generated_at" \
            --output artifacts/ranker-current-target/strategy-operations.json

          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'Ranker market failures: %s\n' "${failures[*]}" >&2
            exit 1
          fi
      - name: Retain current-target evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ranker-current-target-${{ github.run_id }}
          path: artifacts/ranker-current-target
          if-no-files-found: error
          retention-days: 30
