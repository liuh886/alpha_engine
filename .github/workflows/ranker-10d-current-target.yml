name: 10D Ranker Current Target

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ranker-10d-current-target.yml"
      - "scripts/run_ranker_current_target.py"
      - "src/research/ranker_current_target.py"
      - "src/research/us_x1_3_current_target.py"
      - "src/research/cn_x1_2_current_target.py"
      - "src/research/cn_x1_2_prospective.py"
      - "src/artifacts/strategy_signal_ledger.py"
      - "src/artifacts/strategy_operations.py"
      - "src/governance/active_strategy_catalog.py"
      - "src/governance/strategy_runtime_capabilities.py"
      - "configs/strategies/registry.json"
      - "configs/models/us_x1_3.yaml"
      - "configs/models/cn_x1_2.yaml"
      - "data/research/formal_model_runs/**"
      - "data/research/market_evidence/**"

permissions:
  contents: write

concurrency:
  group: ranker-10d-current-target
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Capture executed source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate active ranker runtime
        run: |
          uv run ruff check \
            scripts/run_ranker_current_target.py \
            src/research/ranker_current_target.py \
            src/research/us_x1_3_current_target.py \
            src/research/cn_x1_2_current_target.py \
            src/governance/strategy_runtime_capabilities.py \
            tests/test_strategy_runtime_capabilities.py \
            tests/test_ranker_current_target_runtime.py
          uv run pytest \
            tests/test_strategy_runtime_capabilities.py \
            tests/test_ranker_current_target_runtime.py \
            tests/test_strategy_signal_ledger.py \
            -q --strict-markers --tb=short
      - name: Resolve due decisions from active registry
        id: due
        run: |
          set -euo pipefail
          mkdir -p artifacts/ranker-current-target
          as_of="$(date -u +%F)"
          for market in us cn; do
            uv run python scripts/run_ranker_current_target.py due \
              --market "$market" \
              --formal-root data/research/formal_model_runs \
              --as-of "$as_of" \
              --output "artifacts/ranker-current-target/${market}_due.json"
          done
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          for market in ("us", "cn"):
              payload = json.loads(Path(f"artifacts/ranker-current-target/{market}_due.json").read_text())
              print(f"{market}_due={'true' if payload['due'] else 'false'}")
              print(f"{market}_date={payload.get('signal_date') or ''}")
          PY
      - name: Build due current targets
        env:
          US_DUE: ${{ steps.due.outputs.us_due }}
          US_DATE: ${{ steps.due.outputs.us_date }}
          CN_DUE: ${{ steps.due.outputs.cn_due }}
          CN_DATE: ${{ steps.due.outputs.cn_date }}
        run: |
          set -euo pipefail
          for market in us cn; do
            if [ "$market" = us ]; then
              due="$US_DUE"; date="$US_DATE"
            else
              due="$CN_DUE"; date="$CN_DATE"
            fi
            [ "$due" = true ] || continue
            provider="artifacts/ranker-current-target/${market}_provider"
            uv run python scripts/data/refresh_selected_pool_prices_v2.py \
              --market "$market" \
              --source-csv-dir data/csv_clean \
              --output-root "$provider" \
              --start 2021-01-01 \
              --cutoff "$date" \
              --max-rounds 3
            uv run python scripts/run_ranker_current_target.py build \
              --market "$market" \
              --formal-root data/research/formal_model_runs \
              --provider-dir "$provider/data/providers/$market" \
              --signal-date "$date" \
              --market-cutoff "$date" \
              --output "artifacts/ranker-current-target/${market}_signal.json"
          done
      - name: Seal due canonical decisions
        if: steps.due.outputs.us_due == 'true' || steps.due.outputs.cn_due == 'true'
        env:
          EXECUTION_SHA: ${{ steps.source.outputs.sha }}
          US_DUE: ${{ steps.due.outputs.us_due }}
          CN_DUE: ${{ steps.due.outputs.cn_due }}
        run: |
          set -euo pipefail
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for market in us cn; do
            if [ "$market" = us ]; then due="$US_DUE"; else due="$CN_DUE"; fi
            [ "$due" = true ] || continue
            signal="artifacts/ranker-current-target/${market}_signal.json"
            model="$(uv run python -c "import json; print(json.load(open('$signal'))['model_version_id'])")"
            uv run alpha ops record-decision \
              --model-version-id "$model" \
              --signal-json "$signal" \
              --delivery-status pending \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --commit-sha "$EXECUTION_SHA" \
              --created-at-utc "$created_at"
          done
      - name: Commit canonical ranker decisions
        if: steps.due.outputs.us_due == 'true' || steps.due.outputs.cn_due == 'true'
        run: |
          set -euo pipefail
          git config user.name "AlphaEngine Ranker Operations"
          git config user.email "ranker-operations@alphaengine.local"
          git add data/research/strategy_signal_ledgers
          if git diff --cached --quiet; then
            echo "Canonical ranker decisions already sealed."
          else
            git commit -m "ops: seal governed 10-session decisions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Materialize Strategy Operations evidence
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run alpha ops build \
            --generated-at "$generated_at" \
            --output artifacts/ranker-current-target/strategy-operations.json
      - name: Retain current-target evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ranker-current-target-${{ github.run_id }}
          path: artifacts/ranker-current-target
          if-no-files-found: error
          retention-days: 30
