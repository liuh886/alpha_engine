name: QQQI v4.2 Post-Defense State2 Accelerator

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-v4-2-post-defense-state2-accelerator.yml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_v4_2_post_defense_state2_accelerator_v4_10_research.yaml"
      - "src/research/v4_2_post_defense_state2_accelerator.py"
      - "scripts/run_qqqi_v4_2_post_defense_state2_accelerator.py"
      - "tests/test_v4_2_post_defense_state2_accelerator.py"
  workflow_dispatch:
    inputs:
      end_date:
        description: Optional exclusive market-data end date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint and test post-defense accelerator
        run: |
          uv run ruff check \
            src/research/v4_2_post_defense_state2_accelerator.py \
            scripts/run_qqqi_v4_2_post_defense_state2_accelerator.py \
            tests/test_v4_2_post_defense_state2_accelerator.py
          uv run pytest \
            tests/test_v4_2_post_defense_state2_accelerator.py \
            tests/test_v4_2_rsi_vix_sgov_experiment.py \
            tests/test_v4_2_state2_tail_experiment.py \
            tests/test_vxn_bridge_allocation_experiment.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Build governed ETF bundle with bounded retry
        run: |
          for attempt in 1 2 3; do
            if uv run python scripts/data/build_etf_reference_bundle.py \
              --output-root artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Run post-defense state2 accelerator experiment
        run: >-
          uv run python scripts/run_qqqi_v4_2_post_defense_state2_accelerator.py
          --end-date "${{ inputs.end_date }}"
          --etf-data-bundle artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
          --output-dir
          artifacts/evidence/qqqi_qqq_tqqq_v4_2_post_defense_state2_accelerator_v4_10_research
      - name: Upload evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-v4-2-post-defense-state2-accelerator-${{ github.run_id }}
          path: |
            artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1/bundle_manifest.json
            artifacts/evidence/qqqi_qqq_tqqq_v4_2_post_defense_state2_accelerator_v4_10_research
          if-no-files-found: error
          retention-days: 90
