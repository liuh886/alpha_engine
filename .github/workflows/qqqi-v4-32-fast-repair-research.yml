name: QQQ v4.32 Fast Repair Research

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-v4-32-fast-repair-research.yml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_v4_32_ma200_fast_repair_release.yaml"
      - "scripts/run_qqqi_v4_32_ma200_fast_repair_release.py"
      - "src/research/v4_32_ma200_fast_repair_release.py"
      - "tests/test_v4_32_ma200_fast_repair_release.py"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint and focused tests
        run: |
          uv run ruff check src/research/v4_32_ma200_fast_repair_release.py scripts/run_qqqi_v4_32_ma200_fast_repair_release.py tests/test_v4_32_ma200_fast_repair_release.py
          uv run pytest tests/test_v4_32_ma200_fast_repair_release.py tests/test_cnn_fear_greed_adapter.py -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Run frozen v4.32 experiment
        run: uv run python scripts/run_qqqi_v4_32_ma200_fast_repair_release.py --end-date 2026-08-06
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: qqq-v4-32-fast-repair-${{ github.run_id }}
          path: artifacts/evidence/qqqi_qqq_tqqq_v4_32_ma200_fast_repair_release
          if-no-files-found: error
          retention-days: 30
