name: Strategy Signal Delivery Outbox

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/strategy-signal-delivery-outbox.yml"
      - "scripts/run_signal_delivery_outbox.py"
      - "src/artifacts/strategy_signal_ledger.py"
      - "configs/strategies/registry.json"
      - "tests/test_signal_delivery_outbox.py"
      - "tests/test_strategy_signal_ledger.py"
  workflow_run:
    workflows:
      - "QQQ Rotation v4.3 Signal Alert"
      - "10D Ranker Current Target"
      - "CN27 Current Target"
    types: [completed]
  # BYD Daily is already the third workflow_run hop. A fourth hop is not run.
  repository_dispatch:
    types: [strategy_signal_delivery]
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: strategy-signal-delivery-outbox-${{ github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
      - name: Validate outbox contract
        run: |
          uv run ruff check \
            scripts/run_signal_delivery_outbox.py \
            src/artifacts/strategy_signal_ledger.py \
            tests/test_signal_delivery_outbox.py \
            tests/test_strategy_signal_ledger.py
          uv run pytest \
            tests/test_signal_delivery_outbox.py \
            tests/test_strategy_signal_ledger.py \
            -q --strict-markers --tb=short

  deliver:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
      - name: Validate outbox contract
        run: |
          uv run ruff check \
            scripts/run_signal_delivery_outbox.py \
            src/artifacts/strategy_signal_ledger.py \
            tests/test_signal_delivery_outbox.py \
            tests/test_strategy_signal_ledger.py
          uv run pytest \
            tests/test_signal_delivery_outbox.py \
            tests/test_strategy_signal_ledger.py \
            -q --strict-markers --tb=short
      - name: Drain canonical pending decisions
        id: drain
        shell: bash
        run: |
          set +e
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run python scripts/run_signal_delivery_outbox.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --commit-sha "$(git rev-parse HEAD)" \
            --created-at-utc "$created_at" \
            --output artifacts/signal-delivery-outbox/result.json
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Materialize Strategy Operations evidence
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run alpha ops build \
            --generated-at "$generated_at" \
            --output artifacts/signal-delivery-outbox/strategy-operations.json
      - name: Commit append-only delivery receipts
        id: receipts
        run: |
          set -euo pipefail
          git config user.name "AlphaEngine Delivery Outbox"
          git config user.email "delivery-outbox@alphaengine.local"
          git add data/research/strategy_signal_ledgers
          if git diff --cached --quiet; then
            echo "No pending delivery receipt changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "ops: publish strategy delivery receipts"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request strategy operations publication
        # Skip duplicate strategy handoffs, retaining manual/scheduled recovery
        # when a previous dispatch failed after committing its receipt.
        # New failure receipts still publish before the final failure step.
        if: steps.receipts.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -nc \
            --arg producer_workflow "$GITHUB_WORKFLOW" \
            --arg producer_run_id "$GITHUB_RUN_ID" \
            '{event_type: "strategy_operations_publication", client_payload: {
              producer_workflow: $producer_workflow, producer_run_id: $producer_run_id
            }}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
      - name: Retain outbox evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: strategy-signal-delivery-${{ github.run_id }}
          path: artifacts/signal-delivery-outbox
          if-no-files-found: error
          retention-days: 30
      - name: Fail after persisting delivery failure evidence
        if: steps.drain.outputs.status != '0'
        run: exit 1
