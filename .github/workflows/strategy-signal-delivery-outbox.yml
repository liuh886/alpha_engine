name: Strategy Signal Delivery Outbox

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/strategy-signal-delivery-outbox.yml"
      - "scripts/run_signal_delivery_outbox.py"
      - "src/artifacts/strategy_signal_ledger.py"
      - "configs/strategies/registry.json"
      - "tests/test_signal_delivery_outbox.py"
      - "tests/test_strategy_signal_ledger.py"
  workflow_run:
    workflows:
      - "QQQ Rotation v4.3 Signal Alert"
      - "10D Ranker Current Target"
      - "CN27 Current Target"
    types: [completed]
  # BYD Daily is already the third workflow_run hop. A fourth hop is not run.
  repository_dispatch:
    types: [strategy_signal_delivery]
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      verify_private_state_only:
        description: "Verify private restore/CAS no-op without notifications or public state publication"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: strategy-signal-delivery-outbox-${{ github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
      - name: Validate outbox contract
        run: |
          uv run ruff check \
            scripts/run_signal_delivery_outbox.py \
            src/artifacts/strategy_signal_ledger.py \
            tests/test_signal_delivery_outbox.py \
            tests/test_strategy_signal_ledger.py
          uv run pytest \
            tests/test_signal_delivery_outbox.py \
            tests/test_strategy_signal_ledger.py \
            -q --strict-markers --tb=short

  deliver:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_private_state_only == true && github.ref || 'main' }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
      - name: Validate outbox contract
        run: |
          uv run ruff check \
            scripts/run_signal_delivery_outbox.py \
            src/artifacts/strategy_signal_ledger.py \
            tests/test_signal_delivery_outbox.py \
            tests/test_strategy_signal_ledger.py
          uv run pytest \
            tests/test_signal_delivery_outbox.py \
            tests/test_strategy_signal_ledger.py \
            -q --strict-markers --tb=short
      - name: Restore authoritative private ledgers
        env:
          GOVERNED_SOURCE_ARCHIVE_SSH_KEY: ${{ secrets.GOVERNED_SOURCE_ARCHIVE_SSH_KEY }}
        run: >-
          uv run alpha ops private-ledgers restore
          --receipt "$RUNNER_TEMP/private-ledgers.json"
      - name: Verify private state without external delivery
        if: inputs.verify_private_state_only == true
        env:
          GOVERNED_SOURCE_ARCHIVE_WRITE_SSH_KEY: ${{ secrets.GOVERNED_SOURCE_ARCHIVE_WRITE_SSH_KEY }}
        run: |
          uv run alpha ops private-ledgers persist --receipt "$RUNNER_TEMP/private-ledgers.json"
          mkdir -p artifacts/signal-delivery-outbox
          cp "$RUNNER_TEMP/private-ledgers.json" artifacts/signal-delivery-outbox/result.json
      - name: Drain canonical pending decisions
        if: inputs.verify_private_state_only != true
        id: drain
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOVERNED_SOURCE_ARCHIVE_WRITE_SSH_KEY: ${{ secrets.GOVERNED_SOURCE_ARCHIVE_WRITE_SSH_KEY }}
        shell: bash
        run: |
          set +e
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run python scripts/run_signal_delivery_outbox.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --commit-sha "$(git rev-parse HEAD)" \
            --created-at-utc "$created_at" \
            --private-ledger-receipt "$RUNNER_TEMP/private-ledgers.json" \
            --output artifacts/signal-delivery-outbox/result.json
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test -f artifacts/signal-delivery-outbox/result.json
      - name: Materialize Strategy Operations evidence
        if: inputs.verify_private_state_only != true
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run alpha ops build \
            --generated-at "$generated_at" \
            --output artifacts/signal-delivery-outbox/strategy-operations.json
      - name: Commit append-only delivery receipts
        if: inputs.verify_private_state_only != true
        id: receipts
        run: |
          set -euo pipefail
          git config user.name "AlphaEngine Delivery Outbox"
          git config user.email "delivery-outbox@alphaengine.local"
          git add data/research/strategy_signal_ledgers
          if git diff --cached --quiet; then
            echo "No pending delivery receipt changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "ops: publish strategy delivery receipts"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request strategy operations publication
        # Skip duplicate strategy handoffs, retaining manual/scheduled recovery
        # when a previous dispatch failed after committing its receipt.
        # New failure receipts still publish before the final failure step.
        if: inputs.verify_private_state_only != true && (steps.receipts.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -nc \
            --arg producer_workflow "$GITHUB_WORKFLOW" \
            --arg producer_run_id "$GITHUB_RUN_ID" \
            '{event_type: "strategy_operations_publication", client_payload: {
              producer_workflow: $producer_workflow, producer_run_id: $producer_run_id
            }}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
      - name: Retain public delivery receipt only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: strategy-signal-delivery-${{ github.run_id }}
          # strategy-operations.json contains protected current strategy state.
          # Keep only metadata; never upload the entire output directory.
          path: artifacts/signal-delivery-outbox/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail after persisting delivery failure evidence
        if: inputs.verify_private_state_only != true && steps.drain.outputs.status != '0'
        run: exit 1
