name: Pages Live Smoke Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages-live-smoke-once.yml"

permissions:
  contents: read
  issues: write

jobs:
  verify-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://liuh886.github.io/alpha_engine
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for and verify published endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pages-smoke

          fetch() {
            local path="$1"
            local output="$2"
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 30 \
              --retry-delay 10 \
              --retry-all-errors \
              "${BASE_URL}/${path}" \
              --output "$output"
          }

          fetch "" /tmp/pages-smoke/index.html
          fetch "data/manifest.json" /tmp/pages-smoke/manifest.json
          fetch "data/models.json" /tmp/pages-smoke/models.json
          fetch "data/runs/us_x1_1-evidence-30737322468/run.json" /tmp/pages-smoke/run.json

          grep -q "Alpha Engine Research Studio" /tmp/pages-smoke/index.html

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/pages-smoke')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          models = json.loads((root / 'models.json').read_text(encoding='utf-8'))
          run = json.loads((root / 'run.json').read_text(encoding='utf-8'))

          assert manifest['source'] == 'repository_research_store'
          assert 'metadata_db_missing' not in json.dumps(manifest)

          rows = models if isinstance(models, list) else models.get('models', [])
          ids = {row['id'] for row in rows}
          assert {'us_x1_1', 'us_x1_0', 'cn_x1_0'} <= ids

          assert run['run_id'] == 'us_x1_1-evidence-30737322468'
          assert run['model_id'] == 'us_x1_1'
          assert run['research_only'] is True
          assert run['trade_ready'] is False
          PY

      - name: Record successful UAT
        run: |
          gh issue comment 349 --repo "$GITHUB_REPOSITORY" --body "## Live Pages UAT passed\n\nVerified from a clean GitHub-hosted runner:\n\n- `${BASE_URL}/`\n- `${BASE_URL}/data/manifest.json`\n- `${BASE_URL}/data/models.json`\n- `${BASE_URL}/data/runs/us_x1_1-evidence-30737322468/run.json`\n\nAssertions passed: repository-backed source, all three named models present, primary US x1.1 run accessible, `research_only=true`, `trade_ready=false`, and no `metadata_db_missing` steady state.\n\nActivation commit: `${GITHUB_SHA}`."
          gh issue close 349 --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Record failed UAT
        if: failure()
        run: |
          gh issue comment 349 --repo "$GITHUB_REPOSITORY" --body "## Live Pages UAT failed\n\nThe one-time GitHub-hosted smoke test could not validate the public Pages endpoints after retries. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
