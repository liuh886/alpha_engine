name: BYD v1.2 Formal Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/models/byd_v1_2_convex_momentum_budget_v1.yaml"
      - "configs/models/model_registry_v1.yaml"
      - "scripts/promote_byd_v1_2_formal.py"
      - "scripts/sync_formal_bundle_v2.py"
      - "src/research/byd_v1_2_convex_momentum.py"
      - "src/research/byd_v1_2_trend_expansion.py"
      - "src/research/byd_signal_alerts.py"
      - "tests/test_byd_v1_2_convex_momentum.py"
      - "tests/test_byd_signal_alerts.py"
      - "data/research/formal_backtests/**"
      - "data/research/formal_model_runs/**"
      - "qlib-dashboard/src/**"
      - "qlib-dashboard/public/data/formal-model-runs/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/byd-v1-2-formal.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: byd-v1-2-formal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GENERATED_AT: 2026-08-06T09:52:48Z

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json
      - name: Install locked environments
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
          cd qlib-dashboard
          npm ci
      - name: Materialize BYD v1.2 operating surface
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise RuntimeError(f'missing {label} anchor')
              return text.replace(old, new, 1)

          page = Path('qlib-dashboard/src/pages/StrategyOperationsPage.tsx')
          text = page.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '          <Badge className="gap-1.5"><Activity className="h-3 w-3" /> BYD v1.2</Badge>\n          <Badge variant="outline">Research only</Badge>',
              '          <Badge className="gap-1.5"><Activity className="h-3 w-3" /> BYD v1.2</Badge>\n          <Badge variant="secondary">Formal baseline</Badge>\n          <Badge variant="outline">Research only</Badge>',
              'BYD formal badge',
          )
          text = text.replace(
              'bydIndex.latestSignal.record.target_state_label',
              'bydIndex.latestSignal.record.target_mode_label',
          )
          text = replace_once(
              text,
              "Expansion: {bydIndex.latestSignal.record.expansion_active ? 'Active' : 'Inactive'}",
              "Expansion: {bydIndex.latestSignal.record.expansion_active ? 'Active' : 'Inactive'} · financed {formatPercent(bydIndex.latestSignal.record.financed_increment, 2)}",
              'BYD financed increment',
          )
          text = text.replace(
              "['Mom accel 20/60', formatNumber(bydIndex!.latestSignal!.record.factor_context.momentum_accel_20_60, 4)]",
              "['Momentum 20d', formatPercent(bydIndex!.latestSignal!.record.factor_context.mom_20, 2)]",
          )
          text = text.replace(
              "['Open autocorr 20d', formatNumber(bydIndex!.latestSignal!.record.factor_context.open_return_autocorr_20, 4)]",
              "['Momentum 60d', formatPercent(bydIndex!.latestSignal!.record.factor_context.mom_60, 2)]",
          )
          text = text.replace(
              "['Dist from 20d low', formatPercent(bydIndex!.latestSignal!.record.factor_context.distance_from_low_20)]",
              "['Momentum scale', formatPercent(bydIndex!.latestSignal!.record.factor_context.momentum_scale, 2)]",
          )
          text = text.replace(
              '<CardHeader><CardTitle className="text-base">Current allocation</CardTitle></CardHeader>',
              '<CardHeader><CardTitle className="text-base">Formal target allocation</CardTitle></CardHeader>',
          )
          obsolete = (
              'target_state_label',
              'momentum_accel_20_60',
              'open_return_autocorr_20',
              'distance_from_low_20',
          )
          if any(value in text for value in obsolete):
              raise RuntimeError('obsolete BYD runtime fields remain in operations page')
          page.write_text(text, encoding='utf-8')

          deploy = Path('.github/workflows/deploy-pages.yml')
          text = deploy.read_text(encoding='utf-8')
          old_node = """          const expected = new Set(['qqqi_qqq_tqqq_v4_2', 'us_x1_1', 'cn_x1_0', 'byd_dividend_sleeve_v1_0']);
          if (catalog.records.length !== 4) throw new Error('formal catalog must contain exactly four records');
          for (const record of catalog.records) {
            if (!expected.delete(record.model_version_id)) throw new Error(`unexpected formal version: ${record.model_version_id}`);
            const manifestPath = path.join(root, record.manifest_path);
            if (!fs.existsSync(manifestPath)) throw new Error(`missing manifest: ${record.manifest_path}`);
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (manifest.bundle_id !== record.bundle_id) throw new Error(`bundle mismatch: ${record.model_version_id}`);
            if (manifest.publication_channel !== 'formal' || manifest.publication_status !== 'accepted_formal_baseline') throw new Error(`status mismatch: ${record.model_version_id}`);
            for (const section of manifest.sections) {
              if (section.availability_status !== 'available') continue;
              const sectionPath = path.join(path.dirname(manifestPath), section.path);
              if (!fs.existsSync(sectionPath)) throw new Error(`missing section: ${record.model_version_id}/${section.section_id}`);
            }
          }
          if (expected.size) throw new Error(`missing formal versions: ${[...expected].join(', ')}`);
"""
          new_node = """          if (!Array.isArray(catalog.records) || catalog.records.length === 0) throw new Error('formal catalog is empty');
          const seen = new Set();
          for (const record of catalog.records) {
            if (!record.model_version_id || seen.has(record.model_version_id)) throw new Error(`duplicate formal version: ${record.model_version_id}`);
            seen.add(record.model_version_id);
            const manifestPath = path.join(root, record.manifest_path);
            if (!fs.existsSync(manifestPath)) throw new Error(`missing manifest: ${record.manifest_path}`);
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (manifest.bundle_id !== record.bundle_id) throw new Error(`bundle mismatch: ${record.model_version_id}`);
            if (manifest.publication_channel !== 'formal' || manifest.publication_status !== 'accepted_formal_baseline') throw new Error(`status mismatch: ${record.model_version_id}`);
            for (const section of manifest.sections) {
              if (section.availability_status !== 'available') continue;
              const sectionPath = path.join(path.dirname(manifestPath), section.path);
              if (!fs.existsSync(sectionPath)) throw new Error(`missing section: ${record.model_version_id}/${section.section_id}`);
            }
          }
"""
          if old_node in text:
              text = text.replace(old_node, new_node, 1)
          elif new_node not in text:
              raise RuntimeError('missing Node formal-catalog deploy anchor')
          old_python = """          assert {row['model_version_id'] for row in catalog['records']} == {
              'qqqi_qqq_tqqq_v4_2', 'us_x1_1', 'cn_x1_0', 'byd_dividend_sleeve_v1_0'
          }
"""
          new_python = """          model_ids = [row['model_version_id'] for row in catalog['records']]
          assert model_ids and len(model_ids) == len(set(model_ids))
"""
          if old_python in text:
              text = text.replace(old_python, new_python, 1)
          elif new_python not in text:
              raise RuntimeError('missing Python formal-catalog deploy anchor')
          deploy.write_text(text, encoding='utf-8')
          PY
      - name: Verify immutable market inputs
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > "$RUNNER_TEMP/515180.zip"
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  $RUNNER_TEMP/515180.zip" | sha256sum --check --strict
          mkdir -p artifacts/input/byd artifacts/input/515180
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/input/byd
          unzip -q "$RUNNER_TEMP/515180.zip" -d artifacts/input/515180
      - name: Generate complete formal publication
        run: |
          uv run python scripts/promote_byd_v1_2_formal.py \
            --root data/research/formal_backtests \
            --byd-dir artifacts/input/byd \
            --etf-dir artifacts/input/515180 \
            --signal-ledger data/research/byd_v1_2_signal_ledger \
            --generated-at "$GENERATED_AT" \
            --receipt artifacts/byd-v1-2-promotion.json
          rm -rf .research/formal-model-runs
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root data/research/formal_backtests \
            --output-root .research/formal-model-runs \
            --receipt artifacts/formal-bundle-v2.json
          rsync -a --delete --exclude formal-bundle-v2-sync-receipt.json \
            .research/formal-model-runs/ data/research/formal_model_runs/
          cd qlib-dashboard
          npm run sync:formal-model-runs
      - name: Validate code, formal assets and frontend
        run: |
          uv run ruff check \
            scripts/promote_byd_v1_2_formal.py \
            src/research/byd_v1_2_convex_momentum.py \
            src/research/byd_signal_alerts.py \
            scripts/run_byd_signal_alert.py \
            tests/test_byd_v1_2_convex_momentum.py \
            tests/test_byd_signal_alerts.py
          uv run pytest \
            tests/test_byd_v1_2_convex_momentum.py \
            tests/test_byd_signal_alerts.py \
            tests/test_model_x1_baselines.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root data/research/formal_backtests \
            --output-root artifacts/formal-model-runs-second \
            --receipt artifacts/formal-bundle-v2-second.json
          diff -ru --exclude formal-bundle-v2-sync-receipt.json \
            data/research/formal_model_runs artifacts/formal-model-runs-second
          cd qlib-dashboard
          npm run lint
          npx tsc --noEmit
          npm test -- --run
          npm run build
          test -f dist/data/formal-model-runs/catalog.json
          test ! -e dist/data/formal-backtests
      - name: Commit exact formal and frontend publication
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          rm -f .github/workflows/materialize-byd-v1-2-promotion.yml
          git config user.name "AlphaEngine Release Agent"
          git config user.email "release-agent@alphaengine.local"
          git add -A \
            .github/workflows/materialize-byd-v1-2-promotion.yml \
            .github/workflows/deploy-pages.yml \
            qlib-dashboard/src/pages/StrategyOperationsPage.tsx \
            qlib-dashboard/public/data/formal-model-runs \
            data/research/formal_backtests \
            data/research/formal_model_runs
          if git diff --cached --quiet; then
            echo "Formal publication is already byte-stable."
          else
            git commit -m "release: publish BYD v1.2 formal evidence and frontend"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Upload complete formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byd-v1-2-formal-${{ github.run_id }}
          path: |
            artifacts/byd-v1-2-promotion.json
            artifacts/formal-bundle-v2.json
            data/research/formal_backtests/byd_v1_2_convex_momentum_budget_v1.json
            data/research/formal_model_runs/byd_v1_2_convex_momentum_budget_v1
          if-no-files-found: error
          retention-days: 90
