name: Alpha Engine Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'configs/**'
      - 'data/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ranker-10d-current-target.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'configs/**'
      - 'data/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ranker-10d-current-target.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv and locked Python dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Enforce architecture and CI contracts
        run: |
          uv run python scripts/check_ci_governance.py --output artifacts/ci-workflow-inventory.json --enforce
          uv run python scripts/check_legacy_web_boundary.py

      - name: Ruff lint repository
        run: uv run ruff check .

      - name: Mypy type check
        run: uv run mypy src/release src/models/metric_contract.py

      - name: Backend tests
        run: >-
          uv run pytest tests -q --strict-markers --tb=short --disable-warnings

      - name: Package build
        if: github.event_name != 'pull_request'
        run: uv build
