name: Alpha Engine Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'configs/**'
      - 'data/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ranker-10d-current-target.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'configs/**'
      - 'data/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ranker-10d-current-target.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv and locked Python dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Enforce architecture and CI contracts
        run: |
          uv run python scripts/check_ci_governance.py --output artifacts/ci-workflow-inventory.json --enforce
          uv run python scripts/check_legacy_web_boundary.py

      - name: Ruff lint ratcheted production paths
        run: >-
          uv run ruff check
          src/release
          src/models/metric_contract.py
          src/research/experiment_harness.py
          src/research/cross_sectional_experiment_runner.py
          src/research/formal_baseline.py
          src/research/formal_baseline_onboarding.py
          src/research/rules_based_allocation_experiment_runner.py
          src/research/byd_v1_3_candidate.py
          src/research/ranker_current_target.py
          src/research/drift_monitor.py
          src/factors/ranker_snapshot.py
          src/artifacts/strategy_operations.py
          scripts/run_research_experiment.py
          scripts/run_active_research_experiments.py
          scripts/run_ranker_current_target.py
          scripts/diagnose_byd_activity_decay.py
          scripts/screen_byd_successor_states.py
          scripts/evaluate_byd_recovery_satellite.py
          scripts/diagnose_byd_recovery_lifecycle.py
          scripts/evaluate_byd_recovery_event_lifecycle.py
          scripts/evaluate_byd_recovery_event_low_vol_confirmation.py
          scripts/check_legacy_web_boundary.py
          scripts/check_ci_governance.py
          tests/test_formal_baseline_onboarding.py
          tests/test_rules_based_allocation_experiment_runner.py
          tests/test_ranker_current_target.py
          tests/test_strategy_operations.py
          tests/test_t47_drift_monitor.py

      - name: Mypy type check
        run: uv run mypy src/release src/models/metric_contract.py

      - name: Core release-contract tests
        run: >-
          uv run pytest
          tests/test_release_candidate_generation.py
          tests/test_release_candidate_gate.py
          tests/test_walk_forward.py
          tests/test_vectorized_backtest.py
          tests/test_architecture_contract.py
          tests/test_model_signal_identity.py
          tests/test_data_runtime_truth.py
          tests/test_experiment_harness.py
          tests/test_cross_sectional_experiment_runner.py
          tests/test_formal_baseline_onboarding.py
          tests/test_rules_based_allocation_experiment_runner.py
          tests/test_ranker_current_target.py
          tests/test_strategy_operations.py
          tests/test_t47_drift_monitor.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

      - name: Package build
        if: github.event_name != 'pull_request'
        run: uv build

  us-x1-2-certification:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/us-x1-2-certification'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked Python dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Validate certification implementation
        run: |
          uv run ruff check scripts/certify_us_x1_2.py
          uv run python -m py_compile scripts/certify_us_x1_2.py

      - name: Rebuild current governed US provider
        run: |
          set -euo pipefail
          cutoff="$(date -u +%Y-%m-%d)"
          echo "Provider cutoff: $cutoff"
          rm -rf artifacts/us-x1-2/provider-us
          uv run python scripts/data/refresh_selected_pool_prices_v2.py \
            --root . \
            --market us \
            --source-csv-dir data/csv_clean \
            --output-root artifacts/us-x1-2/provider-us \
            --start 2021-01-01 \
            --cutoff "$cutoff" \
            --max-rounds 3 \
            --full-refresh

      - name: Run full US x1.2 certification
        run: |
          set -euo pipefail
          mkdir -p artifacts/us-x1-2
          uv run python scripts/certify_us_x1_2.py \
            --provider-uri artifacts/us-x1-2/provider-us/data/providers/us \
            --output-dir artifacts/us-x1-2/certification \
            | tee artifacts/us-x1-2/certification.log
          test -s artifacts/us-x1-2/certification/us_x1_2_certification.json
          grep '^US_X1_2_CERTIFICATION=' artifacts/us-x1-2/certification.log

      - name: Upload US x1.2 certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: us-x1-2-certification-${{ github.run_id }}
          path: |
            artifacts/us-x1-2/certification/
            artifacts/us-x1-2/certification.log
            artifacts/us-x1-2/provider-us/artifacts/selected_pool_price_refresh_manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
