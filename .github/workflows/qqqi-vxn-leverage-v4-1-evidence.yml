name: QQQI VXN Leverage v4.1 Evidence

on:
  pull_request:
    branches: [agent/qqqi-v4-breadth-vxn]
    paths:
      - ".github/workflows/qqqi-vxn-leverage-v4-1-evidence.yml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_vxn_leverage_v4_1.yaml"
      - "scripts/run_qqqi_qqq_tqqq_vxn_leverage_v4_1.py"
      - "src/research/vxn_leverage_overlay_experiment.py"
      - "src/research/breadth_vxn_rotation_experiment.py"
      - "tests/test_vxn_leverage_overlay_experiment.py"
      - "docs/research/qqqi_qqq_tqqq_vxn_leverage_v4_1_experiment.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff lint VXN overlay paths
        run: >-
          uv run ruff check
          src/research/vxn_leverage_overlay_experiment.py
          scripts/run_qqqi_qqq_tqqq_vxn_leverage_v4_1.py
          tests/test_vxn_leverage_overlay_experiment.py
      - name: Mypy focused VXN overlay paths
        run: >-
          uv run mypy
          src/research/vxn_leverage_overlay_experiment.py
          scripts/run_qqqi_qqq_tqqq_vxn_leverage_v4_1.py
      - name: Run focused VXN overlay and inherited VIX tests
        run: >-
          uv run pytest
          tests/test_vxn_leverage_overlay_experiment.py
          tests/test_breadth_vxn_rotation_experiment.py
          tests/test_vix_rotation_experiment.py
          tests/test_strategy_experiment_journal.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Compile VXN overlay modules
        run: |
          uv run python -m py_compile \
            src/research/vxn_leverage_overlay_experiment.py \
            scripts/run_qqqi_qqq_tqqq_vxn_leverage_v4_1.py \
            tests/test_vxn_leverage_overlay_experiment.py
      - name: Run frozen VXN leverage-veto experiment
        run: >-
          uv run python scripts/run_qqqi_qqq_tqqq_vxn_leverage_v4_1.py
          --end-date 2026-08-01
          --output-dir artifacts/evidence/qqqi_qqq_tqqq_vxn_leverage_v4_1
          --strategy-run-dir artifacts/strategy_runs
      - name: Upload evidence and strategy run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-vxn-leverage-v4-1-evidence
          path: |
            artifacts/evidence/qqqi_qqq_tqqq_vxn_leverage_v4_1
            artifacts/strategy_runs/qqqi_qqq_tqqq_vxn_leverage_v4_1
          if-no-files-found: warn
          retention-days: 14
