name: CN130 Cross-Sectional Ranking Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/cn130_payload.tar.gz.b64
      - scripts/apply_cn130_payload.py
      - .github/workflows/cn130-cross-sectional-ranking-evidence.yml

permissions:
  contents: write

concurrency:
  group: apply-cn130-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-final-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: research/cn130-cross-sectional-ranking-v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply complete research payload
        run: python scripts/apply_cn130_payload.py
      - name: Commit final implementation and evidence
        run: |
          git config user.name 'AlphaEngine Research Agent'
          git config user.email 'research-agent@alphaengine.local'
          git add -A
          git commit -m 'research: execute CN130 ranking evidence'
          git push origin HEAD:research/cn130-cross-sectional-ranking-v1
