name: Automation Token Write Health

# Temporary diagnostic: probe the reviewed-refresh token's pull-request write
# path (create + close a draft probe PR). Dispatch-only; removed once verified.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  write-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe pull-request write through the automation token
        env:
          GH_TOKEN: ${{ secrets.FORMAL_REFRESH_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PROBE_BRANCH: automation/token-write-probe
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          git init -q "$workdir"
          cd "$workdir"
          git config user.name "AlphaEngine Token Probe"
          git config user.email "token-probe@alphaengine.local"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch -q --depth 1 origin main
          git checkout -q -b "$PROBE_BRANCH" FETCH_HEAD
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > token-write-probe.txt
          git add token-write-probe.txt
          git commit -qm "chore: token write probe"
          git push -q --force origin "HEAD:${PROBE_BRANCH}"
          gh pr create --base main --head "$PROBE_BRANCH" --draft \
            --title "chore: token write probe" \
            --body "Automated probe verifying the reviewed-refresh token can open a pull request. Closed immediately."
          number="$(gh pr list --head "$PROBE_BRANCH" --state open --json number --jq '.[0].number')"
          author="$(gh pr view "$number" --json author --jq '.author.login')"
          gh pr close "$number" --delete-branch
          echo "pull request write probe passed: #${number} created as ${author} and closed"
