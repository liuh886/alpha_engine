name: QQQI v4.21 State2 Intraday Meta Label

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-v4-21-state2-intraday-meta-label.yml"
      - "configs/research_paradigms/qqqi_state2_intraday_meta_label_v4_21_research.yaml"
      - "src/data/adapters/polygon_intraday_adapter.py"
      - "src/data/adapters/yfinance_open_close_research_adapter.py"
      - "src/research/v4_21_state2_intraday_preflight.py"
      - "scripts/run_qqqi_v4_21_intraday_preflight.py"
      - "tests/test_polygon_intraday_adapter.py"
      - "tests/test_yfinance_open_close_research_adapter.py"
      - "tests/test_v4_21_state2_intraday_preflight.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint v4.21 Phase 0
        run: |
          uv run ruff check \
            src/data/adapters/polygon_intraday_adapter.py \
            src/data/adapters/yfinance_open_close_research_adapter.py \
            src/research/v4_21_state2_intraday_preflight.py \
            scripts/run_qqqi_v4_21_intraday_preflight.py \
            tests/test_polygon_intraday_adapter.py \
            tests/test_yfinance_open_close_research_adapter.py \
            tests/test_v4_21_state2_intraday_preflight.py
      - name: Test v4.21 Phase 0 and inherited baseline
        run: |
          uv run pytest \
            tests/test_polygon_intraday_adapter.py \
            tests/test_yfinance_open_close_research_adapter.py \
            tests/test_v4_21_state2_intraday_preflight.py \
            tests/test_polygon_adapter.py \
            tests/test_vxn_bridge_allocation_experiment.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Run governed intraday data preflight
        run: |
          uv run python scripts/run_qqqi_v4_21_intraday_preflight.py \
            --output-dir artifacts/evidence/qqqi_state2_intraday_meta_label_v4_21_research
      - name: Upload v4.21 Phase 0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-v4-21-intraday-phase0-${{ github.run_id }}
          path: artifacts/evidence/qqqi_state2_intraday_meta_label_v4_21_research
          if-no-files-found: error
          retention-days: 90
