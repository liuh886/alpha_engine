      - "configs/factor_libraries/**"
      - "configs/data_contracts/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed-refresh candidate commit to validate
        required: true
        type: string
      pr_number:
        description: Reviewed-refresh PR carrying the candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: formal-refresh-contract-${{ inputs.candidate_sha || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Verify candidate identity
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Classify formal backend impact
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git diff --name-only origin/main...HEAD > changed-files.txt
          else
            git diff --name-only HEAD^1 HEAD^2 > changed-files.txt
          fi
          cat changed-files.txt
          if grep -Ev '^qlib-dashboard/src/' changed-files.txt | grep -q .; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.scope.outputs.backend == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.backend == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json
      - name: Install locked environment
        if: steps.scope.outputs.backend == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
          cd qlib-dashboard
          npm ci --no-audit --no-fund
      - name: Resolve formal publication mode
        if: steps.scope.outputs.backend == 'true'
        id: mode
        shell: bash
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from scripts.run_formal_refresh_transaction import _assert_formal_catalog_or_declared_transition
          from src.governance.active_strategy_catalog import load_active_strategy_catalog

          formal = json.loads(Path("data/research/formal_model_runs/catalog.json").read_text(encoding="utf-8"))
          active = load_active_strategy_catalog()
          observed = {
              str(row.get("model_version_id") or "")
              for row in formal.get("records", [])
              if isinstance(row, dict)
          }
          expected = set(active.active_model_version_ids)
          if observed == expected:
              print("cutover=false")
              print("reason=exact_formal_identity")
          else:
              _assert_formal_catalog_or_declared_transition(formal, active)
              print("cutover=true")
              print("reason=declared_model_cutover_before_reviewed_refresh")
          PY
      - name: Validate declared model cutover
        if: steps.scope.outputs.backend == 'true' && steps.mode.outputs.cutover == 'true'
        run: |
          uv run ruff check \
            src/governance/active_strategy_catalog.py \
            src/governance/strategy_runtime_capabilities.py \
            src/artifacts/formal_bundle_reader.py \
            src/artifacts/formal_bundle_v2_builder.py \
            src/artifacts/us_x1_3_preview.py \
            src/research/us_x1_3_current_target.py \
            src/research/cn_x1_2_prospective.py \
            src/research/cn_x1_2_current_target.py \
            src/research/ranker_current_target.py \
            scripts/run_formal_refresh_transaction.py \
            scripts/run_formal_strategy_refresh.py \
            scripts/build_us_x1_3_preview.py \
            scripts/build_cn_x1_2_prospective_ledger.py \
            scripts/run_ranker_current_target.py \
            scripts/validate_model_x1_baselines.py \
            tests/test_active_strategy_catalog.py \
            tests/test_strategy_runtime_capabilities.py \
            tests/test_ranker_current_target.py \
            tests/test_ranker_current_target_runtime.py \
            tests/test_formal_bundle_reader.py \
            tests/test_formal_refresh.py \
            tests/test_formal_strategy_refresh.py \
            tests/test_cn_x1_2_prospective.py \
            tests/test_refresh_ranker_formal.py \
            tests/test_formal_refresh_metric_projection.py \
            tests/test_model_x1_baselines.py \
            tests/test_us_x1_3_current_target.py \
            tests/test_formal_refresh_trigger_scope.py
          uv run mypy \
            src/artifacts/formal_bundle_reader.py \
            scripts/run_formal_refresh_transaction.py \
            scripts/run_formal_strategy_refresh.py
          uv run pytest \
            tests/test_active_strategy_catalog.py \
            tests/test_strategy_runtime_capabilities.py \
            tests/test_ranker_current_target.py \
            tests/test_ranker_current_target_runtime.py \
            tests/test_formal_bundle_reader.py \
            tests/test_formal_refresh.py \
            tests/test_formal_strategy_refresh.py \
            tests/test_cn_x1_2_prospective.py \
            tests/test_refresh_ranker_formal.py \
            tests/test_formal_refresh_metric_projection.py \
            tests/test_model_x1_baselines.py \
            tests/test_us_x1_3_current_target.py \
            tests/test_formal_refresh_trigger_scope.py \
            -q --strict-markers --tb=short
          cd qlib-dashboard
          npm run check:account
      - name: Validate exact formal candidate contracts
        if: steps.scope.outputs.backend == 'true' && steps.mode.outputs.cutover != 'true'
        run: |
          test ! -e data/research/formal_backtests
          uv run ruff check \
            src/governance/active_strategy_catalog.py \
            src/governance/strategy_runtime_capabilities.py \
            src/artifacts/formal_bundle_reader.py \
            src/artifacts/formal_bundle_v2_builder.py \
            src/artifacts/formal_refresh.py \
            src/artifacts/formal_provider_cache.py \
            src/artifacts/us_x1_3_preview.py \
            src/artifacts/qqq_v4_3_formal.py \
            src/artifacts/strategy_operations.py \
            src/artifacts/system_health.py \
            src/dashboard/market_evidence.py \
            src/factors/library.py \
            src/factors/panel.py \
            src/data \
            src/research/formal_model_replay.py \
            src/research/qqq_authoritative_replay.py \
            src/research/rules_formal_replay_gate.py \
            src/research/cn_x1_2_prospective.py \
            src/research/cn_x1_2_current_target.py \
            src/research/ranker_current_target.py \
            src/research/us_x1_3_current_target.py \
            scripts/build_market_evidence.py \
            scripts/run_formal_refresh_transaction.py \
            scripts/run_formal_strategy_refresh.py \
            scripts/ranker_provisional_mtm.py \
            scripts/govern_formal_provider_cache.py \
            scripts/refresh_ranker_formal.py \
            scripts/build_cn_x1_2_prospective_ledger.py \
            scripts/build_us_x1_3_preview.py \
            scripts/run_ranker_current_target.py \
            scripts/byd_formal_refresh_common.py \
            scripts/byd_v1_3_formal_builder.py \
            scripts/refresh_byd_v1_3_formal.py \
            scripts/refresh_qqq_v4_3_formal.py \
            tests/test_active_strategy_catalog.py \
            tests/test_strategy_runtime_capabilities.py \
            tests/test_ranker_current_target.py \
            tests/test_ranker_current_target_runtime.py \
            tests/test_formal_bundle_reader.py \
            tests/test_formal_refresh.py \
            tests/test_formal_strategy_refresh.py \
            tests/test_cn_x1_2_prospective.py \
            tests/test_refresh_ranker_formal.py \
            tests/test_formal_refresh_metric_projection.py \
            tests/test_ranker_provisional_mtm.py \
            tests/test_formal_bundle_mtm_projection.py \
            tests/test_refresh_byd_v1_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_rules_formal_replay_gate.py \
            tests/test_market_evidence.py \
            tests/test_formal_provider_cache.py \
            tests/test_strategy_operations.py \
            tests/test_system_health.py \
            tests/test_model_data_bundle.py \
            tests/test_repository_research_store.py \
            tests/test_sync_formal_bundle_v2.py \
            tests/test_us_x1_3_preview_publication.py \
            tests/test_us_x1_3_current_target.py \
            tests/test_formal_refresh_trigger_scope.py
          uv run mypy \
            src/artifacts/formal_bundle_reader.py \
            src/artifacts/formal_refresh.py \
            src/artifacts/formal_provider_cache.py \
            src/dashboard/market_evidence.py \
            scripts/govern_formal_provider_cache.py \
            scripts/build_market_evidence.py \
            scripts/run_formal_refresh_transaction.py \
            scripts/run_formal_strategy_refresh.py
          uv run pytest \
            tests/test_active_strategy_catalog.py \
            tests/test_strategy_runtime_capabilities.py \
            tests/test_ranker_current_target.py \
            tests/test_ranker_current_target_runtime.py \
            tests/test_formal_bundle_reader.py \
            tests/test_formal_refresh.py \
            tests/test_formal_strategy_refresh.py \
            tests/test_cn_x1_2_prospective.py \
            tests/test_refresh_ranker_formal.py \
            tests/test_formal_refresh_metric_projection.py \
            tests/test_ranker_provisional_mtm.py \
            tests/test_formal_bundle_mtm_projection.py \
            tests/test_refresh_byd_v1_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_rules_formal_replay_gate.py \
            tests/test_market_evidence.py \
            tests/test_formal_provider_cache.py \
            tests/test_sync_formal_bundle_v2.py \
            tests/test_strategy_operations.py \
            tests/test_system_health.py \
            tests/test_model_data_bundle.py \
            tests/test_repository_research_store.py \
            tests/test_us_x1_3_preview_publication.py \
