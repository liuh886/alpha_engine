name: Formal Backtest Refresh CI
run-name: Formal refresh candidate ${{ inputs.candidate_sha || github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/formal-backtest-refresh.yml"
      - ".github/workflows/formal-backtest-refresh-ci.yml"
      - "configs/strategies/registry.json"
      - "configs/models/us_x1_2.yaml"
      - "src/artifacts/**"
      - "src/data/**"
      - "src/dashboard/**"
      - "src/factors/**"
      - "src/governance/**"
      - "src/research/**"
      - "scripts/run_formal_refresh_transaction.py"
      - "scripts/run_formal_strategy_refresh.py"
      - "scripts/build_market_evidence.py"
      - "scripts/build_us_x1_2_preview.py"
      - "scripts/govern_formal_provider_cache.py"
      - "scripts/ranker_provisional_mtm.py"
      - "scripts/refresh_ranker_formal.py"
      - "scripts/refresh_byd_v1_3_formal.py"
      - "scripts/refresh_qqq_v4_3_formal.py"
      - "scripts/data/**"
      - "tests/test_active_strategy_catalog.py"
      - "tests/test_formal_refresh.py"
      - "tests/test_formal_strategy_refresh.py"
      - "tests/test_ranker_provisional_mtm.py"
      - "tests/test_formal_bundle_mtm_projection.py"
      - "tests/test_refresh_byd_v1_3_formal.py"
      - "tests/test_refresh_qqq_v4_3_formal.py"
      - "tests/test_rules_formal_replay_gate.py"
      - "tests/test_market_evidence.py"
      - "tests/test_formal_provider_cache.py"
      - "tests/test_formal_backtest_freshness.py"
      - "tests/test_strategy_operations.py"
      - "tests/test_model_data_bundle.py"
      - "tests/test_repository_research_store.py"
      - "tests/test_sync_formal_bundle_v2.py"
      - "tests/test_us_x1_2_preview_publication.py"
      - "data/research/formal_backtests/**"
      - "data/research/formal_model_runs/**"
      - "data/research/model_runs/**"
      - "data/research/market_evidence/**"
      - "data/research/model_data_bundle_v1/**"
      - "qlib-dashboard/scripts/**"
      - "qlib-dashboard/src/**"
      - "qlib-dashboard/package.json"
      - "qlib-dashboard/package-lock.json"
      - "qlib-dashboard/vite.config.*"
      - "qlib-dashboard/tsconfig*.json"
      - "configs/pools/**"
      - "configs/research_universes/**"
      - "configs/research_classifications/**"
      - "configs/factor_libraries/**"
      - "configs/data_contracts/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed-refresh candidate commit to validate
        required: true
        type: string
      pr_number:
        description: Reviewed-refresh PR carrying the candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: formal-refresh-contract-${{ inputs.candidate_sha || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Verify candidate identity
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Classify formal backend impact
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git diff --name-only origin/main...HEAD > changed-files.txt
          else
            git diff --name-only HEAD^1 HEAD^2 > changed-files.txt
          fi
          cat changed-files.txt
          if grep -Ev '^qlib-dashboard/src/' changed-files.txt | grep -q .; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.scope.outputs.backend == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.backend == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json
      - name: Install locked environment
        if: steps.scope.outputs.backend == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
          cd qlib-dashboard
          npm ci --no-audit --no-fund
      - name: Validate refresh contracts
        if: steps.scope.outputs.backend == 'true'
        run: |
          uv run ruff check \
            src/governance/active_strategy_catalog.py \
            src/artifacts/formal_refresh.py \
            src/artifacts/formal_provider_cache.py \
            src/artifacts/us_x1_2_preview.py \
            src/artifacts/qqq_v4_3_formal.py \
            src/artifacts/strategy_operations.py \
            src/dashboard/market_evidence.py \
            src/factors/library.py \
            src/factors/panel.py \
            src/data \
            src/research/formal_model_replay.py \
            src/research/qqq_authoritative_replay.py \
            src/research/rules_formal_replay_gate.py \
            scripts/build_market_evidence.py \
            scripts/run_formal_refresh_transaction.py \
            scripts/run_formal_strategy_refresh.py \
            scripts/ranker_provisional_mtm.py \
            scripts/govern_formal_provider_cache.py \
            scripts/refresh_ranker_formal.py \
            scripts/build_us_x1_2_preview.py \
            scripts/byd_formal_refresh_common.py \
            scripts/byd_v1_3_formal_builder.py \
            scripts/refresh_byd_v1_3_formal.py \
            scripts/refresh_qqq_v4_3_formal.py \
            tests/test_active_strategy_catalog.py \
            tests/test_formal_refresh.py \
            tests/test_formal_strategy_refresh.py \
            tests/test_ranker_provisional_mtm.py \
            tests/test_formal_bundle_mtm_projection.py \
            tests/test_refresh_byd_v1_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_rules_formal_replay_gate.py \
            tests/test_market_evidence.py \
            tests/test_formal_provider_cache.py \
            tests/test_strategy_operations.py \
            tests/test_model_data_bundle.py \
            tests/test_repository_research_store.py \
            tests/test_us_x1_2_preview_publication.py
          uv run mypy \
            src/artifacts/formal_refresh.py \
            src/artifacts/formal_provider_cache.py \
            src/dashboard/market_evidence.py \
            scripts/govern_formal_provider_cache.py \
            scripts/build_market_evidence.py \
            scripts/run_formal_refresh_transaction.py \
            scripts/run_formal_strategy_refresh.py
          uv run pytest \
            tests/test_active_strategy_catalog.py \
            tests/test_formal_refresh.py \
            tests/test_formal_strategy_refresh.py \
            tests/test_ranker_provisional_mtm.py \
            tests/test_formal_bundle_mtm_projection.py \
            tests/test_refresh_byd_v1_3_formal.py \
            tests/test_refresh_qqq_v4_3_formal.py \
            tests/test_rules_formal_replay_gate.py \
            tests/test_market_evidence.py \
            tests/test_formal_provider_cache.py \
            tests/test_formal_backtest_freshness.py \
            tests/test_sync_formal_bundle_v2.py \
            tests/test_strategy_operations.py \
            tests/test_model_data_bundle.py \
            tests/test_repository_research_store.py \
            tests/test_us_x1_2_preview_publication.py \
            -q --strict-markers --tb=short
          cd qlib-dashboard
          npm run check:account
