name: Static-to-PIT Contract Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/research/static_to_pit_*.py"
      - "scripts/run_static_to_pit_alpha_decomposition.py"
      - "tests/test_static_to_pit_*.py"
      - ".github/workflows/static-to-pit-tests.yml"
  workflow_dispatch:

concurrency:
  group: static-to-pit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff new research surface
        run: |
          uv run ruff check \
            src/research/static_to_pit_*.py \
            scripts/run_static_to_pit_alpha_decomposition.py \
            tests/test_static_to_pit_*.py
      - name: Static-to-PIT contract tests
        run: |
          uv run pytest \
            tests/test_static_to_pit_contract.py \
            tests/test_static_to_pit_diagnostics.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
