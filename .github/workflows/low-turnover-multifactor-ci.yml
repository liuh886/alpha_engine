name: Low-Turnover Multifactor CI

on:
  push:
    branches: [main]
    paths:
      - "configs/factors/us_low_turnover_multifactor_v1.yaml"
      - "src/research/low_turnover_multifactor.py"
      - "scripts/build_low_turnover_multifactor.py"
      - "tests/test_low_turnover_multifactor.py"
      - ".github/workflows/low-turnover-multifactor-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "configs/factors/us_low_turnover_multifactor_v1.yaml"
      - "src/research/low_turnover_multifactor.py"
      - "scripts/build_low_turnover_multifactor.py"
      - "tests/test_low_turnover_multifactor.py"
      - ".github/workflows/low-turnover-multifactor-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multifactor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff focused files
        run: uv run ruff check src/research/low_turnover_multifactor.py scripts/build_low_turnover_multifactor.py tests/test_low_turnover_multifactor.py
      - name: Run multifactor tests
        run: uv run pytest tests/test_low_turnover_multifactor.py -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: CLI import check
        run: uv run python scripts/build_low_turnover_multifactor.py --help
