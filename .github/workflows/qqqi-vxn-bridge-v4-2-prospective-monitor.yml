name: QQQI VXN Bridge v4.2 Prospective Monitor

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-vxn-bridge-v4-2-prospective-monitor.yml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_vxn_bridge_v4_2.yaml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_vxn_bridge_v4_2_prospective_monitor.yaml"
      - "scripts/run_qqqi_vxn_bridge_v4_2_prospective_monitor.py"
      - "src/research/vxn_bridge_allocation_experiment.py"
      - "src/research/vxn_prospective_monitor.py"
      - "tests/test_vxn_bridge_allocation_experiment.py"
      - "tests/test_vxn_bridge_prospective_monitor.py"
      - "docs/research/qqqi_qqq_tqqq_vxn_bridge_v4_2_prospective_monitoring.md"
  schedule:
    - cron: "0 14 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff lint bridge monitor paths
        run: >-
          uv run ruff check
          src/research/vxn_bridge_allocation_experiment.py
          scripts/run_qqqi_vxn_bridge_v4_2_prospective_monitor.py
          tests/test_vxn_bridge_allocation_experiment.py
          tests/test_vxn_bridge_prospective_monitor.py
      - name: Mypy focused bridge monitor paths
        run: >-
          uv run mypy --follow-imports=skip
          src/research/vxn_bridge_allocation_experiment.py
          scripts/run_qqqi_vxn_bridge_v4_2_prospective_monitor.py
      - name: Run bridge monitor and inherited tests
        run: >-
          uv run pytest
          tests/test_vxn_bridge_prospective_monitor.py
          tests/test_vxn_bridge_allocation_experiment.py
          tests/test_vxn_prospective_monitor.py
          tests/test_vxn_leverage_overlay_experiment.py
          tests/test_strategy_experiment_journal.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Compile bridge monitor modules
        run: |
          uv run python -m py_compile \
            src/research/vxn_bridge_allocation_experiment.py \
            scripts/run_qqqi_vxn_bridge_v4_2_prospective_monitor.py \
            tests/test_vxn_bridge_allocation_experiment.py \
            tests/test_vxn_bridge_prospective_monitor.py
      - name: Run frozen side-by-side prospective monitor
        run: >-
          uv run python scripts/run_qqqi_vxn_bridge_v4_2_prospective_monitor.py
          --output-dir artifacts/evidence/qqqi_qqq_tqqq_vxn_bridge_v4_2_prospective_monitor
          --strategy-run-dir artifacts/strategy_runs
      - name: Upload prospective evidence and run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-vxn-bridge-v4-2-prospective-${{ github.run_id }}
          path: |
            artifacts/evidence/qqqi_qqq_tqqq_vxn_bridge_v4_2_prospective_monitor
            artifacts/strategy_runs/qqqi_qqq_tqqq_vxn_bridge_v4_2_prospective_monitor
          if-no-files-found: warn
          retention-days: 90
