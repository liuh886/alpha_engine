name: QQQI VXN Bridge v4.2 Prospective Monitor

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-vxn-bridge-v4-2-prospective-monitor.yml"
      - "pyproject.toml"
      - "configs/data/qqqi_qqq_tqqq_reference_bundle_v1.yaml"
      - "configs/data_contracts/qqq_rotation_model_data_v1.yaml"
      - "configs/data_recipes/qqq_rotation_v1.yaml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_vxn_bridge_v4_2.yaml"
      - "configs/research_paradigms/qqqi_qqq_tqqq_vxn_bridge_v4_2_prospective_monitor.yaml"
      - "scripts/data/build_etf_reference_bundle.py"
      - "scripts/run_qqqi_vxn_bridge_v4_2_prospective_monitor.py"
      - "src/cli/**"
      - "src/data/data_recipe.py"
      - "src/data/model_data_profile.py"
      - "src/data/strategy_data_bundle.py"
      - "src/data/adapters/tiingo_adapter.py"
      - "src/data/etf_reference_bundle.py"
      - "src/research/etf_strategy_data.py"
      - "src/research/vxn_bridge_allocation_experiment.py"
      - "src/research/vxn_prospective_monitor.py"
      - "tests/test_data_recipe.py"
      - "tests/test_researcher_cli.py"
      - "tests/test_strategy_data_bundle.py"
      - "tests/test_tiingo_adapter.py"
      - "tests/test_etf_reference_bundle.py"
      - "tests/test_vxn_bridge_allocation_experiment.py"
      - "tests/test_vxn_bridge_prospective_monitor.py"
      - "docs/research/qqqi_qqq_tqqq_vxn_bridge_v4_2_prospective_monitoring.md"
  workflow_run:
    workflows: ["ETF Reference Bundle CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prospective-monitor:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff lint bridge monitor and governed recipe paths
        run: >-
          uv run ruff check
          src/cli
          src/data/data_recipe.py
          src/data/model_data_profile.py
          src/data/strategy_data_bundle.py
          src/data/adapters/tiingo_adapter.py
          src/data/etf_reference_bundle.py
          src/research/etf_strategy_data.py
          src/research/vxn_bridge_allocation_experiment.py
          scripts/data/build_etf_reference_bundle.py
          scripts/run_qqqi_vxn_bridge_v4_2_prospective_monitor.py
          tests/test_data_recipe.py
          tests/test_researcher_cli.py
          tests/test_strategy_data_bundle.py
          tests/test_tiingo_adapter.py
          tests/test_etf_reference_bundle.py
          tests/test_vxn_bridge_allocation_experiment.py
          tests/test_vxn_bridge_prospective_monitor.py
      - name: Mypy focused bridge monitor and governed recipe paths
        run: >-
          uv run mypy --follow-imports=skip
          src/cli
          src/data/data_recipe.py
          src/data/model_data_profile.py
          src/data/strategy_data_bundle.py
          src/data/adapters/tiingo_adapter.py
          src/data/etf_reference_bundle.py
          src/research/etf_strategy_data.py
          src/research/vxn_bridge_allocation_experiment.py
          scripts/data/build_etf_reference_bundle.py
          scripts/run_qqqi_vxn_bridge_v4_2_prospective_monitor.py
      - name: Run bridge monitor and governed recipe tests
        run: >-
          uv run pytest
          tests/test_data_recipe.py
          tests/test_researcher_cli.py
          tests/test_strategy_data_bundle.py
          tests/test_tiingo_adapter.py
          tests/test_etf_reference_bundle.py
          tests/test_vxn_bridge_prospective_monitor.py
          tests/test_vxn_bridge_allocation_experiment.py
          tests/test_vxn_prospective_monitor.py
          tests/test_vxn_leverage_overlay_experiment.py
          tests/test_strategy_experiment_journal.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Download shared professional ETF bundle
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: qqqi-qqq-tqqq-reference-bundle-${{ github.event.workflow_run.id }}
          path: artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Build PR validation ETF bundle without credentialed requests
        if: github.event_name != 'workflow_run'
        env:
          TIINGO_API_TOKEN: ""
        run: >-
          uv run python scripts/data/build_etf_reference_bundle.py
          --output-root artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
      - name: Prepare governed strategy dataset and enforce profile gate
        env:
          TIINGO_API_TOKEN: ""
        run: >-
          uv run alpha data prepare qqq-rotation
          --source-etf-bundle artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
      - name: Run frozen side-by-side monitor through researcher CLI
        env:
          TIINGO_API_TOKEN: ""
        run: >-
          uv run alpha research run qqqi-vxn-v4.2
          --source-etf-bundle artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
      - name: Upload data identity, profile gate, evidence and run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-vxn-bridge-v4-2-prospective-${{ github.run_id }}
          path: |
            artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1/bundle_manifest.json
            artifacts/data/qqq_rotation_strategy_data_v1
            artifacts/data/qqq_rotation_model_data_v1
            artifacts/cache/data_recipes/qqq-rotation/latest.json
            artifacts/evidence/qqqi_qqq_tqqq_vxn_bridge_v4_2_prospective_monitor
            artifacts/strategy_runs/qqqi_qqq_tqqq_vxn_bridge_v4_2_prospective_monitor
          if-no-files-found: warn
          retention-days: 90
