name: Materialize Formal Model Backtests

on:
  push:
    branches:
      - agent/formal-model-backtest-frontend
    paths:
      - "scripts/build_formal_model_backtests.py"
      - ".github/workflows/materialize-formal-model-backtests.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: materialize-formal-model-backtests
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked research dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Download formal US x1.1 backtest evidence
        uses: actions/download-artifact@v4
        with:
          name: us-x1-1-complete-backtest-notebook-30751593667
          path: artifacts/formal-source/us
          github-token: ${{ github.token }}
          repository: liuh886/alpha_engine
          run-id: 30751593667

      - name: Download formal QQQ Rotation v4.2 backtest evidence
        uses: actions/download-artifact@v4
        with:
          name: qqqi-vxn-bridge-v4-2-evidence
          path: artifacts/formal-source/v42
          github-token: ${{ github.token }}
          repository: liuh886/alpha_engine
          run-id: 30706201043

      - name: Download formal CN x1.0 backtest evidence
        uses: actions/download-artifact@v4
        with:
          name: cn130-xgb-optimization-30733728747
          path: artifacts/formal-source/cn
          github-token: ${{ github.token }}
          repository: liuh886/alpha_engine
          run-id: 30733728747

      - name: Build repository-backed formal backtest packages
        run: >-
          uv run python scripts/build_formal_model_backtests.py
          --source-root artifacts/formal-source
          --output-dir data/research/formal_backtests

      - name: Validate publication boundary
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("data/research/formal_backtests")
          catalog = json.loads((root / "catalog.json").read_text(encoding="utf-8"))
          assert catalog["publication_policy"] == "formal_named_baselines_only"
          assert catalog["research_only"] is True
          assert catalog["trade_ready"] is False
          assert [row["model_id"] for row in catalog["records"]] == [
              "qqqi_qqq_tqqq_v4_2",
              "us_x1_1",
              "cn_x1_0",
          ]
          for row in catalog["records"]:
              path = root / row["path"]
              raw = path.read_bytes()
              payload = json.loads(raw)
              assert hashlib.sha256(raw).hexdigest() == row["sha256"]
              assert payload["record_type"] == "formal_model_backtest"
              assert payload["publication_status"] == "accepted_formal_baseline"
              assert payload["model_id"] == row["model_id"]
              assert payload["research_only"] is True
              assert payload["trade_ready"] is False
          assert json.loads((root / "us_x1_1.json").read_text())["evidence_completeness"]["status"] == "complete"
          assert json.loads((root / "qqqi_qqq_tqqq_v4_2.json").read_text())["evidence_completeness"]["status"] == "complete"
          assert json.loads((root / "cn_x1_0.json").read_text())["evidence_completeness"]["status"] == "partial"
          PY

      - name: Commit durable formal backtest store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/formal_backtests
          if git diff --cached --quiet; then
            echo "Formal backtest packages are unchanged."
            exit 0
          fi
          git commit -m "data: publish formal model backtests"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
