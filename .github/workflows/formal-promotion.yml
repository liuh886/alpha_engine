name: Formal Baseline Promotion Verification

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/formal-promotion.yml"
      - "data/research/formal_promotions/**"
      - "data/research/formal_backtests/**"
      - "scripts/build_formal_model_backtests.py"
      - "scripts/formal_promotion.py"
      - "scripts/materialize_durable_formal_archives.py"
      - "scripts/materialize_formal_backtest_base.py"
      - "tests/test_formal_promotion.py"
      - "tests/test_materialize_durable_formal_archives.py"
      - "tests/test_materialize_formal_backtest_base.py"

permissions:
  contents: read

concurrency:
  group: formal-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-formal-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed formal release
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Validate durable promotion contracts
        run: |
          uv run ruff check \
            scripts/formal_promotion.py \
            scripts/materialize_durable_formal_archives.py \
            scripts/materialize_formal_backtest_base.py \
            tests/test_formal_promotion.py \
            tests/test_materialize_durable_formal_archives.py \
            tests/test_materialize_formal_backtest_base.py
          uv run mypy \
            scripts/formal_promotion.py \
            scripts/materialize_durable_formal_archives.py \
            scripts/materialize_formal_backtest_base.py
          uv run pytest \
            tests/test_formal_promotion.py \
            tests/test_materialize_durable_formal_archives.py \
            tests/test_materialize_formal_backtest_base.py \
            -q --strict-markers --tb=short

      - name: Materialize immutable historical formal release
        run: |
          mkdir -p artifacts/formal-promotion
          uv run python scripts/materialize_formal_backtest_base.py \
            --manifest data/research/formal_backtests/base_manifest.json \
            --output-dir artifacts/formal-promotion/historical-base \
            --receipt artifacts/formal-promotion/historical-base-receipt.json

      - name: Materialize exact durable source archives
        shell: bash
        run: |
          mkdir -p artifacts/formal-promotion
          set -o pipefail
          uv run python scripts/materialize_durable_formal_archives.py \
            --manifest-dir data/research/formal_promotions \
            --output-dir artifacts/formal-promotion/archives \
            --receipt artifacts/formal-promotion/archive-receipt.json \
            2>&1 | tee artifacts/formal-promotion/archive.log

      - name: Reproduce and byte-compare historical formal bases
        shell: bash
        run: |
          set -o pipefail
          cp artifacts/formal-promotion/historical-base/catalog.json \
            data/research/formal_backtests/catalog.json
          cp artifacts/formal-promotion/historical-base/qqqi_qqq_tqqq_v4_2.json \
            data/research/formal_backtests/qqqi_qqq_tqqq_v4_2.json
          cp artifacts/formal-promotion/historical-base/us_x1_1.json \
            data/research/formal_backtests/us_x1_1.json
          cp artifacts/formal-promotion/historical-base/cn_x1_0.json \
            data/research/formal_backtests/cn_x1_0.json
          uv run python scripts/formal_promotion.py verify \
            --manifest-dir data/research/formal_promotions \
            --archive-dir artifacts/formal-promotion/archives \
            --source-root artifacts/formal-promotion/source \
            --generated-dir artifacts/formal-promotion/generated \
            --committed-dir data/research/formal_backtests \
            --receipt artifacts/formal-promotion/promotion-receipt.json \
            --summary artifacts/formal-promotion/promotion-summary.md \
            2>&1 | tee artifacts/formal-promotion/verify.log
          cat artifacts/formal-promotion/promotion-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retain promotion verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: formal-promotion-verification
          path: artifacts/formal-promotion
          if-no-files-found: error
          retention-days: 30
