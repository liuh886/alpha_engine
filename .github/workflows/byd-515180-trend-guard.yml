name: BYD 515180 Trend Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "src/research/byd_515180_trend_guard.py"
      - "scripts/run_byd_515180_trend_guard.py"
      - "tests/test_byd_515180_trend_guard.py"
      - "data/research/byd_515180_trend_guard_v1_artifact.zip.b64"
      - "docs/evidence/byd_515180_trend_guard/sealed_manifest.json"
      - ".github/workflows/byd-515180-trend-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Verify immutable identities
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > "$RUNNER_TEMP/515180-canonical-v1.zip"
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  $RUNNER_TEMP/515180-canonical-v1.zip" | sha256sum --check --strict
          base64 --decode data/research/byd_515180_trend_guard_v1_artifact.zip.b64 > "$RUNNER_TEMP/trend-guard-v1.zip"
          echo "77b2da146ba5745ec67a024aa2bb322a555da47b7c27e6855f1f159884b83245  $RUNNER_TEMP/trend-guard-v1.zip" | sha256sum --check --strict
      - name: Lint and contract tests
        run: |
          uv run ruff check \
            src/research/byd_515180_trend_guard.py \
            scripts/run_byd_515180_trend_guard.py \
            tests/test_byd_515180_trend_guard.py
          uv run pytest \
            tests/test_byd_515180_trend_guard.py \
            tests/test_byd_515180_allocation.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Extract immutable inputs and sealed evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/data/byd_canonical_v1 artifacts/data/515180_canonical_v1 artifacts/sealed
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/data/byd_canonical_v1
          unzip -q "$RUNNER_TEMP/515180-canonical-v1.zip" -d artifacts/data/515180_canonical_v1
          unzip -q "$RUNNER_TEMP/trend-guard-v1.zip" -d artifacts/sealed
      - name: Reproduce frozen trend-guard screen
        run: >-
          uv run python scripts/run_byd_515180_trend_guard.py
          --byd-dir artifacts/data/byd_canonical_v1
          --etf-dir artifacts/data/515180_canonical_v1
          --output-dir artifacts/reproduced
      - name: Require byte-stable evidence
        run: |
          set -euo pipefail
          for name in README.md summary.json evaluation.csv period_contribution.csv trend_diagnostics.csv; do
            cmp --silent "artifacts/sealed/$name" "artifacts/reproduced/$name"
          done
      - name: Enforce governed decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("artifacts/reproduced/summary.json").read_text())
          expected = {
              "cagr_not_below_baseline_by_more_than_50bp": False,
              "drawdown_or_calmar_improvement": False,
              "ma120_robustness_same_direction": False,
              "max_period_share_at_most_60pct": False,
              "round_trips_at_most_3": True,
              "stress_total_not_below_baseline": False,
              "validation_and_2025_not_both_negative": False,
          }
          assert summary["gates"] == expected
          assert summary["governed_decision"] == "retain_v1_dividend_75_25"
          assert summary["research_only"] is True
          assert summary["trade_ready"] is False
          PY
      - name: Publish evidence summary
        run: cat artifacts/reproduced/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reproduction
        uses: actions/upload-artifact@v4
        with:
          name: byd-515180-trend-guard-offline-reproduction
          path: artifacts/reproduced
          if-no-files-found: error
          retention-days: 30
