name: BYD 515180 Trend Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "src/research/byd_515180_trend_guard.py"
      - "scripts/run_byd_515180_trend_guard.py"
      - "tests/test_byd_515180_trend_guard.py"
      - ".github/workflows/byd-515180-trend-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Verify immutable data identities
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > "$RUNNER_TEMP/515180-canonical-v1.zip"
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  $RUNNER_TEMP/515180-canonical-v1.zip" | sha256sum --check --strict
      - name: Lint and contract tests
        run: |
          uv run ruff check \
            src/research/byd_515180_trend_guard.py \
            scripts/run_byd_515180_trend_guard.py \
            tests/test_byd_515180_trend_guard.py
          uv run pytest \
            tests/test_byd_515180_trend_guard.py \
            tests/test_byd_515180_allocation.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Extract immutable data
        run: |
          set -euo pipefail
          mkdir -p artifacts/data/byd_canonical_v1 artifacts/data/515180_canonical_v1
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/data/byd_canonical_v1
          unzip -q "$RUNNER_TEMP/515180-canonical-v1.zip" -d artifacts/data/515180_canonical_v1
      - name: Run frozen trend-guard screen
        run: >-
          uv run python scripts/run_byd_515180_trend_guard.py
          --byd-dir artifacts/data/byd_canonical_v1
          --etf-dir artifacts/data/515180_canonical_v1
          --output-dir artifacts/research/byd_515180_trend_guard
      - name: Publish evidence summary
        run: cat artifacts/research/byd_515180_trend_guard/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: byd-515180-trend-guard-evidence
          path: artifacts/research/byd_515180_trend_guard
          if-no-files-found: error
          retention-days: 30
