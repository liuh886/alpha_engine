name: US x1.1 Native XGBoost Grid

on:
  pull_request:
    branches:
      - main
    paths:
      - "configs/research_experiments/us_x1_1_native_xgb_calibration_v1.yaml"
      - "configs/models/us_x1_1.yaml"
      - "src/research/xgb_native_calibration.py"
      - "scripts/run_us_x1_1_native_xgb_grid.py"
      - "tests/test_us_x1_1_native_xgb_grid_contract.py"
      - "docs/research/us_x1_1_growth_log.md"
      - "docs/research/us_x1_1_native_xgb_grid_result_2026-08-02.md"
      - ".github/workflows/us-x1-1-native-xgb-grid.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-x1-1-native-xgb-grid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_evidence: ${{ steps.scope.outputs.run_evidence }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Detect evidence-affecting changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_evidence=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event.action }}" != "synchronize" ]]; then
            echo "run_evidence=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          after="${{ github.event.after }}"
          changed="$(git diff --name-only "$before" "$after")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(configs/research_experiments/us_x1_1_native_xgb_calibration_v1\.yaml|configs/models/us_x1_1\.yaml|src/research/xgb_native_calibration\.py|scripts/run_us_x1_1_native_xgb_grid\.py|tests/test_us_x1_1_native_xgb_grid_contract\.py|scripts/data/refresh_selected_pool_prices(_v2)?\.py|src/data/)'; then
            echo "run_evidence=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_evidence=false" >> "$GITHUB_OUTPUT"
          fi

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate native-grid contract
        run: |
          uv run ruff check \
            scripts/run_us_x1_1_native_xgb_grid.py \
            tests/test_us_x1_1_native_xgb_grid_contract.py
          uv run mypy scripts/run_us_x1_1_native_xgb_grid.py
          uv run pytest \
            tests/test_us_x1_1_native_xgb_grid_contract.py \
            tests/test_xgb_native_calibration.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1

  evidence:
    needs:
      - changes
      - contract
    if: needs.changes.outputs.run_evidence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Build promotion-eligible US87 provider
        run: >-
          uv run python scripts/data/refresh_selected_pool_prices_v2.py
          --market us
          --source-csv-dir data/csv_clean
          --output-root artifacts/selected_pool_price_refresh/us
          --start 2021-01-01
          --cutoff 2026-07-31
          --max-rounds 1
          --full-refresh
      - name: Verify provider build contract
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/selected_pool_price_refresh/us/artifacts/selected_pool_price_refresh_manifest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload.get("status") == "selected_pool_price_refresh_ready", payload
          assert payload.get("promotion_eligible") is True, payload.get("promotion_blocker")
          assert not payload.get("failures"), payload.get("failures")
          PY
      - name: Run six-candidate native XGBoost experiment
        run: >-
          uv run python scripts/run_us_x1_1_native_xgb_grid.py
          --provider-uri artifacts/selected_pool_price_refresh/us/data/providers/us
          --output-dir artifacts/evidence/us_x1_1_native_xgb_grid_v1
      - name: Print governed decision summary
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/evidence/us_x1_1_native_xgb_grid_v1/native_grid_decision.json")
          if path.is_file():
              payload = json.loads(path.read_text(encoding="utf-8"))
              print(json.dumps({
                  "provider": payload.get("provider", {}),
                  "decision": payload.get("decision", {}),
                  "attempted_candidates": payload.get("attempted_candidates"),
              }, indent=2))
          else:
              print("native_grid_decision.json was not created")
          PY
      - name: Upload complete native-grid evidence and provider snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-x1-1-native-xgb-grid-${{ github.run_id }}
          path: |
            artifacts/selected_pool_price_refresh/us/artifacts
            artifacts/selected_pool_price_refresh/us/data/providers/us
            artifacts/evidence/us_x1_1_native_xgb_grid_v1
          if-no-files-found: error
          retention-days: 90
