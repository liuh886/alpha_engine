name: Alpha158 Panel CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/alpha158-panel-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
      - "configs/data/alpha158_panel_v1.yaml"
      - "src/factors/panel.py"
      - "scripts/factors/build_alpha158_panel.py"
      - "tests/test_alpha158_panel.py"
  workflow_dispatch:
    inputs:
      market:
        description: "Market panel to build"
        required: true
        type: choice
        options: [us, cn]
      provider_uri:
        description: "Path to promoted Qlib provider in the runner workspace"
        required: true
        type: string
      cutoff:
        description: "Evidence cutoff YYYY-MM-DD"
        required: true
        type: string

concurrency:
  group: alpha158-panel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-uv
      - name: Ruff Alpha158 panel paths
        run: >-
          uv run ruff check
          src/factors/panel.py
          scripts/factors/build_alpha158_panel.py
          tests/test_alpha158_panel.py
      - name: Mypy Alpha158 panel paths
        run: >-
          uv run mypy --follow-imports=skip
          src/factors/panel.py
          scripts/factors/build_alpha158_panel.py
      - name: Test panel and catalog contracts
        run: >-
          uv run pytest
          tests/test_alpha158_panel.py
          tests/test_factor_catalog_alpha158.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

  manual-panel:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-uv
      - name: Build governed panel or emit explicit VWAP blocker
        run: >-
          uv run python scripts/factors/build_alpha158_panel.py
          --market "${{ inputs.market }}"
          --provider-uri "${{ inputs.provider_uri }}"
          --cutoff "${{ inputs.cutoff }}"
          --output-root "artifacts/data/alpha158/${{ inputs.market }}"
      - name: Upload panel evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alpha158-${{ inputs.market }}-${{ github.run_id }}
          path: artifacts/data/alpha158/${{ inputs.market }}
          if-no-files-found: error
          retention-days: 90
