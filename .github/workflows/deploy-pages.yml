name: Deploy Strategy Console to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  detect-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.impact.outputs.deploy }}
      reason: ${{ steps.impact.outputs.reason }}
      matched_paths_json: ${{ steps.impact.outputs.matched_paths_json }}
    steps:
      - name: Checkout publication graph
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false
      - name: Resolve Pages publication impact
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/detect_pages_impact.py --manual --github-output "$GITHUB_OUTPUT"
          else
            python scripts/detect_pages_impact.py --before "$BEFORE_SHA" --after "$AFTER_SHA" --github-output "$GITHUB_OUTPUT"
          fi
          cat artifacts/pages-impact-decision.json
      - name: Record impact decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-impact-decision
          path: artifacts/pages-impact-decision.json
          if-no-files-found: error
          retention-days: 14

  build-and-deploy:
    needs: detect-impact
    if: needs.detect-impact.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Verify zero-server product boundary
        run: python scripts/check_legacy_web_boundary.py
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json
      - name: Build static strategy console
        working-directory: qlib-dashboard
        env:
          VITE_RUNTIME_MODE: static_artifact
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN || '' }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/alpha-engine.svg
          test -f dist/data/formal-model-runs/catalog.json
          test -f dist/data/strategy-operations/snapshots.json
          test ! -e dist/data/strategy-operations/capabilities.json
          test ! -e dist/data/formal-backtests
          grep -q "Systematic Strategy Console" dist/index.html
          grep -q "What are the strategies doing now?" dist/index.html
          grep -q '"display": "standalone"' dist/manifest.webmanifest
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install minimal publication runtime
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
      - name: Validate primary model and run bindings
        run: python scripts/check_repository_model_runs.py
      - name: Export repository research evidence
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/export_static_site_data.py --source repository --repository-catalog data/research/catalog.json --output artifacts/site/data
          mkdir -p artifacts/site/docs
          cp docs/methodology.md artifacts/site/docs/methodology.md
          PYTHONPATH=. python scripts/export_research_bundle.py --source artifacts/site --output artifacts/research-bundle
      - name: Assemble and validate publication
        env:
          IMPACT_REASON: ${{ needs.detect-impact.outputs.reason }}
          MATCHED_PATHS_JSON: ${{ needs.detect-impact.outputs.matched_paths_json }}
        run: |
          set -euo pipefail
          mkdir -p _site/docs _site/data
          cp -r qlib-dashboard/dist/. _site/
          cp -r artifacts/site/data/. _site/data/
          cp -r artifacts/site/reports _site/reports
          cp docs/methodology.md _site/docs/methodology.md
          cp -r artifacts/research-bundle _site/bundle
          cp docs/contracts/alpha-engine-bundle.schema.json _site/docs/alpha-engine-bundle.schema.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "publication_impact": {
                  "reason": os.environ["IMPACT_REASON"],
                  "matched_paths": json.loads(os.environ["MATCHED_PATHS_JSON"]),
              },
          }
          Path("_site/deployment.json").write_text(json.dumps(payload, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/deployment.json
          test -f _site/data/manifest.json
          test -f _site/data/models.json
          test -f _site/data/formal-model-runs/catalog.json
          test -f _site/data/strategy-operations/snapshots.json
          test ! -e _site/data/strategy-operations/capabilities.json
          test -f _site/docs/methodology.md
          test -f _site/bundle/alpha-engine-bundle.json
          grep -q '"source": "repository_research_store"' _site/data/manifest.json
          ! grep -q 'metadata_db_missing' _site/bundle/alpha-engine-bundle.json
          PYTHONPATH=. python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from src.artifacts.model_run_bundle_v2 import validate_catalog, validate_manifest
          from src.artifacts.strategy_operations import validate_operations_payload

          root = Path('_site/data/formal-model-runs')
          catalog = json.loads((root / 'catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog)
          assert catalog['channel'] == 'formal'
          formal_ids = {row['model_version_id'] for row in catalog['records']}
          for row in catalog['records']:
              manifest_path = root / row['manifest_path']
              manifest_bytes = manifest_path.read_bytes()
              assert hashlib.sha256(manifest_bytes).hexdigest() == row['manifest_sha256']
              manifest = json.loads(manifest_bytes)
              validate_manifest(manifest)
              assert manifest['bundle_id'] == row['bundle_id']
          operations = json.loads(Path('_site/data/strategy-operations/snapshots.json').read_text(encoding='utf-8'))
          validate_operations_payload(operations)
          assert {row['model_version_id'] for row in operations['records']} == formal_ids
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
      - name: Verify deployed frontend contracts
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: PYTHONPATH=. python scripts/verify_pages_release.py --base-url "$PAGE_URL" --expected-commit "$GITHUB_SHA"
      - name: Install live-browser runtime
        working-directory: qlib-dashboard
        run: npx playwright install --with-deps chromium
      - name: Exercise all formal strategies on live Pages
        working-directory: qlib-dashboard
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test --config=playwright.live.config.ts
      - name: Upload live-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-browser-evidence
          path: qlib-dashboard/test-results/live-pages
          if-no-files-found: ignore
          retention-days: 14
