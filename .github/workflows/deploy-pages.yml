name: Deploy Research Artifact Studio to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  detect-impact:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.impact.outputs.deploy }}
      reason: ${{ steps.impact.outputs.reason }}
      matched_paths_json: ${{ steps.impact.outputs.matched_paths_json }}
    steps:
      - name: Checkout publication graph
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Resolve Pages publication impact
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/detect_pages_impact.py --manual --github-output "$GITHUB_OUTPUT"
          else
            python scripts/detect_pages_impact.py \
              --before "$BEFORE_SHA" \
              --after "$AFTER_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi
          cat artifacts/pages-impact-decision.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          decision = json.loads(Path("artifacts/pages-impact-decision.json").read_text(encoding="utf-8"))
          matched = ", ".join(f"`{path}`" for path in decision["matched_paths"]) or "none"
          print("### Pages publication impact")
          print()
          print(f"- Deploy: `{str(decision['deploy']).lower()}`")
          print(f"- Reason: `{decision['reason']}`")
          print(f"- Matched paths: {matched}")
          PY

      - name: Record impact decision
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pages-impact-decision
          path: artifacts/pages-impact-decision.json
          if-no-files-found: error
          retention-days: 14

  build-and-deploy:
    needs: detect-impact
    if: ${{ needs.detect-impact.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify zero-server product boundary
        run: python scripts/check_legacy_web_boundary.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json

      - name: Build static artifact studio
        working-directory: qlib-dashboard
        env:
          VITE_RUNTIME_MODE: static_artifact
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/alpha-engine.svg
          test -f dist/data/formal-model-runs/catalog.json
          test ! -e dist/data/formal-backtests
          grep -q "Alpha Engine Research Studio" dist/index.html
          grep -q "Governed Model Runs" dist/index.html
          grep -q '"display": "standalone"' dist/manifest.webmanifest
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('dist/data/formal-model-runs');
          const catalog = JSON.parse(fs.readFileSync(path.join(root, 'catalog.json'), 'utf8'));
          if (catalog.schema_version !== '2.0.0' || catalog.channel !== 'formal') throw new Error('invalid formal v2 catalog');
          if (catalog.research_only !== true || catalog.trade_ready !== false) throw new Error('invalid formal research boundary');
          const expected = new Set(['qqqi_qqq_tqqq_v4_2', 'us_x1_1', 'cn_x1_0', 'byd_dividend_sleeve_v1_0']);
          if (catalog.records.length !== 4) throw new Error('formal catalog must contain exactly four records');
          for (const record of catalog.records) {
            if (!expected.delete(record.model_version_id)) throw new Error(`unexpected formal version: ${record.model_version_id}`);
            const manifestPath = path.join(root, record.manifest_path);
            if (!fs.existsSync(manifestPath)) throw new Error(`missing manifest: ${record.manifest_path}`);
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (manifest.bundle_id !== record.bundle_id) throw new Error(`bundle mismatch: ${record.model_version_id}`);
            if (manifest.publication_channel !== 'formal' || manifest.publication_status !== 'accepted_formal_baseline') throw new Error(`status mismatch: ${record.model_version_id}`);
            for (const section of manifest.sections) {
              if (section.availability_status !== 'available') continue;
              const sectionPath = path.join(path.dirname(manifestPath), section.path);
              if (!fs.existsSync(sectionPath)) throw new Error(`missing section: ${record.model_version_id}/${section.section_id}`);
            }
          }
          if (expected.size) throw new Error(`missing formal versions: ${[...expected].join(', ')}`);
          NODE

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked Python environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Validate release verification contract
        run: |
          uv run ruff check \
            scripts/detect_pages_impact.py \
            scripts/verify_pages_release.py \
            src/artifacts/pages_release_verification.py \
            tests/test_pages_impact.py \
            tests/test_pages_release_verification.py
          uv run mypy \
            scripts/detect_pages_impact.py \
            scripts/verify_pages_release.py \
            src/artifacts/pages_release_verification.py
          uv run pytest \
            tests/test_pages_impact.py \
            tests/test_pages_release_verification.py \
            -q --strict-markers --tb=short

      - name: Validate primary model/run bindings
        run: uv run python scripts/check_repository_model_runs.py

      - name: Export repository research evidence
        run: |
          uv run python scripts/export_static_site_data.py \
            --source repository \
            --repository-catalog data/research/catalog.json \
            --output artifacts/site/data
          mkdir -p artifacts/site/docs
          cp docs/methodology.md artifacts/site/docs/methodology.md
          uv run python scripts/export_research_bundle.py \
            --source artifacts/site \
            --output artifacts/research-bundle

      - name: Assemble site
        env:
          IMPACT_REASON: ${{ needs.detect-impact.outputs.reason }}
          MATCHED_PATHS_JSON: ${{ needs.detect-impact.outputs.matched_paths_json }}
        run: |
          mkdir -p _site/docs _site/data
          cp -r qlib-dashboard/dist/. _site/
          cp -r artifacts/site/data/. _site/data/
          cp -r artifacts/site/reports _site/reports
          cp docs/methodology.md _site/docs/methodology.md
          cp -r artifacts/research-bundle _site/bundle
          cp docs/contracts/alpha-engine-bundle.schema.json _site/docs/alpha-engine-bundle.schema.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "publication_impact": {
                  "reason": os.environ["IMPACT_REASON"],
                  "matched_paths": json.loads(os.environ["MATCHED_PATHS_JSON"]),
              },
          }
          Path("_site/deployment.json").write_text(
              json.dumps(payload, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/deployment.json
          test -f _site/data/manifest.json
          test -f _site/data/models.json
          test -f _site/data/formal-model-runs/catalog.json
          test ! -e _site/data/formal-backtests
          test -f _site/docs/methodology.md
          test -f _site/bundle/alpha-engine-bundle.json
          test -f _site/bundle/data/models.json
          test -f _site/data/runs/us_x1_1-evidence-30737322468/run.json
          test -f _site/data/runs/us_x1_0-evidence-30733686862/run.json
          test -f _site/data/runs/cn_x1_0-evidence-30733728747/run.json
          grep -q '"schema_version": "1.0.0"' _site/bundle/alpha-engine-bundle.json
          grep -q '"source": "repository_research_store"' _site/data/manifest.json
          grep -q '"id": "us_x1_1"' _site/data/models.json
          grep -q '"id": "us_x1_0"' _site/data/models.json
          grep -q '"id": "cn_x1_0"' _site/data/models.json
          grep -q '"primary_run_curve_unavailable"' _site/data/manifest.json
          grep -q '"primary_run_provider_snapshot_unavailable"' _site/data/manifest.json
          ! grep -q 'metadata_db_missing' _site/bundle/alpha-engine-bundle.json
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from src.artifacts.model_run_bundle_v2 import validate_catalog, validate_manifest

          root = Path('_site/data/formal-model-runs')
          catalog = json.loads((root / 'catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog)
          assert catalog['channel'] == 'formal'
          assert catalog['research_only'] is True and catalog['trade_ready'] is False
          assert {row['model_version_id'] for row in catalog['records']} == {
              'qqqi_qqq_tqqq_v4_2', 'us_x1_1', 'cn_x1_0', 'byd_dividend_sleeve_v1_0'
          }
          for row in catalog['records']:
              manifest_path = root / row['manifest_path']
              manifest_bytes = manifest_path.read_bytes()
              assert hashlib.sha256(manifest_bytes).hexdigest() == row['manifest_sha256']
              manifest = json.loads(manifest_bytes)
              validate_manifest(manifest)
              assert manifest['bundle_id'] == row['bundle_id']
              for section in manifest['sections']:
                  if section['availability_status'] != 'available':
                      continue
                  section_path = manifest_path.parent / section['path']
                  payload = section_path.read_bytes()
                  assert len(payload) == section['byte_size']
                  assert hashlib.sha256(payload).hexdigest() == section['sha256']
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed frontend contracts
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          uv run python scripts/verify_pages_release.py \
            --base-url "$PAGE_URL" \
            --expected-commit "$GITHUB_SHA"

      - name: Install live-browser runtime
        working-directory: qlib-dashboard
        run: npx playwright install --with-deps chromium

      - name: Exercise all formal baselines on live Pages
        working-directory: qlib-dashboard
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test --config=playwright.live.config.ts

      - name: Upload live-browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-browser-evidence
          path: qlib-dashboard/test-results/live-pages
          if-no-files-found: ignore
          retention-days: 14
