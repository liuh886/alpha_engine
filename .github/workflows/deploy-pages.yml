name: Deploy Research Artifact Studio to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "qlib-dashboard/**"
      - "data/research/**"
      - "configs/models/*.yaml"
      - "docs/research/**"
      - "scripts/check_repository_model_runs.py"
      - "scripts/export_static_site_data.py"
      - "scripts/export_research_bundle.py"
      - "scripts/verify_pages_release.py"
      - "src/artifacts/pages_release_verification.py"
      - "tests/test_pages_release_verification.py"
      - "src/artifacts/repository_research_store.py"
      - "src/artifacts/research_bundle.py"
      - "docs/methodology.md"
      - "docs/contracts/alpha-engine-bundle.schema.json"
      - "scripts/check_legacy_web_boundary.py"
      - "docs/architecture/legacy_web_inventory.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify zero-server product boundary
        run: python scripts/check_legacy_web_boundary.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json

      - name: Build static artifact studio
        working-directory: qlib-dashboard
        env:
          VITE_RUNTIME_MODE: static_artifact
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/alpha-engine.svg
          test -f dist/data/formal-backtests/catalog.json
          test -f dist/data/formal-backtests/qqqi_qqq_tqqq_v4_2.json
          test -f dist/data/formal-backtests/us_x1_1.json
          test -f dist/data/formal-backtests/cn_x1_0.json
          grep -q "Alpha Engine Research Studio" dist/index.html
          grep -q "Complete backtest review" dist/index.html
          grep -q '"model_id":"qqqi_qqq_tqqq_v4_2"' dist/data/formal-backtests/catalog.json
          grep -q '"model_id":"us_x1_1"' dist/data/formal-backtests/catalog.json
          grep -q '"model_id":"cn_x1_0"' dist/data/formal-backtests/catalog.json
          ! grep -q '"model_id":"us_x1_0"' dist/data/formal-backtests/catalog.json
          grep -q '"display": "standalone"' dist/manifest.webmanifest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked Python environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Validate release verification contract
        run: |
          uv run ruff check \
            scripts/verify_pages_release.py \
            src/artifacts/pages_release_verification.py \
            tests/test_pages_release_verification.py
          uv run mypy \
            scripts/verify_pages_release.py \
            src/artifacts/pages_release_verification.py
          uv run pytest \
            tests/test_pages_release_verification.py \
            -q --strict-markers --tb=short

      - name: Validate primary model/run bindings
        run: uv run python scripts/check_repository_model_runs.py

      - name: Export repository research evidence
        run: |
          uv run python scripts/export_static_site_data.py \
            --source repository \
            --repository-catalog data/research/catalog.json \
            --output artifacts/site/data
          mkdir -p artifacts/site/docs
          cp docs/methodology.md artifacts/site/docs/methodology.md
          uv run python scripts/export_research_bundle.py \
            --source artifacts/site \
            --output artifacts/research-bundle

      - name: Assemble site
        run: |
          mkdir -p _site/docs _site/data
          cp -r qlib-dashboard/dist/. _site/
          cp -r artifacts/site/data/. _site/data/
          cp -r artifacts/site/reports _site/reports
          cp docs/methodology.md _site/docs/methodology.md
          cp -r artifacts/research-bundle _site/bundle
          cp docs/contracts/alpha-engine-bundle.schema.json _site/docs/alpha-engine-bundle.schema.json
          printf '{"commit_sha":"%s","workflow_run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > _site/deployment.json
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/deployment.json
          test -f _site/data/manifest.json
          test -f _site/data/models.json
          test -f _site/data/formal-backtests/catalog.json
          test -f _site/data/formal-backtests/qqqi_qqq_tqqq_v4_2.json
          test -f _site/data/formal-backtests/us_x1_1.json
          test -f _site/data/formal-backtests/cn_x1_0.json
          test -f _site/docs/methodology.md
          test -f _site/bundle/alpha-engine-bundle.json
          test -f _site/bundle/data/models.json
          test -f _site/data/runs/us_x1_1-evidence-30737322468/run.json
          test -f _site/data/runs/us_x1_0-evidence-30733686862/run.json
          test -f _site/data/runs/cn_x1_0-evidence-30733728747/run.json
          grep -q '"schema_version": "1.0.0"' _site/bundle/alpha-engine-bundle.json
          grep -q '"source": "repository_research_store"' _site/data/manifest.json
          grep -q '"id": "us_x1_1"' _site/data/models.json
          grep -q '"id": "us_x1_0"' _site/data/models.json
          grep -q '"id": "cn_x1_0"' _site/data/models.json
          grep -q '"model_id":"qqqi_qqq_tqqq_v4_2"' _site/data/formal-backtests/catalog.json
          grep -q '"model_id":"us_x1_1"' _site/data/formal-backtests/catalog.json
          grep -q '"model_id":"cn_x1_0"' _site/data/formal-backtests/catalog.json
          ! grep -q '"model_id":"us_x1_0"' _site/data/formal-backtests/catalog.json
          grep -q '"primary_run_curve_unavailable"' _site/data/manifest.json
          grep -q '"primary_run_provider_snapshot_unavailable"' _site/data/manifest.json
          ! grep -q 'metadata_db_missing' _site/bundle/alpha-engine-bundle.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed frontend contracts
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          uv run python scripts/verify_pages_release.py \
            --base-url "$PAGE_URL" \
            --expected-commit "$GITHUB_SHA"
