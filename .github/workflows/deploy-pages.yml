name: Deploy Strategy Console to Pages
run-name: Pages ${{ inputs.target_sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main commit to publish and verify
        required: false
        type: string

env:
  RELEASE_SHA: ${{ inputs.target_sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  detect-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.impact.outputs.deploy }}
      reason: ${{ steps.impact.outputs.reason }}
      matched_paths_json: ${{ steps.impact.outputs.matched_paths_json }}
    steps:
      - name: Checkout publication graph
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 1
          show-progress: false
          sparse-checkout: |
            /configs/
            /data/research/catalog.json
            /scripts/detect_pages_impact.py
          sparse-checkout-cone-mode: false
      - name: Resolve Pages publication impact
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/detect_pages_impact.py --manual --github-output "$GITHUB_OUTPUT"
          else
            if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && \
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && \
               ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              # Tree-to-tree diff only needs the two endpoint commits. If this
              # fetch is unavailable, the detector below fails closed.
              git fetch --no-tags --depth=1 --filter=blob:none origin "$BEFORE_SHA" || true
            fi
            python scripts/detect_pages_impact.py --before "$BEFORE_SHA" --after "$AFTER_SHA" --github-output "$GITHUB_OUTPUT"
          fi
          cat artifacts/pages-impact-decision.json
      - name: Record impact decision
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-impact-decision
          path: artifacts/pages-impact-decision.json
          if-no-files-found: error
          retention-days: 14

  build-and-deploy:
    needs: detect-impact
    if: needs.detect-impact.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          lfs: true
      - name: Verify release identity
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Verify zero-server product boundary
        run: python scripts/check_legacy_web_boundary.py
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install governed publication runtime
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Materialize Strategy Operations read model
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run alpha ops build --generated-at "$generated_at"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json
      - name: Build static strategy console
        working-directory: qlib-dashboard
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/icons/alpha-engine.svg
          test -f dist/data/formal-model-runs/catalog.json
          test -f dist/data/strategy-operations/snapshots.json
          test ! -e dist/data/strategy-operations/capabilities.json
          test ! -e dist/data/formal-backtests
          grep -q "Systematic Strategy Console" dist/index.html
      - name: Assemble and validate publication
        env:
          IMPACT_REASON: ${{ needs.detect-impact.outputs.reason }}
          MATCHED_PATHS_JSON: ${{ needs.detect-impact.outputs.matched_paths_json }}
        run: |
          set -euo pipefail
          mkdir -p _site/docs _site/data
          cp -r qlib-dashboard/dist/. _site/
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              "commit_sha": os.environ["RELEASE_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "publication_impact": {
                  "reason": os.environ["IMPACT_REASON"],
                  "matched_paths": json.loads(os.environ["MATCHED_PATHS_JSON"]),
              },
          }
          Path("_site/deployment.json").write_text(json.dumps(payload, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/deployment.json
          test -f _site/data/formal-model-runs/catalog.json
          test -f _site/data/model-decisions/catalog.json
          test -f _site/data/strategy-operations/snapshots.json
          test ! -e _site/data/strategy-operations/capabilities.json
          PYTHONPATH=. uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from src.artifacts.model_run_bundle_v2 import validate_catalog, validate_manifest
          from src.artifacts.pages_release_verification import validate_formal_catalog, validate_public_operations

          root = Path('_site/data/formal-model-runs')
          catalog = json.loads((root / 'catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog)
          assert catalog['channel'] == 'formal'
          for row in catalog['records']:
              manifest_path = root / row['manifest_path']
              manifest_bytes = manifest_path.read_bytes()
              assert hashlib.sha256(manifest_bytes).hexdigest() == row['manifest_sha256']
              manifest = json.loads(manifest_bytes)
              validate_manifest(manifest)
              assert manifest['bundle_id'] == row['bundle_id']
          operations = json.loads(Path('_site/data/strategy-operations/snapshots.json').read_text(encoding='utf-8'))
          validate_public_operations(operations, validate_formal_catalog(catalog))
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployed frontend contracts
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: PYTHONPATH=. uv run python scripts/verify_pages_release.py --base-url "$PAGE_URL" --expected-commit "$RELEASE_SHA"
      - name: Install live-browser runtime
        working-directory: qlib-dashboard
        run: npx playwright install --with-deps chromium
      - name: Exercise all formal strategies on live Pages
        working-directory: qlib-dashboard
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test --config=playwright.live.config.ts
      - name: Upload live-browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-live-browser-evidence
          path: qlib-dashboard/test-results/live-pages
          if-no-files-found: ignore
          retention-days: 14
