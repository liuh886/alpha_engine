name: QQQI VXN Notebook Refresh

on:
  schedule:
    - cron: "0 16 * * 6"
  workflow_dispatch:
    inputs:
      end_date:
        description: Optional exclusive market-data end date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Refresh rolling notebook
        env:
          QQQI_VXN_NOTEBOOK_END_DATE: ${{ inputs.end_date }}
        run: >-
          uv run python scripts/refresh_qqqi_vxn_current_notebook.py
          --timeout 900
      - name: Validate saved result bundle
        run: >-
          uv run python scripts/validate_qqqi_vxn_research_bundle.py
          --require-executed
      - name: Create or update notebook refresh PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/refresh-qqqi-vxn-current-notebook
          delete-branch: true
          commit-message: "research: refresh QQQI VXN current strategy notebook"
          title: "research: refresh QQQI VXN current strategy notebook"
          body: |
            Automated refresh of the rolling QQQI / QQQ / TQQQ strategy notebook.

            - Executes the frozen v4.1 baseline and v4.2 bridge challenger with the latest available data.
            - Preserves saved tables, charts, trade points and prospective metrics in the `.ipynb`.
            - Does not change contracts, signals, thresholds or candidate status.
            - Requires normal review before merge.
          add-paths: |
            notebooks/17_qqqi_qqq_tqqq_vxn_current_strategy_review.ipynb
