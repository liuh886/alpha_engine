name: Promote CN Formal Freshness 2026-08-03

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/promote-cn-formal-freshness-2026-08-03.yml
      - data/research/formal_backtests/cn_freshness_source_2026_08_03.json
      - scripts/promote_cn_formal_freshness.py

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-cn-formal-freshness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_PATH: data/research/formal_backtests/cn_freshness_source_2026_08_03.json
      ARTIFACT_RUN_ID: "30801029527"
      ARTIFACT_NAME: cn-formal-freshness-candidate-2026-08-03-30801029527
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Download accepted incremental CN evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/incremental-cn
          github-token: ${{ github.token }}
          repository: liuh886/alpha_engine
          run-id: ${{ env.ARTIFACT_RUN_ID }}
      - name: Promote and verify formal package
        run: |
          uv run python scripts/promote_cn_formal_freshness.py \
            --root data/research/formal_backtests \
            --artifact-root artifacts/incremental-cn \
            --source "$SOURCE_PATH" \
            --receipt artifacts/cn-formal-promotion-receipt.json
          uv run python scripts/verify_formal_backtest_freshness.py \
            --root data/research/formal_backtests \
            --as-of 2026-08-03T09:15:00Z \
            --receipt artifacts/cn-formal-freshness-receipt.json
      - name: Remove one-shot workflows
        run: |
          rm -f .github/workflows/promote-cn-formal-freshness-2026-08-03.yml
          rm -f .github/workflows/cn-formal-freshness-candidate-2026-08-03.yml
          rm -f .github/workflows/verify-cn-provider-2026-08-03-pr.yml
      - name: Commit verified formal release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/research/formal_backtests/cn_x1_0.json \
            data/research/formal_backtests/catalog.json \
            data/research/formal_backtests/freshness.json \
            .github/workflows
          git diff --cached --check
          git commit -m "data: publish CN formal evidence through 2026-08-03"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
