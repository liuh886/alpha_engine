name: QQQI v4.26 XGBoost Ordinal Risk Budget

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-v4-26-xgb-ordinal-risk-budget.yml"
      - "configs/research_paradigms/qqqi_xgb_ordinal_risk_budget_v4_26_research.yaml"
      - "src/research/v4_26_xgb_ordinal_risk_budget.py"
      - "scripts/run_qqqi_v4_26_xgb_ordinal_risk_budget.py"
      - "tests/test_v4_26_xgb_ordinal_risk_budget.py"
  workflow_dispatch:
    inputs:
      end_date:
        description: Optional exclusive market-data end date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint v4.26
        run: |
          uv run ruff check \
            src/research/v4_26_xgb_ordinal_risk_budget.py \
            scripts/run_qqqi_v4_26_xgb_ordinal_risk_budget.py \
            tests/test_v4_26_xgb_ordinal_risk_budget.py
      - name: Test v4.26 and inherited path contracts
        run: |
          uv run pytest \
            tests/test_v4_26_xgb_ordinal_risk_budget.py \
            tests/test_v4_24_xgb_adjacent_path_utility.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Run governed v4.26 evidence
        run: |
          uv run python scripts/run_qqqi_v4_26_xgb_ordinal_risk_budget.py \
            --end-date "${{ inputs.end_date }}" \
            --output-dir artifacts/evidence/qqqi_xgb_ordinal_risk_budget_v4_26_research
      - name: Validate fail-closed candidate evidence
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path('artifacts/evidence/qqqi_xgb_ordinal_risk_budget_v4_26_research')
          diagnostics = json.loads((root / 'diagnostics.json').read_text())
          manifest = json.loads((root / 'manifest.json').read_text())
          assert diagnostics['direct_promotion_authorized'] is False
          assert diagnostics['baseline_and_alerts_unchanged'] is True
          assert manifest['direct_promotion_authorized'] is False
          oof = pd.read_csv(root / 'oof_ordinal_scores.csv')
          actual = pd.read_csv(root / 'actual_ordinal_scores.csv')
          required = {
              'expected_risk_index', 'selected_state_index', 'selected_state',
              'oracle_state_index', 'selected_path_utility',
              'selected_utility_advantage_vs_v4_2'
          }
          assert required <= set(oof.columns)
          assert required <= set(actual.columns)
          assert set(oof['selected_state']).issubset({'defense', 'bridge', 'core', 'leveraged'})
          assert set(actual['selected_state']).issubset({'defense', 'bridge', 'core', 'leveraged'})
          assert oof['decision_date'].is_unique
          assert actual['decision_date'].is_unique
          if not diagnostics['phase1_gate']['passed']:
              assert not (root / 'oof_headline.csv').exists()
              assert diagnostics['phase2_gate']['skipped'] is True
          PY
      - name: Upload v4.26 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-v4-26-xgb-ordinal-risk-budget-${{ github.run_id }}
          path: artifacts/evidence/qqqi_xgb_ordinal_risk_budget_v4_26_research
          if-no-files-found: error
          retention-days: 90
