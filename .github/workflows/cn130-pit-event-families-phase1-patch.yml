name: CN130 PIT Event Families Phase 1 Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/data/apply_cn130_event_phase1_empty_window_patch.py
      - .github/workflows/cn130-pit-event-families-phase1-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: data/cn130-pit-event-families-phase1-v1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply audited patch
        run: python scripts/data/apply_cn130_event_phase1_empty_window_patch.py
      - name: Commit patch
        run: |
          git config user.name 'AlphaEngine Data Research Agent'
          git config user.email 'data-research-agent@alphaengine.local'
          git add -A
          git commit -m 'data: handle empty event windows and freeze Phase 1 source cache'
          git push origin HEAD:data/cn130-pit-event-families-phase1-v1
