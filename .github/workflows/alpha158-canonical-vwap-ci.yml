name: Alpha158 Canonical VWAP CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/alpha158-canonical-vwap-ci.yml"
      - "configs/data/alpha158_panel_v1.yaml"
      - "configs/data_contracts/model_data_bundle_v1.yaml"
      - "configs/factor_knowledge/historical_factor_cards_v1.yaml"
      - "configs/research_paradigms/cn_alpha158_cross_window_stability_v1.yaml"
      - "src/data/canonical_vwap.py"
      - "src/data/adapters/polygon_adapter.py"
      - "src/factors/panel.py"
      - "src/factors/reusable_panel.py"
      - "src/factors/governance.py"
      - "src/research/alpha158_stability_diagnostics.py"
      - "scripts/data/build_canonical_vwap_provider.py"
      - "scripts/factors/build_alpha158_panel.py"
      - "scripts/run_cn_alpha158_stability_diagnostics.py"
      - "tests/test_canonical_vwap.py"
      - "tests/test_polygon_adapter.py"
      - "tests/test_alpha158_panel.py"
      - "tests/test_reusable_alpha158_panel.py"
      - "tests/test_factor_governance.py"
      - "tests/test_alpha158_stability_diagnostics.py"
      - "docs/research/alpha158_canonical_vwap_execution_2026-08-02.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/alpha158-canonical-vwap-ci.yml"
      - "configs/data/alpha158_panel_v1.yaml"
      - "configs/data_contracts/model_data_bundle_v1.yaml"
      - "configs/factor_knowledge/historical_factor_cards_v1.yaml"
      - "configs/research_paradigms/cn_alpha158_cross_window_stability_v1.yaml"
      - "src/data/canonical_vwap.py"
      - "src/data/adapters/polygon_adapter.py"
      - "src/factors/panel.py"
      - "src/factors/reusable_panel.py"
      - "src/factors/governance.py"
      - "src/research/alpha158_stability_diagnostics.py"
      - "scripts/data/build_canonical_vwap_provider.py"
      - "scripts/factors/build_alpha158_panel.py"
      - "scripts/run_cn_alpha158_stability_diagnostics.py"
  schedule:
    - cron: "41 7 2 * *"
  workflow_dispatch:
    inputs:
      market:
        description: "Live market evidence to build"
        required: true
        default: "both"
        type: choice
        options: [both, us, cn]
      cutoff:
        description: "Evidence cutoff (YYYY-MM-DD)"
        required: true
        default: "2026-07-31"
        type: string

permissions:
  contents: read

concurrency:
  group: alpha158-canonical-vwap-${{ github.event.pull_request.number || github.ref }}-${{ inputs.market || 'both' }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint canonical VWAP paths
        run: >-
          uv run ruff check
          src/data/canonical_vwap.py
          src/data/adapters/polygon_adapter.py
          src/factors/reusable_panel.py
          src/factors/governance.py
          src/research/alpha158_stability_diagnostics.py
          scripts/data/build_canonical_vwap_provider.py
          scripts/factors/build_alpha158_panel.py
          scripts/run_cn_alpha158_stability_diagnostics.py
          tests/test_canonical_vwap.py
          tests/test_polygon_adapter.py
          tests/test_alpha158_panel.py
          tests/test_reusable_alpha158_panel.py
          tests/test_factor_governance.py
          tests/test_alpha158_stability_diagnostics.py
      - name: Type-check canonical VWAP paths
        run: >-
          uv run mypy --follow-imports=skip
          src/data/canonical_vwap.py
          src/data/adapters/polygon_adapter.py
          src/factors/reusable_panel.py
          src/research/alpha158_stability_diagnostics.py
          scripts/data/build_canonical_vwap_provider.py
          scripts/factors/build_alpha158_panel.py
          scripts/run_cn_alpha158_stability_diagnostics.py
      - name: Run canonical VWAP and Alpha158 contract tests
        run: >-
          uv run pytest
          tests/test_canonical_vwap.py
          tests/test_polygon_adapter.py
          tests/test_alpha158_panel.py
          tests/test_reusable_alpha158_panel.py
          tests/test_factor_governance.py
          tests/test_alpha158_stability_diagnostics.py
          tests/test_model_data_bundle.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

  live-us-panel:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (inputs.market == '' || inputs.market == 'both' || inputs.market == 'us')
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 600
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Resolve current evidence cutoff
        id: cutoff
        shell: bash
        run: |
          cutoff="${{ inputs.cutoff }}"
          if [ -z "$cutoff" ]; then cutoff="$(date -u -d '1 day ago' +%F)"; fi
          echo "value=$cutoff" >> "$GITHUB_OUTPUT"
      - name: Preflight same-record reported VWAP
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.data.adapters.base import FetchRequest
          from src.data.adapters.polygon_adapter import PolygonAdapter

          adapter = PolygonAdapter()
          cutoff = "${{ steps.cutoff.outputs.value }}"
          rows = []
          for symbol in ("AAPL", "MSFT", "NVDA"):
              result = adapter.fetch_daily_bars(FetchRequest(
                  symbol=symbol, market="us", start="2026-01-01", end=cutoff,
              ))
              rows.append({
                  "symbol": symbol,
                  "rows": len(result.df),
                  "last_date": result.df["date"].max().date().isoformat(),
                  "vwap_semantics": result.df.attrs["vwap_semantics"],
              })
          path = Path("artifacts/data/canonical_vwap/us/preflight.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "status": "passed", "symbols": rows,
              "research_only": True, "trade_ready": False,
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Build exact US87 canonical VWAP provider and Alpha158 panels
        run: >-
          uv run python scripts/data/build_canonical_vwap_provider.py
          --market us
          --start 2021-01-01
          --cutoff "${{ steps.cutoff.outputs.value }}"
          --output-root artifacts/data/canonical_vwap/us
      - name: Upload US provider, panels, quality and readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha158-canonical-vwap-us-${{ github.run_id }}
          path: artifacts/data/canonical_vwap/us
          if-no-files-found: warn
          retention-days: 90

  live-cn-panel:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (inputs.market == '' || inputs.market == 'both' || inputs.market == 'cn')
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Resolve current evidence cutoff
        id: cutoff
        shell: bash
        run: |
          cutoff="${{ inputs.cutoff }}"
          if [ -z "$cutoff" ]; then cutoff="$(date -u -d '1 day ago' +%F)"; fi
          echo "value=$cutoff" >> "$GITHUB_OUTPUT"
      - name: Restore exact-cutoff CN source pairs
        id: vwap-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/data/canonical_vwap/cn/raw
            artifacts/data/canonical_vwap/cn/qfq
            artifacts/data/canonical_vwap/cn/cache_metadata
          key: >-
            ${{ runner.os }}-alpha158-vwap-cn-${{ hashFiles('configs/research_universes/cn_selected_equities_v3.yaml') }}-${{ steps.cutoff.outputs.value }}
      - name: Build exact CN130 canonical VWAP provider and Alpha158 panels
        run: >-
          uv run python scripts/data/build_canonical_vwap_provider.py
          --market cn
          --start 2021-01-01
          --cutoff "${{ steps.cutoff.outputs.value }}"
          --output-root artifacts/data/canonical_vwap/cn
      - name: Run CN Alpha158 cross-window stability diagnostics
        run: >-
          uv run python scripts/run_cn_alpha158_stability_diagnostics.py
          --spec configs/research_paradigms/cn_alpha158_cross_window_stability_v1.yaml
          --bundle-root artifacts/data/canonical_vwap/cn
          --output artifacts/data/canonical_vwap/cn/alpha158/research/cn_alpha158_cross_window_stability_v1.json
      - name: Save exact-cutoff CN source pairs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/data/canonical_vwap/cn/raw
            artifacts/data/canonical_vwap/cn/qfq
            artifacts/data/canonical_vwap/cn/cache_metadata
          key: ${{ steps.vwap-cache.outputs.cache-primary-key }}
      - name: Print readiness decision
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/data/canonical_vwap/cn/canonical_vwap_bundle.json")
          if path.is_file():
              payload = json.loads(path.read_text(encoding="utf-8"))
              panel = payload["factor_panel_manifest"]
              profiles = payload["model_data_manifest"]["training_profiles"]
              target = next(row for row in profiles if row["profile_id"] == "cn_selected_alpha158_v1")
              diagnostic_path = Path(
                  "artifacts/data/canonical_vwap/cn/alpha158/research/"
                  "cn_alpha158_cross_window_stability_v1.json"
              )
              diagnostic = (
                  json.loads(diagnostic_path.read_text(encoding="utf-8"))
                  if diagnostic_path.is_file()
                  else None
              )
              print(json.dumps({
                  "panel_status": panel["status"],
                  "ready_symbols": panel["ready_symbol_count"],
                  "expected_symbols": panel["expected_symbol_count"],
                  "training_profile": target,
                  "factor_stability_diagnostics": (
                      None
                      if diagnostic is None
                      else {
                          "status": diagnostic["status"],
                          "classification_counts": diagnostic["classification_counts"],
                          "cross_window_stable_factor_ids": diagnostic[
                              "cross_window_stable_factor_ids"
                          ],
                      }
                  ),
              }, indent=2))
          else:
              print("canonical_vwap_bundle.json was not created")
          PY
      - name: Upload provider, panels, quality, readiness and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha158-canonical-vwap-cn-${{ github.run_id }}
          path: artifacts/data/canonical_vwap/cn
          if-no-files-found: warn
          retention-days: 90
