name: Materialize CN x1.1 Promotion

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cn-x1-1-bootstrap.yml
      - .cn-x1-1-payload/**

permissions:
  actions: read
  contents: write

concurrency:
  group: cn-x1-1-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download certified complete candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: cn-x1-1-fallback-aware-certified-31022910416
          path: ${{ runner.temp }}/certified-cn-x1-1
          github-token: ${{ github.token }}
          repository: liuh886/alpha_engine
          run-id: 31022910416
      - name: Materialize promotion sources and frozen evidence
        shell: bash
        run: |
          set -euo pipefail
          cat .cn-x1-1-payload/part-* > "$RUNNER_TEMP/cn-x1-1-sources.b64"
          base64 --decode "$RUNNER_TEMP/cn-x1-1-sources.b64" > "$RUNNER_TEMP/cn-x1-1-sources.tar.gz"
          tar -xzf "$RUNNER_TEMP/cn-x1-1-sources.tar.gz" -C .
          sed -i 's/[[:space:]]\+$//' docs/research/cn_x1_1_formal_promotion_2026-08-06.md
          mkdir -p data/research/cn_x1_1_regime_gated_candidate_v1
          cp -a "$RUNNER_TEMP/certified-cn-x1-1/final/." data/research/cn_x1_1_regime_gated_candidate_v1/
          python scripts/promote_cn_x1_1_formal.py \
            --root data/research/formal_backtests \
            --evidence-root data/research/cn_x1_1_regime_gated_candidate_v1 \
            --generated-at 2026-08-05T17:36:00Z \
            --receipt /tmp/cn-x1-1-promotion-receipt.json
          rm -rf .cn-x1-1-payload .github/workflows/cn-x1-1-bootstrap.yml
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate promotion before publishing branch
        run: |
          uv run ruff check \
            scripts/promote_cn_x1_1_formal.py \
            scripts/validate_model_x1_baselines.py \
            tests/test_promote_cn_x1_1_formal.py \
            tests/test_model_x1_baselines.py
          uv run mypy \
            scripts/promote_cn_x1_1_formal.py \
            scripts/validate_model_x1_baselines.py
          uv run python scripts/validate_model_x1_baselines.py \
            --output /tmp/model-x1-registry.json
          uv run pytest \
            tests/test_promote_cn_x1_1_formal.py \
            tests/test_model_x1_baselines.py \
            tests/test_us_x1_1_baseline_contract.py \
            -q --strict-markers --tb=short
      - name: Commit complete promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: materialize CN x1.1 formal promotion"
          git push origin "HEAD:${{ github.head_ref }}"
