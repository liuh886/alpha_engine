name: Researcher Data CLI CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/researcher-data-cli-ci.yml"
      - "pyproject.toml"
      - "configs/data_contracts/model_data_bundle_v1.yaml"
      - "configs/data_contracts/qqq_rotation_model_data_v1.yaml"
      - "configs/data_contracts/qqq_rotation_sgov_model_data_v1.yaml"
      - "configs/data_recipes/**"
      - "src/cli/**"
      - "src/data/data_recipe.py"
      - "src/data/model_data_profile.py"
      - "src/data/strategy_data_bundle.py"
      - "src/research/etf_strategy_data.py"
      - "scripts/data/check_model_data_profile.py"
      - "scripts/data/refresh_selected_pool_prices_v2.py"
      - "tests/test_data_recipe.py"
      - "tests/test_data_recipe_registry.py"
      - "tests/test_researcher_cli.py"
      - "tests/test_strategy_data_bundle.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/researcher-data-cli-ci.yml"
      - "pyproject.toml"
      - "configs/data_contracts/model_data_bundle_v1.yaml"
      - "configs/data_contracts/qqq_rotation_model_data_v1.yaml"
      - "configs/data_contracts/qqq_rotation_sgov_model_data_v1.yaml"
      - "configs/data_recipes/**"
      - "src/cli/**"
      - "src/data/data_recipe.py"
      - "src/data/model_data_profile.py"
      - "src/data/strategy_data_bundle.py"
      - "src/research/etf_strategy_data.py"
      - "scripts/data/check_model_data_profile.py"
      - "scripts/data/refresh_selected_pool_prices_v2.py"
      - "tests/test_data_recipe.py"
      - "tests/test_data_recipe_registry.py"
      - "tests/test_researcher_cli.py"
      - "tests/test_strategy_data_bundle.py"

concurrency:
  group: researcher-data-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIINGO_API_TOKEN: ""
      TUSHARE_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Verify installed researcher command and recipe discovery
        run: |
          uv run alpha --help
          uv run alpha data list
          uv run alpha data prepare --help
          uv run alpha research run --help
      - name: Ruff researcher data paths
        run: >-
          uv run ruff check
          src/cli
          src/data/data_recipe.py
          src/data/model_data_profile.py
          src/data/strategy_data_bundle.py
          src/research/etf_strategy_data.py
          scripts/data/check_model_data_profile.py
          tests/test_data_recipe.py
          tests/test_data_recipe_registry.py
          tests/test_researcher_cli.py
          tests/test_strategy_data_bundle.py
      - name: Mypy researcher data paths
        run: >-
          uv run mypy --follow-imports=skip
          src/cli
          src/data/data_recipe.py
          src/data/model_data_profile.py
          src/data/strategy_data_bundle.py
          src/research/etf_strategy_data.py
          scripts/data/check_model_data_profile.py
      - name: Run researcher data tests
        run: >-
          uv run pytest
          tests/test_data_recipe.py
          tests/test_data_recipe_registry.py
          tests/test_researcher_cli.py
          tests/test_strategy_data_bundle.py
          tests/test_model_data_profile_gate.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
