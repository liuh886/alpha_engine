name: BYD v1.2 Trend Expansion Research

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/research_paradigms/byd_v1_2_trend_expansion.yaml"
      - "src/research/byd_v1_2_trend_expansion.py"
      - "scripts/run_byd_v1_2_trend_expansion.py"
      - "tests/test_byd_v1_2_trend_expansion.py"
      - "docs/evidence/byd_v1_2_trend_expansion/**"
      - "docs/research/byd_v1_2_trend_expansion.md"
      - ".github/workflows/byd-v1-2-trend-expansion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: byd-v1-2-trend-expansion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reproduce-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Verify immutable inputs
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > 515180-canonical-v1-artifact.zip
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  515180-canonical-v1-artifact.zip" | sha256sum --check --strict
      - name: Validate frozen code and tests
        run: |
          uv run ruff check \
            src/research/byd_v1_2_trend_expansion.py \
            scripts/run_byd_v1_2_trend_expansion.py \
            tests/test_byd_v1_2_trend_expansion.py
          uv run mypy \
            src/research/byd_v1_2_trend_expansion.py \
            scripts/run_byd_v1_2_trend_expansion.py
          uv run pytest tests/test_byd_v1_2_trend_expansion.py -q --strict-markers --tb=short
      - name: Extract immutable inputs
        run: |
          mkdir -p artifacts/data/byd_canonical_v1 artifacts/data/515180_canonical_v1
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/data/byd_canonical_v1
          unzip -q 515180-canonical-v1-artifact.zip -d artifacts/data/515180_canonical_v1
      - name: Run frozen experiment
        run: |
          uv run python scripts/run_byd_v1_2_trend_expansion.py \
            --byd-dir artifacts/data/byd_canonical_v1 \
            --etf-dir artifacts/data/515180_canonical_v1 \
            --output-dir artifacts/research/byd_v1_2_trend_expansion
      - name: Seal key evidence
        run: |
          set -euo pipefail
          target=docs/evidence/byd_v1_2_trend_expansion
          mkdir -p "$target"
          for file in README.md summary.json evaluation.csv period_contribution.csv episode_attribution.csv state_ledger.csv; do
            cp "artifacts/research/byd_v1_2_trend_expansion/$file" "$target/$file"
          done
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("docs/evidence/byd_v1_2_trend_expansion")
          files = {}
          for path in sorted(root.iterdir()):
              if path.name == "sealed_manifest.json" or not path.is_file():
                  continue
              files[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          contract_paths = [
              Path("configs/research_paradigms/byd_v1_2_trend_expansion.yaml"),
              Path("src/research/byd_v1_2_trend_expansion.py"),
              Path("scripts/run_byd_v1_2_trend_expansion.py"),
          ]
          contract_sha = hashlib.sha256(
              b"".join(path.read_bytes() for path in contract_paths)
          ).hexdigest()
          manifest = {
              "schema_version": "byd_v1_2_trend_expansion_seal_v1",
              "contract_sha256": contract_sha,
              "byd_snapshot_sha256": "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179",
              "etf_artifact_sha256": "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f",
              "files_sha256": files,
              "research_only": True,
              "trade_ready": False,
          }
          (root / "sealed_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit deterministic evidence to PR branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/byd_v1_2_trend_expansion
          if git diff --cached --quiet; then
            echo "Evidence already byte-stable."
          else
            git commit -m "research: seal BYD v1.2 trend-expansion evidence"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Publish summary
        run: cat artifacts/research/byd_v1_2_trend_expansion/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete evidence
        uses: actions/upload-artifact@v4
        with:
          name: byd-v1-2-trend-expansion-${{ github.run_id }}
          path: artifacts/research/byd_v1_2_trend_expansion
          if-no-files-found: error
          retention-days: 90
