name: BYD 515180 Prospective Sleeve

on:
  pull_request:
    branches: [main]
    paths:
      - "src/research/byd_515180_prospective.py"
      - "scripts/run_byd_515180_prospective.py"
      - "tests/test_byd_515180_prospective.py"
      - "tests/test_byd_515180_prospective_envelope.py"
      - "data/research/byd_515180_prospective/**"
      - "docs/research/byd_515180_prospective.md"
      - ".github/workflows/byd-515180-prospective.yml"
  push:
    branches: [main]
    paths:
      - "src/research/byd_515180_prospective.py"
      - "scripts/run_byd_515180_prospective.py"
      - "tests/test_byd_515180_prospective.py"
      - "tests/test_byd_515180_prospective_envelope.py"
      - "data/research/byd_prospective_shadow/observations/**"
      - "docs/research/byd_515180_prospective.md"
      - ".github/workflows/byd-515180-prospective.yml"
  schedule:
    - cron: "45 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: byd-515180-prospective-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Verify immutable bases
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > 515180-canonical-v1-artifact.zip
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  515180-canonical-v1-artifact.zip" | sha256sum --check --strict
      - name: Verify sealed BYD prospective source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("data/research/byd_prospective_shadow/observations").glob("*.json"))
          if not paths:
              raise SystemExit("no sealed BYD prospective observations are available")
          latest = json.loads(paths[-1].read_text(encoding="utf-8"))
          required = {
              "signal_date",
              "data_version",
              "base_target_position",
              "open_research_eligible",
              "chain_linked_adjusted_ohlcv",
          }
          missing = sorted(required - set(latest))
          if missing:
              raise SystemExit(f"latest BYD observation is missing fields: {missing}")
          print(
              json.dumps(
                  {
                      "path": str(paths[-1]),
                      "signal_date": latest["signal_date"],
                      "data_version": latest["data_version"],
                      "base_target_position": latest["base_target_position"],
                      "open_research_eligible": latest["open_research_eligible"],
                  },
                  ensure_ascii=False,
                  sort_keys=True,
              )
          )
          PY
      - name: Lint prospective sleeve
        run: >-
          uv run ruff check
          src/research/byd_515180_prospective.py
          scripts/run_byd_515180_prospective.py
          tests/test_byd_515180_prospective.py
          tests/test_byd_515180_prospective_envelope.py
      - name: Run prospective sleeve contract tests
        run: >-
          uv run pytest
          tests/test_byd_515180_prospective.py
          tests/test_byd_515180_prospective_envelope.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

  live-update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Extract immutable 515180 base outside repository
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/515180-canonical-v1-artifact.zip"
          base_dir="$RUNNER_TEMP/515180_canonical_v1"
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > "$zip_path"
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  $zip_path" | sha256sum --check --strict
          mkdir -p "$base_dir"
          unzip -q "$zip_path" -d "$base_dir"
          echo "ETF_BASELINE_DIR=$base_dir" >> "$GITHUB_ENV"
      - name: Verify sealed BYD source before pairing
        run: |
          set -euo pipefail
          latest="$(find data/research/byd_prospective_shadow/observations -maxdepth 1 -name '*.json' -print | sort | tail -n 1)"
          test -n "$latest"
          echo "Pairing from sealed BYD observation: $latest"
          sha256sum "$latest"
      - name: Append evidence or persist blocker receipt
        id: append
        shell: bash
        run: |
          set +e
          log_path="$RUNNER_TEMP/byd-515180-prospective-update.log"
          uv run python scripts/run_byd_515180_prospective.py \
            --byd-store data/research/byd_prospective_shadow \
            --etf-baseline-dir "$ETF_BASELINE_DIR" \
            --store-dir data/research/byd_515180_prospective \
            --as-of "$(date -u +%F)" \
            --secondary-retries 2 \
            2>&1 | tee "$log_path"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p data/research/byd_515180_prospective/blockers
          UPDATE_LOG_PATH="$log_path" UPDATE_EXIT_STATUS="$status" python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path(os.environ["UPDATE_LOG_PATH"])
          payload = log_path.read_bytes() if log_path.exists() else b""
          receipt = {
              "schema_version": "byd_515180_prospective_blocker_v1",
              "kind": "live_update_blocker",
              "observed_at_utc": datetime.now(timezone.utc).isoformat(),
              "as_of": datetime.now(timezone.utc).date().isoformat(),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "exit_status": int(os.environ["UPDATE_EXIT_STATUS"]),
              "log_sha256": hashlib.sha256(payload).hexdigest(),
              "log_tail": payload.decode("utf-8", errors="replace")[-6000:],
              "research_only": True,
              "trade_ready": False,
          }
          path = Path("data/research/byd_515180_prospective/blockers") / (
              f"{receipt['github_run_id']}-{receipt['github_run_attempt']}.json"
          )
          encoded = json.dumps(
              receipt,
              ensure_ascii=False,
              indent=2,
              sort_keys=True,
          ) + "\n"
          if path.exists() and path.read_text(encoding="utf-8") != encoded:
              raise SystemExit(f"blocker receipt drift detected: {path}")
          path.write_text(encoded, encoding="utf-8")
          PY
          echo "failed=true" >> "$GITHUB_OUTPUT"
      - name: Verify append-only scope
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v '^data/research/byd_515180_prospective/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected prospective updater changes:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit immutable evidence or blocker receipt
        run: |
          set -euo pipefail
          if git diff --quiet -- data/research/byd_515180_prospective && \
             [[ -z "$(git ls-files --others --exclude-standard data/research/byd_515180_prospective)" ]]; then
            echo "No new paired prospective evidence"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/byd_515180_prospective
          if [[ "${{ steps.append.outputs.failed }}" == "true" ]]; then
            git commit -m "research: record BYD 515180 prospective blocker"
          else
            git commit -m "research: append BYD 515180 prospective evidence"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail after persisting blocker
        if: steps.append.outputs.failed == 'true'
        run: |
          echo "Prospective update failed; immutable blocker receipt was committed"
          exit 1
