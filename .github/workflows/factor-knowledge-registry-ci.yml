name: Factor Knowledge Registry CI

on:
  push:
    branches: [main]
    paths:
      - "configs/factor_knowledge/historical_factor_cards_v1.yaml"
      - "configs/factor_knowledge/relationship_map_v1.yaml"
      - "src/research/factor_knowledge_registry.py"
      - "src/research/factor_history_backfill.py"
      - "src/research/factor_relationship_map.py"
      - "scripts/migrate_factor_knowledge_registry.py"
      - "scripts/backfill_factor_history_batch1.py"
      - "scripts/build_factor_relationship_map.py"
      - "tests/test_factor_knowledge_registry.py"
      - "tests/test_factor_history_backfill.py"
      - "tests/test_factor_relationship_map.py"
      - ".github/workflows/factor-knowledge-registry-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
  pull_request:
    branches: [main]
    paths:
      - "configs/factor_knowledge/historical_factor_cards_v1.yaml"
      - "configs/factor_knowledge/relationship_map_v1.yaml"
      - "src/research/factor_knowledge_registry.py"
      - "src/research/factor_history_backfill.py"
      - "src/research/factor_relationship_map.py"
      - "scripts/migrate_factor_knowledge_registry.py"
      - "scripts/backfill_factor_history_batch1.py"
      - "scripts/build_factor_relationship_map.py"
      - "tests/test_factor_knowledge_registry.py"
      - "tests/test_factor_history_backfill.py"
      - "tests/test_factor_relationship_map.py"
      - ".github/workflows/factor-knowledge-registry-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-uv
      - name: Ruff factor knowledge path
        run: >-
          uv run ruff check
          src/research/factor_knowledge_registry.py
          src/research/factor_history_backfill.py
          src/research/factor_relationship_map.py
          scripts/migrate_factor_knowledge_registry.py
          scripts/backfill_factor_history_batch1.py
          scripts/build_factor_relationship_map.py
          tests/test_factor_knowledge_registry.py
          tests/test_factor_history_backfill.py
          tests/test_factor_relationship_map.py
      - name: Run factor knowledge tests
        run: >-
          uv run pytest
          tests/test_factor_knowledge_registry.py
          tests/test_factor_history_backfill.py
          tests/test_factor_relationship_map.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: CLI import checks
        run: |
          uv run python scripts/migrate_factor_knowledge_registry.py --help
          uv run python scripts/backfill_factor_history_batch1.py --help
          uv run python scripts/build_factor_relationship_map.py --help
