name: Selected Pool Ranker Retest

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/pools/selected_pool_registry_v1.yaml"
      - "configs/research_paradigms/*selected_pool_ranker_retest_v1.yaml"
      - "src/research/multi_market_readiness.py"
      - "scripts/data/refresh_selected_pool_prices_v2.py"
      - "scripts/audit_selected_pool_price_sources.py"
      - "scripts/run_selected_pool_ranker_retest.py"
      - "tests/test_selected_pool_ranker_retest_contract.py"
      - "docs/research/selected_pool_ranker_retest_contract_2026-08-01.md"
      - ".github/workflows/selected-pool-ranker-retest.yml"
  push:
    branches: [main]
    paths:
      - "configs/pools/selected_pool_registry_v1.yaml"
      - "configs/research_paradigms/*selected_pool_ranker_retest_v1.yaml"
      - "src/research/multi_market_readiness.py"
      - "scripts/data/refresh_selected_pool_prices_v2.py"
      - "scripts/audit_selected_pool_price_sources.py"
      - "scripts/run_selected_pool_ranker_retest.py"
      - "tests/test_selected_pool_ranker_retest_contract.py"
      - "docs/research/selected_pool_ranker_retest_contract_2026-08-01.md"
      - ".github/workflows/selected-pool-ranker-retest.yml"
  workflow_dispatch:
    inputs:
      market:
        description: "Selected market evidence run"
        required: true
        default: "both"
        type: choice
        options: [cn, us, both]

concurrency:
  group: selected-pool-ranker-retest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff frozen retest files
        run: >-
          uv run ruff check
          src/research/multi_market_readiness.py
          scripts/audit_selected_pool_price_sources.py
          scripts/run_selected_pool_ranker_retest.py
          tests/test_selected_pool_ranker_retest_contract.py
      - name: Mypy frozen retest files
        run: >-
          uv run mypy
          src/research/multi_market_readiness.py
          scripts/audit_selected_pool_price_sources.py
          scripts/run_selected_pool_ranker_retest.py
      - name: Run frozen retest contract tests
        run: >-
          uv run pytest
          tests/test_selected_pool_ranker_retest_contract.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

  evidence-on-pr:
    if: github.event_name == 'pull_request'
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        market: [cn, us]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Rebuild exact complete promoted provider
        run: >-
          uv run python scripts/data/refresh_selected_pool_prices_v2.py
          --market "${{ matrix.market }}"
          --source-csv-dir data/csv_clean
          --output-root "artifacts/selected_pool_price_refresh/${{ matrix.market }}"
          --start 2021-01-01
          --cutoff 2026-06-18
          --max-rounds 1
          --full-refresh
      - name: Verify provider promotion gate
        shell: bash
        run: |
          market="${{ matrix.market }}"
          manifest="artifacts/selected_pool_price_refresh/${market}/artifacts/selected_pool_price_refresh_manifest.json"
          uv run python - "$manifest" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload.get("status") == "selected_pool_price_refresh_ready", payload
          assert payload.get("promotion_eligible") is True, payload.get("promotion_blocker")
          assert not payload.get("failures"), payload.get("failures")
          PY
      - name: Run frozen selected-pool evidence
        shell: bash
        run: |
          market="${{ matrix.market }}"
          provider="artifacts/selected_pool_price_refresh/${market}/data/providers/${market}"
          mkdir -p artifacts/evidence/selected_pool_ranker_retest
          if [ "$market" = "cn" ]; then
            uv run python scripts/run_selected_pool_ranker_retest.py \
              --market cn \
              --cn-provider-uri "$provider" \
              --output-dir artifacts/evidence/selected_pool_ranker_retest
          else
            uv run python scripts/run_selected_pool_ranker_retest.py \
              --market us \
              --us-provider-uri "$provider" \
              --output-dir artifacts/evidence/selected_pool_ranker_retest
          fi
      - name: Upload provider identity, refresh evidence and backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-pool-ranker-retest-${{ matrix.market }}-${{ github.run_id }}
          path: |
            artifacts/selected_pool_price_refresh/${{ matrix.market }}/artifacts
            artifacts/selected_pool_price_refresh/${{ matrix.market }}/data/providers/${{ matrix.market }}/provider_manifest.json
            artifacts/evidence/selected_pool_ranker_retest
          if-no-files-found: error
          retention-days: 90

  evidence-dispatch:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 600
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Build promoted providers and run frozen evidence
        shell: bash
        run: |
          requested="${{ inputs.market }}"
          markets="$requested"
          if [ "$requested" = "both" ]; then
            markets="us cn"
          fi
          mkdir -p artifacts/evidence/selected_pool_ranker_retest
          for market in $markets; do
            root="artifacts/selected_pool_price_refresh/${market}"
            uv run python scripts/data/refresh_selected_pool_prices_v2.py \
              --market "$market" \
              --source-csv-dir data/csv_clean \
              --output-root "$root" \
              --start 2021-01-01 \
              --cutoff 2026-06-18 \
              --max-rounds 1 \
              --full-refresh
            manifest="$root/artifacts/selected_pool_price_refresh_manifest.json"
            uv run python - "$manifest" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload.get("status") == "selected_pool_price_refresh_ready", payload
          assert payload.get("promotion_eligible") is True, payload.get("promotion_blocker")
          assert not payload.get("failures"), payload.get("failures")
          PY
            provider="$root/data/providers/$market"
            if [ "$market" = "cn" ]; then
              uv run python scripts/run_selected_pool_ranker_retest.py \
                --market cn --cn-provider-uri "$provider" \
                --output-dir artifacts/evidence/selected_pool_ranker_retest
            else
              uv run python scripts/run_selected_pool_ranker_retest.py \
                --market us --us-provider-uri "$provider" \
                --output-dir artifacts/evidence/selected_pool_ranker_retest
            fi
          done
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-pool-ranker-retest-${{ inputs.market }}-${{ github.run_id }}
          path: |
            artifacts/selected_pool_price_refresh
            artifacts/evidence/selected_pool_ranker_retest
          if-no-files-found: error
          retention-days: 90
