name: Apply effective provider cutoff follow-up

on:
  push:
    branches: [fix/provider-effective-cutoff]
    paths: [.github/workflows/apply-effective-provider-cutoff-followup.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/provider-effective-cutoff
          fetch-depth: 1
      - name: Materialize corrected workflow blob
        run: |
          python scripts/maintenance/patch_effective_provider_cutoff_followup.py
          cp .github/workflows/formal-backtest-refresh.yml scripts/maintenance/formal-backtest-refresh.followup.yml
          git restore .github/workflows/formal-backtest-refresh.yml
      - name: Commit ordinary blob only
        run: |
          git config user.name "AlphaEngine Maintenance Agent"
          git config user.email "maintenance-agent@alphaengine.local"
          git add scripts/maintenance/formal-backtest-refresh.followup.yml
          git commit -m "chore: materialize corrected effective-cutoff workflow blob"
          git push origin HEAD:fix/provider-effective-cutoff
