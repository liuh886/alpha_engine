name: QQQI v4.25 New Information Phase 0

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-v4-25-new-information-phase0.yml"
      - "configs/research_paradigms/qqqi_xgb_new_information_v4_25_phase0.yaml"
      - "docs/research/qqqi_xgb_new_information_v4_25_source_registry_2026-08-05.md"
      - "src/research/v4_25_new_information_phase0.py"
      - "scripts/run_qqqi_v4_25_new_information_phase0.py"
      - "tests/test_v4_25_new_information_phase0.py"
  workflow_dispatch:
    inputs:
      end_date:
        description: Optional exclusive QQQ calendar end date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint v4.25 Phase 0
        run: |
          uv run ruff check \
            src/research/v4_25_new_information_phase0.py \
            scripts/run_qqqi_v4_25_new_information_phase0.py \
            tests/test_v4_25_new_information_phase0.py
      - name: Test no-outcome source contracts
        run: |
          uv run pytest \
            tests/test_v4_25_new_information_phase0.py \
            tests/test_v4_24_xgb_adjacent_path_utility.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Run v4.25 source admissibility audit
        run: |
          uv run python scripts/run_qqqi_v4_25_new_information_phase0.py \
            --end-date "${{ inputs.end_date }}" \
            --output-dir artifacts/evidence/qqqi_xgb_new_information_v4_25_phase0
      - name: Assert Phase 0 contains no outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/evidence/qqqi_xgb_new_information_v4_25_phase0')
          payload = json.loads((root / 'diagnostics.json').read_text())
          assert payload['outcome_calculation_authorized'] is False
          assert payload['xgboost_training_performed'] is False
          assert payload['future_returns_present'] is False
          assert payload['path_utility_present'] is False
          assert payload['action_selection_performed'] is False
          assert payload['portfolio_constructed'] is False
          forbidden = ('future_return', 'path_utility', 'selected_action', 'portfolio_weight')
          for path in root.iterdir():
              if path.suffix.lower() not in {'.csv', '.json', '.md'}:
                  continue
              text = path.read_text(encoding='utf-8')
              for token in forbidden:
                  assert token not in text.lower(), (path, token)
          PY
      - name: Upload v4.25 Phase 0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-v4-25-new-information-phase0-${{ github.run_id }}
          path: artifacts/evidence/qqqi_xgb_new_information_v4_25_phase0
          if-no-files-found: error
          retention-days: 90
