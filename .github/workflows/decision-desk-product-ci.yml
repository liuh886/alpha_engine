name: Decision Evidence Contract CI

on:
  push:
    branches: [main]
    paths:
      - "src/decision_support/decision_ledger_reader.py"
      - "src/research/workflow.py"
      - "src/research/workflow_store.py"
      - "src/research/workflow_types.py"
      - "src/research/promotion_consumers.py"
      - "src/research/promotion_decision.py"
      - "tests/test_decision_ledger_reader.py"
      - "tests/test_research_workflow_contract.py"
      - ".github/workflows/decision-desk-product-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/decision_support/decision_ledger_reader.py"
      - "src/research/workflow.py"
      - "src/research/workflow_store.py"
      - "src/research/workflow_types.py"
      - "src/research/promotion_consumers.py"
      - "src/research/promotion_decision.py"
      - "tests/test_decision_ledger_reader.py"
      - "tests/test_research_workflow_contract.py"
      - ".github/workflows/decision-desk-product-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
      - name: Ruff evidence contracts
        run: >-
          uv run ruff check
          src/decision_support/decision_ledger_reader.py
          src/research/workflow.py
          src/research/workflow_store.py
          src/research/workflow_types.py
          src/research/promotion_consumers.py
          src/research/promotion_decision.py
          tests/test_decision_ledger_reader.py
          tests/test_research_workflow_contract.py
      - name: Run evidence contract tests
        run: >-
          uv run pytest
          tests/test_decision_ledger_reader.py
          tests/test_research_workflow_contract.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
