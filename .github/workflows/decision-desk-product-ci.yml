name: Decision Evidence Contract CI

on:
  push:
    branches: [main]
    paths:
      - "src/decision_support/decision_ledger_reader.py"
      - "src/api/routers/research.py"
      - "src/research/**"
      - "tests/test_decision_ledger_reader.py"
      - "tests/test_research_workflow_contract.py"
      - ".github/workflows/decision-desk-product-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/decision_support/decision_ledger_reader.py"
      - "src/api/routers/research.py"
      - "src/research/**"
      - "tests/test_decision_ledger_reader.py"
      - "tests/test_research_workflow_contract.py"
      - ".github/workflows/decision-desk-product-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff evidence contracts
        run: uv run ruff check src/decision_support/decision_ledger_reader.py src/api/routers/research.py tests/test_decision_ledger_reader.py tests/test_research_workflow_contract.py
      - name: Run evidence contract tests
        run: uv run pytest tests/test_decision_ledger_reader.py tests/test_research_workflow_contract.py -q --strict-markers --tb=short --disable-warnings --maxfail=1
