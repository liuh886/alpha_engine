name: Apply effective provider cutoff patch

on:
  push:
    branches: [fix/provider-effective-cutoff]
    paths: [.github/workflows/apply-effective-provider-cutoff.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/provider-effective-cutoff
          fetch-depth: 1
      - name: Materialize patched workflow as ordinary blob
        run: |
          python scripts/maintenance/patch_effective_provider_cutoff.py
          cp .github/workflows/formal-backtest-refresh.yml scripts/maintenance/formal-backtest-refresh.patched.yml
          git restore .github/workflows/formal-backtest-refresh.yml
      - name: Commit ordinary blob only
        run: |
          git config user.name "AlphaEngine Maintenance Agent"
          git config user.email "maintenance-agent@alphaengine.local"
          git add scripts/maintenance/formal-backtest-refresh.patched.yml
          git commit -m "chore: materialize effective-cutoff workflow blob"
          git push origin HEAD:fix/provider-effective-cutoff
# one-shot helper; deleted after blob transfer
