name: CN130 Tail Source Export

on:
  pull_request:
    branches:
      - research/cn130-cross-sectional-ranking-v1
    paths:
      - .github/workflows/cn130-tail-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Export source
        run: |
          mkdir -p artifacts
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=.pytest_cache \
            --exclude=.mypy_cache \
            --exclude=.ruff_cache \
            --exclude=artifacts \
            --exclude='**/node_modules' \
            --exclude='**/dist' \
            -czf artifacts/alpha-engine-cn130-tail-source-${GITHUB_SHA}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: cn130-tail-source-${{ github.run_id }}
          path: artifacts/alpha-engine-cn130-tail-source-*.tar.gz
          if-no-files-found: error
          retention-days: 3
