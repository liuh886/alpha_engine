name: Small-Pool Rotation Contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/pools/us_small_pool_v1.yaml"
      - "configs/pools/cn_small_pool_v1_draft.yaml"
      - "configs/pools/cn_small_pool_v1.yaml"
      - "configs/research_paradigms/us_small_pool_sector_rotation_v1.yaml"
      - "configs/research_paradigms/us_structured_pool_hierarchical_rotation_v2_draft.yaml"
      - "configs/research_paradigms/us_structured_pool_hierarchical_rotation_v2.yaml"
      - "configs/research_paradigms/cn_small_pool_sector_rotation_v1_draft.yaml"
      - "configs/research_paradigms/cn_small_pool_sector_rotation_v1.yaml"
      - "docs/research/small_pool_sector_rotation_charter_2026-07-30.md"
      - "docs/research/multi_market_hierarchical_rotation_charter_2026-07-30.md"
      - "docs/research/cn_small_pool_v1_freeze_2026-07-30.md"
      - "src/research/small_pool_rotation.py"
      - "src/research/hierarchical_pool_rotation.py"
      - "src/research/hierarchical_rotation_validation.py"
      - "scripts/run_small_pool_rotation.py"
      - "scripts/run_hierarchical_pool_rotation.py"
      - "scripts/run_us_hierarchical_rotation_validation.py"
      - "scripts/build_us_hierarchical_validation_snapshot.py"
      - "tests/test_small_pool_sector_rotation_contract.py"
      - "tests/test_small_pool_rotation_engine.py"
      - "tests/test_multi_market_hierarchical_rotation_contract.py"
      - "tests/test_hierarchical_pool_rotation_engine.py"
      - "tests/test_hierarchical_rotation_validation.py"
      - ".github/workflows/small-pool-rotation-ci.yml"
  push:
    branches: [main]
    paths:
      - "configs/pools/us_small_pool_v1.yaml"
      - "configs/pools/cn_small_pool_v1_draft.yaml"
      - "configs/pools/cn_small_pool_v1.yaml"
      - "configs/research_paradigms/us_small_pool_sector_rotation_v1.yaml"
      - "configs/research_paradigms/us_structured_pool_hierarchical_rotation_v2_draft.yaml"
      - "configs/research_paradigms/us_structured_pool_hierarchical_rotation_v2.yaml"
      - "configs/research_paradigms/cn_small_pool_sector_rotation_v1_draft.yaml"
      - "configs/research_paradigms/cn_small_pool_sector_rotation_v1.yaml"
      - "docs/research/multi_market_hierarchical_rotation_charter_2026-07-30.md"
      - "docs/research/cn_small_pool_v1_freeze_2026-07-30.md"
      - "src/research/small_pool_rotation.py"
      - "src/research/hierarchical_pool_rotation.py"
      - "src/research/hierarchical_rotation_validation.py"
      - "scripts/run_small_pool_rotation.py"
      - "scripts/run_hierarchical_pool_rotation.py"
      - "scripts/run_us_hierarchical_rotation_validation.py"
      - "scripts/build_us_hierarchical_validation_snapshot.py"
      - "tests/test_small_pool_sector_rotation_contract.py"
      - "tests/test_small_pool_rotation_engine.py"
      - "tests/test_multi_market_hierarchical_rotation_contract.py"
      - "tests/test_hierarchical_pool_rotation_engine.py"
      - "tests/test_hierarchical_rotation_validation.py"
      - ".github/workflows/small-pool-rotation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff rotation files
        run: >-
          uv run ruff check
          src/research/small_pool_rotation.py
          src/research/hierarchical_pool_rotation.py
          src/research/hierarchical_rotation_validation.py
          scripts/run_small_pool_rotation.py
          scripts/run_hierarchical_pool_rotation.py
          scripts/run_us_hierarchical_rotation_validation.py
          scripts/build_us_hierarchical_validation_snapshot.py
          tests/test_small_pool_sector_rotation_contract.py
          tests/test_small_pool_rotation_engine.py
          tests/test_multi_market_hierarchical_rotation_contract.py
          tests/test_hierarchical_pool_rotation_engine.py
          tests/test_hierarchical_rotation_validation.py
      - name: Run rotation tests
        run: >-
          uv run pytest
          tests/test_small_pool_sector_rotation_contract.py
          tests/test_small_pool_rotation_engine.py
          tests/test_multi_market_hierarchical_rotation_contract.py
          tests/test_hierarchical_pool_rotation_engine.py
          tests/test_hierarchical_rotation_validation.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
