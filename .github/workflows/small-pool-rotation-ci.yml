name: Small-Pool Rotation Contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/pools/us_small_pool_v1.yaml"
      - "configs/research_paradigms/us_small_pool_sector_rotation_v1.yaml"
      - "docs/research/small_pool_sector_rotation_charter_2026-07-30.md"
      - "tests/test_small_pool_sector_rotation_contract.py"
      - ".github/workflows/small-pool-rotation-ci.yml"
  push:
    branches: [main]
    paths:
      - "configs/pools/us_small_pool_v1.yaml"
      - "configs/research_paradigms/us_small_pool_sector_rotation_v1.yaml"
      - "tests/test_small_pool_sector_rotation_contract.py"
      - ".github/workflows/small-pool-rotation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff contract test
        run: uv run ruff check tests/test_small_pool_sector_rotation_contract.py
      - name: Run contract test
        run: >-
          uv run pytest
          tests/test_small_pool_sector_rotation_contract.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
