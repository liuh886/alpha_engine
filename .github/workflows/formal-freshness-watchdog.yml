name: Formal Freshness Watchdog

on:
  schedule:
    # Run after expected CN and US data availability
    # CN data typically available by ~12:00 UTC, US by ~02:00 UTC
    - cron: "0 3 * * 1-5"    # US close + data pipe latency ~3hr
    - cron: "0 14 * * 1-5"   # CN close + data pipe latency ~7hr
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify formal backtest freshness
        id: freshness
        shell: bash
        run: |
          set +e
          output="$(python scripts/verify_formal_backtest_freshness.py \
            --root data/research/formal_backtests \
            --as-of now 2>&1)"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if [ $status -eq 0 ]; then
            echo "status_label=current" >> "$GITHUB_OUTPUT"
          elif echo "$output" | grep -qi "stale"; then
            echo "status_label=stale" >> "$GITHUB_OUTPUT"
          else
            echo "status_label=blocked" >> "$GITHUB_OUTPUT"
          fi

          {
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert freshness receipt issue
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS_LABEL: ${{ steps.freshness.outputs.status_label }}
          EXIT_CODE: ${{ steps.freshness.outputs.exit_code }}
        with:
          script: |
            const status = process.env.STATUS_LABEL || 'blocked';
            const exitCode = process.env.EXIT_CODE || '1';
            const timestamp = new Date().toISOString();
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const title = status === 'current'
              ? `[Freshness] Formal backtests current — ${timestamp.slice(0, 10)}`
              : `[Freshness] Formal backtests ${status} — ${timestamp.slice(0, 10)}`;

            const body = [
              `## Formal Backtest Freshness — ${status.toUpperCase()}`,
              '',
              `- **Status**: \`${status}\``,
              `- **Checked at**: ${timestamp}`,
              `- **Workflow run**: [${context.runId}](${runUrl})`,
              `- **Exit code**: ${exitCode}`,
              '',
              status === 'current'
                ? 'All formal backtest markets have up-to-date data.'
                : 'One or more formal backtest markets are stale or blocked. Review the workflow run for details.',
              '',
              `<!-- freshness-check:${context.runId} -->`,
            ].join('\n');

            // Find existing freshness issue to update
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['freshness'],
              per_page: 10,
            });

            const existing = issues.find(i =>
              i.title.includes('[Freshness]') && !i.pull_request
            );

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.notice(`Updated freshness issue #${existing.number}`);
            } else if (status !== 'current') {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['freshness'],
              });
              core.notice('Created new freshness issue');
            }
