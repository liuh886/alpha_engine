name: Formal Backtest Freshness Watchdog

on:
  schedule:
    # After the prior US session and its normal end-of-day data window.
    - cron: '30 1 * * 2-6'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/formal-backtest-freshness-watchdog.yml
      - scripts/verify_formal_backtest_freshness.py
      - tests/test_formal_backtest_freshness.py
      - data/research/formal_backtests/**

permissions:
  contents: read
  issues: write

concurrency:
  group: formal-backtest-freshness-watchdog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate freshness implementation
        run: |
          uv run ruff check scripts/verify_formal_backtest_freshness.py tests/test_formal_backtest_freshness.py
          uv run pytest tests/test_formal_backtest_freshness.py -q --strict-markers --tb=short
      - name: Evaluate current wall-clock freshness
        id: freshness
        shell: bash
        run: |
          set +e
          uv run python scripts/verify_formal_backtest_freshness.py \
            --root data/research/formal_backtests \
            --as-of now \
            --receipt artifacts/formal-freshness-watchdog.json \
            > artifacts/formal-freshness-watchdog.log 2>&1
          exit_code=$?
          set -e
          uv run python - "$exit_code" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          exit_code = int(sys.argv[1])
          receipt_path = Path('artifacts/formal-freshness-watchdog.json')
          log_path = Path('artifacts/formal-freshness-watchdog.log')
          log = log_path.read_text(encoding='utf-8', errors='replace')
          if exit_code == 0:
              receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
              status = 'current'
              summary = 'All accepted formal packages match the declared latest completed sessions.'
          else:
              status = 'stale' if 'stale' in log.lower() or 'next session closed' in log.lower() else 'blocked'
              summary = log.strip().splitlines()[-1] if log.strip() else 'Freshness verification failed without a diagnostic.'
              receipt = {
                  'schema_version': '1.0.0',
                  'status': status,
                  'checked_at': datetime.now(timezone.utc).isoformat(),
                  'summary': summary,
                  'bounded_log_tail': log.splitlines()[-20:],
                  'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                  'commit_sha': os.environ['GITHUB_SHA'],
                  'research_only': True,
                  'trade_ready': False,
              }
              receipt_path.parent.mkdir(parents=True, exist_ok=True)
              receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'status={status}\n')
              handle.write(f'summary={summary[:500]}\n')
          PY
      - name: Upload watchdog receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-freshness-watchdog-${{ github.run_id }}
          path: |
            artifacts/formal-freshness-watchdog.json
            artifacts/formal-freshness-watchdog.log
          if-no-files-found: error
          retention-days: 90
      - name: Upsert durable freshness status
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          FRESHNESS_STATUS: ${{ steps.freshness.outputs.status }}
          FRESHNESS_SUMMARY: ${{ steps.freshness.outputs.summary }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- formal-backtest-freshness-watchdog -->';
            const receipt = JSON.parse(fs.readFileSync('artifacts/formal-freshness-watchdog.json', 'utf8'));
            const status = process.env.FRESHNESS_STATUS;
            const body = [
              marker,
              '',
              `## 正式回测时效：${status}`,
              '',
              `- 检查时间：${receipt.checked_at || receipt.as_of || new Date().toISOString()}`,
              `- 工作流：${context.runId}`,
              `- 提交：\`${context.sha}\``,
              `- 结论：${process.env.FRESHNESS_SUMMARY}`,
              '- 研究用途：是',
              '- 自动交易授权：否',
              '',
              '该状态检查使用当前时间，不把历史字节可复现性误写成“数据仍为最新”。',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100,
            });
            const existing = issues.find((issue) =>
              !issue.pull_request && String(issue.body || '').includes(marker)
            );
            const desiredState = status === 'current' ? 'closed' : 'open';
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: `[运行健康] 正式回测时效：${status}`,
                body,
                state: desiredState,
              });
            } else if (status !== 'current') {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[运行健康] 正式回测时效：${status}`,
                body,
                assignees: [context.repo.owner],
              });
            }
