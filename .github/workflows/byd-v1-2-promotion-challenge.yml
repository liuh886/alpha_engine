name: BYD v1.2 Promotion Challenge

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/research_paradigms/byd_v1_2_promotion_challenge_v1.yaml"
      - "configs/research_candidates/byd_v1_2_convex_momentum_budget_v1.yaml"
      - "src/research/byd_v1_2_promotion_challenge.py"
      - "src/research/byd_v1_2_convex_momentum.py"
      - "scripts/run_byd_v1_2_promotion_challenge.py"
      - "scripts/run_byd_convex_momentum_evidence.py"
      - "scripts/run_byd_improvement_experiments.py"
      - "tests/test_byd_v1_2_promotion_challenge.py"
      - "tests/test_byd_v1_2_convex_momentum.py"
      - ".github/workflows/byd-v1-2-promotion-challenge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: byd-v1-2-promotion-challenge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-challenge:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Verify immutable input identities
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > "$RUNNER_TEMP/515180.zip"
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  $RUNNER_TEMP/515180.zip" | sha256sum --check --strict
          mkdir -p artifacts/input/byd artifacts/input/515180
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/input/byd
          unzip -q "$RUNNER_TEMP/515180.zip" -d artifacts/input/515180

      - name: Validate implementation
        run: |
          uv run ruff check \
            src/research/byd_v1_2_promotion_challenge.py \
            src/research/byd_v1_2_convex_momentum.py \
            scripts/run_byd_v1_2_promotion_challenge.py \
            scripts/run_byd_convex_momentum_evidence.py \
            scripts/run_byd_improvement_experiments.py \
            tests/test_byd_v1_2_promotion_challenge.py \
            tests/test_byd_v1_2_convex_momentum.py
          uv run pytest \
            tests/test_byd_v1_2_promotion_challenge.py \
            tests/test_byd_v1_2_convex_momentum.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1

      - name: Run frozen challenge twice
        run: |
          set -euo pipefail
          contract=configs/research_paradigms/byd_v1_2_promotion_challenge_v1.yaml
          for output in artifacts/result-a artifacts/result-b; do
            uv run python scripts/run_byd_v1_2_promotion_challenge.py \
              --byd-dir artifacts/input/byd \
              --etf-dir artifacts/input/515180 \
              --contract "$contract" \
              --output-dir "$output"
          done
          diff -ru artifacts/result-a artifacts/result-b

      - name: Reproduce independent architectures from PR 588
        run: |
          uv run python scripts/run_byd_improvement_experiments.py \
            --byd-dir artifacts/input/byd \
            --etf-dir artifacts/input/515180 \
            --output-dir artifacts/architecture-diagnostic

      - name: Reproduce selected convex momentum candidate twice
        run: |
          set -euo pipefail
          contract=configs/research_candidates/byd_v1_2_convex_momentum_budget_v1.yaml
          for output in artifacts/convex-a artifacts/convex-b; do
            uv run python scripts/run_byd_convex_momentum_evidence.py \
              --byd-dir artifacts/input/byd \
              --etf-dir artifacts/input/515180 \
              --contract "$contract" \
              --output-dir "$output"
          done
          diff -ru artifacts/convex-a artifacts/convex-b

      - name: Enforce research-only decision boundary
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          challenge = json.loads(Path("artifacts/result-a/decision.json").read_text())
          assert challenge["issue"] == 592
          assert challenge["promotion_authorized"] is False
          assert challenge["decision"]["promotion_authorized"] is False

          convex = json.loads(Path("artifacts/convex-a/decision.json").read_text())
          assert convex["issue"] == 596
          assert convex["fresh_historical_holdout"] is False
          assert convex["historical_evidence_consumed"] is True
          assert convex["promotion_authorized"] is False
          assert convex["automatic_promotion_allowed"] is False
          assert convex["decision"]["prospective_candidate_selected"] is True
          assert convex["decision"]["promotion_authorized"] is False
          print("Challenge decision:", challenge["decision"]["decision"])
          print("Prospective candidate:", convex["candidate_id"])
          PY

      - name: Upload governed evidence
        uses: actions/upload-artifact@v4
        with:
          name: byd-v1-2-promotion-challenge-${{ github.run_id }}
          path: |
            artifacts/result-a
            artifacts/architecture-diagnostic
            artifacts/convex-a
          if-no-files-found: error
          retention-days: 90
