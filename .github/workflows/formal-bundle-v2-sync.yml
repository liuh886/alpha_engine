name: Formal Bundle v2 Sync

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/formal-bundle-v2-sync.yml
      - scripts/sync_formal_bundle_v2.py
      - scripts/run_formal_refresh_transaction.py
      - src/artifacts/formal_bundle_v2_builder.py
      - src/cli/main.py
      - src/governance/active_strategy_catalog.py
      - configs/strategies/registry.json
      - configs/models/**
      - src/artifacts/strategy_operations.py
      - tests/test_formal_bundle_v2_builder.py
      - tests/test_sync_formal_bundle_v2.py
      - tests/test_strategy_operations.py
      - tests/test_active_strategy_catalog.py
      - tests/test_formal_refresh.py
      - data/research/formal_backtests/**
      - data/research/formal_model_runs/**
      - data/research/strategy_signal_ledgers/**
      - qlib-dashboard/scripts/sync-formal-model-runs.mjs
      - qlib-dashboard/scripts/sync-strategy-operations.mjs
      - qlib-dashboard/src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-bundle-v2-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  project-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json
      - name: Install locked environments
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
          cd qlib-dashboard
          npm ci --no-audit --no-fund

      - name: Resolve projection mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from scripts.run_formal_refresh_transaction import _assert_formal_catalog_or_declared_transition
          from src.governance.active_strategy_catalog import load_active_strategy_catalog

          formal_path = Path("data/research/formal_model_runs/catalog.json")
          formal = json.loads(formal_path.read_text(encoding="utf-8"))
          active = load_active_strategy_catalog()
          observed = {
              str(row.get("model_version_id") or "")
              for row in formal.get("records", [])
              if isinstance(row, dict)
          }
          expected = set(active.active_model_version_ids)
          if observed == expected:
              print("defer=false")
              print("reason=exact_active_formal_identity")
          else:
              # This helper accepts only a one-for-one declared lineage.supersedes
              # transition with the same family/kind/formal status. Any unrelated
              # catalog drift remains a hard failure.
              _assert_formal_catalog_or_declared_transition(formal, active)
              print("defer=true")
              print("reason=declared_model_version_cutover_requires_reviewed_refresh")
          PY

      - name: Validate declared cutover contract
        if: steps.mode.outputs.defer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check \
            scripts/run_formal_refresh_transaction.py \
            src/governance/active_strategy_catalog.py \
            scripts/validate_model_x1_baselines.py
          uv run pytest \
            tests/test_formal_refresh.py \
            tests/test_active_strategy_catalog.py \
            tests/test_model_x1_baselines.py \
            tests/test_us_x1_3_current_target.py \
            -q --strict-markers --tb=short
          {
            echo '### Formal Bundle v2 projection deferred'
            echo
            echo 'The active catalog is in a validated declared model-version cutover.'
            echo 'Native preview evidence for the successor must be generated by Reviewed Formal Backtest Refresh; this lightweight projection may not invent or relabel predecessor evidence.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build active formal Bundle v2 twice
        if: steps.mode.outputs.defer != 'true'
        run: |
          set -euo pipefail
          rm -rf artifacts/bundle-a artifacts/bundle-b
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root data/research/formal_backtests \
            --output-root artifacts/bundle-a \
            --receipt artifacts/bundle-receipt-a.json
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root data/research/formal_backtests \
            --output-root artifacts/bundle-b \
            --receipt artifacts/bundle-receipt-b.json
          diff -ru artifacts/bundle-a artifacts/bundle-b
          cmp artifacts/bundle-receipt-a.json artifacts/bundle-receipt-b.json
          rm -rf data/research/formal_model_runs
          cp -a artifacts/bundle-a data/research/formal_model_runs
          rm -f data/research/formal_model_runs/formal-bundle-v2-sync-receipt.json
      - name: Rebuild generated Strategy Operations against active identities
        if: steps.mode.outputs.defer != 'true'
        run: |
          set -euo pipefail
          generated_at="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/research/formal_backtests/catalog.json').read_text(encoding='utf-8'))
          print(payload['published_at'])
          PY
          )"
          uv run alpha ops build \
            --formal-catalog data/research/formal_model_runs/catalog.json \
            --generated-at "$generated_at" \
            --output artifacts/operations-a.json
          uv run alpha ops build \
            --formal-catalog data/research/formal_model_runs/catalog.json \
            --generated-at "$generated_at" \
            --output artifacts/operations-b.json
          cmp artifacts/operations-a.json artifacts/operations-b.json
          mkdir -p data/research/strategy_operations
          cp artifacts/operations-a.json data/research/strategy_operations/snapshots.json
          cd qlib-dashboard
          npm run sync:formal-model-runs
          npm run sync:strategy-operations
      - name: Validate Python publication contracts
        if: steps.mode.outputs.defer != 'true'
        run: |
          set -euo pipefail
          uv run ruff check \
            src/artifacts/formal_bundle_v2_builder.py \
            scripts/sync_formal_bundle_v2.py \
            src/cli/main.py \
            src/governance/active_strategy_catalog.py \
            src/artifacts/strategy_operations.py \
            tests/test_formal_bundle_v2_builder.py \
            tests/test_sync_formal_bundle_v2.py \
            tests/test_strategy_operations.py \
            tests/test_active_strategy_catalog.py
          uv run pytest \
            tests/test_formal_bundle_v2_builder.py \
            tests/test_sync_formal_bundle_v2.py \
            tests/test_strategy_operations.py \
            tests/test_active_strategy_catalog.py \
            -q --strict-markers --tb=short
      - name: Validate projected frontend lint and types
        if: steps.mode.outputs.defer != 'true'
        working-directory: qlib-dashboard
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Validate projected frontend unit tests
        if: steps.mode.outputs.defer != 'true'
        working-directory: qlib-dashboard
        run: npm test -- --run
      - name: Validate projected frontend build
        if: steps.mode.outputs.defer != 'true'
        working-directory: qlib-dashboard
        run: npm run build
      - name: Report generated delta without mutating the PR
        if: github.event_name == 'pull_request' && steps.mode.outputs.defer != 'true'
        shell: bash
        run: |
          {
            echo '### Generated publication delta'
            echo '```text'
            git status --short -- data/research/formal_model_runs
            echo '```'
            echo 'Strategy Operations and frontend public assets are build outputs and are intentionally untracked.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload projection evidence
        if: always() && steps.mode.outputs.defer != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: formal-bundle-v2-sync-${{ github.run_id }}
          path: |
            artifacts/bundle-a
            artifacts/bundle-receipt-a.json
            artifacts/operations-a.json
          if-no-files-found: error
          retention-days: 30
