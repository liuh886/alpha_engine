name: Formal Bundle v2 Sync

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/formal-bundle-v2-sync.yml
      - scripts/promote_byd_v1_2_formal.py
      - scripts/migrate_formal_v1_to_bundle_v2.py
      - scripts/sync_formal_bundle_v2.py
      - data/research/formal_backtests/**
      - data/research/formal_model_runs/**
      - qlib-dashboard/public/data/formal-model-runs/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formal-bundle-v2-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  GENERATED_AT: 2026-08-06T09:52:48Z

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json

      - name: Install locked environments
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
          cd qlib-dashboard
          npm ci

      - name: Verify immutable BYD and 515180 inputs
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > "$RUNNER_TEMP/515180.zip"
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  $RUNNER_TEMP/515180.zip" | sha256sum --check --strict
          mkdir -p artifacts/input/byd artifacts/input/515180
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/input/byd
          unzip -q "$RUNNER_TEMP/515180.zip" -d artifacts/input/515180

      - name: Generate accepted formal v1 package
        run: |
          uv run python scripts/promote_byd_v1_2_formal.py \
            --root data/research/formal_backtests \
            --byd-dir artifacts/input/byd \
            --etf-dir artifacts/input/515180 \
            --signal-ledger data/research/byd_v1_2_signal_ledger \
            --generated-at "$GENERATED_AT" \
            --receipt artifacts/byd-v1-2-promotion.json

      - name: Project Bundle v2 twice and compare bytes
        run: |
          rm -rf .research/formal-a .research/formal-b
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root data/research/formal_backtests \
            --output-root .research/formal-a \
            --receipt artifacts/formal-receipt-a.json
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root data/research/formal_backtests \
            --output-root .research/formal-b \
            --receipt artifacts/formal-receipt-b.json
          diff -ru .research/formal-a .research/formal-b
          cmp artifacts/formal-receipt-a.json artifacts/formal-receipt-b.json
          rsync -a --delete --exclude formal-bundle-v2-sync-receipt.json \
            .research/formal-a/ data/research/formal_model_runs/
          cd qlib-dashboard
          npm run sync:formal-model-runs

      - name: Validate publication contracts
        run: |
          uv run ruff check \
            scripts/promote_byd_v1_2_formal.py \
            scripts/migrate_formal_v1_to_bundle_v2.py \
            scripts/sync_formal_bundle_v2.py \
            src/research/byd_v1_2_convex_momentum.py \
            tests/test_byd_v1_2_convex_momentum.py \
            tests/test_sync_formal_bundle_v2.py
          uv run pytest \
            tests/test_byd_v1_2_convex_momentum.py \
            tests/test_model_x1_baselines.py \
            tests/test_sync_formal_bundle_v2.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from src.artifacts.model_run_bundle_v2 import validate_catalog, validate_manifest

          v1 = json.loads(Path('data/research/formal_backtests/catalog.json').read_text())
          root = Path('data/research/formal_model_runs')
          v2 = json.loads((root / 'catalog.json').read_text())
          validate_catalog(v2)
          accepted = [row['model_id'] for row in v1['records']]
          projected = [row['model_version_id'] for row in v2['records']]
          assert accepted and len(accepted) == len(set(accepted))
          assert set(accepted) == set(projected)
          assert 'byd_v1_2_convex_momentum_budget_v1' in projected
          assert 'byd_dividend_sleeve_v1_0' not in projected
          for row in v2['records']:
              validate_manifest(json.loads((root / row['manifest_path']).read_text()))
          PY
          test -f qlib-dashboard/public/data/formal-model-runs/catalog.json
          test -f qlib-dashboard/public/data/formal-model-runs/byd_v1_2_convex_momentum_budget_v1/manifest.json

      - name: Commit deterministic formal assets
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "AlphaEngine Release Agent"
          git config user.email "release-agent@alphaengine.local"
          git add \
            data/research/formal_backtests \
            data/research/formal_model_runs \
            qlib-dashboard/public/data/formal-model-runs
          if git diff --cached --quiet; then
            echo "Formal BYD v1.2 assets are already byte-stable."
          else
            git commit -m "release: materialize BYD v1.2 formal assets"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-bundle-v2-sync-${{ github.run_id }}
          path: |
            artifacts/byd-v1-2-promotion.json
            artifacts/formal-receipt-a.json
            .research/formal-a
          if-no-files-found: error
          retention-days: 90
