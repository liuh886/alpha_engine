name: Formal Bundle v2 Sync

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/formal-bundle-v2-sync.yml
      - scripts/migrate_formal_v1_to_bundle_v2.py
      - scripts/sync_formal_bundle_v2.py
      - tests/test_sync_formal_bundle_v2.py
      - data/research/formal_backtests/**
      - data/research/formal_model_runs/**
      - qlib-dashboard/public/data/formal-model-runs/**
      - qlib-dashboard/src/hooks/useModels.ts
      - qlib-dashboard/src/pages/StrategyOperationsPage.tsx
      - qlib-dashboard/src/lib/byd-runtime.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-bundle-v2-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  project-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json

      - name: Install locked environments
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
          cd qlib-dashboard
          npm ci

      - name: Validate generic formal projector
        run: |
          uv run ruff check \
            scripts/migrate_formal_v1_to_bundle_v2.py \
            scripts/sync_formal_bundle_v2.py \
            tests/test_sync_formal_bundle_v2.py
          uv run mypy \
            scripts/migrate_formal_v1_to_bundle_v2.py \
            scripts/sync_formal_bundle_v2.py
          uv run pytest tests/test_sync_formal_bundle_v2.py \
            -q --strict-markers --tb=short

      - name: Project all accepted formal models twice
        run: |
          uv run python scripts/sync_formal_bundle_v2.py \
            --output-root .research/formal-run-a \
            --receipt .research/formal-receipt-a.json
          uv run python scripts/sync_formal_bundle_v2.py \
            --output-root .research/formal-run-b \
            --receipt .research/formal-receipt-b.json
          diff -ru .research/formal-run-a .research/formal-run-b
          cmp .research/formal-receipt-a.json .research/formal-receipt-b.json
          diff -ru --exclude formal-bundle-v2-sync-receipt.json \
            .research/formal-run-a data/research/formal_model_runs

      - name: Enforce catalog parity and section integrity
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from src.artifacts.model_run_bundle_v2 import validate_catalog, validate_manifest

          v1 = json.loads(Path('data/research/formal_backtests/catalog.json').read_text())
          root = Path('data/research/formal_model_runs')
          v2 = json.loads((root / 'catalog.json').read_text())
          validate_catalog(v2)
          accepted = [row['model_id'] for row in v1['records']]
          projected = [row['model_version_id'] for row in v2['records']]
          assert accepted and len(accepted) == len(set(accepted))
          assert set(accepted) == set(projected)
          assert 'byd_v1_2_convex_momentum_budget_v1' in projected
          assert 'byd_dividend_sleeve_v1_0' not in projected
          for row in v2['records']:
              manifest = json.loads((root / row['manifest_path']).read_text())
              validate_manifest(manifest)
          PY

      - name: Validate frontend against committed formal catalog
        working-directory: qlib-dashboard
        run: |
          npm run lint
          npx tsc --noEmit
          npm test -- --run
          npm run build
          test -f dist/data/formal-model-runs/catalog.json
          test ! -e dist/data/formal-backtests

      - name: Upload projection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-bundle-v2-sync-${{ github.run_id }}
          path: |
            .research/formal-receipt-a.json
            .research/formal-run-a
          if-no-files-found: error
          retention-days: 90
