name: Formal Bundle v2 Sync

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/formal-bundle-v2-sync.yml
      - scripts/sync_formal_bundle_v2.py
      - scripts/migrate_formal_v1_to_bundle_v2.py
      - scripts/build_strategy_operations.py
      - src/artifacts/strategy_operations.py
      - tests/test_migrate_formal_v1_to_bundle_v2.py
      - tests/test_sync_formal_bundle_v2.py
      - tests/test_strategy_operations.py
      - data/research/formal_backtests/**
      - data/research/formal_model_runs/**
      - data/research/strategy_signal_ledgers/**
      - data/research/strategy_operations/**
      - qlib-dashboard/scripts/sync-formal-model-runs.mjs
      - qlib-dashboard/scripts/sync-strategy-operations.mjs
      - qlib-dashboard/public/data/formal-model-runs/**
      - qlib-dashboard/public/data/strategy-operations/**
      - qlib-dashboard/src/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formal-bundle-v2-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  project-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json
      - name: Install locked environments
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
          cd qlib-dashboard
          npm ci --no-audit --no-fund
      - name: Project accepted formal v1 into Bundle v2 twice
        run: |
          set -euo pipefail
          rm -rf artifacts/bundle-a artifacts/bundle-b
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root data/research/formal_backtests \
            --output-root artifacts/bundle-a \
            --receipt artifacts/bundle-receipt-a.json
          uv run python scripts/sync_formal_bundle_v2.py \
            --source-root data/research/formal_backtests \
            --output-root artifacts/bundle-b \
            --receipt artifacts/bundle-receipt-b.json
          diff -ru artifacts/bundle-a artifacts/bundle-b
          cmp artifacts/bundle-receipt-a.json artifacts/bundle-receipt-b.json
          rm -rf data/research/formal_model_runs
          cp -a artifacts/bundle-a data/research/formal_model_runs
          rm -f data/research/formal_model_runs/formal-bundle-v2-sync-receipt.json
      - name: Rebuild Strategy Operations against projected identities
        run: |
          set -euo pipefail
          generated_at="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/research/formal_backtests/catalog.json').read_text(encoding='utf-8'))
          print(payload['published_at'])
          PY
          )"
          uv run python scripts/build_strategy_operations.py \
            --formal-catalog data/research/formal_model_runs/catalog.json \
            --ledger-root data/research/strategy_signal_ledgers \
            --generated-at "$generated_at" \
            --output artifacts/operations-a.json
          uv run python scripts/build_strategy_operations.py \
            --formal-catalog data/research/formal_model_runs/catalog.json \
            --ledger-root data/research/strategy_signal_ledgers \
            --generated-at "$generated_at" \
            --output artifacts/operations-b.json
          cmp artifacts/operations-a.json artifacts/operations-b.json
          cp artifacts/operations-a.json data/research/strategy_operations/snapshots.json
          cd qlib-dashboard
          npm run sync:formal-model-runs
          npm run sync:strategy-operations
      - name: Validate projected Python publication contracts
        run: |
          set -euo pipefail
          uv run ruff check \
            scripts/migrate_formal_v1_to_bundle_v2.py \
            scripts/sync_formal_bundle_v2.py \
            scripts/build_strategy_operations.py \
            src/artifacts/strategy_operations.py \
            tests/test_migrate_formal_v1_to_bundle_v2.py \
            tests/test_sync_formal_bundle_v2.py \
            tests/test_strategy_operations.py
          uv run pytest \
            tests/test_migrate_formal_v1_to_bundle_v2.py \
            tests/test_sync_formal_bundle_v2.py \
            tests/test_strategy_operations.py \
            -q --strict-markers --tb=short
      - name: Validate projected frontend lint and types
        working-directory: qlib-dashboard
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Validate projected frontend unit tests
        working-directory: qlib-dashboard
        run: npm test -- --run
      - name: Validate projected frontend build
        working-directory: qlib-dashboard
        run: npm run build
      - name: Commit exact projected assets
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          git config user.name "AlphaEngine Release Agent"
          git config user.email "release-agent@alphaengine.local"
          git add \
            data/research/formal_model_runs \
            data/research/strategy_operations/snapshots.json \
            qlib-dashboard/public/data/formal-model-runs \
            qlib-dashboard/public/data/strategy-operations
          if git diff --cached --quiet; then
            echo "Formal v2 and Strategy Operations projections are byte-stable."
          else
            git commit -m "release: sync formal v2 and strategy operations"
            git pull --rebase origin ${{ github.head_ref }}
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Upload projection evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: formal-bundle-v2-sync-${{ github.run_id }}
          path: |
            artifacts/bundle-a
            artifacts/bundle-receipt-a.json
            artifacts/operations-a.json
          if-no-files-found: error
          retention-days: 30
