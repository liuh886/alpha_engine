name: CN130 PIT Event Families Phase 3

on:
  pull_request:
    branches:
      - data/cn130-pit-event-families-phase2-v1
    paths:
      - src/data/company_events/ashare_holding_change_events.py
      - scripts/data/build_cn130_pit_event_families_phase3.py
      - tests/test_ashare_holding_change_events.py
      - configs/data_contracts/company_information_event_phase3_v1.yaml
      - docs/research/cn130_pit_event_families_phase3_*.md
      - data/research/cn130_pit_event_families_phase3_v1/**
      - .github/workflows/cn130-pit-event-families-phase3.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PRICE_PROVIDER_ARTIFACT_ID: '8850463785'
  PIT_SOURCE_ARTIFACT_ID: '8926572265'
  CALIBRATION_LEDGER_ARTIFACT_ID: '8927662386'
  PYTHONPATH: .
  GH_TOKEN: ${{ github.token }}

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint and focused tests
        run: |
          uv run ruff check \
            src/data/company_events/ashare_holding_change_events.py \
            scripts/data/build_cn130_pit_event_families_phase3.py \
            tests/test_ashare_holding_change_events.py
          uv run pytest \
            tests/test_company_information_event_store.py \
            tests/test_cn130_pit_event_family_audit.py \
            tests/test_ashare_primary_company_events.py \
            tests/test_ashare_holding_change_events.py \
            -q --strict-markers --tb=short
      - name: Download immutable price provider
        run: |
          mkdir -p .research/provider-artifact .research/provider
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRICE_PROVIDER_ARTIFACT_ID}/zip" > .research/provider.zip
          unzip -q .research/provider.zip -d .research/provider-artifact
          tar -xf .research/provider-artifact/cn-provider-2026-08-03.tar -C .research/provider
          test "$(python -c "import json; print(json.load(open('.research/provider/data/providers/cn/provider_manifest.json'))['provider_identity_sha256'])")" = "abae71f037571a9a847d4582e0bea9fabdd71796cac54a70aa7c6d07b668eeb0"
      - name: Download frozen R0 ledgers
        run: |
          mkdir -p .research/calibration-artifact .research/frozen-artifact
          mkdir -p .research/ledgers/calibration .research/ledgers/frozen
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CALIBRATION_LEDGER_ARTIFACT_ID}/zip" > .research/calibration.zip
          unzip -q .research/calibration.zip -d .research/calibration-artifact
          cp .research/calibration-artifact/calibration-score-ledgers/*.csv.gz .research/ledgers/calibration/
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PIT_SOURCE_ARTIFACT_ID}/zip" > .research/frozen.zip
          unzip -q .research/frozen.zip -d .research/frozen-artifact
          cp .research/frozen-artifact/score_ledgers/*.csv.gz .research/ledgers/frozen/
      - name: Prime exact CNINFO source cache
        run: |
          EXECUTION_AT="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          echo "EXECUTION_AT=${EXECUTION_AT}" >> "$GITHUB_ENV"
          uv run python scripts/data/build_cn130_pit_event_families_phase3.py \
            --provider-dir .research/provider/data/providers/cn \
            --ledger-dir .research/ledgers/calibration \
            --ledger-dir .research/ledgers/frozen \
            --source-cache-root .research/source-cache \
            --output-dir .research/prime \
            --execution-at "$EXECUTION_AT" \
            --refresh-source-cache
          test "$(find .research/source-cache -type f -name '*.json' | wc -l | tr -d ' ')" = "260"
      - name: Execute frozen source cache twice
        run: |
          for RUN in a b; do
            uv run python scripts/data/build_cn130_pit_event_families_phase3.py \
              --provider-dir .research/provider/data/providers/cn \
              --ledger-dir .research/ledgers/calibration \
              --ledger-dir .research/ledgers/frozen \
              --source-cache-root .research/source-cache \
              --output-dir ".research/run-${RUN}" \
              --execution-at "$EXECUTION_AT"
          done
      - name: Verify deterministic evidence
        run: diff -ru .research/run-a .research/run-b
      - name: Package complete evidence
        if: always()
        run: |
          mkdir -p artifacts/cn130-pit-event-families-phase3
          test ! -d .research/run-a || cp -R .research/run-a artifacts/cn130-pit-event-families-phase3/final
          test ! -d .research/source-cache || cp -R .research/source-cache artifacts/cn130-pit-event-families-phase3/source-cache
          cp configs/data_contracts/company_information_event_phase3_v1.yaml artifacts/cn130-pit-event-families-phase3/
          cp docs/research/cn130_pit_event_families_phase3_preregistration_2026-08-05.md artifacts/cn130-pit-event-families-phase3/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cn130-pit-event-families-phase3-${{ github.run_id }}
          path: artifacts/cn130-pit-event-families-phase3/
          if-no-files-found: error
          retention-days: 30
