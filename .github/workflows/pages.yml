name: Deploy Research Artifact Studio to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify zero-server product boundary
        run: python scripts/check_legacy_web_boundary.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qlib-dashboard/package-lock.json

      - name: Build static artifact studio
        working-directory: qlib-dashboard
        env:
          VITE_RUNTIME_MODE: static_artifact
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/alpha-engine.svg
          grep -q "Alpha Engine Research Studio" dist/index.html

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked Python environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen

      - name: Export static site data and research bundle
        run: |
          uv run python scripts/export_static_site_data.py --output artifacts/site/data
          mkdir -p artifacts/site/docs
          cp docs/methodology.md artifacts/site/docs/methodology.md
          uv run python scripts/export_research_bundle.py \
            --source artifacts/site \
            --output artifacts/research-bundle

      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp -r qlib-dashboard/dist/* _site/
          cp -r artifacts/site/data _site/data 2>/dev/null || true
          cp -r artifacts/site/reports _site/reports 2>/dev/null || true
          cp docs/methodology.md _site/docs/methodology.md
          cp -r artifacts/research-bundle _site/bundle
          cp docs/contracts/alpha-engine-bundle.schema.json _site/docs/alpha-engine-bundle.schema.json
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/data/manifest.json
          test -f _site/data/models.json
          test -f _site/docs/methodology.md
          test -f _site/bundle/alpha-engine-bundle.json
          test -f _site/bundle/data/models.json
          grep -q '"schema_version": "1.0.0"' _site/bundle/alpha-engine-bundle.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment success
        if: success() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'fix(pages):')
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh issue comment 349 --body "Pages deployment succeeded for commit \`${GITHUB_SHA}\`. Published URL: ${PAGE_URL}"

      - name: Report deployment failure
        if: failure() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'fix(pages):')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 349 --body "Pages deployment failed for commit \`${GITHUB_SHA}\`. Review the workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
