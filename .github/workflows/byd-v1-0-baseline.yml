name: BYD V1.0 Baseline Research

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/research_paradigms/byd_v1_0.yaml"
      - "configs/research_paradigms/byd_v1_0_core_tactical.yaml"
      - "docs/research/byd_v1_0_baseline.md"
      - "src/research/byd_single_asset_v1.py"
      - "src/research/byd_core_tactical_v1.py"
      - "scripts/run_byd_v1_0.py"
      - "scripts/run_byd_core_tactical_v1.py"
      - "tests/test_byd_single_asset_v1.py"
      - "tests/test_byd_core_tactical_v1.py"
      - ".github/workflows/byd-v1-0-baseline.yml"
  push:
    branches: [main]
    paths:
      - "configs/research_paradigms/byd_v1_0.yaml"
      - "configs/research_paradigms/byd_v1_0_core_tactical.yaml"
      - "docs/research/byd_v1_0_baseline.md"
      - "src/research/byd_single_asset_v1.py"
      - "src/research/byd_core_tactical_v1.py"
      - "scripts/run_byd_v1_0.py"
      - "scripts/run_byd_core_tactical_v1.py"
      - "tests/test_byd_single_asset_v1.py"
      - "tests/test_byd_core_tactical_v1.py"
      - ".github/workflows/byd-v1-0-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff BYD research files
        run: >-
          uv run ruff check
          src/research/byd_single_asset_v1.py
          src/research/byd_core_tactical_v1.py
          scripts/run_byd_v1_0.py
          scripts/run_byd_core_tactical_v1.py
          tests/test_byd_single_asset_v1.py
          tests/test_byd_core_tactical_v1.py
      - name: Run BYD research tests
        run: >-
          uv run pytest
          tests/test_byd_single_asset_v1.py
          tests/test_byd_core_tactical_v1.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

  binary-timing-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Run frozen binary-timing screen
        run: >-
          uv run python scripts/run_byd_v1_0.py
          --fetch-provider auto
          --output-dir artifacts/research/byd_v1_0_binary
      - name: Upload binary-timing evidence or blocker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byd-v1-0-binary-evidence
          path: artifacts/research/byd_v1_0_binary
          if-no-files-found: error
          retention-days: 30

  core-tactical-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Run frozen BYD core-tactical evidence
        run: >-
          uv run python scripts/run_byd_core_tactical_v1.py
          --fetch-provider auto
          --output-dir artifacts/research/byd_v1_0_core_tactical
      - name: Upload core-tactical evidence or blocker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byd-v1-0-core-tactical-evidence
          path: artifacts/research/byd_v1_0_core_tactical
          if-no-files-found: error
          retention-days: 30
