name: Current Formal Backtest Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - data/research/formal_backtests/**
      - scripts/verify_formal_backtest_freshness.py
      - .github/workflows/current-formal-backtest-integrity.yml

permissions:
  contents: read

concurrency:
  group: current-formal-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-current-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Verify catalog identities and package hashes
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('data/research/formal_backtests')
          catalog = json.loads((root / 'catalog.json').read_text(encoding='utf-8'))
          freshness = json.loads((root / 'freshness.json').read_text(encoding='utf-8'))
          expected = {
              'qqqi_qqq_tqqq_v4_3',
              'us_x1_1',
              'cn_x1_1',
              'byd_v1_2_convex_momentum_budget_v1',
          }
          records = catalog.get('records') or []
          ids = {str(row['model_id']) for row in records}
          assert ids == expected, (ids, expected)
          assert 'qqqi_qqq_tqqq_v4_2' not in ids
          assert set(freshness.get('required_models') or []) == expected
          assert 'qqqi_qqq_tqqq_v4_2' not in freshness.get('required_models', [])

          for row in records:
              path = root / str(row['path'])
              assert path.is_file(), path
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == row['sha256'], (path, digest, row['sha256'])
              package = json.loads(path.read_text(encoding='utf-8'))
              assert package['model_id'] == row['model_id']
              assert package['publication_status'] == 'accepted_formal_baseline'
              assert package['research_only'] is True
              assert package['trade_ready'] is False
              assert package['evidence_cutoff']
              assert package['date_range']['end']
          print('Current formal snapshot identities and package hashes are valid.')
          PY
      - name: Verify current freshness contract
        run: |
          uv run python scripts/verify_formal_backtest_freshness.py \
            --root data/research/formal_backtests \
            --as-of "$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/research/formal_backtests/catalog.json').read_text(encoding='utf-8'))
          print(payload['published_at'])
          PY
          )" \
            --receipt artifacts/current-formal-freshness-receipt.json
      - name: Retain integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-formal-backtest-integrity-${{ github.run_id }}
          path: artifacts/current-formal-freshness-receipt.json
          if-no-files-found: error
          retention-days: 90
