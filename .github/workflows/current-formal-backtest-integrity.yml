name: Current Formal Backtest Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - data/research/formal_backtests/**
      - .github/workflows/current-formal-backtest-integrity.yml

permissions:
  contents: read

concurrency:
  group: current-formal-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-current-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate current formal catalog, package digests, and active identities
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('data/research/formal_backtests')
          expected = [
              'qqqi_qqq_tqqq_v4_3',
              'us_x1_1',
              'cn_x1_1',
              'byd_v1_2_convex_momentum_budget_v1',
          ]
          catalog = json.loads((root / 'catalog.json').read_text())
          ids = [row['model_id'] for row in catalog['records']]
          assert ids == expected, ids
          assert 'qqqi_qqq_tqqq_v4_2' not in ids
          assert catalog['research_only'] is True
          assert catalog['trade_ready'] is False

          for row in catalog['records']:
              path = root / row['path']
              assert path.is_file(), path
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == row['sha256'], (row['model_id'], digest, row['sha256'])
              package = json.loads(path.read_text())
              assert package['model_id'] == row['model_id']
              assert package['publication_status'] == 'accepted_formal_baseline'
              assert package['research_only'] is True
              assert package['trade_ready'] is False

          freshness = json.loads((root / 'freshness.json').read_text())
          assert freshness['required_models'] == expected
          assert freshness['research_only'] is True
          assert freshness['trade_ready'] is False
          assert not (root / 'qqqi_qqq_tqqq_v4_2.json').exists()
          print('Current formal snapshot is internally consistent.')
          PY
