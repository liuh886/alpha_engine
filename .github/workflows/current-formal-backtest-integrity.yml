name: Current Formal Backtest Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - data/research/formal_backtests/**
      - .github/workflows/current-formal-backtest-integrity.yml

permissions:
  contents: read

concurrency:
  group: current-formal-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-current-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify active identities, package hashes, and internal freshness contracts
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('data/research/formal_backtests')
          catalog = json.loads((root / 'catalog.json').read_text(encoding='utf-8'))
          freshness = json.loads((root / 'freshness.json').read_text(encoding='utf-8'))
          expected = {
              'qqqi_qqq_tqqq_v4_3',
              'us_x1_1',
              'cn_x1_1',
              'byd_v1_2_convex_momentum_budget_v1',
          }
          records = catalog.get('records') or []
          ids = {str(row['model_id']) for row in records}
          assert ids == expected, (ids, expected)
          assert 'qqqi_qqq_tqqq_v4_2' not in ids
          assert set(freshness.get('required_models') or []) == expected
          assert 'qqqi_qqq_tqqq_v4_2' not in freshness.get('required_models', [])

          packages = {}
          for row in records:
              path = root / str(row['path'])
              assert path.is_file(), path
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == row['sha256'], (path, digest, row['sha256'])
              package = json.loads(path.read_text(encoding='utf-8'))
              assert package['model_id'] == row['model_id']
              assert package['publication_status'] == 'accepted_formal_baseline'
              assert package['research_only'] is True
              assert package['trade_ready'] is False
              assert package['evidence_cutoff']
              assert package['date_range']['end']
              packages[package['model_id']] = package

          qqq = packages['qqqi_qqq_tqqq_v4_3']
          qqq_freshness = qqq.get('freshness') or {}
          assert qqq_freshness.get('status') == 'current'
          assert qqq_freshness.get('required_cutoff') == qqq['evidence_cutoff']
          assert qqq_freshness.get('latest_completed_session') == qqq['evidence_cutoff']
          assert qqq_freshness.get('model_selection_reopened') is False
          assert qqq_freshness.get('research_only') is True
          assert qqq_freshness.get('trade_ready') is False
          assert qqq.get('evidence', {}).get('historical_economic_evidence_recomputed') is False

          print('Current formal snapshot is structurally valid; cross-market temporal freshness remains the responsibility of Reviewed Formal Backtest Refresh.')
          PY
