name: Current Formal Backtest Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - data/research/formal_backtests/**
      - data/research/cn_x1_1_regime_gated_candidate_v1/**
      - data/research/byd_canonical_v1_snapshot.tar.xz
      - data/research/515180_canonical_v1_artifact.zip.b64
      - data/research/byd_v1_2_signal_ledger/**
      - scripts/promote_cn_x1_1_formal.py
      - scripts/promote_byd_v1_2_formal.py
      - tests/test_promote_cn_x1_1_formal.py
      - tests/test_byd_v1_2_convex_momentum.py
      - .github/workflows/current-formal-backtest-integrity.yml

permissions:
  contents: read

concurrency:
  group: current-formal-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reproduce-current-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CN_GENERATED_AT: 2026-08-05T17:36:00Z
      BYD_GENERATED_AT: 2026-08-06T09:52:48Z
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Validate immutable-model promoters
        run: |
          uv run ruff check \
            scripts/promote_cn_x1_1_formal.py \
            scripts/promote_byd_v1_2_formal.py \
            tests/test_promote_cn_x1_1_formal.py \
            tests/test_byd_v1_2_convex_momentum.py
          uv run mypy scripts/promote_cn_x1_1_formal.py
          uv run pytest \
            tests/test_promote_cn_x1_1_formal.py \
            tests/test_byd_v1_2_convex_momentum.py \
            -q --strict-markers --tb=short
      - name: Extract immutable BYD formal inputs
        run: |
          set -euo pipefail
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz" | sha256sum --check --strict
          base64 --decode data/research/515180_canonical_v1_artifact.zip.b64 > "$RUNNER_TEMP/515180-canonical-v1.zip"
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  $RUNNER_TEMP/515180-canonical-v1.zip" | sha256sum --check --strict
          mkdir -p artifacts/data/byd_canonical_v1 artifacts/data/515180_canonical_v1
          tar -xJf data/research/byd_canonical_v1_snapshot.tar.xz -C artifacts/data/byd_canonical_v1
          unzip -q "$RUNNER_TEMP/515180-canonical-v1.zip" -d artifacts/data/515180_canonical_v1
      - name: Reproduce accepted BYD v1.2 package independently
        run: |
          set -euo pipefail
          mkdir -p artifacts/reproduced-byd
          cp -a data/research/formal_backtests/. artifacts/reproduced-byd/
          uv run python scripts/promote_byd_v1_2_formal.py \
            --root artifacts/reproduced-byd \
            --byd-dir artifacts/data/byd_canonical_v1 \
            --etf-dir artifacts/data/515180_canonical_v1 \
            --signal-ledger data/research/byd_v1_2_signal_ledger \
            --generated-at "$BYD_GENERATED_AT" \
            --receipt artifacts/current-byd-v1-2-formal-reproduction-receipt.json
          cmp \
            artifacts/reproduced-byd/byd_v1_2_convex_momentum_budget_v1.json \
            data/research/formal_backtests/byd_v1_2_convex_momentum_budget_v1.json
      - name: Reproduce accepted CN x1.1 package independently
        run: |
          set -euo pipefail
          mkdir -p artifacts/reproduced-cn
          cp -a data/research/formal_backtests/. artifacts/reproduced-cn/
          uv run python scripts/promote_cn_x1_1_formal.py \
            --root artifacts/reproduced-cn \
            --evidence-root data/research/cn_x1_1_regime_gated_candidate_v1 \
            --generated-at "$CN_GENERATED_AT" \
            --receipt artifacts/current-cn-x1-1-formal-reproduction-receipt.json
          cmp \
            artifacts/reproduced-cn/cn_x1_1.json \
            data/research/formal_backtests/cn_x1_1.json
      - name: Validate the current formal catalog and package digests
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('data/research/formal_backtests')
          expected = [
              'qqqi_qqq_tqqq_v4_3',
              'us_x1_1',
              'cn_x1_1',
              'byd_v1_2_convex_momentum_budget_v1',
          ]
          catalog = json.loads((root / 'catalog.json').read_text())
          ids = [row['model_id'] for row in catalog['records']]
          assert ids == expected, ids
          assert 'qqqi_qqq_tqqq_v4_2' not in ids
          assert catalog['research_only'] is True
          assert catalog['trade_ready'] is False
          for row in catalog['records']:
              path = root / row['path']
              assert path.is_file(), path
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == row['sha256'], (row['model_id'], digest, row['sha256'])
              package = json.loads(path.read_text())
              assert package['model_id'] == row['model_id']
              assert package['publication_status'] == 'accepted_formal_baseline'
              assert package['research_only'] is True
              assert package['trade_ready'] is False
          freshness = json.loads((root / 'freshness.json').read_text())
          assert freshness['required_models'] == expected
          assert freshness['research_only'] is True
          assert freshness['trade_ready'] is False
          print('Current formal catalog, package digests, and active identities are internally consistent.')
          PY
      - name: Retain current release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-formal-backtest-integrity-${{ github.run_id }}
          path: |
            artifacts/current-cn-x1-1-formal-reproduction-receipt.json
            artifacts/current-byd-v1-2-formal-reproduction-receipt.json
            artifacts/reproduced-cn/cn_x1_1.json
            artifacts/reproduced-byd/byd_v1_2_convex_momentum_budget_v1.json
          if-no-files-found: error
          retention-days: 90
