name: Fundamental Acceleration CI

on:
  push:
    branches: [main]
    paths:
      - "configs/factors/us_fundamental_acceleration_v1.yaml"
      - "src/research/fundamental_acceleration.py"
      - "scripts/build_fundamental_acceleration_scores.py"
      - "tests/test_fundamental_acceleration.py"
      - ".github/workflows/fundamental-acceleration-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "configs/factors/us_fundamental_acceleration_v1.yaml"
      - "src/research/fundamental_acceleration.py"
      - "scripts/build_fundamental_acceleration_scores.py"
      - "tests/test_fundamental_acceleration.py"
      - ".github/workflows/fundamental-acceleration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff focused files
        run: uv run ruff check src/research/fundamental_acceleration.py scripts/build_fundamental_acceleration_scores.py tests/test_fundamental_acceleration.py
      - name: Run factor tests
        run: uv run pytest tests/test_fundamental_acceleration.py -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: CLI import check
        run: uv run python scripts/build_fundamental_acceleration_scores.py --help
