name: SEC Company Facts Fundamentals CI

on:
  push:
    branches: [main]
    paths:
      - "configs/providers/sec_companyfacts_fundamentals_v1.yaml"
      - "src/research/sec_companyfacts_fundamentals.py"
      - "scripts/build_sec_companyfacts_fundamentals.py"
      - "tests/test_sec_companyfacts_fundamentals.py"
      - ".github/workflows/sec-companyfacts-fundamentals-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "configs/providers/sec_companyfacts_fundamentals_v1.yaml"
      - "src/research/sec_companyfacts_fundamentals.py"
      - "scripts/build_sec_companyfacts_fundamentals.py"
      - "tests/test_sec_companyfacts_fundamentals.py"
      - ".github/workflows/sec-companyfacts-fundamentals-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff focused files
        run: uv run ruff check src/research/sec_companyfacts_fundamentals.py scripts/build_sec_companyfacts_fundamentals.py tests/test_sec_companyfacts_fundamentals.py
      - name: Run source tests
        run: uv run pytest tests/test_sec_companyfacts_fundamentals.py -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: CLI import check
        run: uv run python scripts/build_sec_companyfacts_fundamentals.py --help
