name: US x1.2 Certification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/us-x1-2-certification
    paths:
      - ".github/workflows/us-x1-2-certification.yml"
      - "scripts/certify_us_x1_2.py"
      - "configs/research_experiments/us_x1_2_certification_v1.yaml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/us-x1-2-certification.yml"
      - "scripts/certify_us_x1_2.py"
      - "configs/research_experiments/us_x1_2_certification_v1.yaml"

permissions:
  contents: read

concurrency:
  group: us-x1-2-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - name: Check out certification revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev

      - name: Validate certification runner
        run: |
          uv run ruff check scripts/certify_us_x1_2.py
          uv run python -m py_compile scripts/certify_us_x1_2.py

      - name: Rebuild current governed US provider
        run: |
          set -euo pipefail
          cutoff="$(date -u +%Y-%m-%d)"
          echo "Provider cutoff: $cutoff"
          rm -rf artifacts/us-x1-2/provider-us
          uv run python scripts/data/refresh_selected_pool_prices_v2.py \
            --root . \
            --market us \
            --source-csv-dir data/csv_clean \
            --output-root artifacts/us-x1-2/provider-us \
            --start 2021-01-01 \
            --cutoff "$cutoff" \
            --max-rounds 3 \
            --full-refresh

      - name: Run full certification
        run: |
          set -euo pipefail
          uv run python scripts/certify_us_x1_2.py \
            --provider-uri artifacts/us-x1-2/provider-us/data/providers/us \
            --output-dir artifacts/us-x1-2/certification \
            | tee artifacts/us-x1-2/certification.log
          test -s artifacts/us-x1-2/certification/us_x1_2_certification.json
          grep '^US_X1_2_CERTIFICATION=' artifacts/us-x1-2/certification.log

      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: us-x1-2-certification-${{ github.run_id }}
          path: |
            artifacts/us-x1-2/certification/
            artifacts/us-x1-2/certification.log
            artifacts/us-x1-2/provider-us/artifacts/selected_pool_price_refresh_manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
