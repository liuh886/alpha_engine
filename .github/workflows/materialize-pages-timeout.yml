name: Materialize Pages Deployment Timeout

on:
  push:
    branches:
      - fix/pages-deploy-queue-timeout

permissions:
  contents: write

concurrency:
  group: materialize-pages-deploy-timeout
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pages-deploy-queue-timeout
          fetch-depth: 0

      - name: Increase Pages platform queue tolerance
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-pages.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
'''
          new = '''      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
'''
          if old not in text:
              raise SystemExit('deploy-pages action block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/materialize-pages-timeout.yml').unlink()
          PY

      - name: Commit focused workflow fix
        run: |
          git config user.name "AlphaEngine Maintenance Agent"
          git config user.email "maintenance-agent@alphaengine.local"
          git add .github/workflows/deploy-pages.yml .github/workflows/materialize-pages-timeout.yml
          git commit -m "fix: tolerate GitHub Pages deployment queue delay"
          git push origin HEAD:fix/pages-deploy-queue-timeout
