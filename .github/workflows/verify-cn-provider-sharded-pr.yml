name: Verify CN Provider Shards PR

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-cn-provider-sharded-pr.yml"
      - "scripts/data/fetch_cn_provider_shard.py"

permissions:
  contents: read

concurrency:
  group: verify-cn-provider-shards-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Fetch exact AkShare/Sina shard
        run: >-
          uv run python scripts/data/fetch_cn_provider_shard.py
          --output-root artifacts/shard-${{ matrix.shard }}
          --shard-index ${{ matrix.shard }}
          --shard-count 8
          --start 2021-01-01
          --cutoff 2026-07-31
      - name: Upload shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: cn-provider-pr-shard-${{ matrix.shard }}
          path: artifacts/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  aggregate:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Download all shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: cn-provider-pr-shard-*
          path: artifacts/shards
          merge-multiple: true
      - name: Verify exact pool and shard coverage
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          manifests = sorted(Path("artifacts/shards").glob("shard-*.json"))
          assert len(manifests) == 8, manifests
          rows = []
          for path in manifests:
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload["status"] == "complete", payload
              assert payload["cutoff"] == "2026-07-31", payload
              assert payload["provider"] == "akshare_sina", payload
              rows.extend(payload["records"])
          symbols = [row["symbol"] for row in rows]
          assert len(symbols) == 131, len(symbols)
          assert len(set(symbols)) == 131, symbols
          assert all(row["last_date"] == "2026-07-31" for row in rows), rows
          assert all(row["provider"] == "akshare_sina" for row in rows), rows
          assert len(list(Path("artifacts/shards/csv").glob("*.csv"))) == 131
          PY
      - name: Build exact Qlib provider
        run: >-
          uv run python scripts/build_market_providers.py
          --root artifacts/provider-root
          --csv-dir artifacts/shards/csv
          --markets cn
      - name: Verify reproducible current provider identity and dimensions
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          provider = json.loads(
              Path("artifacts/provider-root/data/providers/cn/provider_manifest.json")
              .read_text(encoding="utf-8")
          )
          assert provider["provider_identity_sha256"] == "6614e26a4d7cc27dad4e1123ddcc1a73f0e753b7c115e86577a40ab195da2d09", provider
          assert provider["calendar"]["last_day"] == "2026-07-31", provider
          assert provider["calendar"]["session_count"] == 1351, provider
          assert provider["instruments"]["count"] == 131, provider
          PY
      - name: Archive complete provider before upload
        run: |
          tar -C artifacts/provider-root -cf artifacts/cn-provider-pr-2026-07-31.tar \
            data/providers/cn
          tar -C artifacts/shards -rf artifacts/cn-provider-pr-2026-07-31.tar \
            shard-0.json shard-1.json shard-2.json shard-3.json \
            shard-4.json shard-5.json shard-6.json shard-7.json
          test "$(tar -tf artifacts/cn-provider-pr-2026-07-31.tar | grep -c '^data/providers/cn/features/')" -gt 100
          tar -tf artifacts/cn-provider-pr-2026-07-31.tar | grep -Fx 'data/providers/cn/calendars/day.txt'
      - name: Upload complete verified provider
        uses: actions/upload-artifact@v4
        with:
          name: cn-provider-pr-2026-07-31-${{ github.run_id }}
          path: artifacts/cn-provider-pr-2026-07-31.tar
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
