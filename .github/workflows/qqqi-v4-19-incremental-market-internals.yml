name: QQQI v4.19 Incremental Market Internals

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qqqi-v4-19-incremental-market-internals.yml"
      - "configs/research_paradigms/qqqi_market_internal_incremental_factors_v4_19_research.yaml"
      - "src/research/v4_19_incremental_market_internals.py"
      - "scripts/run_qqqi_v4_19_incremental_market_internals.py"
      - "tests/test_v4_19_incremental_market_internals.py"
  workflow_dispatch:
    inputs:
      end_date:
        description: Optional exclusive market-data end date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint v4.19
        run: |
          uv run ruff check \
            src/research/v4_19_incremental_market_internals.py \
            scripts/run_qqqi_v4_19_incremental_market_internals.py \
            tests/test_v4_19_incremental_market_internals.py
      - name: Test v4.19 and inherited comparator
        run: |
          uv run pytest \
            tests/test_v4_19_incremental_market_internals.py \
            tests/test_v4_16_action_advantage_model.py \
            tests/test_vxn_bridge_allocation_experiment.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Run governed Phase 0 and Phase 1 evidence
        run: |
          for attempt in 1 2 3; do
            if uv run python scripts/run_qqqi_v4_19_incremental_market_internals.py \
              --end-date "${{ inputs.end_date }}" \
              --output-dir artifacts/evidence/qqqi_market_internal_incremental_factors_v4_19_research; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            rm -rf artifacts/evidence/qqqi_market_internal_incremental_factors_v4_19_research
            sleep $((attempt * 30))
          done
      - name: Upload Phase 0 and Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-v4-19-incremental-market-internals-${{ github.run_id }}
          path: artifacts/evidence/qqqi_market_internal_incremental_factors_v4_19_research
          if-no-files-found: error
          retention-days: 90
