name: Purge deleted market-data history

on:
  push:
    branches: [main]
    paths:
      - "docs/operations/execute_deleted_market_data_history_purge_2026-08-01.flag"

permissions:
  contents: write
  issues: write

concurrency:
  group: deleted-market-data-history-purge
  cancel-in-progress: false

jobs:
  purge:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: history-rewrite-backup-2026-08-01

    steps:
      - name: Checkout execution contract
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize execution paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "PURGE_LIST=${GITHUB_WORKSPACE}/configs/data_quality/history_purge_paths_v1.txt"
            echo "MIRROR_DIR=${RUNNER_TEMP}/alpha_engine.git"
            echo "VERIFY_DIR=${RUNNER_TEMP}/alpha_engine-verify.git"
            echo "BACKUP_BUNDLE=${RUNNER_TEMP}/alpha_engine-pre-history-purge.bundle"
          } >> "$GITHUB_ENV"

      - name: Validate purge contract and repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < "$PURGE_LIST" | tr -d ' ')" = "138"
          while IFS= read -r path; do
            [[ "$path" =~ ^data/csv_clean/[A-Za-z0-9]+\.csv$ ]] || {
              echo "unsafe purge path: $path" >&2
              exit 1
            }
          done < "$PURGE_LIST"

          open_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number --jq 'length')"
          test "$open_prs" = "0" || {
            echo "history rewrite blocked: $open_prs open pull request(s)" >&2
            exit 1
          }

      - name: Create mirror and immutable recovery bundle
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --mirror "$remote" "$MIRROR_DIR"

          git --git-dir="$MIRROR_DIR" for-each-ref --format='%(refname)' refs/pull refs/remotes |
            while IFS= read -r ref; do
              test -z "$ref" || git --git-dir="$MIRROR_DIR" update-ref -d "$ref"
            done

          git --git-dir="$MIRROR_DIR" bundle create "$BACKUP_BUNDLE" --all
          sha256sum "$BACKUP_BUNDLE" > "${BACKUP_BUNDLE}.sha256"
          git --git-dir="$MIRROR_DIR" count-objects -vH > "${RUNNER_TEMP}/objects-before.txt"
          git --git-dir="$MIRROR_DIR" rev-list --objects --all > "${RUNNER_TEMP}/all-objects-before.txt"
          grep -Ff "$PURGE_LIST" "${RUNNER_TEMP}/all-objects-before.txt" > "${RUNNER_TEMP}/purged-object-inventory.txt"

          missing=0
          while IFS= read -r path; do
            if ! grep -F " $path" "${RUNNER_TEMP}/all-objects-before.txt" >/dev/null; then
              echo "missing historical target: $path" >&2
              missing=1
            fi
          done < "$PURGE_LIST"
          test "$missing" = "0"

      - name: Upload pre-rewrite recovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: alpha-engine-pre-history-purge-backup
          retention-days: 90
          compression-level: 0
          path: |
            ${{ runner.temp }}/alpha_engine-pre-history-purge.bundle
            ${{ runner.temp }}/alpha_engine-pre-history-purge.bundle.sha256
            ${{ runner.temp }}/objects-before.txt
            ${{ runner.temp }}/purged-object-inventory.txt
            configs/data_quality/history_purge_paths_v1.txt

      - name: Rewrite every branch and tag
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install git-filter-repo

          args=(--force --invert-paths)
          while IFS= read -r path; do
            args+=(--path "$path")
          done < "$PURGE_LIST"

          git -C "$MIRROR_DIR" filter-repo "${args[@]}"

          git --git-dir="$MIRROR_DIR" rev-list --objects --all > "${RUNNER_TEMP}/all-objects-after.txt"
          while IFS= read -r path; do
            if grep -F " $path" "${RUNNER_TEMP}/all-objects-after.txt" >/dev/null; then
              echo "purge verification failed: $path remains reachable" >&2
              exit 1
            fi
          done < "$PURGE_LIST"

          for branch in \
            agent/cn-v3-tree-test \
            agent/cn-v3-tree-test-2 \
            agent/cn-v3-tree-test-3 \
            agent/cn-v3-tree-test-4 \
            agent/cn-selected-pool-v3-and-history-prep \
            agent/purge-deleted-market-data-history; do
            git --git-dir="$MIRROR_DIR" update-ref -d "refs/heads/$branch" || true
          done

          git --git-dir="$MIRROR_DIR" count-objects -vH > "${RUNNER_TEMP}/objects-after.txt"

      - name: Force-update rewritten heads and tags
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git --git-dir="$MIRROR_DIR" remote get-url origin >/dev/null 2>&1; then
            git --git-dir="$MIRROR_DIR" remote set-url origin "$remote"
          else
            git --git-dir="$MIRROR_DIR" remote add origin "$remote"
          fi

          git --git-dir="$MIRROR_DIR" push --force --prune origin 'refs/heads/*:refs/heads/*'
          git --git-dir="$MIRROR_DIR" push --force --prune origin 'refs/tags/*:refs/tags/*'

      - name: Verify from a fresh mirror clone
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --mirror "$remote" "$VERIFY_DIR"
          git --git-dir="$VERIFY_DIR" rev-list --objects --all > "${RUNNER_TEMP}/fresh-all-objects.txt"

          while IFS= read -r path; do
            if grep -F " $path" "${RUNNER_TEMP}/fresh-all-objects.txt" >/dev/null; then
              echo "fresh-clone verification failed: $path remains reachable" >&2
              exit 1
            fi
          done < "$PURGE_LIST"

          new_main="$(git --git-dir="$VERIFY_DIR" rev-parse refs/heads/main)"
          echo "NEW_MAIN=$new_main" >> "$GITHUB_ENV"
          git --git-dir="$VERIFY_DIR" count-objects -vH > "${RUNNER_TEMP}/fresh-objects.txt"

      - name: Publish durable recovery release
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          A full pre-rewrite Git bundle created immediately before the deleted-market-data history purge.

          Rewritten main: ${NEW_MAIN}
          Purged paths: 138 exact CSV paths listed in history_purge_paths_v1.txt.
          The release tag points to rewritten history; the attached bundle is the disaster-recovery copy of the old refs.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$NEW_MAIN" \
            --title "Pre-history-purge recovery bundle (2026-08-01)" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "$BACKUP_BUNDLE" \
            "${BACKUP_BUNDLE}.sha256" \
            "${RUNNER_TEMP}/objects-before.txt" \
            "${RUNNER_TEMP}/objects-after.txt" \
            "${RUNNER_TEMP}/fresh-objects.txt" \
            "${RUNNER_TEMP}/purged-object-inventory.txt" \
            "$PURGE_LIST"

      - name: Record completion in Issue 270
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 270 --repo "$GITHUB_REPOSITORY" --body "History purge completed. All 138 approved deleted CSV paths were removed from every rewritten branch and tag, verified from a fresh mirror clone. Rewritten main: \`${NEW_MAIN}\`. Recovery release: \`${RELEASE_TAG}\`. GitHub server-side garbage collection may update reported repository size asynchronously."
          gh issue close 270 --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Upload post-rewrite audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-engine-history-purge-audit
          retention-days: 90
          path: |
            ${{ runner.temp }}/objects-before.txt
            ${{ runner.temp }}/objects-after.txt
            ${{ runner.temp }}/fresh-objects.txt
            ${{ runner.temp }}/purged-object-inventory.txt
            ${{ runner.temp }}/alpha_engine-pre-history-purge.bundle.sha256
            configs/data_quality/history_purge_paths_v1.txt
