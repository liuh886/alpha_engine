name: Patch DESIGN Current Status

on:
  push:
    branches:
      - docs/design-current-status-20260730
    paths:
      - ".github/workflows/patch-design-current-status.yml"

permissions:
  contents: write

jobs:
  patch-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/design-current-status-20260730
          fetch-depth: 0
      - name: Apply targeted DESIGN edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("DESIGN.md")
          text = path.read_text(encoding="utf-8")

          old_status = '''## Current Status (2026-07-18)

          Alpha Engine is a **research-only platform**. Key points:

          - **Paradigm**: Fixed 10D horizon, spec-bound execution (`configs/research_paradigms/`)
          - **Runtime**: `SpecBoundResearchWorkflowExecutor` is the sole runtime (ADR-0006/0007)
          - **Promotion**: `PromotionDecision` is the single promotion interface (ADR-0005), fail-closed on missing evidence
          - **Agents**: Unified `ResearchAssistant` — the four-agent architecture (Alpha, Risk, Governance, Developer) is superseded
          - **Trading**: **No model is trade-ready.** All outputs are diagnostic-only or research candidates
          - **Evidence**: Latest 2026-07-16 run at `docs/evidence/issue-124-current-2026-07-16/` — both CN/US `diagnostic_only=true`
          - **Deployment**: Not deployed for live trading. Demo mode (`--demo`) for UI exploration only
          '''.replace("          ", "")

          new_status = '''## Current Status (2026-07-30)

          Alpha Engine is a **research-only platform**. Key points:

          - **Paradigm**: Fixed 10D horizon with spec-bound execution (`configs/research_paradigms/`); model, feature, universe, portfolio, cost, benchmark, and evidence contracts are frozen before evaluation
          - **Runtime**: `SpecBoundResearchWorkflowExecutor` is the sole canonical runtime (ADR-0006/0007)
          - **Promotion**: `PromotionDecision` is the single promotion interface (ADR-0005) and fails closed on missing, mismatched, or non-independent evidence
          - **Agents**: Unified `ResearchAssistant` — the four-agent architecture (Alpha, Risk, Governance, Developer) is superseded
          - **Models**: LightGBM LambdaRank and XGBoost `rank:ndcg` are supported for fixed comparisons; neither algorithm family is preferred, stable, or trade-ready
          - **Universe validity**: U0 static curated membership is exploratory and retains survivorship bias; U1 window-start PIT OOS membership with semiannual as-of training membership is the current authoritative US contract; U2 daily/event PIT remains a future trade-grade requirement
          - **Latest evidence**: `docs/research/static_to_pit_decomposition_results_2026-07-30.md` records that the static alpha collapse is driven primarily by the OOS opportunity set, not by LightGBM-versus-XGBoost training differences
          - **Model-family decision**: `stop_existing_ohlcv_ranker_family`; no further tree, feature-window, direction, Top-K, blend, cost, threshold, or retrospective-universe search is approved on observed windows
          - **Trading**: **No model is trade-ready.** `stable_research_candidate=false` and `trade_ready=false` remain authoritative
          - **Next research**: A new challenge must introduce a genuinely new economic information set and reserve untouched or independently declared evidence before feature selection
          - **Deployment**: Not deployed for live trading. Demo mode (`--demo`) is for UI exploration only; frontend expansion is not the current priority
          '''.replace("          ", "")

          old_constraints = '''## Key Design Constraints

          - Single-user system (no multi-tenancy)
          - Qlib binary format for market data (float32 .bin files)
          - LightGBM only (no neural nets, no ensemble)
          - BiweeklyTrendStrategy with TopK=5 concentration
          - 15% MDD circuit breaker as sole risk control
          '''.replace("          ", "")

          new_constraints = '''## Key Design Constraints

          - Single-user system (no multi-tenancy)
          - Market and research data must be provider-manifest-bound, source-hashed, and identity-checked; Qlib float32 binaries remain the canonical OHLCV execution format
          - Every experiment is spec-bound: model family, information set, universe mode, horizon, Top-K/Bottom-K, costs, benchmark, orientation, windows, and stop rules are declared before evaluation
          - Model families are candidates inside a frozen contract, not global architecture choices; LightGBM and XGBoost may be compared only when explicitly declared by the spec
          - Universe validity is explicit: U0 static curated is diagnostic, U1 window-start/semiannual PIT is the current authoritative US research level, and U2 daily/event PIT is required for future trade-grade claims
          - Promotion is fail-closed and requires economic, risk, data-identity, and evidence-independence gates; no single drawdown threshold is a complete risk-control or promotion contract
          - Observed development windows cannot be reused for parameter, universe, direction, Top-K, blend, or threshold selection after a family-level stop decision
          '''.replace("          ", "")

          decision_entry = '''### 2026-07-30: Static-to-PIT Alpha Decomposition and OHLCV Family Stop

          - The frozen LightGBM/XGBoost comparison reproduced both the published static endpoint and the authoritative PIT endpoint across 2024H1--2025H2.
          - Average OOS opportunity-set effects were -19.31% for LightGBM and -18.94% for XGBoost; training/label effects were only -1.09% and -0.02%. Top-15 overlap was approximately one third despite common-name score correlation near 0.77.
          - The static curated universe is therefore retained only as U0 exploratory evidence. U1 window-start PIT OOS membership with semiannual as-of training membership is the authoritative US research contract.
          - Final decision: `stop_existing_ohlcv_ranker_family`, `stable_research_candidate=false`, and `trade_ready=false`. Further tuning of the existing price/volume ranker family on observed windows is prohibited.
          - The next admissible challenge must use a genuinely new economic information source and an untouched or independently reserved evidence plan. See `docs/research/static_to_pit_decomposition_results_2026-07-30.md` and Issue #192.

          '''.replace("          ", "")

          if old_status not in text:
              raise SystemExit("Current Status block did not match exactly")
          if old_constraints not in text:
              raise SystemExit("Key Design Constraints block did not match exactly")

          text = text.replace(old_status, new_status, 1)
          text = text.replace(old_constraints, new_constraints, 1)
          marker = "## Decision Log\n\n"
          if decision_entry not in text:
              if marker not in text:
                  raise SystemExit("Decision Log marker missing")
              text = text.replace(marker, marker + decision_entry, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit targeted update
        run: |
          if git diff --quiet -- DESIGN.md; then
            echo "No DESIGN changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md
          git commit -m "docs: reconcile current research status"
          git push origin HEAD:docs/design-current-status-20260730
