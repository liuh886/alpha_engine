name: Publish Strategy Operations Runtime

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "QQQ Rotation v4.3 Signal Alert"
      - "10D Ranker Current Target"
      - "Reviewed Formal Backtest Refresh"
    types: [completed]
  repository_dispatch:
    types: [strategy_operations_publication]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force publication bypassing cache receipt"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: strategy-operations-publication
  cancel-in-progress: false

jobs:
  publish-operations:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve current canonical main SHA
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "Invalid resolved canonical SHA: $sha" >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Freshness changes even when no new decision changes canonical Git.
          # Deduplicate within a scheduled observation window, not forever by SHA.
          echo "window=$(($(date -u +%s) / 21600))" >> "$GITHUB_OUTPUT"

      - name: Restore publication idempotency receipt
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: artifacts/strategy-operations-publication-receipt.json
          key: strategy-operations-publication-v2-${{ steps.revision.outputs.sha }}-${{ steps.revision.outputs.window }}

          lookup-only: true

      - name: Checkout canonical revision
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force == true
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Verify canonical revision identity
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force == true
        run: test "$(git rev-parse HEAD)" = "${{ steps.revision.outputs.sha }}"

      - name: Setup governed Python environment
        uses: ./.github/actions/setup-python-uv
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force == true

      - name: Validate runtime publisher contract
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          uv run ruff check \
            src/artifacts/strategy_operations_runtime.py \
            src/cli/main.py \
            tests/test_strategy_operations_runtime.py
          uv run pytest tests/test_strategy_operations_runtime.py tests/test_strategy_operations_release.py tests/test_market_session_clock.py -q --strict-markers --tb=short

      - name: Materialize current operations from canonical evidence
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run alpha ops build --generated-at "$generated_at"

      - name: Publish current operations through GitHub OIDC
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force == true
        run: uv run alpha ops publish

      - name: Record publication receipt
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force == true
        env:
          CANONICAL_SHA: ${{ steps.revision.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": "1.0.0",
              "status": "success",
              "canonical_sha": os.environ["CANONICAL_SHA"],
              "run_id": os.environ["RUN_ID"],
              "event_name": os.environ["EVENT_NAME"],
              "research_only": True,
              "trade_ready": False,
          }
          Path("artifacts/strategy-operations-publication-receipt.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Retain publication artifacts
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force == true
        uses: actions/upload-artifact@v6
        with:
          name: strategy-operations-runtime-${{ github.run_id }}
          path: |
            data/research/strategy_operations/snapshots.json
            artifacts/strategy-operations-publication-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Save successful publication receipt
        # A forced re-publication may reuse an existing immutable receipt key;
        # save only when this canonical revision did not already have one.
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: artifacts/strategy-operations-publication-receipt.json
          key: strategy-operations-publication-v2-${{ steps.revision.outputs.sha }}-${{ steps.revision.outputs.window }}

  collect-operating-evidence:
    needs: publish-operations
    if: >-
      !cancelled() &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: ./.github/actions/setup-python-uv
      - name: Collect current review without declaring acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNED_SOURCE_ARCHIVE_WRITE_SSH_KEY: ${{ secrets.GOVERNED_SOURCE_ARCHIVE_WRITE_SSH_KEY }}
        run: |
          mkdir -p artifacts/operating-review
          uv run alpha ops acceptance \
            --collect-repository "$GITHUB_REPOSITORY" \
            --input-root artifacts/operating-review \
            --archive-repository liuh886/alpha-engine-data-archive \
            --output artifacts/operating-review/acceptance-report.json \
            > artifacts/operating-review-command.json
      - name: Summarize current acceptance gaps
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/operating-review-command.json")
          result = json.loads(path.read_text()) if path.is_file() else {}
          review = result.get("latest_attempt_readiness", {})
          lines = ["### Operating acceptance evidence", f"Latest formal attempt: {review.get('run_id', 'unavailable')}:{review.get('run_attempt', 'unknown')}", f"Mechanical evidence: {review.get('qualification_status', 'collection_failed')}", "Independent review required; manual interventions remain unknown."]
          lines.extend(f"- {item['strategy_id']}: {item.get('blocker', 'mechanically verified')}" for item in review.get("strategy_checks", []))
          lines.extend(f"- {item}" for item in review.get("blockers", []))
          if result.get("reason"):
              lines.append(f"- Collection failure: {result['reason']}")
          lines.append("This packet covers the latest attempt only; it does not certify 20 continuous sessions.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n\n".join(lines) + "\n")
          PY
      - name: Retain operating review packet
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: strategy-operating-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/operating-review
            artifacts/operating-review-command.json
          if-no-files-found: error
          retention-days: 90
