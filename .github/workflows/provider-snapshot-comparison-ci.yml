name: Provider Snapshot Comparison CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/provider-snapshot-comparison-ci.yml"
      - "configs/data/provider_snapshot_policy_v1.yaml"
      - "src/data/provider_snapshot_comparison.py"
      - "scripts/data/compare_selected_pool_snapshots.py"
      - "tests/test_provider_snapshot_comparison.py"
      - "docs/research/cn130_provider_snapshot_drift_result_2026-08-02.md"
      - "docs/research/snapshots/cn130_provider_snapshot_drift_2026-08-02.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/provider-snapshot-comparison-ci.yml"
      - "configs/data/provider_snapshot_policy_v1.yaml"
      - "src/data/provider_snapshot_comparison.py"
      - "scripts/data/compare_selected_pool_snapshots.py"
      - "tests/test_provider_snapshot_comparison.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Lint snapshot comparison
        run: >-
          uv run ruff check
          src/data/provider_snapshot_comparison.py
          scripts/data/compare_selected_pool_snapshots.py
          tests/test_provider_snapshot_comparison.py
      - name: Type-check snapshot comparison
        run: >-
          uv run mypy --follow-imports=skip
          src/data/provider_snapshot_comparison.py
          scripts/data/compare_selected_pool_snapshots.py
      - name: Run snapshot comparison tests
        run: >-
          uv run pytest tests/test_provider_snapshot_comparison.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1
      - name: Verify committed decision boundary
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("docs/research/snapshots/cn130_provider_snapshot_drift_2026-08-02.json")
              .read_text(encoding="utf-8")
          )
          decision = payload["decision"]
          assert decision["status"] == "unexplained_provider_drift_blocking"
          assert decision["further_cn_model_search_authorized"] is False
          assert payload["manifest_findings"]["row_delta_for_all_131_files"] == 30
          assert payload["manifest_findings"]["historical_prefix_hash_available_count"] == 0
          PY
