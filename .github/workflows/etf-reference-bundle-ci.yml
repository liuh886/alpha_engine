name: ETF Reference Bundle CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/etf-reference-bundle-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
      - "configs/data/qqqi_qqq_tqqq_reference_bundle_v1.yaml"
      - "src/data/provider_catalog.py"
      - "src/data/adapters/tiingo_adapter.py"
      - "src/data/etf_reference_bundle.py"
      - "src/research/etf_strategy_data.py"
      - "scripts/data/build_etf_reference_bundle.py"
      - "tests/test_provider_catalog.py"
      - "tests/test_tiingo_adapter.py"
      - "tests/test_etf_reference_bundle.py"
      - "docs/research/qqqi_qqq_tqqq_provider_data_v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/etf-reference-bundle-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
      - "configs/data/qqqi_qqq_tqqq_reference_bundle_v1.yaml"
      - "src/data/provider_catalog.py"
      - "src/data/adapters/tiingo_adapter.py"
      - "src/data/etf_reference_bundle.py"
      - "src/research/etf_strategy_data.py"
      - "scripts/data/build_etf_reference_bundle.py"
      - "tests/test_provider_catalog.py"
      - "tests/test_tiingo_adapter.py"
      - "tests/test_etf_reference_bundle.py"
      - "docs/research/qqqi_qqq_tqqq_provider_data_v1.md"
  schedule:
    - cron: "30 13 * * 6"
  workflow_dispatch:

concurrency:
  group: etf-reference-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-uv
      - name: Ruff ETF provider paths
        run: >-
          uv run ruff check
          src/data/provider_catalog.py
          src/data/adapters/tiingo_adapter.py
          src/data/etf_reference_bundle.py
          src/research/etf_strategy_data.py
          scripts/data/build_etf_reference_bundle.py
          tests/test_provider_catalog.py
          tests/test_tiingo_adapter.py
          tests/test_etf_reference_bundle.py
      - name: Mypy ETF provider paths
        run: >-
          uv run mypy --follow-imports=skip
          src/data/provider_catalog.py
          src/data/adapters/tiingo_adapter.py
          src/data/etf_reference_bundle.py
          src/research/etf_strategy_data.py
          scripts/data/build_etf_reference_bundle.py
      - name: Run ETF provider tests
        run: >-
          uv run pytest
          tests/test_provider_catalog.py
          tests/test_tiingo_adapter.py
          tests/test_etf_reference_bundle.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

  live-bundle:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-uv
      - name: Build current ETF bundle and retain failure evidence
        run: >-
          uv run python scripts/data/build_etf_reference_bundle.py
          --output-root artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
      - name: Classify Tiingo secret and professional-source status
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1")
          path = root / "bundle_manifest.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          token_configured = bool(os.getenv("TIINGO_API_TOKEN", "").strip())
          health = payload.get("provider_health", {}).get("tiingo", {})
          error_counts = health.get("error_class_counts", {})

          if not token_configured:
              status = "not_configured"
          elif payload.get("professional_source_ready") is True:
              status = "usable"
          elif error_counts.get("rate_limited"):
              status = "rate_limited"
          elif error_counts.get("credential_or_entitlement"):
              status = "credential_or_entitlement"
          elif any(
              value in {"quarantine", "provider_missing"}
              for value in payload.get("reconciliation_status", {}).values()
          ):
              status = "reconciliation_or_provider_failed"
          else:
              status = "professional_gate_failed"

          secret_status = {
              "schema_version": "1.1",
              "credential_env": "TIINGO_API_TOKEN",
              "token_configured": token_configured,
              "status": status,
              "professional_source_ready": payload.get("professional_source_ready"),
              "selected_providers": payload.get("selected_providers", {}),
              "reconciliation_status": payload.get("reconciliation_status", {}),
              "provider_health": health,
              "research_only": True,
              "trade_ready": False,
          }
          (root / "tiingo_secret_status.json").write_text(
              json.dumps(secret_status, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(secret_status, indent=2, sort_keys=True))

          assert payload["strategy_data_ready"] is True, payload
          assert payload["symbols"] == ["QQQ", "QQQI", "TQQQ"], payload
          assert payload["common_history_start"] is not None, payload
          assert payload["trade_ready"] is False, payload
          if token_configured:
              assert status == "usable", secret_status
              assert set(payload["selected_providers"].values()) == {"tiingo"}, payload
              accepted = {"consensus", "explainable_corporate_action_difference"}
              assert set(payload["reconciliation_status"].values()) <= accepted, payload
              print("::notice title=Tiingo secret usable::QQQ, QQQI and TQQQ passed identity, provider-health and independent reconciliation gates")
          PY
      - name: Upload ETF reference bundle and credential evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qqqi-qqq-tqqq-reference-bundle-${{ github.run_id }}
          path: artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
          if-no-files-found: error
          retention-days: 90
