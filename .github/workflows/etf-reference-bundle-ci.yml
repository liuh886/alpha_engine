name: ETF Reference Bundle CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/etf-reference-bundle-ci.yml"
      - "configs/data/qqqi_qqq_tqqq_reference_bundle_v1.yaml"
      - "src/data/provider_catalog.py"
      - "src/data/adapters/tiingo_adapter.py"
      - "src/data/etf_reference_bundle.py"
      - "src/research/etf_strategy_data.py"
      - "scripts/data/build_etf_reference_bundle.py"
      - "tests/test_provider_catalog.py"
      - "tests/test_tiingo_adapter.py"
      - "tests/test_etf_reference_bundle.py"
      - "docs/research/qqqi_qqq_tqqq_provider_data_v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/etf-reference-bundle-ci.yml"
      - "configs/data/qqqi_qqq_tqqq_reference_bundle_v1.yaml"
      - "src/data/provider_catalog.py"
      - "src/data/adapters/tiingo_adapter.py"
      - "src/data/etf_reference_bundle.py"
      - "src/research/etf_strategy_data.py"
      - "scripts/data/build_etf_reference_bundle.py"
      - "tests/test_provider_catalog.py"
      - "tests/test_tiingo_adapter.py"
      - "tests/test_etf_reference_bundle.py"
      - "docs/research/qqqi_qqq_tqqq_provider_data_v1.md"
  schedule:
    - cron: "30 13 * * 6"
  workflow_dispatch:
    inputs:
      require_professional:
        description: "Require Tiingo plus independent reconciliation"
        required: true
        default: false
        type: boolean

concurrency:
  group: etf-reference-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Ruff ETF provider paths
        run: >-
          uv run ruff check
          src/data/provider_catalog.py
          src/data/adapters/tiingo_adapter.py
          src/data/etf_reference_bundle.py
          src/research/etf_strategy_data.py
          scripts/data/build_etf_reference_bundle.py
          tests/test_provider_catalog.py
          tests/test_tiingo_adapter.py
          tests/test_etf_reference_bundle.py
      - name: Mypy ETF provider paths
        run: >-
          uv run mypy --follow-imports=skip
          src/data/provider_catalog.py
          src/data/adapters/tiingo_adapter.py
          src/data/etf_reference_bundle.py
          src/research/etf_strategy_data.py
          scripts/data/build_etf_reference_bundle.py
      - name: Run ETF provider tests
        run: >-
          uv run pytest
          tests/test_provider_catalog.py
          tests/test_tiingo_adapter.py
          tests/test_etf_reference_bundle.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

  live-bundle:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Build current ETF bundle
        shell: bash
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.require_professional }}" = "true" ]; then
            extra="--require-professional"
          elif [ -n "$TIINGO_API_TOKEN" ]; then
            extra="--require-professional"
          fi
          uv run python scripts/data/build_etf_reference_bundle.py \
            --output-root artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1 \
            $extra
      - name: Verify strategy and professional-source gates
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1")
          path = root / "bundle_manifest.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["strategy_data_ready"] is True, payload
          assert payload["symbols"] == ["QQQ", "QQQI", "TQQQ"], payload
          assert payload["common_history_start"] is not None, payload
          assert payload["trade_ready"] is False, payload

          token_configured = bool(os.getenv("TIINGO_API_TOKEN", "").strip())
          status = "not_configured"
          if token_configured:
              assert payload["professional_source_ready"] is True, payload
              assert set(payload["selected_providers"].values()) == {"tiingo"}, payload
              accepted = {"consensus", "explainable_corporate_action_difference"}
              assert set(payload["reconciliation_status"].values()) <= accepted, payload
              status = "usable"
              print("::notice title=Tiingo secret usable::QQQ, QQQI and TQQQ passed Tiingo identity and independent reconciliation gates")
          else:
              assert payload["professional_source_ready"] is False, payload
              print("::notice title=Tiingo secret not configured::Yahoo research fallback remains active")

          secret_status = {
              "schema_version": "1.0",
              "credential_env": "TIINGO_API_TOKEN",
              "token_configured": token_configured,
              "status": status,
              "professional_source_ready": payload["professional_source_ready"],
              "selected_providers": payload["selected_providers"],
              "reconciliation_status": payload["reconciliation_status"],
              "research_only": True,
              "trade_ready": False,
          }
          (root / "tiingo_secret_status.json").write_text(
              json.dumps(secret_status, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload ETF reference bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqqi-qqq-tqqq-reference-bundle-${{ github.run_id }}
          path: artifacts/data/qqqi_qqq_tqqq_reference_bundle_v1
          if-no-files-found: error
          retention-days: 90
