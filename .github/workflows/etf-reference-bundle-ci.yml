name: ETF Reference Bundle CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/etf-reference-bundle-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
      - "configs/data/qqqi_qqq_tqqq_reference_bundle_v1.yaml"
      - "configs/data/qqqi_qqq_tqqq_reference_research_v2.yaml"
      - "src/data/provider_catalog.py"
      - "src/data/adapters/tiingo_adapter.py"
      - "src/data/etf_reference_bundle.py"
      - "src/research/etf_strategy_data.py"
      - "scripts/data/build_etf_reference_bundle.py"
      - "tests/test_provider_catalog.py"
      - "tests/test_tiingo_adapter.py"
      - "tests/test_etf_reference_bundle.py"
      - "docs/research/qqqi_qqq_tqqq_provider_data_v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/etf-reference-bundle-ci.yml"
      - ".github/actions/setup-python-uv/action.yml"
      - "configs/data/qqqi_qqq_tqqq_reference_bundle_v1.yaml"
      - "configs/data/qqqi_qqq_tqqq_reference_research_v2.yaml"
      - "src/data/provider_catalog.py"
      - "src/data/adapters/tiingo_adapter.py"
      - "src/data/etf_reference_bundle.py"
      - "src/research/etf_strategy_data.py"
      - "scripts/data/build_etf_reference_bundle.py"
      - "tests/test_provider_catalog.py"
      - "tests/test_tiingo_adapter.py"
      - "tests/test_etf_reference_bundle.py"
      - "docs/research/qqqi_qqq_tqqq_provider_data_v1.md"
  schedule:
    - cron: "30 13 * * 6"
  workflow_dispatch:

concurrency:
  group: etf-reference-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-uv
      - name: Ruff ETF provider paths
        run: >-
          uv run ruff check
          src/data/provider_catalog.py
          src/data/adapters/tiingo_adapter.py
          src/data/etf_reference_bundle.py
          src/research/etf_strategy_data.py
          scripts/data/build_etf_reference_bundle.py
          tests/test_provider_catalog.py
          tests/test_tiingo_adapter.py
          tests/test_etf_reference_bundle.py
      - name: Mypy ETF provider paths
        run: >-
          uv run mypy --follow-imports=skip
          src/data/provider_catalog.py
          src/data/adapters/tiingo_adapter.py
          src/data/etf_reference_bundle.py
          src/research/etf_strategy_data.py
          scripts/data/build_etf_reference_bundle.py
      - name: Run ETF provider tests
        run: >-
          uv run pytest
          tests/test_provider_catalog.py
          tests/test_tiingo_adapter.py
          tests/test_etf_reference_bundle.py
          -q --strict-markers --tb=short --disable-warnings --maxfail=1

  live-bundle:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-uv
      - name: Build current ETF bundle and retain failure evidence
        run: >-
          uv run python scripts/data/build_etf_reference_bundle.py
          --output-root artifacts/data/qqqi_qqq_tqqq_reference_research_v2
      - name: Verify free research source and completed cutoff
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path("artifacts/data/qqqi_qqq_tqqq_reference_research_v2/bundle_manifest.json")
          payload = json.loads(path.read_text())
          contract = Path("configs/data/qqqi_qqq_tqqq_reference_research_v2.yaml")
          assert payload["contract_sha256"] == hashlib.sha256(contract.read_bytes()).hexdigest()
          assert payload["source_policy"] == "yahoo_research_v2"
          assert payload["strategy_data_ready"] is True
          assert payload["professional_source_ready"] is False
          assert payload["symbols"] == ["QQQ", "QQQI", "TQQQ"]
          assert set(payload["selected_providers"].values()) == {"yfinance"}
          assert not any("tiingo" in name.lower() for name in payload["files"])
          assert payload["trade_ready"] is False
          print(json.dumps({key: payload[key] for key in (
              "source_policy", "contract_sha256", "common_history_start", "common_history_end",
              "strategy_data_ready", "professional_source_ready", "selected_providers",
          )}, sort_keys=True))
          PY
      - name: Upload ETF reference bundle and credential evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qqqi-qqq-tqqq-reference-bundle-${{ github.run_id }}
          path: artifacts/data/qqqi_qqq_tqqq_reference_research_v2
          if-no-files-found: error
          retention-days: 90
