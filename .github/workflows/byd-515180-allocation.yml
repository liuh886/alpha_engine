name: BYD 515180 Core Dividend Research

on:
  pull_request:
    branches: [main]
    paths:
      - "src/data/etf_515180_canonical.py"
      - "src/data/etf_515180_quality_v2.py"
      - "src/research/byd_515180_allocation.py"
      - "src/research/byd_515180_execution.py"
      - "scripts/data/build_515180_canonical_bundle.py"
      - "scripts/data/build_515180_canonical_bundle_v2.py"
      - "scripts/data/fetch_515180_secondary_v2.py"
      - "scripts/run_byd_515180_allocation.py"
      - "tests/test_etf_515180_canonical.py"
      - "tests/test_byd_515180_allocation.py"
      - "data/research/515180_canonical_v1_artifact.zip.b64"
      - "docs/evidence/byd_515180_allocation/**"
      - ".github/workflows/byd-515180-allocation.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev
      - name: Verify immutable BYD canonical snapshot
        run: >-
          echo "2e56595d3363b201469f6eefe5dd6390ba156da6fb7ea32a8348d25f06bac179  data/research/byd_canonical_v1_snapshot.tar.xz"
          | sha256sum --check --strict
      - name: Run frozen contract tests
        run: |
          uv run ruff check \
            src/data/etf_515180_canonical.py \
            src/data/etf_515180_quality_v2.py \
            src/research/byd_515180_allocation.py \
            src/research/byd_515180_execution.py \
            scripts/data/build_515180_canonical_bundle.py \
            scripts/data/build_515180_canonical_bundle_v2.py \
            scripts/data/fetch_515180_secondary_v2.py \
            scripts/run_byd_515180_allocation.py \
            tests/test_etf_515180_canonical.py \
            tests/test_byd_515180_allocation.py
          uv run pytest \
            tests/test_etf_515180_canonical.py \
            tests/test_byd_515180_allocation.py \
            -q --strict-markers --tb=short --disable-warnings --maxfail=1

  materialize-authoritative-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download exact canonical artifact ZIP bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/liuh886/alpha_engine/actions/artifacts/8902066862/zip \
            --output 515180-canonical-v1-artifact.zip
          echo "7e077664516b74546ec118f2bf0484ee650577a0898623f3f0cb8623397e061f  515180-canonical-v1-artifact.zip" | sha256sum --check --strict
          mkdir -p artifacts/data/515180_canonical_v1
          unzip -q 515180-canonical-v1-artifact.zip -d artifacts/data/515180_canonical_v1
      - name: Download passed allocation evidence
        uses: actions/download-artifact@v4
        with:
          name: byd-515180-allocation-evidence
          path: artifacts/research/byd_515180_allocation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: liuh886/alpha_engine
          run-id: 30933294861
      - name: Verify authoritative data and decision
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("artifacts/data/515180_canonical_v1/manifest.json").read_text())
          exact = {
              "schema_version": "cn_etf_canonical_total_return_v1",
              "symbol": "515180.SH",
              "cutoff": "2026-08-03",
              "data_quality_status": "canonical_v1_pass",
              "raw_sha256": "67c80e12908cbcccaa1d5ab2833563ff8db6f02deebc81247f6be50aa957a6e5",
              "factor_sha256": "e0e3b031716b79d0259e23712d35c0c2b46142709b8d76cbca761621fcf98751",
              "adjusted_sha256": "2173afbe2fcbc8875de55ce0ff9bcb25b1c9f184c5cd273ade682244393c67a5",
              "actions_sha256": "d6efca5c7c1f1459f5c78953baec2b6ee26685489162e17b694215fffcc7f92b",
              "session_audit_sha256": "a85a466307e3965b80259cd9d65d88db330dc0c2fb210ff8e77f354b863475df",
              "manifest_sha256": "7f19639e6540ebb71eac7e52dab270df4b20b59bcf764c2dc6843045de21e4ec",
          }
          for key, expected in exact.items():
              if manifest.get(key) != expected:
                  raise SystemExit(f"authoritative identity mismatch for {key}: {manifest.get(key)!r} != {expected!r}")
          summary = json.loads(Path("artifacts/research/byd_515180_allocation/summary.json").read_text())
          if summary["governed_decisions"]["v1_dividend_75_25"]["decision"] != "supported":
              raise SystemExit("authoritative primary-candidate decision drifted")
          PY
      - name: Materialize exact bytes and static evidence
        run: |
          set -euo pipefail
          mkdir -p data/research docs/evidence/byd_515180_allocation
          base64 -w 76 515180-canonical-v1-artifact.zip > data/research/515180_canonical_v1_artifact.zip.b64
          cp artifacts/research/byd_515180_allocation/summary.json docs/evidence/byd_515180_allocation/summary.json
          cp artifacts/research/byd_515180_allocation/evaluation.csv docs/evidence/byd_515180_allocation/evaluation.csv
          cp artifacts/research/byd_515180_allocation/correlation_diagnostics.csv docs/evidence/byd_515180_allocation/correlation_diagnostics.csv
          cp artifacts/research/byd_515180_allocation/conditional_complementarity.csv docs/evidence/byd_515180_allocation/conditional_complementarity.csv
          cp artifacts/research/byd_515180_allocation/README.md docs/evidence/byd_515180_allocation/README.md
          rm -f .github/workflows/materialize-515180-canonical-snapshot.yml
      - name: Commit immutable evidence when absent
        run: |
          set -euo pipefail
          if git diff --quiet -- data/research/515180_canonical_v1_artifact.zip.b64 docs/evidence/byd_515180_allocation .github/workflows/materialize-515180-canonical-snapshot.yml && \
             [[ -z "$(git ls-files --others --exclude-standard data/research/515180_canonical_v1_artifact.zip.b64 docs/evidence/byd_515180_allocation)" ]]; then
            echo "Authoritative evidence already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/515180_canonical_v1_artifact.zip.b64 docs/evidence/byd_515180_allocation
          git add -u .github/workflows/materialize-515180-canonical-snapshot.yml || true
          git commit -m "research: freeze exact 515180 canonical allocation evidence"
          git push origin HEAD:${{ github.head_ref }}
